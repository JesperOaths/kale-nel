<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bruis - Nature tees</title>
  <meta name="description" content="Bruis nature-inspired tees. Choose a shirt shape, then browse the designs available in that collection." />
  <meta property="og:title" content="Bruis" />
  <meta property="og:description" content="Nature-inspired tees." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kalenel.nl/shop/" />
  <link rel="stylesheet" href="styles.css?v=20260830-shape-entry-v2" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/shop/" aria-label="Bruis shop home">Bruis</a>
    <button class="cart-button" type="button" data-open-cart>Cart <span data-cart-count>0</span></button>
  </header>

  <main>
    <section class="shape-entry" data-shape-entry aria-labelledby="shape-entry-title">
      <div class="shape-entry-heading">
        <p class="section-kicker">Choose your shirt</p>
        <h1 id="shape-entry-title">Pick the shape first.</h1>
        <p>Select a shirt silhouette to open only the designs available in that collection.</p>
      </div>

      <div class="collection-grid collection-grid-large" role="list" aria-label="Shirt shapes">
        <button class="collection-card" type="button" data-collection="normal" aria-pressed="false">
          <span class="collection-image"><img src="assets/collection-normal.webp" alt="Normal classic T-shirt outline" /></span>
          <span class="collection-copy">
            <strong>Normal</strong>
            <small>Classic everyday T-shirt fit</small>
            <span class="collection-count" data-collection-count="normal">Loading…</span>
          </span>
        </button>
        <button class="collection-card" type="button" data-collection="boxy" aria-pressed="false">
          <span class="collection-image"><img src="assets/collection-boxy.webp" alt="Boxy T-shirt outline" /></span>
          <span class="collection-copy">
            <strong>Boxy</strong>
            <small>Shorter, wider, square silhouette</small>
            <span class="collection-count" data-collection-count="boxy">Loading…</span>
          </span>
        </button>
        <button class="collection-card" type="button" data-collection="all-over" aria-pressed="false">
          <span class="collection-image"><img src="assets/collection-all-over.webp" alt="All-over print T-shirt outline" /></span>
          <span class="collection-copy">
            <strong>All Over Print</strong>
            <small>Artwork repeated across the whole shirt</small>
            <span class="collection-count" data-collection-count="all-over">Loading…</span>
          </span>
        </button>
      </div>
    </section>

    <section class="shop-section" id="shop" data-shop-section aria-labelledby="shop-title" hidden>
      <div class="shop-heading">
        <div>
          <p class="section-kicker">Selected shape</p>
          <h2 id="shop-title" data-collection-title>Normal shirts</h2>
        </div>
        <button class="collection-back" type="button" data-expand-shapes>View shapes larger</button>
      </div>

      <nav class="shape-switcher" data-shape-switcher aria-label="Change shirt shape">
        <span class="shape-switcher-label">Change shape</span>
        <div class="shape-switcher-options">
          <button class="shape-mini" type="button" data-collection="normal" aria-pressed="false">
            <img src="assets/collection-normal.webp" alt="" aria-hidden="true" />
            <span>Normal</span>
          </button>
          <button class="shape-mini" type="button" data-collection="boxy" aria-pressed="false">
            <img src="assets/collection-boxy.webp" alt="" aria-hidden="true" />
            <span>Boxy</span>
          </button>
          <button class="shape-mini" type="button" data-collection="all-over" aria-pressed="false">
            <img src="assets/collection-all-over.webp" alt="" aria-hidden="true" />
            <span>All Over</span>
          </button>
        </div>
      </nav>

      <p class="collection-empty" data-collection-empty hidden></p>
      <div class="product-grid" data-products aria-live="polite"></div>
    </section>
  </main>

  <aside class="cart-drawer" data-cart-drawer aria-hidden="true" aria-label="Shopping cart">
    <div class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="cart-head">
        <h2 id="cart-title">Cart</h2>
        <button class="icon-button" type="button" data-close-cart aria-label="Close cart">x</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-summary">
        <div><span>Total</span><strong data-cart-subtotal>€0</strong></div>
        <p>Shipping is calculated after the address is entered.</p>
        <button class="button primary full" type="button" data-shop-checkout>Secure checkout</button>
        <p class="payment-status" data-payment-status role="status" aria-live="polite"></p>
      </div>
    </div>
  </aside>

  <footer class="footer">Bruis - Nature-inspired clothing.</footer>

  <script src="catalog-data.js?v=20260830-shape-entry-v2" defer></script>
  <script src="store.js?v=20260830-shape-entry-v2" defer></script>
  <script src="payments.js?v=20260830-payments-v2" defer></script>
</body>
</html>
