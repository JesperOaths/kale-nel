<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bruis - Nature tees</title>
  <meta name="description" content="Bruis nature-inspired tees. Shipping calculated after address entry." />
  <meta property="og:title" content="Bruis" />
  <meta property="og:description" content="Nature-inspired tees." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kalenel.nl/shop/" />
  <link rel="stylesheet" href="styles.css?v=20260830-bare" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/shop/" aria-label="Bruis shop home">Bruis</a>
    <button class="cart-button" type="button" data-open-cart>Cart <span data-cart-count>0</span></button>
  </header>

  <main>
    <section class="hero">
      <h1>Nature tees</h1>
      <p>Clean shirts with quiet nature artwork. Shipping calculated at checkout.</p>
    </section>

    <section class="shop-section" id="shop">
      <div class="product-grid" data-products aria-live="polite"></div>
    </section>
  </main>

  <aside class="cart-drawer" data-cart-drawer aria-hidden="true" aria-label="Shopping cart">
    <div class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="cart-head">
        <h2 id="cart-title">Cart</h2>
        <button class="icon-button" type="button" data-close-cart aria-label="Close cart">x</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-summary">
        <div><span>Total</span><strong data-cart-subtotal>€0</strong></div>
        <p>Shipping is calculated after the address is entered.</p>
        <a class="button primary full" data-mail-order href="mailto:hello@example.com?subject=Bruis%20order%20request">Request order link</a>
      </div>
    </div>
  </aside>

  <footer class="footer">Bruis - Nature-inspired clothing.</footer>

  <script src="catalog-data.js?v=20260830-no-shipping" defer></script>
  <script src="store.js?v=20260830-no-shipping" defer></script>
</body>
</html>
