<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Oversized Boxy T-Shirt measurement guide</title>
<desc id="desc">Diagram showing garment width and length measurement points on a laid-flat oversized boxy T-shirt.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24351f"/></marker>
  <style>
    .shirt{fill:#f3eee5;stroke:#8c806e;stroke-width:4}
    .seam{fill:none;stroke:#b8ab99;stroke-width:3}
    .measure{fill:none;stroke:#24351f;stroke-width:5;stroke-dasharray:12 10;marker-start:url(#arrow);marker-end:url(#arrow)}
    .label{font:700 30px system-ui,sans-serif;fill:#182016}
    .small{font:600 20px system-ui,sans-serif;fill:#697064}
    .title{font:800 34px Georgia,serif;fill:#182016}
  </style>
</defs>
<rect width="900" height="620" rx="28" fill="#fffdf8"/>
<text x="42" y="58" class="title">How we measure</text>
<text x="42" y="91" class="small">Measurements are taken on a flat, laid-out garment.</text>
<g transform="translate(105,120)">
  <path class="shirt" d="M150 95 L260 24 Q330 60 400 24 L510 95 L640 180 L575 275 L500 230 L500 450 Q330 480 160 450 L160 230 L85 275 L20 180 Z"/>
  <path class="seam" d="M270 46 Q330 94 390 46"/>
  <path class="measure" d="M155 238 L505 238"/>
  <text x="292" y="220" class="label">Width</text>
  <path class="measure" d="M250 72 L250 442"/>
  <text x="268" y="350" class="label">Length</text>
</g>
<g transform="translate(615,180)">
  <rect x="0" y="0" width="220" height="210" rx="22" fill="#f5f0e8" stroke="#ded4c4"/>
  <text x="20" y="44" class="label" font-size="24">Width</text>
  <text x="20" y="76" class="small" font-size="18">Measured straight across</text>
  <text x="20" y="100" class="small" font-size="18">the body while laid flat.</text>
  <text x="20" y="148" class="label" font-size="24">Length</text>
  <text x="20" y="180" class="small" font-size="18">Measured from shoulder</text>
  <text x="20" y="204" class="small" font-size="18">to bottom hem.</text>
</g>
<g transform="translate(615,425)">
  <rect x="0" y="0" width="220" height="105" rx="18" fill="#f5f0e8" stroke="#ded4c4"/>
  <text x="18" y="38" class="label" font-size="22">Tolerance</text>
  <text x="18" y="69" class="small" font-size="17">Small production variation</text>
  <text x="18" y="92" class="small" font-size="17">is normal.</text>
</g>
</svg>