name = "kalenel-admin-gate"
main = "src/worker.js"
compatibility_date = "2026-07-29"
workers_dev = false

# Free Workers architecture:
# - no R2
# - no Queues
# - no Workers AI
# - no paid Workers plan features
# - static admin files are served from Workers Static Assets behind the Worker OAuth gate

routes = [
  { pattern = "admin.kalenel.nl", custom_domain = true },
  { pattern = "kalenel.nl/admin*", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/gejast-admin*", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/gejast-push-admin-source.js", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/drinks_admin.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/familie_admin.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/match_control.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/match_swap.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/*_vault.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/vault.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/familie/admin.html", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/repo/admin*", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/*.md", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/*.txt", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/*.sql", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/*.patch", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/mnt/*", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/deployment_forensics_v761/*", zone_name = "kalenel.nl" },
  { pattern = "kalenel.nl/sql/*", zone_name = "kalenel.nl" }
]

[assets]
directory = "./static"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# All OAuth and allowlist values, including GITHUB_CLIENT_ID, are installed as Worker secrets
# by scripts/setup-admin-worker-secrets.ps1. None are stored in Git.
