<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t d">
  <title id="t">Bruis Seal of Approval</title>
  <desc id="d">Premium burgundy wax seal with gold detailing.</desc>
  <defs>
    <radialGradient id="wax" cx="38%" cy="28%" r="76%">
      <stop offset="0" stop-color="#ef9db7"/>
      <stop offset=".28" stop-color="#cf6388"/>
      <stop offset=".66" stop-color="#8b274c"/>
      <stop offset="1" stop-color="#541229"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b5"/>
      <stop offset=".32" stop-color="#e1bc68"/>
      <stop offset=".62" stop-color="#9d7230"/>
      <stop offset="1" stop-color="#f2d88f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#16040b" flood-opacity=".55"/>
    </filter>
    <filter id="texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M160 10
      l15 12 19-6 11 17 20 1 7 18 19 7 2 20 17 10-4 20 14 14-9 18 10 17-13 15 5 20-17 10-1 20-19 7-7 19-20 1-11 17-19-6-15 12-15-12-19 6-11-17-20-1-7-19-19-7-1-20-17-10 5-20-13-15 10-17-9-18 14-14-4-20 17-10 2-20 19-7 7-18 20-1 11-17 19 6z"
      fill="url(#wax)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" filter="url(#texture)"/>

    <circle cx="160" cy="160" r="116" fill="none" stroke="#3a0919" stroke-width="8" opacity=".6"/>
    <circle cx="160" cy="160" r="104" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="160" cy="160" r="91" fill="none" stroke="#f7dc97" stroke-width="1.5" stroke-dasharray="2.5 7" opacity=".78"/>

    <path d="M88 160h33" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M199 160h33" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="160" r="4.5" fill="url(#gold)"/>
    <circle cx="242" cy="160" r="4.5" fill="url(#gold)"/>

