    <text x="160" y="225" text-anchor="middle" fill="#3a0919" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="3.4">SEAL OF APPROVAL</text>

    <g transform="translate(160 153)">
      <path d="M-33 4 l18 18 43-48" fill="none" stroke="#f9e6ae" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
      <path d="M-33 4 l18 18 43-48" fill="none" stroke="#4b0d21" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
