name: v806 family nested-runtime builder

on:
  push:
    branches: [agent/v806-family-alias-runtime-light]
    paths: ['.github/workflows/v806-build-family-runtime.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out v806 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v806-family-alias-runtime-light
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Build exact v806 product change
        shell: bash
        run: |
          set -euo pipefail
          printf 'v806\n' > VERSION
          node fix-version-drift.mjs
          python3 <<'PY'
          from pathlib import Path
          import json

          p = Path('gejast-config.js')
          src = p.read_text()
          replacements = {
              "script.src = `./gejast-scope-hardening.js?${effectiveVersion}`": "script.src = `/gejast-scope-hardening.js?${effectiveVersion}`",
              "script.src = `./gejast-v725-repair.js?${effectiveVersion}`": "script.src = `/gejast-v725-repair.js?${effectiveVersion}`",
              "script.src = `./gejast-site-announcements.js?${effectiveVersion}`": "script.src = `/gejast-site-announcements.js?${effectiveVersion}`",
              "fetch('./VERSION?ts=' + Date.now()": "fetch('/VERSION?ts=' + Date.now()",
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'missing nested-runtime replacement target: {old}')
              src = src.replace(old, new)
          p.write_text(src)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          check = 'node check-v806-nested-runtime-assets.mjs'
          static = pkg['scripts']['verify:static']
          if check not in static:
              anchor = 'node check-v805-paardenrace-native-poll-owner.mjs'
              if anchor not in static:
                  raise SystemExit('verify:static anchor missing')
              pkg['scripts']['verify:static'] = static.replace(anchor, anchor + ' && ' + check)
          pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n')

          cert = {
              'schema_version': 1,
              'current_version': 'v806',
              'status': 'REVALIDATION_REQUIRED',
              'prior_certification': {
                  'version': 'v805',
                  'product_sha': 'b64a116f2b2684d1fbd475b40c2b76f569d40942',
                  'release_branch': 'release/v805-certified-20260818',
                  'artifact': 'final-acceptance-v805.json'
              },
              'reason': 'v806 makes shared runtime support assets and the VERSION refresh root-absolute so protected nested /familie/ routes cannot resolve JavaScript or VERSION requests under /familie/. v805 remains the certified rollback baseline until v806 completes fresh live health, authenticated visual review and focused nested-route proof.',
              'current_evidence': {
                  'candidate_version': 'v806',
                  'candidate_status': 'SOURCE_VERIFICATION_PENDING_THEN_DEPLOYMENT_REVALIDATION',
                  'v805_certified_product_sha': 'b64a116f2b2684d1fbd475b40c2b76f569d40942',
                  'v805_final_acceptance': 'final-acceptance-v805.json'
              },
              'required_next': [
                  'Merge v806 only after canonical CI verifies root-absolute nested runtime asset resolution and all existing contracts.',
                  'After deployment, run exact-current live health and a focused authenticated nested Family route proof that rejects /familie/gejast-*.js and /familie/VERSION requests.',
                  'Run the full authenticated visual audit with cleanup and manually review the v806 screenshots before restoring PASS.'
              ]
          }
          Path('release-certification.json').write_text(json.dumps(cert, indent=2) + '\n')
          PY
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v806-builder-run-id.txt
          node check-v806-nested-runtime-assets.mjs
          node check-version-drift.mjs

      - name: Commit focused-verified v806 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION gejast-config.js package.json release-certification.json check-v806-nested-runtime-assets.mjs .proof/v806-builder-run-id.txt '*.html' '*.js' '*.mjs' 'familie/*.html'
          git add -u
          git diff --cached --quiet && { echo 'No v806 candidate changes produced'; exit 1; }
          git commit -m 'fix: make nested family runtime assets root-absolute'
          git push origin HEAD:agent/v806-family-alias-runtime-light
          echo 'RESULT=V806_BUILDER_PASS'
