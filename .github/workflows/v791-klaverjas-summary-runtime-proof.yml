name: v791 Klaverjas summary runtime proof

on:
  push:
    branches:
      - 'agent/v791-klaverjas-summary-overlay'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Permanent verification first
        run: npm run verify
      - name: Install isolated browsers
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Build isolated local fixture
        run: |
          rm -rf /tmp/kalenel-v791-proof
          mkdir -p /tmp/kalenel-v791-proof
          tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C /tmp/kalenel-v791-proof
          cat > /tmp/kalenel-v791-proof/gejast-home-gate.js <<'EOF'
          (function(){
            try {
              document.documentElement.classList.remove('gejast-auth-pending');
              document.documentElement.classList.add('gejast-auth-ready');
              if (document.body) {
                document.body.classList.remove('boot-pending');
                document.body.classList.remove('page-loading');
              }
            } catch (_) {}
            window.GEJAST_HOME_GATE = { proof: true };
          })();
          EOF
          cat >> /tmp/kalenel-v791-proof/gejast-config.js <<'EOF'
          ;(function(){
            window.GEJAST_CONFIG = window.GEJAST_CONFIG || {};
            window.GEJAST_CONFIG.requireMatchEntrySession = function(){ return true; };
            window.GEJAST_CONFIG.ensurePlayerSessionOrRedirect = function(){ return true; };
            window.GEJAST_CONFIG.requirePlayerSession = function(){ return true; };
          })();
          EOF
      - name: Start isolated site
        run: |
          cd /tmp/kalenel-v791-proof
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kalenel-v791-proof-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/VERSION >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kalenel-v791-proof-http.log
          exit 1
      - name: Cross-engine 16-round scorer proof
        env:
          PROOF_BASE_URL: http://127.0.0.1:4173
        run: node scripts/v791-klaverjas-summary-runtime-proof.mjs
      - name: Prove repository stayed clean
        if: always()
        run: |
          git status --short
          test -z "$(git status --porcelain)"
