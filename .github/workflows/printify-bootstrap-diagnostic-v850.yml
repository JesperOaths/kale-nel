name: Printify secret promotion

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Promote existing Printify token to Edge secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-promote-secret-v850'
          echo
          curl --fail-with-body --silent --show-error --max-time 12 \
            'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828?bootstrap=1'
