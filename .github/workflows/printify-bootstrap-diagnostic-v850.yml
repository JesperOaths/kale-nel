name: Audit v851 catalog selection

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Audit live catalog exclusions
        shell: bash
        run: |
          set -euo pipefail
          URL='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          body="$(curl --silent --show-error --fail --max-time 30 "$URL?diagnostic=1&catalog_audit=1")"
          printf '%s\n' "$body" | jq '{
            ok,
            mode,
            shopCount,
            probes,
            catalogAudit: {
              upstreamProducts: .catalogAudit.upstreamProducts,
              shopCounts: .catalogAudit.shopCounts,
              excluded: .catalogAudit.excluded
            }
          }'
          printf '%s' "$body" | jq -e '.ok == true and (.catalogAudit.upstreamProducts // 0) > 0' >/dev/null
