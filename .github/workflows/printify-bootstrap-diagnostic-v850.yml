name: Force v851 catalog refresh

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger v851 live catalog rebuild
        shell: bash
        run: |
          set -euo pipefail
          URL='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          for attempt in {1..12}; do
            body="$(curl --silent --show-error --max-time 20 "$URL?refresh=v851-$attempt" || true)"
            printf '%s\n' "$body" | jq '{source,catalogSelection,warming,refreshScheduled,products:(.products|length // 0)}' || true
            if printf '%s' "$body" | jq -e '
              .source == "printify-live-v851"
              and .catalogSelection == "all-readable-printify-shops-v851"
              and ((.products // []) | length) > 0
            ' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 8
          done
          exit 1
