name: Recover Supabase database

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Restart unhealthy Supabase project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "Restarting Supabase database because db/rest health checks are UNHEALTHY..."
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restart"
          echo
      - name: Wait for database and REST recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            body="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/health?services=db&services=pooler&services=rest" || true)"
            echo "$body"
            if printf '%s' "$body" | python3 -c '
import json,sys
try:
  rows=json.load(sys.stdin)
  by={x.get("name"):x.get("healthy") for x in rows if isinstance(x,dict)}
  raise SystemExit(0 if by.get("db") is True and by.get("rest") is True and by.get("pooler") is True else 1)
except Exception:
  raise SystemExit(1)
'; then
              echo "Supabase database, REST, and pooler are healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Supabase services did not recover within the bounded recovery window."
          exit 1
      - name: Verify Printify token and catalog path
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828?diagnostic=1'
          echo
