name: Refresh live Printify catalog

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger and verify live Printify catalog
        shell: bash
        run: |
          set -euo pipefail
          URL='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          echo "Triggering live Printify catalog refresh..."
          for attempt in {1..12}; do
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' "$URL?refresh_probe=v850-$attempt" || true)"
            echo "attempt=$attempt http=$code"
            jq '{source,catalogSelection,warming,refreshScheduled,products:(.products|length // 0),shops:(.shops|length // 0),error}' "$tmp" 2>/dev/null || head -c 500 "$tmp" || true
            echo
            if [[ "$code" == "200" ]] && jq -e '
              .source == "printify-live-v850"
              and .catalogSelection == "all-readable-printify-shops-v850"
              and ((.products // []) | length) > 0
            ' "$tmp" >/dev/null 2>&1; then
              echo "Live Printify catalog is ready."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live Printify catalog did not become ready."
          exit 1
