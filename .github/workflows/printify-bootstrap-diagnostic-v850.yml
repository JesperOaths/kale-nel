name: Check Supabase REST and Printify path

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Check Supabase services
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/health?services=db&services=pooler&services=rest"
          echo
      - name: Check Printify diagnostic path
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 15 \
            'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828?diagnostic=1'
          echo
