name: Probe v851 catalog cache

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live catalog cache
        shell: bash
        run: |
          set -euo pipefail
          URL='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' "$URL?health=1" || true)"
          body="$(cat "$response")"
          echo "HTTP $status"
          printf '%s\n' "$body"
          printf '%s\n' "$body" | jq '{ok,mode,cachedProducts,cacheAgeSeconds,catalogSelection,refreshScheduled}'
          printf '%s' "$body" | jq -e '.ok == true and (.cachedProducts // 0) >= 53' >/dev/null

# catalog-audit-rerun-rpc-first
