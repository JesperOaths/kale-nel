name: Read Printify blueprint metadata

on:
  push:
    paths:
      - '.github/workflows/printify-bootstrap-diagnostic-v850.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public blueprint metadata through catalog bridge
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828?blueprint_meta=1'
          echo
