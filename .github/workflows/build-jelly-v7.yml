name: Build Jellyfish v7 preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shop-jellyfish-nonblank-v7
      - name: Reconstruct and verify exact preview
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/jelly-v7.part0 .tmp/jelly-v7.part1 .tmp/jelly-v7.part2 .tmp/jelly-v7.part3 .tmp/jelly-v7.part4 .tmp/jelly-v7.part5 .tmp/jelly-v7.part6 > /tmp/jelly-v7.b64
          base64 -d /tmp/jelly-v7.b64 > shop/assets/product-previews/jellyfish-front-v7.webp
          test "$(stat -c%s shop/assets/product-previews/jellyfish-front-v7.webp)" = "24990"
          echo "e6e20ad2c7acadfa3fb7041194cd66da3071c076cadb52ebc27bf869c84cd0cb  shop/assets/product-previews/jellyfish-front-v7.webp" | sha256sum -c -
          file shop/assets/product-previews/jellyfish-front-v7.webp | grep -qi 'Web/P'
      - name: Commit reconstructed binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shop/assets/product-previews/jellyfish-front-v7.webp
          git commit -m "Shop: reconstruct verified Jellyfish v7 asset"
          git push origin HEAD:fix/shop-jellyfish-nonblank-v7
