name: v809 runtime RPC push builder

on:
  push:
    branches: [agent/v809-runtime-rpc-contract-cleanup]
    paths: ['.github/workflows/v809-runtime-rpc-push-builder.yml']

permissions:
  contents: write

concurrency:
  group: v809-runtime-rpc-push-builder
  cancel-in-progress: false

env:
  BASE_SHA: 41b9643029595c22e68223ed7e860da4d2b6040b
  TARGET_BRANCH: agent/v809-runtime-rpc-contract-cleanup

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v809-runtime-rpc-contract-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify v809
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^(\.github/workflows/v809-runtime-rpc-builder\.yml|\.github/workflows/v809-runtime-rpc-push-builder\.yml|scripts/v809-runtime-rpc-build\.py)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected branch drift:'; echo "$unexpected"; exit 1; }
          printf 'v809\n' > VERSION
          python3 scripts/v809-runtime-rpc-build.py
          node fix-version-drift.mjs
          node check-v809-runtime-rpc-contract-cleanup.mjs
          rm -f .github/workflows/v809-runtime-rpc-builder.yml .github/workflows/v809-runtime-rpc-push-builder.yml scripts/v809-runtime-rpc-build.py
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align active runtime RPC contracts v809'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'RESULT=V809_RUNTIME_RPC_BUILDER_PASS'
