name: S9 folder suggestion review safeguards

on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/folder_suggestion_engine.py'
      - 'ops/c720p/s9-native-security/folder_suggestion_api.py'
      - 'ops/c720p/s9-native-security/folder-suggestion-cards-v1.js'
      - 'ops/c720p/s9-native-security/security-people-v320.js'
      - 'ops/c720p/s9-native-security/security-people-v325.js'
      - 'ops/c720p/s9-native-security/security-people-v52.html'
      - 'ops/c720p/s9-native-security/security-people-v53.html'
      - 'ops/c720p/s9-native-security/folder_suggestion_baseline_v1.py'
      - 'ops/c720p/s9-native-security/s9_folder_suggestion_metrics_extension_v1.py'
      - 'ops/c720p/s9-native-security/folder-suggestion-cards-live-v3.js'
      - 'ops/c720p/s9-native-security/folder-suggestions-top-tab-live-v3.js'
      - 'ops/c720p/s9-native-security/test-suggestions-nonblocking-live-v3.py'
      - 'ops/c720p/s9-native-security/security-hub-v33.js'
      - 'ops/c720p/s9-native-security/people-suggestions-dom-guard-v1.js'
      - 'ops/c720p/s9-native-security/install-active-surveillance-suggestions.py'
      - 'ops/c720p/s9-native-security/test-real-surveillance-suggestions-dom.py'
      - 'ops/c720p/s9-native-security/security-people-v326.js'
      - 'ops/c720p/s9-native-security/appearance-evidence-panel-v3.js'
      - 'ops/c720p/s9-native-security/security-hub-v32.js'
      - 'ops/c720p/s9-native-security/install-active-people-hub-loader.py'
      - 'ops/c720p/s9-native-security/test-active-v53-suggestions.py'
      - 'ops/c720p/s9-native-security/folder-suggestions-top-tab-v1.js'
      - 'ops/c720p/s9-native-security/s9_folder_suggestion_bridge_v1.py'
      - 'ops/c720p/s9-native-security/install-people-suggestions-entry-route.py'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-vector-routing.py'
      - 'ops/c720p/s9-native-security/test-folder-suggestions-top-tab.js'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-cards.js'
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-*.py'
      - '.github/workflows/s9-folder-suggestion-engine.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/folder_suggestion_engine.py'
      - 'ops/c720p/s9-native-security/folder_suggestion_api.py'
      - 'ops/c720p/s9-native-security/folder-suggestion-cards-v1.js'
      - 'ops/c720p/s9-native-security/security-people-v320.js'
      - 'ops/c720p/s9-native-security/security-people-v325.js'
      - 'ops/c720p/s9-native-security/security-people-v52.html'
      - 'ops/c720p/s9-native-security/security-people-v53.html'
      - 'ops/c720p/s9-native-security/folder_suggestion_baseline_v1.py'
      - 'ops/c720p/s9-native-security/s9_folder_suggestion_metrics_extension_v1.py'
      - 'ops/c720p/s9-native-security/folder-suggestion-cards-live-v3.js'
      - 'ops/c720p/s9-native-security/folder-suggestions-top-tab-live-v3.js'
      - 'ops/c720p/s9-native-security/test-suggestions-nonblocking-live-v3.py'
      - 'ops/c720p/s9-native-security/security-hub-v33.js'
      - 'ops/c720p/s9-native-security/people-suggestions-dom-guard-v1.js'
      - 'ops/c720p/s9-native-security/install-active-surveillance-suggestions.py'
      - 'ops/c720p/s9-native-security/test-real-surveillance-suggestions-dom.py'
      - 'ops/c720p/s9-native-security/security-people-v326.js'
      - 'ops/c720p/s9-native-security/appearance-evidence-panel-v3.js'
      - 'ops/c720p/s9-native-security/security-hub-v32.js'
      - 'ops/c720p/s9-native-security/install-active-people-hub-loader.py'
      - 'ops/c720p/s9-native-security/test-active-v53-suggestions.py'
      - 'ops/c720p/s9-native-security/folder-suggestions-top-tab-v1.js'
      - 'ops/c720p/s9-native-security/s9_folder_suggestion_bridge_v1.py'
      - 'ops/c720p/s9-native-security/install-people-suggestions-entry-route.py'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-vector-routing.py'
      - 'ops/c720p/s9-native-security/test-folder-suggestions-top-tab.js'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-cards.js'
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-native-security/test-folder-suggestion-*.py'

jobs:
  synthetic-review-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate Python modules and executable behavior
        run: |
          cd ops/c720p/s9-native-security
          python -m py_compile folder_suggestion_engine.py folder_suggestion_api.py
          python test-folder-suggestion-engine.py
          python test-folder-suggestion-api.py
          python test-folder-suggestion-http.py
          python -m py_compile install-people-suggestions-entry-route.py s9_folder_suggestion_bridge_v1.py
          python test-folder-suggestion-vector-routing.py
          python -m py_compile install-active-people-hub-loader.py
          python test-active-v53-suggestions.py
          python -m py_compile install-active-surveillance-suggestions.py
          python test-real-surveillance-suggestions-dom.py
          python -m py_compile folder_suggestion_baseline_v1.py s9_folder_suggestion_metrics_extension_v1.py
          python test-suggestions-nonblocking-live-v3.py
      - name: Syntax-check the optional UI bridge and original People UI
        run: |
          node --check ops/c720p/s9-native-security/folder-suggestion-cards-v1.js
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-folder-suggestion-cards.js
          node --check ops/c720p/s9-native-security/security-people-v320.js
          node --check ops/c720p/s9-native-security/security-people-v325.js
          node --check ops/c720p/s9-native-security/security-people-v326.js
          node --check ops/c720p/s9-native-security/appearance-evidence-panel-v3.js
          node --check ops/c720p/s9-native-security/security-hub-v32.js
          node --check ops/c720p/s9-native-security/security-hub-v33.js
          node --check ops/c720p/s9-native-security/people-suggestions-dom-guard-v1.js
          node --check ops/c720p/s9-native-security/folder-suggestions-top-tab-v1.js
          node --check ops/c720p/s9-native-security/folder-suggestions-top-tab-live-v3.js
          node --check ops/c720p/s9-native-security/folder-suggestion-cards-live-v3.js
          node ops/c720p/s9-native-security/test-folder-suggestions-top-tab.js
