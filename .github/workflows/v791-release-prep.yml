name: v791 release prep

on:
  push:
    branches:
      - 'agent/v791-klaverjas-summary-overlay'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v791-klaverjas-summary-overlay
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply narrow repair and synchronize release identity
        run: node scripts/prepare-v791-klaverjas-summary.mjs
      - name: Verify candidate before committing generated sync
        run: npm run verify
      - name: Commit generated candidate changes if needed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prepare v791 Klaverjas finished summary'
          git push origin HEAD:agent/v791-klaverjas-summary-overlay
