name: One-shot v805 release housekeeping

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/v805-release-housekeeping-once.yml']

permissions:
  contents: read

jobs:
  cleanup:
    if: github.head_ref == 'ops/run-one-shots-via-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify certified v805 pointers
        shell: bash
        run: |
          set -euo pipefail
          target='b64a116f2b2684d1fbd475b40c2b76f569d40942'
          branch_sha="$(git ls-remote --heads origin release/v805-certified-20260818 | awk '{print $1}')"
          tag_sha="$(git ls-remote --tags origin 'refs/tags/v805-certified-20260818^{}' | awk '{print $1}')"
          test "$branch_sha" = "$target"
          test "$tag_sha" = "$target"
          echo 'RESULT=V805_CERTIFIED_POINTERS_PASS'
      - name: Inventory governance-retained disposable branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            proof/v805-current-recovery
            proof/v805-main-run-discovery
            proof/v805-paardenrace-native-cadence
            proof/v805-phase2-deep-live-20260818
            proof/v805-phase2-owner-isolation
            proof/v805-pikken-render-stress2-20260818
            proof/v805-pikken-render-stress-20260818
            proof/v805-postrestart-health-20260818
            proof/v805-postv801a-fast-deep-20260818
            proof/v805-postv801a-fast-visual-20260818
            proof/v805-toepen-v801a-rest-20260818
            proof/cancel-obsolete-visual-20260818
            ops/v805-release-tag-20260818
            ops/v805-release-housekeeping
            test/v805-visual-warning-diagnostics
          )
          retained=0
          absent=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "governance_retained=$branch"
              retained=$((retained+1))
            else
              echo "already_absent=$branch"
              absent=$((absent+1))
            fi
          done
          echo "retained=$retained absent=$absent"
          echo 'RESULT=V805_PROOF_BRANCH_RETENTION_INVENTORIED_PASS'
      - name: Record cleanup governance boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Repository deletion rules reject deletion of protected proof/ops branches (GH013 Cannot delete this branch).'
          echo 'The rule is intentionally preserved; branch retention is housekeeping state, not a release blocker.'
          echo 'Certified release/v805-certified-20260818 and v805-certified-20260818 remain the authoritative immutable pointers.'
          echo 'RESULT=V805_HOUSEKEEPING_GOVERNANCE_BOUNDARY_PASS'
