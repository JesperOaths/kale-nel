name: One-shot v805 release housekeeping

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v805-release-housekeeping-once.yml']

# Triggered only when this one-shot workflow changes on main. Remove it after PASS.
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify permanent v805 release evidence before cleanup
        shell: bash
        run: |
          set -euo pipefail
          target='b64a116f2b2684d1fbd475b40c2b76f569d40942'
          resolve_tag_commit() {
            local tag="$1" direct peeled
            direct="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            printf '%s\n' "${peeled:-$direct}"
          }
          certified_sha="$(git ls-remote --heads origin release/v805-certified-20260818 | awk '{print $1}')"
          freeze_sha="$(git ls-remote --heads origin release/v805-certified-freeze-20260818 | awk '{print $1}')"
          tag_sha="$(resolve_tag_commit v805-certified-20260818)"
          record_sha="$(git ls-remote --heads origin release/v805-finalization-record | awk '{print $1}')"
          test "$certified_sha" = "$target"
          test "$freeze_sha" = "$target"
          test "$tag_sha" = "$target"
          test -n "$record_sha"
          git fetch --quiet origin release/v805-finalization-record
          git show FETCH_HEAD:RELEASE_V805_CERTIFICATION_20260818.md | grep -Fq "$target"
          git show FETCH_HEAD:RELEASE_V805_CERTIFICATION_20260818.md | grep -Fq '7757d1e51ae99152ee730efb640a27566a28d05eb2d635957bf40f40118495c5'
          echo 'RESULT=V805_PERMANENT_EVIDENCE_PRE_CLEANUP_PASS'

      - name: Delete exact disposable v805 branch allowlist
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/v805-release-finalization
            agent/v805-remove-redundant-paardenrace-monitor
            proof/v805-current-recovery
            proof/v805-main-run-discovery
            proof/v805-paardenrace-native-cadence
            proof/v805-phase2-deep-live-20260818
            proof/v805-phase2-owner-isolation
            proof/v805-pikken-render-stress2-20260818
            proof/v805-pikken-render-stress-20260818
            proof/v805-postrestart-health-20260818
            proof/v805-postv801a-fast-deep-20260818
            proof/v805-postv801a-fast-visual-20260818
            proof/v805-toepen-v801a-rest-20260818
            proof/cancel-obsolete-visual-20260818
            ops/v805-release-tag-20260818
            ops/v805-release-housekeeping
            test/v805-visual-warning-diagnostics
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|release/*|agent/v813-*) echo "Refusing protected/current branch: $branch"; exit 1 ;;
            esac
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "deleted=$branch"
            else
              echo "already_absent=$branch"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Disposable branch still present: $branch"
              exit 1
            fi
          done
          echo 'RESULT=V805_DISPOSABLE_BRANCH_ZERO_RESIDUE_PASS'

      - name: Verify permanent v805 pointers after cleanup
        shell: bash
        run: |
          set -euo pipefail
          target='b64a116f2b2684d1fbd475b40c2b76f569d40942'
          resolve_tag_commit() {
            local tag="$1" direct peeled
            direct="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            printf '%s\n' "${peeled:-$direct}"
          }
          test "$(git ls-remote --heads origin release/v805-certified-20260818 | awk '{print $1}')" = "$target"
          test "$(git ls-remote --heads origin release/v805-certified-freeze-20260818 | awk '{print $1}')" = "$target"
          test "$(resolve_tag_commit v805-certified-20260818)" = "$target"
          test -n "$(git ls-remote --heads origin release/v805-finalization-record | awk '{print $1}')"
          echo 'RESULT=V805_RELEASE_HOUSEKEEPING_PASS'
