name: v787 final thorough read-only audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  baseline-live-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full permanent repository verification
        run: npm run verify
      - name: Hardened live v787 public/admin suite
        env:
          GEJAST_EXPECTED_VERSION: v787
          GEJAST_SMOKE_RETRIES: 5
        run: npm run smoke:live
      - name: Base and extended read-only beta surfaces
        run: |
          npm run smoke:beta:read
          npm run smoke:beta:extended
      - name: Live performance budgets
        run: npm run smoke:beta:perf
      - name: Static metadata, residue, secret and push-schedule audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/v787-final-thorough-static-audit-v2.mjs

  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary browser and accessibility tooling
        run: |
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: 70-route/viewport renders plus focused Rad widths
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
        run: node scripts/v787-final-thorough-browser-audit.mjs
