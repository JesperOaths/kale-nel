name: C720P legacy Save Delete live contract V168
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-legacy-save-delete-v168.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-legacy-save-delete-v168.py'
      - '.github/workflows/c720p-legacy-save-delete-audit-v168.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-legacy-save-delete-v168.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-legacy-save-delete-v168.py'
      - '.github/workflows/c720p-legacy-save-delete-audit-v168.yml'
permissions:
  contents: read
concurrency:
  group: c720p-save-delete-v168
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Refuse unrecognized Save and Delete behavior without media writes
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-c720p-legacy-save-delete-v168.py"
          python3 "$d/test-audit-c720p-legacy-save-delete-v168.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Audit live Save and Delete branch semantics without invoking them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source="ops/c720p/security-runtime/audit-c720p-legacy-save-delete-v168.py"
          hash="$(sha256sum "$source" | cut -d' ' -f1)"
          stage="/tmp/c720p-save-delete-v168-${GITHUB_SHA:0:13}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fsSL --max-time 40 '$url' -o '$stage' && printf '%s  %s\\n' '$hash' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-save-delete-v168-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-save-delete-v168','diagnostic',:'cmd',250,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_SAVE_DELETE_V168_JOB=$job"
          for i in $(seq 1 100); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3200)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              grep -q 'C720P_LEGACY_SAVE_DELETE_V168_CONTRACT' <<< "$output"
              grep -q '"save_persists_index_locally": true' <<< "$output"
              grep -q '"delete_unlinks_local_files": true' <<< "$output"
              grep -q '"no_save_or_delete_executed": true' <<< "$output"
              grep -q '"no_media_or_review_writes": true' <<< "$output"
              grep -q '"local_originals_retention_required": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Save/Delete read-only structure unavailable";exit 1
