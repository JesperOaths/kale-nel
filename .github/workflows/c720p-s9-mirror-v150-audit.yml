name: C720P S9 3-hour migration mirror installed-state audit V150
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-mirror-v150.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-mirror-v150.py'
      - '.github/workflows/c720p-s9-mirror-v150-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-mirror-v150.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-mirror-v150.py'
      - '.github/workflows/c720p-s9-mirror-v150-audit.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-mirror-audit-v150
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Non-destructive import worker, timer and private manifest checks
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-c720p-s9-mirror-v150.py"
          python3 "$d/test-audit-c720p-s9-mirror-v150.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Inspect physical S9 migration worker and scheduled mirroring
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source="ops/c720p/security-runtime/audit-c720p-s9-mirror-v150.py"
          hash="$(sha256sum "$source" | cut -d' ' -f1)"
          stage="/tmp/c720p-s9-mirror-audit-v150-${GITHUB_SHA:0:14}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$hash' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' && /usr/bin/python3 '$stage' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-s9-mirror-v150-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-s9-mirror-audit-v150','diagnostic',:'cmd',320,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_S9_MIRROR_V150_JOB=$job"
          for i in $(seq 1 110); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3500)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_S9_MIRROR_V150_READONLY_VERIFIED' <<< "$output"
              grep -q '"mirror_timer_active": true' <<< "$output"
              grep -q '"mirror_timer_enabled": true' <<< "$output"
              grep -q '"no_worker_copy_or_verify_run": true' <<< "$output"
              grep -q '"contains_media_deletion": false' <<< "$output"
              grep -q '"originals_still_required": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "S9 mirroring state preflight not verified";exit 1
