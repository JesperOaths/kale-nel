name: Record exact live v803 identity

on:
  push:
    branches: [release/v803-live-identity]
    paths: ['.github/workflows/v803-sync-live-identity.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/v803-live-identity
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Record fail-closed exact-v803 live evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 'v803'
          python3 - <<'PY'
          import json
          from pathlib import Path

          live_sha='4bb1af4e1c5f285da8f755579e1e5998e0d38554'
          health_run=31981729447
          visual_run=31981729455
          cadence_run=31982033700

          p=Path('beta-readiness.json')
          d=json.loads(p.read_text())
          d['site_version']='live v803 / current frontend release v803'
          d['last_updated']='2026-08-17'
          dep=d.setdefault('deployment_identity',{})
          dep.pop('release_candidate_version',None)
          dep['live_version']='v803'
          dep['frontend_release_merge']=live_sha
          dep['repository_head_at_audit']=live_sha
          dep['note']=(
            'Live v803 PASS identity: merge '+live_sha+' is deployed. Exact-main Live deployment health run 31981729447 attempt 2 passed public/admin routes, GitHub OAuth perimeter, base+extended read-only acceptance and performance after one transient drinks_history HTTP 503 on attempt 1. '
            'Fresh-browser live cadence proof 31982033700 PASS observed exactly one early homepage-live call on desktop (598 ms) and one on 390x844 mobile (449 ms), with zero calls after 3 seconds while both canonical live-summary and v725 compatibility runtime were present. '
            'Exact-v803 visual run 31981729455 remains blocked before Chromium screenshots because all four Supabase service-role fixture attempts and all four cleanup attempts timed out; no artifact exists and residue is unverified. '
            'Historical Chromium/axe and isolated no-write mobile Chromium evidence remains preserved in baseline checks. SQL-only Toepen v801a remains permission-gated and undeployed.'
          )
          ev=dep.setdefault('evidence',[])
          additions=[
            '2026-08-17 live v803: exact-main Live deployment health run 31981729447 attempt 2 PASS after deployment of merge 4bb1af4e1c5f285da8f755579e1e5998e0d38554; all deployed public/admin surfaces, admin GitHub OAuth boundary, base+extended read-only acceptance and performance passed.',
            '2026-08-17 live v803: fresh-browser cadence proof 31982033700 PASS; desktop homepage-live calls=1 at 598 ms and 390x844 mobile calls=1 at 449 ms, with zero late/repeating calls after 3 seconds; canonical live-summary plus v725 compatibility runtime both observed.',
            '2026-08-17 live v803: full visual run 31981729455 failed before screenshots because all four service-role REST provisioning attempts timed out; no screenshot artifact was produced and all four cleanup attempts also timed out, so residue remains unverified.'
          ]
          for item in reversed(additions):
            if item not in ev: ev.insert(0,item)
          for check in d.get('baseline_checks',[]):
            if check.get('id')=='live_routes':
              prefix='2026-08-17 live v803 exact-main health run 31981729447 attempt 2 PASS across deployed public/admin routes, admin OAuth perimeter, base+extended read-only acceptance and performance. '
              if not str(check.get('evidence','')).startswith(prefix):
                check['evidence']=prefix+str(check.get('evidence',''))
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          p=Path('release-certification.json')
          c=json.loads(p.read_text())
          c['current_version']='v803'
          c['status']='REVALIDATION_REQUIRED'
          c['reason']=(
            'v803 is live from merge '+live_sha+' and exact-main deployment health run 31981729447 attempt 2 is green. '
            'The proven legacy one-second homepage-live request storm is fixed: fresh-browser live cadence run 31982033700 observed one early desktop call and one early mobile call with no repeats after 3 seconds. '
            'Certification remains blocked because exact-v803 full visual run 31981729455 failed before screenshot capture when the production Supabase data plane timed out on all disposable-identity provisioning attempts; no visual artifact exists and cleanup/residue verification also timed out. '
            'The separate SQL-only Toepen v801a ownership repair remains deliberately undeployed without explicit authorization.'
          )
          e=c.setdefault('current_evidence',{})
          e.pop('candidate_parent_main',None)
          e['frontend_version']='v803'
          e['live_frontend_version']='v803'
          e['live_frontend_merge']=live_sha
          e['audited_repository_head']=live_sha
          e['v803_live_deployment_health_run']=health_run
          e['v803_live_deployment_health_attempt']=2
          e['v803_homepage_request_cadence_inventory_run']=31981237343
          e['v803_legacy_repair_load_graph_run']=31981327145
          e['v803_fresh_live_homepage_cadence_run']=cadence_run
          e['v803_fresh_live_homepage_cadence_result']='PASS_DESKTOP_1_AT_598MS_MOBILE_1_AT_449MS_ZERO_AFTER_3S'
          e['v803_visual_audit_run']=visual_run
          e['v803_visual_audit_status']='FAILED_BEFORE_SCREENSHOTS_SUPABASE_DATA_PLANE'
          e['v803_visual_artifact']=None
          e['v803_visual_cleanup_status']='UNVERIFIED_DATA_PLANE_TIMEOUT'
          c['required_next']=[
            'Restore reliable production Supabase data-plane access, then rerun the exact-current full live visual audit through authenticated Friends/Family fixture provisioning, screenshot capture, artifact upload, zero-residue cleanup and manual screenshot review.',
            'Once the data plane is reliable, rerun exact-current live Boerenbridge/Beerpong owner-isolation and the remaining deep Phase-2 live-write campaign with explicit zero-residue cleanup.',
            'Obtain explicit authorization before applying GEJAST_v801a_toepen_idempotency_owner_guard.sql to production Supabase.',
            'After any authorized v801a deployment, prove same-owner Toepen idempotency still returns the same game while unrelated-owner, invalid-session and wrong-scope replay fail closed, with zero residue, then rerun exact-current live health/deep gameplay before considering PASS.'
          ]
          p.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          PY
          npm ci
          npm run verify
          git rm .github/workflows/v803-sync-live-identity.yml
          git config user.name 'JesperOaths'
          git config user.email '150788310+JesperOaths@users.noreply.github.com'
          git add beta-readiness.json release-certification.json
          git add -u
          git commit -m 'cert: record exact live v803 evidence'
          git push origin HEAD:release/v803-live-identity
