name: S9 People and Faces unified UI plus private review cases
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/test-step2-appearance-pilot.js'
      - 'ops/c720p/s9-native-security/test-step2-manual-evidence-cases.py'
      - 'ops/c720p/s9-native-security/deploy-step2-manual-cases-v1.py'
      - 'ops/c720p/s9-person-ml-v1/s9_manual_evidence_cases.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - '.github/workflows/c720p-s9-people-faces-unified.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/test-step2-appearance-pilot.js'
      - 'ops/c720p/s9-native-security/deploy-step2-manual-cases-v1.py'
      - 'ops/c720p/s9-person-ml-v1/s9_manual_evidence_cases.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - '.github/workflows/c720p-s9-people-faces-unified.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-people-faces-unified
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify face review layout and secure manual evidence cases
        shell: bash
        run: |
          set -euo pipefail
          node ops/c720p/s9-native-security/test-step2-appearance-pilot.js
          node ops/c720p/s9-native-security/test-face-review-evidence-gates-v29.js
          python3 ops/c720p/s9-native-security/test-step2-manual-evidence-cases.py
          python3 ops/c720p/s9-native-security/test-s9-hsv-integration.py
          python3 -m py_compile \
            ops/c720p/s9-native-security/deploy-step2-manual-cases-v1.py \
            ops/c720p/s9-person-ml-v1/s9_manual_evidence_cases.py \
            ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py
  deploy:
    needs: verify
    # Combined legacy UI publishers require explicit operator dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Guarded C720P review-case backend and unified UI deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client >/dev/null; }
          dir="ops/c720p/s9-native-security"
          installer="$dir/deploy-step2-manual-cases-v1.py"
          isha="$(sha256sum "$installer" | cut -d' ' -f1)"
          sha_backend="$(sha256sum ops/c720p/s9-person-ml-v1/s9_manual_evidence_cases.py | cut -d' ' -f1)"
          sha_proxy="$(sha256sum ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py | cut -d' ' -f1)"
          sha_ui="$(sha256sum "$dir/security-face-folders-v22.html" | cut -d' ' -f1)"
          dest="/tmp/s9-step2-unified-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/$GITHUB_SHA/$installer"
          cmd="curl -fSsL --max-time 40 '$uri' -o '$dest' && printf '%s  %s\n' '$isha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA' --backend-sha '$sha_backend' --proxy-sha '$sha_proxy' --ui-sha '$sha_ui'"
          idem="s9-unified-people-faces-${GITHUB_SHA:0:22}-$GITHUB_RUN_ATTEMPT"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-people-faces','deployment',:'cmd',300,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_UNIFIED_PEOPLE_FACES_DEPLOY_JOB=$id"
          for n in $(seq 1 110); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 7000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_STEP2_PERSISTENT_CASES_DEPLOY_VERIFIED' <<< "$output" || exit 1
              exit 0
            fi
            sleep 7
          done
          echo "S9 unified UI install not verified; do not claim deployment"
          exit 1
