name: v805 Supabase management restart

on:
  push:
    branches:
      - proof/v805-current-recovery
    paths:
      - .github/workflows/v805-supabase-management-restart.yml

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Verify management token exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_MANAGEMENT_TOKEN_MISSING'
            exit 78
          fi
          echo 'SUPABASE_MANAGEMENT_TOKEN_PRESENT'

      - name: Restart Supabase project
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/restart-body \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart")
          echo "SUPABASE_RESTART_HTTP=${http_code}"
          cat /tmp/restart-body
          echo
          case "$http_code" in
            200|201|202) echo 'SUPABASE_MANAGEMENT_RESTART_ACCEPTED' ;;
            *) echo 'SUPABASE_MANAGEMENT_RESTART_FAILED'; exit 1 ;;
          esac
