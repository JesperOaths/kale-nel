name: S9 metadata two-store transaction V197 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-dual-store-commit-v197.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerTrustedCheckpointV196.java'
      - '.github/workflows/s9-dual-store-commit-v197.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-dual-store-commit-v197.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerTrustedCheckpointV196.java'
      - '.github/workflows/s9-dual-store-commit-v197.yml'
permissions:
  contents: read
jobs:
  crash_and_replay_regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify crash gap, two-store receipts and no live media authority
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          python3 "$d/test-s9-ledger-trusted-head-v195.py"
          python3 "$d/test-s9-migrated-ledger-v193.py"
          python3 ops/c720p/security-runtime/test_s9_migrated_save_delete_contract_v181.py
