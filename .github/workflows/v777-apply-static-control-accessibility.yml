name: v777 apply static control accessibility

on:
  pull_request:
    paths:
      - 'scripts/apply-v777-static-control-accessibility.mjs'
      - '.github/workflows/v777-apply-static-control-accessibility.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic v777 patch
        run: node scripts/apply-v777-static-control-accessibility.mjs
      - name: Verify v777 release candidate
        shell: bash
        run: |
          node check-static-control-accessibility-v777.mjs
          node scripts/audit-game-control-accessibility-v777.mjs | tee /tmp/v777-accessibility.txt
          grep -q '^STATIC_SAFE_CANDIDATES=0$' /tmp/v777-accessibility.txt
          grep -q '^DYNAMIC_CONTEXT_CANDIDATES=12$' /tmp/v777-accessibility.txt
          npm run verify
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          git -c core.whitespace=cr-at-eol diff --check
      - name: Remove one-time audit/builder machinery and commit permanent v777 release
        shell: bash
        run: |
          rm -f scripts/audit-game-control-accessibility-v777.mjs
          rm -f scripts/apply-v777-static-control-accessibility.mjs
          rm -f .github/workflows/v777-game-accessibility-audit.yml
          rm -f .github/workflows/v777-apply-static-control-accessibility.yml
          rm -rf node_modules
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'accessibility: label static controls v777'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
