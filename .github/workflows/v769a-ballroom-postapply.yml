name: v769a Ballroom post-apply proof

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read

jobs:
  proof:
    if: github.event.pull_request.head.ref == 'agent/v770-ballroom-safe-read-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify repaired Ballroom production read path
        run: node check-live-ballroom-safe-read-v769a.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Confirm live site remains v769
        env:
          GEJAST_EXPECTED_VERSION: v769
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
