name: S9 V3 read-only first applied pilot postmortem
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-first-pilot-postmortem.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-first-pilot-postmortem.py'
      - '.github/workflows/s9-v3-first-pilot-postmortem.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-first-pilot-postmortem.py'
      - '.github/workflows/s9-v3-first-pilot-postmortem.yml'
permissions:
  contents: read
concurrency:
  group: security-v3-pilot-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prove phone evidence audit cannot alter private sources
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/run-s9-v3-first-pilot-postmortem.py"
          python3 "$d/test-s9-v3-first-pilot-postmortem.py"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/offline-worker/run-s9-v3-first-pilot-postmortem.py').read_text()
          for bad in ('--apply','subprocess.run(', 'pm install','rm -f','os.replace('):
              assert bad not in s
          print('S9_PILOT_PRIVATE_POSTMORTEM_READONLY_PASS')
          PY
  live-readonly:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run private source-qualified S9 first pilot read-only integrity audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security/offline-worker'
          stage="/tmp/security-v3-pilot-diag-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$stage'"
          for script in run-s9-v3-first-pilot-postmortem.py run-s9-v3-resumable-archive.py backfill-s9-original-roi-osnet-temporal-v2.py; do
            src="$root/$script"
            digest="$(sha256sum "$src" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
            cmd="$cmd && curl -fsSL --retry 2 --max-time 35 '$url' -o '$stage/$script' && printf '%s  %s\\n' '$digest' '$stage/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/run-s9-v3-first-pilot-postmortem.py'"
          idem="security-v3-pilot-diag-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v3-pilot-postmortem','diagnostic',:'cmd',220,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_V3_PRIVATE_PREFLIGHT_JOB=$id"
          for attempt in $(seq 1 48); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3500)"
              echo "$output"
              if [[ "$status" != 'done|0' ]]; then
                echo "S9 V3 read-only postmortem did not complete"; exit 1
              fi
              grep -q 'S9_V3_FIRST_PILOT_DIAGNOSTIC' <<< "$output"
              grep -q '"raw_filenames_disclosed": false' <<< "$output"
              grep -q '"private_identifiers_disclosed": false' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          echo "S9 V3 postmortem timed out"; exit 1
