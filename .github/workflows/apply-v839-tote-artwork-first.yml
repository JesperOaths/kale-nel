name: Apply v839 tote artwork first

on:
  push:
    branches:
      - agent/v839-tote-artwork-first
    paths:
      - .github/workflows/apply-v839-tote-artwork-first.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap v839 tote artwork-first patch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/v839-tote-artwork-first
          fetch-depth: 0

      - name: Apply v839 storefront patch
        shell: bash
        run: |
          set -euo pipefail
          cp shop/tote-handle-color-v838.js shop/tote-handle-color-v839.js
          python - <<'PY'
          from pathlib import Path

          tote = Path('shop/tote-handle-color-v839.js')
          s = tote.read_text()
          old = """    if(!variantId) return all;\n    const exact = all.filter(view => Array.isArray(view?.variantIds) && view.variantIds.map(String).includes(variantId));\n    return exact.length ? exact : all;\n"""
          new = """    const artwork = all.find(view => /artwork|print file|design png/i.test(String(view?.label || '')))\n      || all.find(view => !Array.isArray(view?.variantIds) || !view.variantIds.length)\n      || null;\n    if(!variantId){\n      if(!artwork) return all;\n      return [artwork, ...all.filter(view => view !== artwork)];\n    }\n    const exact = all.filter(view => Array.isArray(view?.variantIds) && view.variantIds.map(String).includes(variantId));\n    const selectedViews = exact.length ? exact : all.filter(view => view !== artwork);\n    return artwork ? [artwork, ...selectedViews.filter(view => view !== artwork)] : selectedViews;\n"""
          if old not in s:
              raise SystemExit('viewsFor target block not found')
          s = s.replace(old, new, 1)
          s = s.replace("window.BRUIS_TOTE_HANDLE_COLOR_V838", "window.BRUIS_TOTE_HANDLE_COLOR_V839")
          s = s.replace("release: 'v838'", "release: 'v839'")
          s = s.replace("variantBoundMockups: true,\n    exactVariantSelection: true", "variantBoundMockups: true,\n    artworkFirst: true,\n    sharedArtworkFirst: true,\n    exactVariantSelection: true")
          tote.write_text(s)

          index = Path('shop/index.html')
          s = index.read_text()
          s = s.replace('tote-handle-color-v838.js?v=20260916-storefront-v838-r1', 'tote-handle-color-v839.js?v=20260916-storefront-v839-r1')
          s = s.replace('<span class="version-watermark">v838</span>', '<span class="version-watermark">v839</span>')
          index.write_text(s)

          live = Path('check-live-shop.mjs')
          s = live.read_text()
          s = s.replace('tote-handle-color-v838.js?v=20260916-storefront-v838-r1', 'tote-handle-color-v839.js?v=20260916-storefront-v839-r1')
          s = s.replace("https://kalenel.nl/shop/tote-handle-color-v838.js?v=20260916-storefront-v838-r1", "https://kalenel.nl/shop/tote-handle-color-v839.js?v=20260916-storefront-v839-r1")
          s = s.replace('tote-handle-color-v838.js', 'tote-handle-color-v839.js')
          s = s.replace('v838', 'v839').replace('V838', 'V839')
          anchor = "assert.match(toteUi, /variantBoundMockups:\\s*true/, 'tote gallery must use selected-variant mockups');\n"
          extra = anchor + "assert.match(toteUi, /sharedArtworkFirst:\\s*true/, 'tote gallery must keep the artwork as slide one for every handle color');\n"
          if anchor not in s:
              raise SystemExit('live tote assertion anchor not found')
          s = s.replace(anchor, extra, 1)
          live.write_text(s)

          contract = Path('check-shop-commerce-v817.mjs')
          s = contract.read_text()
          s = s.replace("const toteHandleColor = read('shop/tote-handle-color-v838.js');", "const toteHandleColor = read('shop/tote-handle-color-v839.js');")
          s = s.replace('tote-handle-color-v838.js?v=20260916-storefront-v838-r1', 'tote-handle-color-v839.js?v=20260916-storefront-v839-r1')
          s = s.replace('v838', 'v839').replace('V838', 'V839')
          anchor = "assert.match(toteHandleColor, /variantBoundMockups:\\s*true/);\n"
          extra = anchor + "assert.match(toteHandleColor, /sharedArtworkFirst:\\s*true/);\nassert.match(toteHandleColor, /artwork\\|print file\\|design png/i);\n"
          if anchor not in s:
              raise SystemExit('contract tote assertion anchor not found')
          s = s.replace(anchor, extra, 1)
          contract.write_text(s)
          PY

      - name: Verify v839 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check shop/tote-handle-color-v839.js
          node check-shop-commerce-v817.mjs

      - name: Commit v839
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-v839-tote-artwork-first.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/index.html shop/tote-handle-color-v839.js check-live-shop.mjs check-shop-commerce-v817.mjs
          git commit -m "v839: keep tote artwork as first slide"
          git push origin HEAD:agent/v839-tote-artwork-first
