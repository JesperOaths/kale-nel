name: v809 postmerge certification

on:
  push:
    branches: [proof/v809-postmerge-certification]
    paths: ['.github/workflows/v809-postmerge-certification.yml']

permissions:
  contents: write

concurrency:
  group: v809-postmerge-certification
  cancel-in-progress: false

env:
  PRODUCT_SHA: 6b2e28175aa07705945db42107cff112800864b7
  PROOF_BRANCH: proof/v809-postmerge-certification
  SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEJAST_VISUAL_DB_NAME: postgres
  GEJAST_BASE_URL: https://kalenel.nl/
  GEJAST_SITE_SCOPE: friends
  GEJAST_VISUAL_TIMEOUT_MS: '25000'
  GEJAST_VISUAL_SETTLE_MS: '5000'
  GEJAST_WARNING_PROOF_TIMEOUT_MS: '25000'
  GEJAST_WARNING_PROOF_SETTLE_MS: '4500'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v809-postmerge-certification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Pin exact deployed product and browser runtime
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRODUCT_SHA"
          test "$(git show "$PRODUCT_SHA:VERSION" | tr -d '\r\n')" = 'v809'
          test "$(tr -d '\r\n' < VERSION)" = 'v809'
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing'; exit 1; }
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'system Chrome missing'; exit 1; }
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/full-live-visual-audit-v792.mjs')
          s=p.read_text()
          old='chromium.launch({ headless: true })'
          new='chromium.launch({ headless: true, executablePath: process.env.GEJAST_SYSTEM_CHROME })'
          if old not in s: raise SystemExit('visual Chrome patch target missing')
          p.write_text(s.replace(old,new))
          PY
          node --check scripts/full-live-visual-audit-v792.mjs
          node --check scripts/full-live-visual-fixtures-v801.mjs
          node --check scripts/refine-expected-visual-aliases-v809.mjs
          node --check scripts/v809-runtime-warning-live-proof.mjs
          "$chrome" --version

      - name: Exact-current live deployment health
        id: health
        shell: bash
        env:
          GEJAST_EXPECTED_VERSION: v809
          GEJAST_DEPLOY_WAIT_SECONDS: '240'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
          GEJAST_ADMIN_AUTH_TIMEOUT_MS: '15000'
          GEJAST_DATA_PLANE_TIMEOUT_MS: '10000'
          GEJAST_DATA_PLANE_ATTEMPTS: '2'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '750'
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
          GEJAST_PERF_TIMEOUT_MS: '20000'
        run: |
          set -euo pipefail
          node check-live-routes.mjs
          node check-live-admin-auth-boundary.mjs
          node check-live-data-plane.mjs
          node check-beta-readonly-surfaces.mjs
          node check-beta-readonly-extended.mjs
          node check-beta-performance.mjs
          echo 'RESULT=V809_EXACT_CURRENT_HEALTH_PASS'

      - name: Provision disposable Friends and Family identities
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-live-visual-fixtures-v801.mjs provision

      - name: Prove repaired runtime RPC contracts in authenticated Chromium
        id: warning_proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v809-runtime-warning-live-proof.mjs

      - name: Run full authenticated visual audit
        id: visual
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-live-visual-audit-v792.mjs

      - name: Refine declared redirect aliases
        id: aliases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refine-expected-visual-aliases-v809.mjs
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('visual-audit/report.json','utf8'));
          const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
          const broken=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken');
          if(broken.length){ console.error(JSON.stringify(broken.slice(0,20),null,2)); process.exit(1); }
          console.log(`RESULT=V809_VISUAL_REPORT_PASS records=${rows.length} broken=0`);
          JS

      - name: Cleanup disposable proof state
        id: cleanup
        if: always() && (steps.provision.outcome == 'success' || steps.provision.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-live-visual-fixtures-v801.mjs cleanup
          mkdir -p v809-warning-proof
          echo 'PASS_ZERO' > v809-warning-proof/cleanup.txt

      - name: Write evidence summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v809-warning-proof
          node <<'JS'
          const fs=require('fs');
          const p='visual-audit/report.json';
          let visual={records:0,broken:null};
          if(fs.existsSync(p)){
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
            visual={records:rows.length,broken:rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken').length};
          }
          const warning=fs.existsSync('v809-warning-proof/report.json')?JSON.parse(fs.readFileSync('v809-warning-proof/report.json','utf8')):null;
          const out={run_id:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,product_sha:process.env.PRODUCT_SHA,version:'v809',visual,warning_assertions:warning?.assertions||null};
          fs.writeFileSync('v809-warning-proof/evidence-summary.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          JS

      - name: Upload combined v809 evidence artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v809-postmerge-certification-${{ github.run_id }}
          path: |
            v809-warning-proof/
            visual-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete exact-current evidence
        id: enforce
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.prepare.outcome }}' = 'success'
          test '${{ steps.health.outcome }}' = 'success'
          test '${{ steps.provision.outcome }}' = 'success'
          test '${{ steps.warning_proof.outcome }}' = 'success'
          test '${{ steps.visual.outcome }}' = 'success'
          test '${{ steps.aliases.outcome }}' = 'success'
          test '${{ steps.cleanup.outcome }}' = 'success'
          test -f v809-warning-proof/report.json
          test -f visual-audit/report.json
          test -f v809-warning-proof/cleanup.txt
          echo 'RESULT=V809_POSTMERGE_CERTIFICATION_EVIDENCE_PASS'

      - name: Record successful proof run on proof branch
        if: steps.enforce.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p .proof
          cat > .proof/v809-postmerge-certification.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "product_sha": "${PRODUCT_SHA}",
            "version": "v809",
            "artifact_id": "${ARTIFACT_ID}",
            "artifact_digest": "${ARTIFACT_DIGEST}",
            "health": "PASS",
            "runtime_warning_proof": "PASS",
            "visual": "PASS",
            "cleanup": "PASS_ZERO"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v809-postmerge-certification.json
          git commit -m 'test: record successful v809 postmerge certification evidence'
          git push origin HEAD:"$PROOF_BRANCH"
