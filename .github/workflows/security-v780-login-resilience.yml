name: Kalenel Security v780 login resilience

on:
  push:
    branches:
      - agent/security-v780-login-resilience
    paths:
      - '.github/workflows/security-v780-login-resilience.yml'
      - 'scripts/deploy-security-v780.py'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/security-v780-login-resilience
          fetch-depth: 0

      - name: Preserve production rollback source
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.before.js
          cp security/index.html /tmp/security.before.html
          test -s /tmp/worker.before.js
          test -s /tmp/security.before.html

      - name: Prepare and verify v780
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy-security-v780.py
          node --check cloudflare/workers/admin-gate/src/worker.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('security/index.html').read_text()
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('BLOCKER=INLINE_SCRIPT_NOT_FOUND')
          Path('/tmp/security-inline.js').write_text(m.group(1))
          PY
          node --check /tmp/security-inline.js
          node scripts/build-admin-worker-assets.mjs
          test -s cloudflare/workers/admin-gate/static/security/index.html
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          grep -q "ADMIN_BUILD = 'v780-security-login-resilience'" cloudflare/workers/admin-gate/src/worker.js
          grep -q 'SECURITY_LOGIN_UPSTREAM_TIMEOUT_MS = 9000' cloudflare/workers/admin-gate/src/worker.js
          grep -q 'SECURITY_MEDIA_SESSION_TIMEOUT_MS = 12000' cloudflare/workers/admin-gate/src/worker.js
          grep -q 'authentication_service_unavailable' cloudflare/workers/admin-gate/src/worker.js
          grep -q 'isTransientSecurityUpstreamStatus' cloudflare/workers/admin-gate/src/worker.js
          grep -q 'authPending:false' security/index.html
          grep -q 'controller.abort(),25000' security/index.html
          grep -q 'id="unlockBtn"' security/index.html
          grep -q 'v780 - Kalenel Security' security/index.html
          echo V780_STATIC=PASS

      - name: Deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo V780_ROLLBACK=YES
              cp /tmp/worker.before.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/security.before.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 15); do
            build=$(curl -sS -o /dev/null -D - https://admin.kalenel.nl/admin.html | awk 'BEGIN{IGNORECASE=1}/^x-kalenel-admin-build:/{sub(/\r$/,"");print $2;exit}')
            root=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/ || true)
            unlock=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/unlock/ || true)
            post=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' https://kalenel.nl/security/auth/login || true)
            public=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            echo "TRY=$attempt BUILD=$build ROOT=$root UNLOCK=$unlock POST=$post PUBLIC=$public"
            if [ "$build" = 'v780-security-login-resilience' ] && [ "$root" = 302 ] && [ "$unlock" = 302 ] && [ "$post" = 401 ] && [ "$public" = 200 ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          echo V780_EDGE=PASS

      - name: Push clean reconciled source branch
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.v780.js
          cp security/index.html /tmp/security.v780.html
          git fetch origin main
          git checkout -B agent/security-v780-clean origin/main
          cp /tmp/worker.v780.js cloudflare/workers/admin-gate/src/worker.js
          cp /tmp/security.v780.html security/index.html
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Harden Security login against transient upstream stalls'
          git push --force origin HEAD:agent/security-v780-clean
          echo V780_SOURCE_BRANCH=PASS
