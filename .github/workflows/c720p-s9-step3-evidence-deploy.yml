name: S9 Step 3 legacy evidence source checks (V59 supersedes deploy)
# V59 deployment and acceptance are owned by security-step4-v59-release-20261019.yml.
# Do not auto-run this older V58 deployment against an upgraded V59 hub route.
# The guarded old deploy script remains available for recovery; it is not
# automatically invoked by a mainline People UI change.
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/test-people-v45.js'
      - 'ops/c720p/s9-native-security/deploy-people-v45.py'
      - '.github/workflows/c720p-s9-step3-evidence-deploy.yml'
permissions:
  contents: read
concurrency:
  group: s9-step3-people-real-route
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test clip-scoped face, clothing, movement and manual decisions
        run: |
          set -euo pipefail
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-people-v45.js
          python3 -m py_compile ops/c720p/s9-native-security/deploy-people-v45.py
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Rollback-safe deployment over existing authorized C720P gateway
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source='ops/c720p/s9-native-security/deploy-people-v45.py'
          sha="$(sha256sum "$source" | cut -d' ' -f1)"
          dest="/tmp/s9-step3-evidence-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fSsL --max-time 45 '$uri' -o '$dest' && printf '%s  %s\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA'"
          idem="s9-step3-real-route-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-step3-real-route','deployment',:'cmd',240,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_STEP3_REAL_ROUTE_JOB=$id"
          for i in $(seq 1 70); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done\|* || "$status" == error\|* || "$status" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              echo "$output"
              [[ "$status" == 'done|0' ]]
              grep -q 'S9_PEOPLE_FACES_V45_ACTUAL_HUB_DEPLOY_VERIFIED' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          echo 'C720P Step 3 deployment verification did not complete.'
          exit 1
