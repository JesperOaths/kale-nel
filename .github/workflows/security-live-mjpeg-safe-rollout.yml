name: Security live MJPEG-only guarded UI rollout
on:
  pull_request:
    paths:
      - '.github/workflows/security-live-mjpeg-safe-rollout.yml'
      - 'ops/c720p/security-runtime/deploy-security-live-only-v1.py'
      - 'ops/c720p/security-runtime/security-live-mjpeg-only-v1.js'
      - 'ops/c720p/security-runtime/test-live-only-mjpeg-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-live-mjpeg-safe-rollout.yml'
permissions:
  contents: read
concurrency:
  group: security-live-mjpeg-only-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify signed original video, MJPEG reconnect and safe deployment syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/c720p/security-runtime/security-live-mjpeg-only-v1.js
          node ops/c720p/security-runtime/test-live-only-mjpeg-v1.js
          python3 -m py_compile ops/c720p/security-runtime/deploy-security-live-only-v1.py
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Dry-run, backup and install original-only player through guarded hub agent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          script='ops/c720p/security-runtime/deploy-security-live-only-v1.py'
          sha="$(sha256sum "$script" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$script"
          dest="/tmp/security-live-mjpeg-only-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 35 '$url' -o '$dest' && printf '%s  %s\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '${GITHUB_SHA}' && /usr/bin/python3 '$dest' --ref '${GITHUB_SHA}' --apply"
          idem="security-live-only-v1-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-live-only','deployment',:'cmd',250,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_LIVE_ONLY_DEPLOY_JOB=$id"
          for i in $(seq 1 55); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 14000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 2500)"
              echo "$out"
              if [[ "$status" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'SECURITY_LIVE_ONLY_PREFLIGHT' <<< "$out"
              grep -q 'SECURITY_LIVE_MJPEG_ONLY_DEPLOY_VERIFIED' <<< "$out"
              echo 'SECURITY_LIVE_ONLY_SOURCE_AND_HTTP_VERIFIED'
              exit 0
            fi
            sleep 4
          done
          exit 1
