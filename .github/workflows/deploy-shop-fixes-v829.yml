name: Deploy shop commerce functions

# Deploys only after validating the corrected repository credential without exposing it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-shop-fixes-v829.yml'
      - 'supabase/functions/_shared/shop-fx.mjs'
      - 'supabase/functions/shop-catalog-v828/**'
      - 'supabase/functions/shop-manual-checkout-v832/**'
      - 'supabase/functions/shop-delivery-preview-v833/**'

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy authoritative shop catalog, checkout and delivery preview
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error title=Missing Supabase credential::The SUPABASE_ACCESS_TOKEN repository secret is empty."
            exit 1
          fi
          echo "::notice title=Supabase credential available::The repository secret is configured; deploying with the current CLI."
          npx --yes supabase@2.117.0 --version
          deploy_function() {
            local function_name="$1"
            local log_file="$RUNNER_TEMP/${function_name}.log"
            if npx --yes supabase@2.117.0 functions deploy "$function_name" --project-ref "$PROJECT_REF" --no-verify-jwt >"$log_file" 2>&1; then
              cat "$log_file"
              return 0
            fi
            cat "$log_file"
            local summary
            summary="$(grep -Ei 'error|failed|unauthorized|forbidden|token|project|unexpected|denied' "$log_file" | head -n 1 || true)"
            summary="$(printf '%s' "${summary:-Deployment command failed without a diagnostic line.}" | sed -E 's/sbp_[A-Za-z0-9_-]+/[redacted]/g; s/[A-Za-z0-9_-]{40,}/[redacted]/g; s/::/: :/g')"
            echo "::error title=Supabase ${function_name} deploy failed::$summary"
            return 1
          }
          deploy_function shop-catalog-v828
          deploy_function shop-manual-checkout-v832
          deploy_function shop-delivery-preview-v833
