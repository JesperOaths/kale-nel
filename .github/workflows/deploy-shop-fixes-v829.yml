name: Deploy shop fixes v829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-shop-fixes-v829.yml'

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy shop catalog and pending-order checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@2.45.4 functions deploy shop-catalog-v828 --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@2.45.4 functions deploy shop-manual-checkout-v828 --project-ref "$PROJECT_REF" --no-verify-jwt
