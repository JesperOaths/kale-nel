name: Deploy shop commerce functions

# Deploys only after validating the repository credential without exposing it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-shop-fixes-v829.yml'
      - 'supabase/functions/shop-catalog-v828/**'
      - 'supabase/functions/shop-manual-checkout-v832/**'

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy authoritative shop catalog and checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error title=Missing Supabase credential::The SUPABASE_ACCESS_TOKEN repository secret is empty."
            exit 1
          fi
          echo "::notice title=Supabase credential available::The repository secret is configured; deploying with the current CLI."
          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 functions deploy shop-catalog-v828 --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@2.117.0 functions deploy shop-manual-checkout-v832 --project-ref "$PROJECT_REF" --no-verify-jwt
