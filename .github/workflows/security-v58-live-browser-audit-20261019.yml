name: One-time Security V58 read-only browser acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/security-v58-live-browser-audit-20261019.yml'
      - 'ops/c720p/s9-native-security/verify-security-v58-browser-readonly.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-v58-live-browser-audit-20261019.yml'
permissions:
  contents: read
concurrency:
  group: security-v58-kiosk-readonly-acceptance
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile and check non-mutating probe boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/verify-security-v58-browser-readonly.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/verify-security-v58-browser-readonly.py').read_text()
          for forbidden in ('review/review', 's9-manual-recording-links', '.submit(', 'rmtree(', 'unlink(', 'Video.play(', 'video.play(', '.write_text(', '.write_bytes('):
              assert forbidden not in s,forbidden
          for required in ('SECURITY_V58_BROWSER_READONLY_ACCEPTANCE_PASS','approvalCancelFooter','viewerFile','driveTab','localTab','Target.closeTarget','data-view=faces'):
              assert required in s,required
          print('SECURITY_V58_BROWSER_READONLY_SOURCE_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Open temporary Chromium tab and verify Security V58 controls without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          directory="ops/c720p/s9-native-security"
          probe="$directory/verify-security-v58-browser-readonly.py"
          library="$directory/security-v8-real-browser-probe.py"
          a="$(sha256sum "$probe" | cut -d' ' -f1)"
          b="$(sha256sum "$library" | cut -d' ' -f1)"
          tmp="/tmp/security-v58-browser-${GITHUB_SHA:0:12}"
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$directory"
          cmd="mkdir -p '$tmp' && curl -fSsL --max-time 30 '$origin/verify-security-v58-browser-readonly.py' -o '$tmp/verify-security-v58-browser-readonly.py' && curl -fSsL --max-time 30 '$origin/security-v8-real-browser-probe.py' -o '$tmp/security-v8-real-browser-probe.py' && printf '%s  %s\\n' '$a' '$tmp/verify-security-v58-browser-readonly.py' | sha256sum -c - >/dev/null && printf '%s  %s\\n' '$b' '$tmp/security-v8-real-browser-probe.py' | sha256sum -c - >/dev/null && /usr/bin/python3 '$tmp/verify-security-v58-browser-readonly.py'"
          idem="security-v58-browser-audit-${GITHUB_SHA:0:18}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-v58-browser','diagnostic',:'cmd',235,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_V58_BROWSER_AUDIT_JOB=$id"
          for i in $(seq 1 55); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 14000)"
              echo "$out"
              [[ "$status" == 'done|0' ]]
              grep -q 'SECURITY_V58_BROWSER_READONLY_ACCEPTANCE_PASS' <<< "$out"
              exit 0
            fi
            sleep 5
          done
          exit 1
