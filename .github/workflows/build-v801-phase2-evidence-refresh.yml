name: Build v801 Phase 2 evidence refresh

on:
  push:
    branches: [cert/v801-phase2-evidence-refresh]
    paths: ['.github/workflows/build-v801-phase2-evidence-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: cert/v801-phase2-evidence-refresh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Refresh exact-v801 evidence truth and fail-closed readiness invariants
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 <<'PY'
          from pathlib import Path
          import json

          root='v801'
          main_sha='66e6f7ad13c1360a1eadfdd528acdb4290957e43'
          frontend_sha='d5388341c5ca0a595f80f239ebb5cafa84b6af60'

          # Release certification: remain fail-closed, but record completed current evidence and the real blocker.
          p=Path('release-certification.json')
          r=json.loads(p.read_text())
          r['current_version']=root
          r['status']='REVALIDATION_REQUIRED'
          r['reason']=(
            'Exact-v801 Phase 1 and Phase 2 revalidation are now complete, including the full visual audit, '
            'forced-login/auth scope isolation, real PIN login, authenticated game surfaces, two-human Klaverjas, '
            'natural Pikken and Paardenrace completion with reconnect/persistence rereads, and isolated Klaverjas '
            'transition/rules/persistence/roem/recovery PostgreSQL proofs. Phase 2 also live-proved one remaining '
            'production backend authorization defect: an unrelated authenticated Friends player can replay another '
            "player's Toepen client_match_id and receive the existing game_id. The SQL-only v801a owner/scope guard "
            'is merged and rollback-proven against the production schema, but has deliberately not been deployed to '
            'Supabase without explicit authorization. Certification therefore remains fail-closed until v801a is '
            'authorized/applied and fresh post-deploy owner-isolation plus deep live regression evidence passes.'
          )
          r['current_evidence']={
            'frontend_version':'v801',
            'frontend_merge':frontend_sha,
            'repository_head':main_sha,
            'full_visual_audit_run':31943987257,
            'phase1_live_auth_gameplay_run':31944683360,
            'phase2_deep_live_run':31952351394,
            'toepen_owner_defect_control_run':31952921912,
            'v801a_rollback_only_schema_proof_run':31953380650,
            'postmerge_live_health_run':31953491375,
            'klaverjas_postgres_persistence_run':31953687334,
            'klaverjas_postgres_roem_run':31953687328,
            'klaverjas_postgres_recovery_run':31953687352
          }
          r['required_next']=[
            'Obtain explicit authorization before applying GEJAST_v801a_toepen_idempotency_owner_guard.sql to production Supabase.',
            'After deployment, prove same-owner Toepen idempotency still returns the same game while unrelated-owner, invalid-session and wrong-scope replay fail closed, with zero residue.',
            'Rerun exact-current live health and the deep Phase-2 gameplay campaign after the backend mutation before considering PASS.'
          ]
          p.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          # Gameplay acceptance: record exactly what today's evidence proves; do not overclaim live completion.
          p=Path('gameplay-acceptance.json')
          g=json.loads(p.read_text())
          g['version']=3
          g['site_version']=root
          g['last_updated']='2026-08-16'
          games={x['id']:x for x in g['games']}
          x=games['toepen']
          x['live_status']='owner_isolation_defect_pending_authorized_fix'
          x['live_evidence']=(
            'Exact-v801 live owner-control run 31952921912 saved a structurally valid completed Toepen match, '
            'confirmed invalid-session denial, and proved an unrelated authenticated Friends player could replay '
            "the creator's client_match_id and receive already_saved=true with the foreign game_id. The foreign game "
            'was not mutated. SQL-only v801a is merged and rollback-proven but not deployed.'
          )
          x['remaining_gap']='Deploy the authorized v801a owner/scope guard, then rerun same-owner idempotency, unrelated-owner denial, invalid-session/wrong-scope denial and totals-consistency proof with zero residue.'

          x=games['boerenbridge']
          x['live_evidence']=(
            'Authenticated production persistence remains proven. Exact-v801 owner-control run 31952921912 additionally '
            'proved an unrelated authenticated player cannot replay another owner\'s client_match_id; the deterministic '
            '18-round engine matrix remains the full-match gameplay authority for all supported player counts.'
          )
          x=games['beerpong']
          x['live_evidence']=(
            'Authenticated production save persistence remains proven. Exact-v801 owner-control run 31952921912 '
            'additionally proved unrelated-player client_match_id replay is rejected. This is persistence/authorization '
            'proof, not a claim of a full multi-device cup-by-cup browser playthrough.'
          )

          x=games['pikken']
          x['live_status']='two_player_natural_completion_reconnect_proven'
          x['live_evidence']=(
            'Exact-v801 Phase-2 deep live run 31952351394 used disposable authenticated identities and multiple browser '
            'contexts to create/join/start Pikken, exercise reconnect/state reread, naturally reach terminal completion, '
            'recognize/persist the winner, reread the completed state, and clean every controlled fixture to zero residue.'
          )
          x['remaining_gap']='Minimum 2 remains grounded; no authoritative maximum room-size contract is proven. Higher player-count live completion is therefore not inferred from the two-player completion proof.'

          x=games['paardenrace']
          x['live_status']='two_player_natural_completion_reconnect_proven'
          x['live_evidence']=(
            'Exact-v801 Phase-2 deep live run 31952351394 used disposable authenticated identities and multiple browser '
            'contexts to create/join/start Paardenrace, preserve reconnect/state reread behavior, exercise nominations, '
            'naturally reach terminal completion, persist/reread the terminal state, and clean every controlled fixture.'
          )
          x['remaining_gap']='Minimum 2 remains grounded; no authoritative maximum human room-size contract is proven. Higher player-count live completion is not inferred from the two-player proof.'

          x=games['klaverjas_online']
          x['deterministic_status']='repository_postgres_revalidated_v801'
          x['deterministic_evidence']=(
            'On current v801 repository state, isolated PostgreSQL runs 31953687334, 31953687328 and 31953687352 '
            'recompiled/reproved the v792b-v792f transition/rules/persistence chain, canonical forged-input-resistant '
            'finished persistence and player stats, roem calculations/privilege isolation, and hidden recovery-hand '
            'rehydration/private-inner-RPC boundary.'
          )
          x['live_status']='two_player_room_reconnect_surface_proven'
          x['live_evidence']=(
            'Exact-v801 Phase-1 run 31944683360 created a two-human room with distinct seats. Phase-2 deep live run '
            '31952351394 exercised multi-context Klaverjas state and reconnect behavior while the current authenticated '
            'surface remained healthy. This is not promoted to a full four-human live play-to-completion claim.'
          )
          x['remaining_gap']='Four-seat gameplay completion is deeply covered by deterministic/isolated PostgreSQL proof; a full four-human production browser play-to-completion remains unclaimed and is not required to hide the current Toepen blocker.'
          p.write_text(json.dumps(g,indent=2,ensure_ascii=False)+'\n')

          # Beta tracker: promote deployment identity to actual live v801, preserve historical proof, and reopen only Toepen.
          p=Path('beta-readiness.json')
          b=json.loads(p.read_text())
          b['version']=8
          b['site_version']='live v801 / current frontend release v801'
          b['last_updated']='2026-08-16'
          d=b['deployment_identity']
          d['status']='verified_complete'
          d['live_version']='v801'
          d['frontend_release_merge']=frontend_sha
          d['repository_head_at_audit']=main_sha
          d['release_candidate_version']=''
          fresh=[
            '2026-08-16 live v801: Phase-1 auth/gameplay run 31944683360 PASS with logged-out invisibility, invalid-token cleanup, real PIN login-to-main, seven authenticated game surfaces, Friends/Family isolation, two-human Klaverjas and zero residue.',
            '2026-08-16 live v801: Phase-2 deep run 31952351394 PASS with multi-context/mobile/reconnect coverage plus natural Pikken and Paardenrace completion/persistence rereads and zero residue.',
            '2026-08-16 repository head 66e6f7ad13c1360a1eadfdd528acdb4290957e43: live deployment health run 31953491375 PASS; SQL-only v801a migration record does not change frontend VERSION or deploy the production function.'
          ]
          for item in reversed(fresh):
            if item not in d['evidence']:
              d['evidence'].insert(0,item)
          d['note']=(
            '2026-08-16 live v801 PASS for deployment identity and current frontend health: exact-v801 visual/auth/game '
            'evidence is current, and SQL-only repository head 66e6f7ad13c1360a1eadfdd528acdb4290957e43 leaves frontend '
            'VERSION at v801. Historical Chromium/axe proof remains zero total axe violations; isolated no-write live '
            'mobile Chromium proof remains preserved with non-GET requests intercepted locally, no Drinks stats-queue '
            'ReferenceError, >=44px Drinks controls and >=24px scoped Beerpong/Pussycup targets. This deployment identity '
            'PASS does not mean release certification PASS: exact-v801 Phase 2 found a Toepen owner-replay defect and the '
            'merged v801a SQL repair remains deliberately undeployed pending explicit authorization.'
          )
          for check in b['baseline_checks']:
            if check['id']=='live_routes':
              check['evidence']='2026-08-16 live v801 deployment health run 31953491375 PASS on current SQL-only repository head 66e6f7ad13c1360a1eadfdd528acdb4290957e43; public VERSION remains v801 and the protected admin perimeter is healthy. '+check['evidence']
            elif check['id']=='game_surface':
              check['evidence']='2026-08-16 exact-v801 Phase-2 deep run 31952351394 proves natural two-player Pikken and Paardenrace completion with reconnect/persistence rereads; Phase-1 run 31944683360 proves two-human Klaverjas and all authenticated game surfaces. Deterministic full-match matrices remain authoritative for Toepen/Boerenbridge and isolated PostgreSQL proof for Klaverjas. '+check['evidence']
            elif check['id']=='live_write_safety_gate':
              check['evidence']='The live-write checklist remains fully disarmed with zero automated mutation targets. One newly live-proven Toepen backend repair is explicitly permission-gated in readiness and is not armed for automatic execution; v801a requires separate human authorization before production deployment.'
          for gap in b['beta_gaps']:
            if gap['id']=='toepen_backend_live':
              gap['status']='needs_permission'
              gap['proof_needed']='Current live blocker: exact-v801 run 31952921912 proved unrelated authenticated same-scope client_match_id replay returns a foreign existing Toepen game_id. v801a is merged and rollback-proven against the production schema but not deployed.'
              gap['next_action']='With explicit authorization, apply GEJAST_v801a_toepen_idempotency_owner_guard.sql to production Supabase, then rerun same-owner idempotency, unrelated-owner denial, invalid-session/wrong-scope denial, totals guard, deep gameplay regression and zero-residue checks.'
              gap['latest_probe']='2026-08-16: owner-control run 31952921912 proved the live defect and Boerenbridge/Beerpong controls; rollback-only v801a production-schema run 31953380650 passed owner/session/scope/totals assertions and proved production remained untouched after rollback.'
          p.write_text(json.dumps(b,indent=2,ensure_ascii=False)+'\n')

          # Current readiness regression must now reject false 12/12 claims and require exactly this one blocker.
          p=Path('check-beta-readiness-current-v770d.mjs')
          s=p.read_text()
          start=s.index('const gaps = new Map(')
          end=s.index("if (!extended.includes", start)
          replacement="""const gaps = new Map((tracker.beta_gaps || []).map((item) => [item.id, item]));
          for (const id of [
            'real_device_push_delivery','admin_host_security','scope_isolation','analytics_observability',
            'profile_editing','secondary_game_save_flows','badge_awards','admin_mutations','drinks_create_verify_reject',
            'boerenbridge_admin_contracts','stats_elo_predictions'
          ]) if (gaps.get(id)?.status !== 'verified_complete') failures.push(`${id} must remain verified_complete at current beta readiness`);
          const toepenGap = gaps.get('toepen_backend_live');
          if (toepenGap?.status !== 'needs_permission') failures.push('toepen_backend_live must remain explicitly needs_permission until the live-proven v801a repair is authorized and deployed');
          if (!/v801a/i.test(String(toepenGap?.next_action || ''))) failures.push('Toepen permission blocker must name the v801a deployment action');

          const blocked = [...gaps.values()].filter((item) => item.status === 'blocked_external');
          const permission = [...gaps.values()].filter((item) => item.status === 'needs_permission');
          const permissionIds = permission.map((item) => item.id).sort();
          if (blocked.length) failures.push(`tracker unexpectedly has blocked_external gaps: ${blocked.map((item) => item.id).join(', ')}`);
          if (JSON.stringify(permissionIds) !== JSON.stringify(['toepen_backend_live'])) failures.push(`expected only Toepen to be permission-gated, got: ${permissionIds.join(', ') || '(none)'}`);
          const completeCount = [...gaps.values()].filter((item) => item.status === 'verified_complete').length;
          if (completeCount !== 11 || permission.length !== 1) failures.push(`expected current readiness split 11 complete / 1 permission-gated, got ${completeCount} / ${permission.length}`);

          """
          replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          p.write_text(s[:start]+replacement+s[end:])

          p=Path('check-live-write-safety-v770e.mjs')
          s=p.read_text()
          s=s.replace("if(permissionIds.length!==0) failures.push('finalized readiness must expose zero permission-gated gaps');", "if(JSON.stringify(permissionIds)!==JSON.stringify(['toepen_backend_live'])) failures.push('current readiness must expose only the unarmed Toepen v801a permission blocker');\nconst toepenPermission=(readiness.beta_gaps||[]).find((item)=>item.id==='toepen_backend_live');\nif(!/v801a/i.test(String(toepenPermission?.next_action||''))) failures.push('Toepen permission blocker must name v801a');\nif(checklistIds.includes('toepen_backend_live')) failures.push('Toepen v801a must remain unarmed until explicit production authorization');")
          s=s.replace("console.log(`Live-write beta safety v771e PASS at ${rootVersion}: beta readiness is 12/12, no mutation target is armed, and the completed Drinks write command is disarmed.`);", "console.log(`Live-write beta safety v771e PASS at ${rootVersion}: one explicit Toepen v801a permission blocker is unarmed, no mutation target is armed, and the completed Drinks write command is disarmed.`);")
          p.write_text(s)
          PY
          node check-release-certification-state.mjs
          node check-gameplay-acceptance-current.mjs
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          npm run verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-certification.json gameplay-acceptance.json beta-readiness.json check-beta-readiness-current-v770d.mjs check-live-write-safety-v770e.mjs
          git commit -m 'cert: refresh v801 Phase 2 evidence truth'
          git push origin HEAD:cert/v801-phase2-evidence-refresh
