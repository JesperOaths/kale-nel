name: C720P Voice Assistant Regression Checks

on:
  push:
    branches: [main]
    paths:
      - 'ops/c720p/voice-assist-canary-20261010.py'
      - 'ops/c720p/voice-pipeline-diagnostic-20261010.py'
      - 'ops/c720p/tests/test_voice_assist_canary.py'
      - '.github/workflows/c720p-voice-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax and offline protocol/repair regression tests
        run: |
          python -m py_compile ops/c720p/voice-assist-canary-20261010.py ops/c720p/voice-pipeline-diagnostic-20261010.py
          python -m unittest discover -s ops/c720p/tests -p 'test_voice_assist_canary.py' -v
