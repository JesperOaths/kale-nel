name: S9 authenticated legacy JPEG display and regeneration guard V189
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-s9-jpeg-ui-v189.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-s9-jpeg-ui-v189.py'
      - '.github/workflows/c720p-s9-jpeg-ui-verified-v189.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-s9-jpeg-ui-v189.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-s9-jpeg-ui-v189.py'
      - '.github/workflows/c720p-s9-jpeg-ui-verified-v189.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-legacy-jpeg-display-v189
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Keep legacy playback and Save/Delete untouched
        shell: bash
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/deploy-c720p-s9-jpeg-ui-v189.py"
          python3 "$d/test-deploy-c720p-s9-jpeg-ui-v189.py"
          python3 "$d/test-c720p-legacy-s9-index-bridge-guard-v1.py"
          node --check "$d/c720p-migrated-snapshot-display-v182.js"
          node "$d/test-c720p-migrated-snapshot-display-v182.mjs"
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Source-pinned C720P only JPEG display injection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          f=ops/c720p/security-runtime/deploy-c720p-s9-jpeg-ui-v189.py
          s="$(sha256sum "$f" | cut -d' ' -f1)"
          stage="/tmp/c720p-jpeg-v189-${GITHUB_SHA:0:14}.py"
          source="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$f"
          cmd="curl -fsSL --max-time 35 '$source' -o '$stage' && printf '%s  %s\\n' '$s' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' && /usr/bin/python3 '$stage' --apply"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-jpeg-v189-${GITHUB_SHA:0:13}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-jpeg-ui-v189','deployment',:'cmd',370,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_JPEG_UI_V189_JOB=$job"
          for i in $(seq 1 118); do
            result="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$result" == done* || "$result" == error* || "$result" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4000)"
              echo "$output"
              [[ "$result" == 'done|0' ]] || exit 1
              grep -q 'C720P_JPEG_UI_V189_PREFLIGHT' <<< "$output"
              grep -q 'C720P_JPEG_UI_V189_VERIFIED' <<< "$output"
              grep -q '"all_recordings_preserved": true' <<< "$output"
              grep -q '"all_snapshots_preserved": true' <<< "$output"
              grep -q '"local_jpeg_fallback_preserved": true' <<< "$output"
              grep -q '"manual_reviews_modified": false' <<< "$output"
              grep -q '"save_delete_routes_modified": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Legacy JPEG display installation not verified";exit 1
