name: S9 V26 fast existing-face metadata refresh
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/fast-recent-s9-clip-index.py'
      - 'ops/c720p/s9-native-security/test-fast-recent-s9-clip-index.py'
      - 'ops/c720p/s9-native-security/deploy-fast-face-v26.py'
      - '.github/workflows/c720p-s9-fast-face-v26.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/fast-recent-s9-clip-index.py'
      - 'ops/c720p/s9-native-security/deploy-fast-face-v26.py'
      - '.github/workflows/c720p-s9-fast-face-v26.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-fast-recent-s9-clip-index.py
          python3 -m py_compile ops/c720p/s9-native-security/deploy-fast-face-v26.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/fast-recent-s9-clip-index.py').read_text()
          assert 'recent_existing_face_updates' in s
          assert 'if latest!=source:' in s
          assert 'face_deep_review_version' not in s or 'face' in s
          for bad in ('ffmpeg', 'tensorflow', 'face_embedding', 'adb install'):
            assert bad not in s,bad
          print('S9_V26_FAST_FACE_SIDECAR_CONTRACT_PASS')
          PY
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src='ops/c720p/s9-native-security/fast-recent-s9-clip-index.py'
          deployer='ops/c720p/s9-native-security/deploy-fast-face-v26.py'
          filehash="$(sha256sum "$src"|cut -d' ' -f1)"
          runhash="$(sha256sum "$deployer"|cut -d' ' -f1)"
          tmp="/tmp/s9-fast-face-v26-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${deployer}"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${tmp}' && printf '%s  %s\\n' '${runhash}' '${tmp}' | sha256sum -c - >/dev/null && python3 '${tmp}' --ref '${GITHUB_SHA}' --sha '${filehash}'"
          idem="s9-fast-face-v26-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-fast-face-v26','deployment',:'cmd',300,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "FAST_FACE_V26_JOB=$id"
          for i in $(seq 1 50); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 7000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_FACE_FAST_REFRESH_V26_DEPLOYED' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
