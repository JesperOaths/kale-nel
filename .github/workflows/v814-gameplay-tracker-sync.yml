name: One-shot v814 gameplay tracker metadata sync

on:
  push:
    branches:
      - agent/v814-web-push-display-ack

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Patch gameplay tracker metadata only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='gameplay-acceptance.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.site_version='v814';
          data.last_updated='2026-08-30';
          data.current_release_note='v814 carries forward the machine-checked gameplay contracts and historical production evidence classes; these are regression baselines, not a claim that exact-current v814 gameplay/visual certification has already been rerun. Fresh v814 live-browser/gameplay evidence remains part of release revalidation.';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n','utf8');
          NODE
          node check-gameplay-acceptance-current.mjs
      - name: Commit gameplay tracker metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameplay-acceptance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync v814 gameplay tracker metadata'
          git push origin HEAD:agent/v814-web-push-display-ack
