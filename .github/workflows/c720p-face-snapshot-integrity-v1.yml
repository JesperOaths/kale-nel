name: S9 native crop integrity and extraction analysis
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/local-sd-catalog.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - 'ops/c720p/s9-native-security/test-face-snapshot-integrity-v1.py'
      - 'ops/c720p/s9-native-security/deploy-face-snapshot-integrity-v1.py'
      - 'ops/c720p/s9-native-security/analyze-original4k-face-extraction-v1.py'
      - '.github/workflows/c720p-face-snapshot-integrity-v1.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-person-ml-v1/local-sd-catalog.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - 'ops/c720p/s9-native-security/test-face-snapshot-integrity-v1.py'
      - 'ops/c720p/s9-native-security/deploy-face-snapshot-integrity-v1.py'
      - 'ops/c720p/s9-native-security/analyze-original4k-face-extraction-v1.py'
      - '.github/workflows/c720p-face-snapshot-integrity-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Native JPEG integrity, missing-image recovery and extraction gap analysis
        run: |
          python3 -m py_compile ops/c720p/s9-person-ml-v1/local-sd-catalog.py ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py ops/c720p/s9-native-security/deploy-face-snapshot-integrity-v1.py ops/c720p/s9-native-security/analyze-original4k-face-extraction-v1.py
          python3 ops/c720p/s9-native-security/test-face-snapshot-integrity-v1.py
          python3 ops/c720p/s9-native-security/test-face-pipeline-v30.py
