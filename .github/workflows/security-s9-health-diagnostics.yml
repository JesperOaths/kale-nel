name: Security S9 health diagnostics read-only contract
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/security-health-diagnostics-v1.py'
      - 'ops/c720p/security-runtime/test-security-health-diagnostics-v1.py'
      - '.github/workflows/security-s9-health-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/security-health-diagnostics-v1.py'
      - 'ops/c720p/security-runtime/test-security-health-diagnostics-v1.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/security-runtime/security-health-diagnostics-v1.py
          python3 ops/c720p/security-runtime/test-security-health-diagnostics-v1.py
