name: v770c dead runtime cleanup proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v770c-dead-runtime-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Prove scheduled Node24 push run from merged main
        env:
          GEJAST_EXPECTED_PUSH_HEAD_SHA: '656886435b9c4dfa5c9cb3b5d9b99af112238b16'
          GEJAST_PUSH_SCHEDULE_WAIT_SECONDS: '480'
        run: node scripts/check-v770b-scheduled-push-postmerge.mjs
      - name: Prove canonical Beurs runtime route
        run: node check-beurs-runtime-route-v770c.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Live v770 deployment health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
