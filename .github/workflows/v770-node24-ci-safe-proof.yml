name: v770 Node24 CI safe proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v770-node24-ci-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Report runtime
        run: node --version && npm --version
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Full repository verification
        run: npm run verify
      - name: Hardened live deployment smoke
        env:
          GEJAST_EXPECTED_VERSION: v767
          GEJAST_DEPLOY_WAIT_SECONDS: '120'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: npm run smoke:live
      - name: Beta read-only smoke
        run: npm run smoke:beta:read
      - name: Push health smoke without send
        run: npm run smoke:push
