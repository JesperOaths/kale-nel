name: v771f finalization residue audit

on:
  pull_request:
    paths:
      - 'scripts/finalization-residue-audit-v771f.mjs'
      - '.github/workflows/v771f-finalization-residue-audit.yml'
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.json'
      - '*.css'
      - 'VERSION'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run finalization residue inventory
        run: node scripts/finalization-residue-audit-v771f.mjs
      - name: Simulate mechanical v772 version alignment
        run: |
          set -euo pipefail
          printf 'v772\n' > VERSION
          node fix-version-drift.mjs
          echo '--- V772_CHANGED_FILE_COUNT ---'
          git status --short | wc -l
          echo '--- V772_CHANGED_FILES ---'
          git status --short
          echo '--- V772_DIFF_STAT ---'
          git diff --stat
          git reset --hard HEAD >/dev/null
