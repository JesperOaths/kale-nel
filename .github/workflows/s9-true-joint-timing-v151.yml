name: S9 7-second preroll and 10-second tail same-clip read-only proof V151
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-s9-true-joint-timing-v151.py'
      - 'ops/c720p/security-runtime/test-audit-s9-true-joint-timing-v151.py'
      - '.github/workflows/s9-true-joint-timing-v151.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-s9-true-joint-timing-v151.py'
      - 'ops/c720p/security-runtime/test-audit-s9-true-joint-timing-v151.py'
      - '.github/workflows/s9-true-joint-timing-v151.yml'
permissions:
  contents: read
concurrency:
  group: s9-true-joint-timing-v151
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fresh structural timing assessment without MP4 access
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-s9-true-joint-timing-v151.py"
          python3 "$d/test-audit-s9-true-joint-timing-v151.py"
          python3 "$d/test-s9-7s-saved-timing-proof-v1.py"
  physical:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Refresh same-recording evidence in memory without modifying private reports
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          d="ops/c720p/security-runtime"
          stage="/tmp/s9-joint-timing-v151-${GITHUB_SHA:0:12}"
          cmd="install -d -m 700 '$stage'"
          for name in audit-s9-true-joint-timing-v151.py s9_7s_saved_timing_proof_v1.py; do
            hash="$(sha256sum "$d/$name" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$d/$name"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$hash' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/audit-s9-true-joint-timing-v151.py' && /usr/bin/python3 '$stage/audit-s9-true-joint-timing-v151.py' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="s9-joint-timing-v151-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-joint-timing-v151','diagnostic',:'cmd',320,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "S9_JOINT_TIMING_V151_JOB=$job"
          for i in $(seq 1 110); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3500)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_TRUE_JOINT_7S_10S_V151_READONLY' <<< "$output"
              grep -q '"same_recording_requirement_enforced": true' <<< "$output"
              grep -q '"no_video_bytes_read": true' <<< "$output"
              grep -q '"no_media_or_review_modifications": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Natural same-recording timing reassessment unavailable";exit 1
