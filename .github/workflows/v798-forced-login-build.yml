name: v798 forced-login deterministic build

on:
  push:
    branches: [agent/v798-forced-login-phase1]
    paths:
      - '.github/workflows/v798-forced-login-build.yml'
      - 'scripts/build-v798-forced-login.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v798 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v798-forced-login-phase1
          fetch-depth: 1
      - name: Build and synchronize v798
        run: |
          node scripts/build-v798-forced-login.mjs
          node fix-version-drift.mjs
      - name: Commit deterministic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reinstate fail-closed site login gate'
          git push origin HEAD:agent/v798-forced-login-phase1
