name: v770b Node24 push dispatcher proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v770b-node24-push-dispatcher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v770b-node24-push-dispatcher
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Report runtime
        run: node --version && npm --version
      - name: Synchronize root lockfile engine metadata
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='package-lock.json';
          const lock=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!lock.packages||!lock.packages['']) throw new Error('package-lock root metadata missing');
          lock.packages[''].engines={...(lock.packages[''].engines||{}),node:'>=24'};
          fs.writeFileSync(path,JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Mocked dispatcher runtime proof
        run: node check-web-push-node24-runtime-v770b.mjs
      - name: Validate real dispatcher secrets and libraries without running queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
          WEB_PUSH_WORKER_ID: node24-secret-validation
          WEB_PUSH_REQUIRE_EXPLICIT_TARGET: 'true'
          WEB_PUSH_TARGET_SUBSCRIPTION_ID: '1'
          WEB_PUSH_DRY_RUN: 'true'
          WEB_PUSH_MAX_JOBS: '1'
        run: |
          node <<'NODE'
          const d=require('./web_push_dispatcher.js');
          const options=d.buildOptions();
          d.createDispatcher(options);
          console.log('Node24 dispatcher construction with configured secrets PASS; dispatcher.run() intentionally not called.');
          NODE
      - name: Full repository verification
        run: npm run verify
      - name: Live v770 read-only deployment health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
      - name: Commit lockfile metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile metadata change required.'
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "Refusing unexpected staged files: $changed"
            exit 1
          fi
          git commit -m "ci: synchronize Node24 dispatcher engine policy"
          git push origin HEAD:agent/v770b-node24-push-dispatcher
