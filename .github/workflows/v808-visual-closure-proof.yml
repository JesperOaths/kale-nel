name: v808 visual closure proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v808-visual-closure-proof.yml'
      - 'scripts/v808-family-runtime-proof-final.mjs'

permissions:
  contents: read

concurrency:
  group: v808-visual-closure-20260818
  cancel-in-progress: true

env:
  GEJAST_EXACT_MAIN_SHA: 7f6f7bc110807e85f52ff4d54927620dbbc9ffeb
  GEJAST_BASE_URL: https://kalenel.nl/
  SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEJAST_VISUAL_DB_NAME: postgres
  GEJAST_SITE_SCOPE: friends
  GEJAST_VISUAL_TIMEOUT_MS: '25000'
  GEJAST_VISUAL_SETTLE_MS: '5000'
  GEJAST_BROWSER_TIMEOUT_MS: '25000'

jobs:
  visual-closure:
    if: github.head_ref == 'proof/v808-final-cert-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v808-final-cert-20260818
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Pin exact v808 product tree and system Chrome
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v808'
          test "$(curl -fsS --max-time 15 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v808'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^(\.github/workflows/v808-final-cert-proof\.yml|scripts/v808-family-runtime-proof\.mjs|scripts/v808-family-runtime-proof-final\.mjs|\.github/workflows/v808-visual-closure-proof\.yml)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof drift:'; echo "$unexpected"; exit 1; }
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"; echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/full-live-visual-audit-v792.mjs')
          s=p.read_text()
          old='chromium.launch({ headless: true })'
          new='chromium.launch({ headless: true, executablePath: process.env.GEJAST_SYSTEM_CHROME })'
          if old not in s: raise SystemExit('visual launch patch target missing')
          p.write_text(s.replace(old,new))
          PY
          node --check scripts/full-live-visual-audit-v792.mjs
          node --check scripts/v808-family-runtime-proof-final.mjs
          echo 'RESULT=V808_VISUAL_CLOSURE_RUNTIME_PASS'
      - name: Probe live auth data plane
        env:
          GEJAST_DATA_PLANE_TIMEOUT_MS: '8000'
          GEJAST_DATA_PLANE_ATTEMPTS: '1'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '0'
        run: node check-live-data-plane.mjs
      - name: Provision authenticated Friends and Family fixtures
        id: provision
        run: node scripts/full-live-visual-fixtures-v801.mjs provision
      - name: Prove Family runtime contracts
        run: node scripts/v808-family-runtime-proof-final.mjs
      - name: Capture every tracked live page
        id: capture
        continue-on-error: true
        run: node scripts/full-live-visual-audit-v792.mjs
      - name: Refine only declared redirect aliases
        id: aliases
        if: always() && steps.provision.outcome == 'success'
        run: node scripts/refine-expected-visual-aliases-v809.mjs
      - name: Print exact warning inventory
        if: always() && steps.provision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f visual-audit/report.json
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('visual-audit/report.json','utf8'));
          const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
          const warn=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='warn');
          const broken=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken');
          console.log(`V808_VISUAL_INVENTORY records=${rows.length} warn=${warn.length} broken=${broken.length}`);
          for(const x of warn){
            console.log(`V808_VISUAL_WARN ${x.route||x.path||''} :: ${x.reason||x.notes||''}`);
            for(const f of (x.failedRequests||x.failed_requests||[])) console.log(`V808_VISUAL_FAILED_REQUEST ${x.route||x.path||''} :: ${JSON.stringify(f)}`);
          }
          JS
      - name: Upload v808 visual artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v808-final-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup visual fixtures
        if: always() && (steps.provision.outcome == 'success' || steps.provision.outcome == 'failure')
        run: node scripts/full-live-visual-fixtures-v801.mjs cleanup
      - name: Enforce visual closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.provision.outcome }}" = 'success'
          test "${{ steps.aliases.outcome }}" = 'success'
          test -f visual-audit/report.json
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('visual-audit/report.json','utf8'));
          const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
          const broken=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken');
          if(broken.length){console.error(JSON.stringify(broken.slice(0,10),null,2));process.exit(1);}
          console.log(`V808_VISUAL_REPORT_PASS records=${rows.length} broken=0`);
          JS
          echo 'RESULT=V808_VISUAL_CLOSURE_PASS'
