name: C720P S9 dual-media local retirement refusal V190
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-full-cutover-v190.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-full-cutover-v190.py'
      - '.github/workflows/c720p-s9-full-cutover-v190.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-full-cutover-v190.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-full-cutover-v190.py'
      - '.github/workflows/c720p-s9-full-cutover-v190.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-full-cutover-audit-v190
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Strict read-only retirement refusal and data provenance
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-c720p-s9-full-cutover-v190.py" "$d/test-audit-c720p-s9-full-cutover-v190.py"
          python3 "$d/test-audit-c720p-s9-full-cutover-v190.py"
          python3 "$d/test-audit-c720p-s9-retirement-v156.py"
          python3 "$d/test_s9_migrated_save_delete_contract_v181.py"
  physical:
    needs: source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compare all six local JPG SHA and MP4 manifests; never delete originals
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source="ops/c720p/security-runtime"
          stage="/tmp/c720p-full-cutover-v190-${GITHUB_SHA:0:13}"
          cmd="install -d -m 700 '$stage'"
          for name in audit-c720p-s9-full-cutover-v190.py audit-c720p-s9-retirement-v156.py s9_migrated_save_delete_contract_v181.py; do
            digest="$(sha256sum "$source/$name" | cut -d' ' -f1)"
            uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source/$name"
            cmd="$cmd && curl -fsSL --max-time 35 '$uri' -o '$stage/$name' && printf '%s  %s\\n' '$digest' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/audit-c720p-s9-full-cutover-v190.py'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-s9-cutover-v190-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-s9-cutover-v190','diagnostic',:'cmd',180,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_S9_FULL_CUTOVER_V190_JOB=$job"
          for attempt in $(seq 1 105); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_S9_DUAL_MEDIA_CUTOVER_V190' <<< "$output"
              grep -q '"state":"blocked"' <<< "$output"
              grep -q '"eligible_for_local_removal":false' <<< "$output"
              grep -q '"local_snapshot_sha_matches":6' <<< "$output"
              grep -q '"retain_all_local_originals":true' <<< "$output"
              grep -q '"files_deleted":0' <<< "$output"
              grep -q '"capture_dropped_frames_after":0' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Read-only S9 cutover audit did not complete";exit 1
