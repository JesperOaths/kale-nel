name: v771a live proof record

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'agent/v771a-live-proof-record'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v771a-live-proof-record
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Record final live v771 proof
        run: node scripts/apply-v771a-live-proof-record.mjs
      - name: Remove temporary ordinary generator
        run: rm scripts/apply-v771a-live-proof-record.mjs
      - name: Install pinned dependencies
        run: npm ci
      - name: Full repository verification
        run: npm run verify
      - name: Confirm live v771 remains healthy
        env:
          GEJAST_EXPECTED_VERSION: v771
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
      - name: Commit readiness record only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta-readiness.json
          git add -u scripts/apply-v771a-live-proof-record.mjs
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(beta-readiness\.json|scripts/apply-v771a-live-proof-record\.mjs)$' || true)"
          if [ -n "$bad" ]; then echo "Unexpected staged files:"; echo "$bad"; exit 1; fi
          git commit -m "docs: record deployed v771 proof"
          git push origin HEAD:agent/v771a-live-proof-record
