name: S9 sealed source manifest V216 (source only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSealedSourceManifestV216.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSealedSourceManifestTestV216.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-sealed-manifest-source-v216.py'
      - '.github/workflows/s9-sealed-source-manifest-v216.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSealedSourceManifestV216.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSealedSourceManifestTestV216.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-sealed-manifest-source-v216.py'
      - '.github/workflows/s9-sealed-source-manifest-v216.yml'
permissions:
  contents: read
jobs:
  source-only-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify strict HMAC records and generation rollback
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          javac -source 8 -target 8 -d "$work" \
            "$d/S9MigratedVerifiedSourceV198.java" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedSealedSourceManifestV216.java" \
            "$d/S9MigratedSealedSourceManifestTestV216.java"
          java -cp "$work" nl.kalenel.s9offline.S9MigratedSealedSourceManifestTestV216
          python3 "$d/test-s9-sealed-manifest-source-v216.py"
          python3 "$d/test-s9-migrated-source-v198.py"
      - name: Android 10 API28 DEX source compilation without phone access
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$work/classes" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedVerifiedSourceV198.java" \
            "$d/S9MigratedSealedSourceManifestV216.java"
          "$d8" --min-api 28 --output "$work/dex" $(find "$work/classes" -name '*.class' -print)
          test -s "$work/dex/classes.dex"
          echo S9_SEALED_SOURCE_MANIFEST_V216_ANDROID_DEX_VERIFIED
