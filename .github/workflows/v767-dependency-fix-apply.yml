name: v767 dependency fix apply

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v767-dependency-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/v767-dependency-hardening
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh vulnerable transitive lock entry only
        run: npm audit fix --package-lock-only
      - name: Install patched lockfile
        run: npm ci
      - name: Require zero high/critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Full repository verification
        run: npm run verify
      - name: Live read-only route smoke
        env:
          GEJAST_EXPECTED_VERSION: v766
        run: npm run smoke:live
      - name: Beta read-only smoke
        run: npm run smoke:beta:read
      - name: Push health smoke without send
        run: npm run smoke:push
      - name: Commit lockfile repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No package-lock change required.'
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != "package-lock.json" ]; then
            echo 'Refusing unexpected staged files.'
            exit 1
          fi
          git commit -m "security: patch vulnerable ws transitive dependency"
          git push origin HEAD:agent/v767-dependency-hardening
