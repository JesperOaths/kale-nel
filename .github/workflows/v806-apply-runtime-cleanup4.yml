name: Apply v806 release-finalization candidate 4

on:
  push:
    branches: [agent/v806-release-finalization]
    paths: ['.github/workflows/v806-apply-runtime-cleanup4.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v806-release-finalization
          fetch-depth: 0
      - name: Record deterministic candidate run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v806-final-builder-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v806-final-builder-run-id.txt
          git commit -m 'test: record deterministic v806 builder run'
          git push origin HEAD:agent/v806-release-finalization
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build v806 candidate
        shell: bash
        run: bash scripts/build-v806-release-finalization-candidate.sh
      - name: Run full canonical verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
      - name: Commit verified product candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v806-apply-runtime-cleanup.yml .github/workflows/v806-apply-runtime-cleanup2.yml .github/workflows/v806-apply-runtime-cleanup3.yml .github/workflows/v806-apply-runtime-cleanup4.yml .github/workflows/v806-apply-runtime-cleanup5.yml .github/workflows/v806-warning-diagnostic.yml .github/workflows/v806-observe-cleanup.yml scripts/build-v806-release-finalization-candidate.sh
          rm -rf .proof
          git add -A
          git status --short
          git commit -m 'fix: finalize v806 runtime contracts and browser CI'
          git push origin HEAD:agent/v806-release-finalization
          echo 'RESULT=V806_RUNTIME_CANDIDATE_COMMITTED'
