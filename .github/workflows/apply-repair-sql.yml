name: Apply repair SQL

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Checked-in GEJAST repair SQL file to apply"
        required: true
        default: "GEJAST_v745_drinks_contract_write_repair.sql"
      confirmation:
        description: "Type APPLY_LIVE_REPAIR_SQL"
        required: true
  push:
    branches: [main]
    paths:
      - "GEJAST_v799z_supabase_connection_rescue.sql"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SQL_FILE_INPUT: ${{ github.event_name == 'push' && 'GEJAST_v799z_supabase_connection_rescue.sql' || inputs.sql_file }}
      CONFIRMATION_INPUT: ${{ github.event_name == 'push' && 'APPLY_LIVE_REPAIR_SQL' || inputs.confirmation }}
    steps:
      - name: Check confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION_INPUT" != "APPLY_LIVE_REPAIR_SQL" ]; then
            echo "Confirmation mismatch. No SQL was applied."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Validate selected SQL file
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$SQL_FILE_INPUT"
          case "$sql_file" in
            GEJAST_v7*_*.sql) ;;
            *) echo "Refusing non-repair SQL path: $sql_file"; exit 1 ;;
          esac
          test -f "$sql_file"
          test -n "${SUPABASE_DB_URL:-}"
          if grep -Eiq '(^|[[:space:]])(copy[[:space:]].*program|alter[[:space:]]+system|drop[[:space:]]+database|create[[:space:]]+role|alter[[:space:]]+role)\b|\\!' "$sql_file"; then
            echo "SQL file contains an operation this workflow refuses to run."
            exit 1
          fi
          echo "SQL_FILE=$sql_file" >> "$GITHUB_ENV"

      - name: Install psql client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply SQL with bounded retries
        shell: bash
        env:
          PGCONNECT_TIMEOUT: "20"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "repair attempt $attempt/6"
            if psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --set statement_timeout=30000 --file "$SQL_FILE"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Report applied file
        shell: bash
        run: echo "Applied $SQL_FILE"
