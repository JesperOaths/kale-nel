name: Apply repair SQL

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Checked-in GEJAST repair SQL file to apply"
        required: true
        default: "GEJAST_v745_drinks_contract_write_repair.sql"
      confirmation:
        description: "Type APPLY_LIVE_REPAIR_SQL"
        required: true
  push:
    branches: [main]
    paths:
      - "GEJAST_v799z_supabase_connection_rescue.sql"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
      SQL_FILE_INPUT: ${{ github.event_name == 'push' && 'GEJAST_v799z_supabase_connection_rescue.sql' || inputs.sql_file }}
      CONFIRMATION_INPUT: ${{ github.event_name == 'push' && 'APPLY_LIVE_REPAIR_SQL' || inputs.confirmation }}
    steps:
      - name: Check confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION_INPUT" = "APPLY_LIVE_REPAIR_SQL"

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Validate selected SQL file
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$SQL_FILE_INPUT"
          case "$sql_file" in GEJAST_v7*_*.sql) ;; *) exit 1 ;; esac
          test -f "$sql_file"
          test -n "${SUPABASE_DB_URL:-}"
          if grep -Eiq '(^|[[:space:]])(copy[[:space:]].*program|alter[[:space:]]+system|drop[[:space:]]+database|create[[:space:]]+role|alter[[:space:]]+role)\b|\\!' "$sql_file"; then exit 1; fi
          echo "SQL_FILE=$sql_file" >> "$GITHUB_ENV"

      - name: Request official database restart when management token is available
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          echo "requested=false" >> "$GITHUB_OUTPUT"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "No management token; continuing with connection recovery."
            exit 0
          fi
          code=$(curl -sS -o /tmp/restart.json -w '%{http_code}' --connect-timeout 10 --max-time 40 \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' || true)
          echo "restart_http=$code"
          case "$code" in
            200|201|202) echo "requested=true" >> "$GITHUB_OUTPUT" ;;
            *) cat /tmp/restart.json 2>/dev/null || true ;;
          esac

      - name: Wait for official restart
        if: steps.restart.outputs.requested == 'true'
        run: sleep 75

      - name: Install psql client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Apply bounded repair SQL
        shell: bash
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "database repair attempt $attempt/6"
            if timeout 35s psql "$SUPABASE_DB_URL" -X --set ON_ERROR_STOP=1 --file "$SQL_FILE"; then
              echo "DATABASE_REPAIR=SUCCESS"
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Report applied file
        shell: bash
        run: echo "Applied $SQL_FILE"
