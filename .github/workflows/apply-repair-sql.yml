name: Apply repair SQL

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Checked-in GEJAST repair SQL file to apply"
        required: true
        default: "GEJAST_v745_drinks_contract_write_repair.sql"
      confirmation:
        description: "Type APPLY_LIVE_REPAIR_SQL"
        required: true
  push:
    branches: [main]
    paths:
      - "GEJAST_v799z_supabase_connection_rescue.sql"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SQL_FILE_INPUT: ${{ github.event_name == 'push' && 'GEJAST_v799z_supabase_connection_rescue.sql' || inputs.sql_file }}
      CONFIRMATION_INPUT: ${{ github.event_name == 'push' && 'APPLY_LIVE_REPAIR_SQL' || inputs.confirmation }}
    steps:
      - name: Check confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION_INPUT" != "APPLY_LIVE_REPAIR_SQL" ]; then
            echo "Confirmation mismatch. No SQL was applied."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Validate selected SQL file
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$SQL_FILE_INPUT"
          case "$sql_file" in
            GEJAST_v7*_*.sql) ;;
            *) echo "Refusing non-repair SQL path: $sql_file"; exit 1 ;;
          esac
          test -f "$sql_file"
          test -n "${SUPABASE_DB_URL:-}"
          if grep -Eiq '(^|[[:space:]])(copy[[:space:]].*program|alter[[:space:]]+system|drop[[:space:]]+database|create[[:space:]]+role|alter[[:space:]]+role)\b|\\!' "$sql_file"; then
            echo "SQL file contains an operation this workflow refuses to run."
            exit 1
          fi
          echo "SQL_FILE=$sql_file" >> "$GITHUB_ENV"

      - name: Derive masked pooler URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.parse
          u=urllib.parse.urlsplit(os.environ['SUPABASE_DB_URL'])
          pw=urllib.parse.quote(urllib.parse.unquote(u.password or ''), safe='')
          user='postgres.uiqntazgnrxwliaidkmy'
          host='aws-0-eu-west-1.pooler.supabase.com'
          for name,port in [('POOLER_TX_URL',6543),('POOLER_SESSION_URL',5432)]:
              url=f'postgresql://{user}:{pw}@{host}:{port}/postgres?sslmode=require'
              print(f'::add-mask::{url}')
              with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'{name}={url}\n')
          PY

      - name: Install psql client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply SQL through available database path
        shell: bash
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          targets=("$POOLER_TX_URL" "$POOLER_SESSION_URL" "$SUPABASE_DB_URL")
          labels=("transaction-pooler" "session-pooler" "direct")
          for round in 1 2 3; do
            for i in 0 1 2; do
              echo "repair round $round via ${labels[$i]}"
              if psql "${targets[$i]}" --set ON_ERROR_STOP=1 --file "$SQL_FILE"; then
                echo "repair succeeded via ${labels[$i]}"
                exit 0
              fi
            done
            sleep $((round * 10))
          done
          exit 1

      - name: Report applied file
        shell: bash
        run: echo "Applied $SQL_FILE"
