name: Apply repair SQL

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Checked-in GEJAST repair SQL file to apply"
        required: true
        default: "GEJAST_v745_drinks_contract_write_repair.sql"
      confirmation:
        description: "Type APPLY_LIVE_REPAIR_SQL"
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "APPLY_LIVE_REPAIR_SQL" ]; then
            echo "Confirmation mismatch. No SQL was applied."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected SQL file
        shell: bash
        run: |
          set -euo pipefail
          sql_file="${{ inputs.sql_file }}"
          case "$sql_file" in
            GEJAST_v7*_*.sql) ;;
            *)
              echo "Refusing non-repair SQL path: $sql_file"
              exit 1
              ;;
          esac
          if [ ! -f "$sql_file" ]; then
            echo "SQL file not found: $sql_file"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Missing SUPABASE_DB_URL repository secret. No SQL was applied."
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(copy[[:space:]].*program|alter[[:space:]]+system|drop[[:space:]]+database|create[[:space:]]+role|alter[[:space:]]+role)\b|\\!' "$sql_file"; then
            echo "SQL file contains an operation this workflow refuses to run."
            exit 1
          fi
          echo "SQL_FILE=$sql_file" >> "$GITHUB_ENV"

      - name: Install psql client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply SQL
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --set statement_timeout=120000 \
            --file "$SQL_FILE"

      - name: Report applied file
        shell: bash
        run: |
          echo "Applied $SQL_FILE"
