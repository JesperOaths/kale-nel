name: proof exact-main run discovery

on:
  push:
    branches: [proof/v805-main-run-discovery]
    paths: ['.github/workflows/proof-main-run-discovery.yml']

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: b64a116f2b2684d1fbd475b40c2b76f569d40942
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v805-main-run-discovery
      - name: Query exact-main Actions runs
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p .proof
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            | jq '{target_sha: env.TARGET_SHA, runs: [.workflow_runs[] | {id,name,path,status,conclusion,event,head_sha,created_at,updated_at}]}' \
            > .proof/main-run-discovery.json
          cat .proof/main-run-discovery.json
      - name: Persist discovery evidence on proof branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/main-run-discovery.json
          git commit -m 'test: record exact-main workflow runs'
          git push origin HEAD:proof/v805-main-run-discovery
