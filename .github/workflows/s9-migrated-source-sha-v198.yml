name: S9 authenticated-source input barrier V198 host-only
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedVerifiedSourceV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedVerifiedSourceTestV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-source-v198.py'
      - '.github/workflows/s9-migrated-source-sha-v198.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedVerifiedSourceV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedVerifiedSourceTestV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-source-v198.py'
      - '.github/workflows/s9-migrated-source-sha-v198.yml'
permissions:
  contents: read
jobs:
  source-proof-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Reject invalid manifest, unauthorized actions and changed original bytes
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-migrated-source-v198.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          echo "S9_SHA_SOURCE_V198_HOST_ONLY_NO_APK_NO_MEDIA"
