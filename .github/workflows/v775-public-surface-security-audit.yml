name: v775 public surface security audit

on:
  pull_request:
    paths:
      - 'scripts/audit-public-surface-security-v775.mjs'
      - 'scripts/audit-git-history-secrets-v775.mjs'
      - '.github/workflows/v775-public-surface-security-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inventory public operational surfaces, current-tree secret patterns, and live headers
        run: node scripts/audit-public-surface-security-v775.mjs
      - name: Scan full Git history for high-confidence private secret exposure
        run: node scripts/audit-git-history-secrets-v775.mjs
