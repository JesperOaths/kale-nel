name: S9 incremental auxiliary recovery byte-range checks
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9_recovery_playback_smoke_v1.py'
      - 'ops/c720p/security-runtime/s9_recovery_playback_smoke_v2.py'
      - 'ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v2.py'
      - 'ops/c720p/security-runtime/c720p-s9-recovery-playback-smoke-v2.service'
      - 'ops/c720p/security-runtime/c720p-s9-recovery-playback-smoke-v2.timer'
      - '.github/workflows/s9-aux-range-incremental.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9_recovery_playback_smoke_v2.py'
      - 'ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v2.py'
permissions:
  contents: read
jobs:
  bounded-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/s9_recovery_playback_smoke_v2.py
          python3 ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v2.py
          python3 ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v1.py
          echo S9_AUXILIARY_RECOVERY_RANGE_CHECKPOINTED_AND_THERMALLY_GATED
