name: C720P snapshot legacy frontend cutover preflight V183
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/preflight-c720p-jpeg-legacy-bridge-v183.py'
      - 'ops/c720p/security-runtime/test-preflight-c720p-jpeg-legacy-bridge-v183.py'
      - '.github/workflows/c720p-jpeg-legacy-preflight-v183.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/preflight-c720p-jpeg-legacy-bridge-v183.py'
      - 'ops/c720p/security-runtime/test-preflight-c720p-jpeg-legacy-bridge-v183.py'
      - '.github/workflows/c720p-jpeg-legacy-preflight-v183.yml'
permissions:
  contents: read
concurrency:
  group: c720p-jpeg-legacy-preflight-v183
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check read-only source hashes and no deletion
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/preflight-c720p-jpeg-legacy-bridge-v183.py"
          python3 "$d/test-preflight-c720p-jpeg-legacy-bridge-v183.py"
          node "$d/test-c720p-migrated-snapshot-display-v182.mjs"
  physical:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read-only inspect current generator guard index clips and private JPEG endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          name=preflight-c720p-jpeg-legacy-bridge-v183.py
          src="ops/c720p/security-runtime/$name"
          digest="$(sha256sum "$src" | cut -d' ' -f1)"
          stage="/tmp/c720p-jpeg-legacy-v183-${GITHUB_SHA:0:13}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
          cmd="umask 077 && curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$digest' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-jpeg-v183-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-jpeg-legacy-preflight-v183','diagnostic',:'cmd',250,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_JPEG_PREFLIGHT_V183_JOB=$job"
          for i in $(seq 1 100); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4200)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_JPEG_LEGACY_PREFLIGHT_V183_VERIFIED' <<< "$output"
              grep -q '"private_snapshot_sha_readback_on_two_ports": true' <<< "$output"
              grep -q '"jpeg_bridge_not_yet_live": true' <<< "$output"
              grep -q '"no_media_or_person_changes": true' <<< "$output"
              grep -q '"retirement_authorized": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Read-only frontend preflight not verified";exit 1
