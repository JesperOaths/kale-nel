name: S9 Step 2 provisional visual appearance review
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/test-step2-appearance-pilot.js'
      - 'ops/c720p/s9-native-security/deploy-step2-appearance-pilot-ui.py'
      - '.github/workflows/c720p-s9-step2-appearance-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/test-step2-appearance-pilot.js'
      - 'ops/c720p/s9-native-security/deploy-step2-appearance-pilot-ui.py'
      - '.github/workflows/c720p-s9-step2-appearance-pilot.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-step2-appearance-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test real UI interaction and no identity assertions
        shell: bash
        run: |
          set -euo pipefail
          node ops/c720p/s9-native-security/test-step2-appearance-pilot.js
          python3 -m py_compile ops/c720p/s9-native-security/deploy-step2-appearance-pilot-ui.py
          python3 ops/c720p/s9-native-security/test-s9-hsv-integration.py
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install PostgreSQL management client
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client >/dev/null; }
      - name: Atomically update only the private Home Assistant appearance UI
        shell: bash
        run: |
          set -euo pipefail
          installer='ops/c720p/s9-native-security/deploy-step2-appearance-pilot-ui.py'
          source='ops/c720p/s9-native-security/security-face-folders-v22.html'
          isha="$(sha256sum "$installer" | cut -d' ' -f1)"
          sha="$(sha256sum "$source" | cut -d' ' -f1)"
          dest="/tmp/s9-step2-appearance-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/$GITHUB_SHA/$installer"
          cmd="curl -fSsL --max-time 40 '$uri' -o '$dest' && printf '%s  %s\n' '$isha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA' --sha256 '$sha'"
          idem="s9-step2-appearance-${GITHUB_SHA:0:22}-$GITHUB_RUN_ATTEMPT"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-step2-appearance','deployment',:'cmd',240,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_STEP2_APPEARANCE_UI_DEPLOY_JOB=$id"
          for n in $(seq 1 100); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 7000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_STEP2_APPEARANCE_PILOT_UI_VERIFIED' <<< "$output" || exit 1
              exit 0
            fi
            sleep 7
          done
          echo "S9 Step2 UI installation not confirmed"
          exit 1
