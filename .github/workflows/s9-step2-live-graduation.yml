name: S9 Step 2 live graduation — signed APK, archive and validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/verify-s9-step2-graduation.py'
      - 'ops/c720p/s9-native-security/test-step2-live-graduation.py'
      - '.github/workflows/s9-step2-live-graduation.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/verify-s9-step2-graduation.py'
      - '.github/workflows/s9-step2-live-graduation.yml'
permissions:
  contents: read
concurrency:
  group: s9-step2-live-graduation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify fail-closed live graduation contract
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-step2-live-graduation.py
          python3 ops/c720p/s9-native-security/test-s9-release-proof.py
          python3 ops/c720p/s9-native-security/test-face-pair-qualification.py
          python3 -m py_compile ops/c720p/s9-native-security/verify-s9-step2-graduation.py
  audit:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run read-only C720P S9 release/archive/human-label check
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          folder='ops/c720p/s9-native-security'
          files='verify-s9-step2-graduation.py report-s9-release-proof.py audit-face-pipeline-v30.py validate-s9-face-identity-pairs.py'
          dest="/tmp/s9-step2-check-${GITHUB_SHA:0:12}"
          # Keep installed local scripts together; each downloaded source is checksum verified.
          command="mkdir -p '$dest'"
          for name in $files; do
            hash="$(sha256sum "$folder/$name" | cut -d' ' -f1)"
            uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$folder/$name"
            command="$command && curl -fSsL --max-time 35 '$uri' -o '$dest/$name' && printf '%s  %s\n' '$hash' '$dest/$name' | sha256sum -c - >/dev/null"
          done
          command="$command && /usr/bin/python3 '$dest/verify-s9-step2-graduation.py'"
          idem="s9-step2-graduation-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$command" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-step2-graduation','diagnostic',:'cmd',185,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "S9_STEP2_GRADUATION_JOB=$job"
          for i in $(seq 1 60); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 9000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q 'S9_STEP2_LIVE_GRADUATION' <<< "$output"
              exit 0
            fi
            sleep 5
          done
          exit 1
