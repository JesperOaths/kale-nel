name: S9 signed migrated action envelope V198 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionTestV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-signed-action-v198.py'
      - '.github/workflows/s9-signed-migrated-action-v198.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionTestV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-signed-action-v198.py'
      - '.github/workflows/s9-signed-migrated-action-v198.yml'
permissions:
  contents: read
jobs:
  exact_hmac_intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact HMAC request intent with no phone/camera listener
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/test-s9-signed-action-v198.py"
          python3 "$d/test-s9-signed-action-v198.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
