name: Full live visual audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/full-live-visual-audit-v792.yml'
      - 'scripts/full-live-visual-audit-v792.mjs'
      - 'scripts/prepare-visual-audit-runtime-v812.mjs'
      - 'scripts/full-live-visual-fixtures-v801.mjs'
      - 'scripts/refine-degraded-visual-report-v807.mjs'
      - 'scripts/refine-expected-visual-aliases-v809.mjs'
      - 'check-live-data-plane.mjs'
      - '*.html'
      - 'familie/**.html'
      - 'gejast-*.js'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: full-live-visual-audit
  cancel-in-progress: true

jobs:
  screenshot-every-page:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEJAST_VISUAL_DB_NAME: postgres
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_SITE_SCOPE: friends
      GEJAST_VISUAL_TIMEOUT_MS: '25000'
      GEJAST_VISUAL_SETTLE_MS: '5000'

    steps:
      - name: Check out exact merged main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prepare deterministic system Chrome screenshot runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing'; exit 1; }
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'GitHub runner system Chrome missing'; exit 1; }
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          GEJAST_SYSTEM_CHROME="$chrome" node scripts/prepare-visual-audit-runtime-v812.mjs
          node --check scripts/full-live-visual-audit-v792.mjs
          node --check scripts/prepare-visual-audit-runtime-v812.mjs
          node --check scripts/full-live-visual-fixtures-v801.mjs
          node --check scripts/refine-degraded-visual-report-v807.mjs
          node --check scripts/refine-expected-visual-aliases-v809.mjs
          node --check check-live-data-plane.mjs
          "$chrome" --version
          if grep -qE 'npx[[:space:]]+playwright[[:space:]]+install|playwright[[:space:]]+install[[:space:]]+--with-deps' .github/workflows/full-live-visual-audit-v792.yml; then
            echo 'Unbounded Playwright browser download reintroduced.'
            exit 1
          fi
          echo 'RESULT=VISUAL_SYSTEM_CHROME_RUNTIME_PASS'

      - name: Probe Supabase auth data plane before fixture provisioning
        id: data_plane
        continue-on-error: true
        env:
          GEJAST_DATA_PLANE_TIMEOUT_MS: '8000'
          GEJAST_DATA_PLANE_ATTEMPTS: '1'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '0'
        run: node check-live-data-plane.mjs

      - name: Provision disposable visual-audit identities through current login contract
        id: provision
        if: steps.data_plane.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-live-visual-fixtures-v801.mjs provision

      - name: Fall back to anonymous perimeter coverage when fixtures are unavailable
        if: steps.data_plane.outcome == 'failure' || steps.provision.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Data-plane preflight or fixture provisioning failed; continuing with fail-closed anonymous visual coverage.'
          suffix="${GITHUB_RUN_ID:-local}${GITHUB_RUN_ATTEMPT:-1}"
          {
            echo "GEJAST_PLAYER1_NAME=${GEJAST_PLAYER1_NAME:-VisualA_${suffix}}"
            echo "GEJAST_PLAYER2_NAME=${GEJAST_PLAYER2_NAME:-VisualB_${suffix}}"
            echo "GEJAST_FAMILY_NAME=${GEJAST_FAMILY_NAME:-VisualFamily_${suffix}}"
            echo 'GEJAST_VISUAL_TIMEOUT_MS=5000'
            echo 'GEJAST_VISUAL_SETTLE_MS=1200'
            echo 'GEJAST_VISUAL_DEGRADED_FIXTURES=1'
          } >> "$GITHUB_ENV"

      - name: Screenshot and inspect every tracked live HTML page
        if: always() && (steps.data_plane.outcome == 'failure' || steps.provision.outcome == 'success' || steps.provision.outcome == 'failure')
        continue-on-error: ${{ steps.provision.outcome == 'success' }}
        run: node scripts/full-live-visual-audit-v792.mjs

      - name: Classify expected degraded login redirects
        if: always() && env.GEJAST_VISUAL_DEGRADED_FIXTURES == '1'
        run: node scripts/refine-degraded-visual-report-v807.mjs

      - name: Refine declared authenticated redirect aliases
        id: alias_refinement
        if: always() && steps.provision.outcome == 'success'
        run: node scripts/refine-expected-visual-aliases-v809.mjs

      - name: Record degraded visual-audit status
        if: always() && (steps.data_plane.outcome == 'failure' || steps.provision.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          cat > visual-audit/DEGRADED_FIXTURE_PROVISIONING.txt <<'EOF'
          DEGRADED_FIXTURE_PROVISIONING
          The read-only Supabase data-plane preflight or disposable authenticated Friends/Family fixture provisioning failed.
          The audit continued with truly anonymous browser contexts: no player session token was seeded. Tracked gated routes therefore exercise the immediate no-session login boundary while admin routes still exercise the Cloudflare perimeter.
          Auth-gated tracked routes that reach /login.html with only redirect-aborted request noise are classified as LOGIN-GATED, not WARN; raw failed-request evidence remains in report.json.
          This artifact is partial evidence only and MUST NOT be treated as authenticated visual certification or zero-residue proof.
          If the preflight failed, no fixture provisioning write was attempted. If fixture provisioning itself failed after a healthy preflight, cleanup was still attempted for any partial run-specific state.
          The workflow remains fail-closed until real fixture provisioning, contextual authenticated captures and cleanup succeed.
          EOF

      - name: Upload visual audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-live-visual-audit-${{ github.run_id }}
          path: visual-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup disposable visual-audit state
        if: always() && (steps.provision.outcome == 'success' || steps.provision.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-live-visual-fixtures-v801.mjs cleanup

      - name: Enforce authenticated visual certification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.data_plane.outcome }}" != 'success' ] || [ "${{ steps.provision.outcome }}" != 'success' ]; then
            echo 'Authenticated visual certification unavailable: data-plane/provisioning did not succeed.'
            exit 1
          fi
          test "${{ steps.alias_refinement.outcome }}" = 'success'
          test -f visual-audit/report.json
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('visual-audit/report.json','utf8'));
          const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
          const broken=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken');
          if(broken.length){ console.error(JSON.stringify(broken.slice(0,10),null,2)); process.exit(1); }
          console.log(`VISUAL_REPORT_PASS records=${rows.length} broken=0`);
          JS
          echo 'RESULT=FULL_LIVE_VISUAL_AUDIT_PASS'
