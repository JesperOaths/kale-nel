name: Full live visual audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/full-live-visual-audit-v792.yml'
      - 'scripts/full-live-visual-audit-v792.mjs'
      - '*.html'
      - 'familie/**.html'
      - 'gejast-*.js'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: full-live-visual-audit
  cancel-in-progress: false

jobs:
  screenshot-every-page:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_SITE_SCOPE: friends
      GEJAST_VISUAL_TIMEOUT_MS: '25000'
      GEJAST_VISUAL_SETTLE_MS: '5000'
    steps:
      - name: Check out exact merged main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install screenshot runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'SUPABASE_DB_URL missing'; exit 1; }
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          node --check scripts/full-live-visual-audit-v792.mjs

      - name: Provision disposable visual-audit identities through current login contract
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="VisualA_${suffix}"
          name2="VisualB_${suffix}"
          family_name="VisualFamily_${suffix}"
          pin1='4826'
          pin2='7314'
          family_pin='2597'
          echo "::add-mask::$pin1"
          echo "::add-mask::$pin2"
          echo "::add-mask::$family_pin"
          echo "GEJAST_PLAYER1_NAME=$name1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_NAME=$name2" >> "$GITHUB_ENV"
          echo "GEJAST_FAMILY_NAME=$family_name" >> "$GITHUB_ENV"

          run_psql_with_pool_retry() {
            local label="$1"
            shift
            local attempt rc output
            for attempt in 1 2 3 4 5 6; do
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                printf '%s' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'ECHECKOUTTIMEOUT|unable to check out connection from the pool'; then
                if [ "$attempt" -lt 6 ]; then
                  echo "$label: Supabase session-pool checkout unavailable (attempt $attempt/6); retrying." >&2
                  sleep $((attempt * 5))
                  continue
                fi
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }

          provision_sql="$RUNNER_TEMP/visual-audit-provision.sql"
          cat > "$provision_sql" <<'SQL'
          begin;
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('visual-a-' || lower(:'name1'), :'name1', true, 'md5:' || md5(:'pin1' || ':' || current_database()), true, true, true, 'friends'),
            ('visual-b-' || lower(:'name2'), :'name2', true, 'md5:' || md5(:'pin2' || ':' || current_database()), true, true, true, 'friends'),
            ('visual-family-' || lower(:'family_name'), :'family_name', true, 'md5:' || md5(:'family_pin' || ':' || current_database()), true, true, true, 'family');

          select public.account_login_v687(:'name1', :'pin1', 'friends', '{"proof":"full-live-visual-audit"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'name2', :'pin2', 'friends', '{"proof":"full-live-visual-audit"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'family_name', :'family_pin', 'family', '{"proof":"full-live-visual-audit"}'::jsonb)->>'session_token';
          commit;
          SQL

          sessions="$(run_psql_with_pool_retry 'Visual-audit provisioning' \
            psql "$SUPABASE_DB_URL" -X -qAt -F'|' -v ON_ERROR_STOP=1 \
            -v name1="$name1" -v name2="$name2" -v family_name="$family_name" \
            -v pin1="$pin1" -v pin2="$pin2" -v family_pin="$family_pin" \
            -f "$provision_sql")"
          IFS='|' read -r token1 token2 family_token <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ ]]
          [[ "$token2" =~ ^[0-9a-f]{48}$ ]]
          [[ "$family_token" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"
          echo "::add-mask::$token2"
          echo "::add-mask::$family_token"
          echo "GEJAST_PLAYER1_TOKEN=$token1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_TOKEN=$token2" >> "$GITHUB_ENV"
          echo "GEJAST_FAMILY_TOKEN=$family_token" >> "$GITHUB_ENV"
          echo 'Current Friends + Family visual-audit sessions provisioned.'

      - name: Screenshot and inspect every tracked live HTML page
        run: node scripts/full-live-visual-audit-v792.mjs

      - name: Upload complete visual audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-live-visual-audit-${{ github.run_id }}
          path: visual-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup disposable visual-audit state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ] || [ -z "${GEJAST_PLAYER2_NAME:-}" ] || [ -z "${GEJAST_FAMILY_NAME:-}" ]; then
            echo 'Fixture names were never fully exported; nothing safe to target for cleanup.'
            exit 0
          fi

          run_psql_with_pool_retry() {
            local label="$1"
            shift
            local attempt rc output
            for attempt in 1 2 3 4 5 6; do
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                printf '%s' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'ECHECKOUTTIMEOUT|unable to check out connection from the pool'; then
                if [ "$attempt" -lt 6 ]; then
                  echo "$label: Supabase session-pool checkout unavailable (attempt $attempt/6); retrying." >&2
                  sleep $((attempt * 5))
                  continue
                fi
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }

          cleanup_sql="$RUNNER_TEMP/visual-audit-cleanup.sql"
          cat > "$cleanup_sql" <<'SQL'
          begin;
          delete from public.paardenrace_match_history h
          using public.paardenrace_rooms r
          where h.room_id = r.id
            and (r.host_name in (:'name1', :'name2')
              or r.host_player_id in (select id from public.players where display_name in (:'name1', :'name2'))
              or r.created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2')));

          delete from public.klaverjas_online_games
          where created_by_player_name in (:'name1', :'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));
          delete from public.pikken_games
          where created_by_player_name in (:'name1', :'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));
          delete from public.paardenrace_rooms
          where host_name in (:'name1', :'name2')
             or host_player_id in (select id from public.players where display_name in (:'name1', :'name2'))
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));

          delete from public.gejast_active_player_metadata_v679
          where lower(coalesce(player_name,'')) in (lower(:'name1'), lower(:'name2'), lower(:'family_name'));
          delete from public.gejast_player_sessions_v746
          where player_id in (select id from public.players where display_name in (:'name1', :'name2', :'family_name'));
          delete from public.players
          where display_name in (:'name1', :'name2', :'family_name') and is_dummy=true and hidden_from_public=true;
          commit;

          select (select count(*) from public.players where display_name in (:'name1',:'name2',:'family_name')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'name1',:'name2',:'family_name')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'name1'),lower(:'name2'),lower(:'family_name'))),
                 (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.paardenrace_rooms where host_name in (:'name1',:'name2'));
          SQL

          residue="$(run_psql_with_pool_retry 'Visual-audit cleanup' \
            psql "$SUPABASE_DB_URL" -X -qAt -F'|' -v ON_ERROR_STOP=1 \
            -v name1="$GEJAST_PLAYER1_NAME" -v name2="$GEJAST_PLAYER2_NAME" -v family_name="$GEJAST_FAMILY_NAME" \
            -f "$cleanup_sql")"
          test "$residue" = '0|0|0|0|0|0'
          echo 'Visual-audit cleanup PASS with zero residue.'
