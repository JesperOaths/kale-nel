# clean execution trigger after branch workflow registration
name: v811 analytics RPC builder

on:
  pull_request:
    branches: [main]
    types: [opened]
  push:
    branches: [agent/v811-analytics-rpc-contract]
    paths: ['.github/workflows/v811-analytics-rpc-builder.yml']

permissions:
  contents: write

concurrency:
  group: v811-analytics-rpc-builder
  cancel-in-progress: false

env:
  BASE_SHA: fba531c35d076d1e0a3065683eed8908c38627b6
  TARGET_BRANCH: agent/v811-analytics-rpc-contract

jobs:
  build:
    if: github.head_ref == 'agent/v811-analytics-rpc-contract' || github.ref == 'refs/heads/agent/v811-analytics-rpc-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v811-analytics-rpc-contract
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build exact v811 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^\.github/workflows/v811-analytics-rpc-builder\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected branch drift:'; echo "$unexpected"; exit 1; }
          printf 'v811\n' > VERSION
          python3 <<'PY'
          from pathlib import Path
          import json

          p=Path('site-analytics.js')
          s=p.read_text()
          old="""  function sendEvent(payload){
    const endpoint = `${SUPABASE_URL}/rest/v1/rpc/track_site_event`;
    const body = JSON.stringify(payload);
    let sameOrigin = false;
"""
          new="""  function sendEvent(payload){
    const endpoint = `${SUPABASE_URL}/rest/v1/rpc/track_site_event`;
    const normalizedPayload = Object.assign({}, payload || {});
    if (Object.prototype.hasOwnProperty.call(normalizedPayload, 'site_scope')) {
      normalizedPayload.extra = Object.assign({}, normalizedPayload.extra || {}, { site_scope: normalizedPayload.site_scope });
      delete normalizedPayload.site_scope;
    }
    const body = JSON.stringify(normalizedPayload);
    let sameOrigin = false;
"""
          if old not in s: raise SystemExit('site-analytics sendEvent patch target missing')
          p.write_text(s.replace(old,new,1))

          Path('check-v811-analytics-rpc-contract.mjs').write_text("""#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst version=fs.readFileSync('VERSION','utf8').trim();\nassert(Number(version.replace(/^v/i,''))>=811,'v811+ required');\nconst src=fs.readFileSync('site-analytics.js','utf8');\nassert(src.includes(\"Object.prototype.hasOwnProperty.call(normalizedPayload, 'site_scope')\"),'analytics sendEvent must normalize site_scope');\nassert(src.includes(\"normalizedPayload.extra = Object.assign({}, normalizedPayload.extra || {}, { site_scope: normalizedPayload.site_scope })\"),'site_scope must be preserved inside analytics extra metadata');\nassert(src.includes('delete normalizedPayload.site_scope'),'unsupported top-level site_scope RPC argument must be removed');\nassert(src.includes('const body = JSON.stringify(normalizedPayload);'),'analytics RPC body must serialize normalized payload');\nassert(!src.includes('const body = JSON.stringify(payload);'),'raw payload serialization must not bypass normalization');\nconsole.log('PASS v811 analytics RPC contract');\n""")

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); script=data['scripts']['verify:static']
          anchor='node check-v810-player-runtime-overload-disambiguation.mjs'; addition='node check-v811-analytics-rpc-contract.mjs'
          if addition not in script:
              if anchor not in script: raise SystemExit('v810 verify anchor missing')
              script=script.replace(anchor,anchor+' && '+addition)
          data['scripts']['verify:static']=script
          pkg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          cpath=Path('beta-live-write-checklist.json'); c=json.loads(cpath.read_text()); c['site_version']='v811'; cpath.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          gpath=Path('gameplay-acceptance.json'); g=json.loads(gpath.read_text()); g['site_version']='v811'; g['last_updated']='2026-08-18'; gpath.write_text(json.dumps(g,indent=2,ensure_ascii=False)+'\n')

          cert={
            'schema_version':1,'current_version':'v811','status':'REVALIDATION_REQUIRED',
            'previous_certified_version':'v808','previous_certified_product_sha':'7f6f7bc110807e85f52ff4d54927620dbbc9ffeb','previous_certified_release_branch':'release/v808-certified-20260818',
            'superseded_uncertified_version':'v810','superseded_uncertified_product_sha':'fba531c35d076d1e0a3065683eed8908c38627b6',
            'reason':'v811 aligns site analytics with the deployed 21-argument track_site_event contract by moving site_scope into extra metadata instead of sending it as an unsupported top-level PostgREST parameter. v810 runtime proof 32136704477 confirmed the player runtime overload is fixed and exposed this exact PGRST202 mismatch.',
            'remaining_release_blockers':['Fresh exact-current v811 live health must pass.','Authenticated browser proof must show track_site_event no longer fails with PGRST202 and must preserve the v809/v810 RPC repairs.','Fresh full visual/runtime evidence and independent zero-residue cleanup are required before PASS.'],
            'required_next':['Merge only after canonical verification and after the currently running exact-v810 automatic visual audit has cleaned its fixtures.','Run exact-current v811 health plus authenticated RPC diagnostics.','Run full authenticated visual audit and independently confirm zero controlled residue before certification.']
          }
          Path('release-certification.json').write_text(json.dumps(cert,indent=2,ensure_ascii=False)+'\n')

          rpath=Path('beta-readiness.json'); r=json.loads(rpath.read_text()); r['site_version']='release candidate v811 / live v810 / certified rollback v808'; r['last_updated']='2026-08-18'
          ident=r.setdefault('deployment_identity',{}); ident['status']='ready_to_test'; ident['live_version']='v810'; ident['release_candidate_version']='v811'; ident['frontend_release_merge']='fba531c35d076d1e0a3065683eed8908c38627b6'; ident['repository_head_at_audit']='fba531c35d076d1e0a3065683eed8908c38627b6'; ident['note']='v811 is a one-owner frontend follow-up over live v810. Exact-current v810 run 32136704477 passed health and authenticated runtime contracts, proving the player bundle overload fix; its response-body diagnostics showed track_site_event PGRST202 because site_scope was sent as an unsupported top-level RPC parameter. v811 preserves site_scope in extra metadata and removes it from the RPC signature. Certified rollback remains v808.'
          ev='2026-08-18 exact-current v810 runtime proof 32136704477 PASS: get_player_runtime_bundle_v687 returned HTTP 200; retired pending/vote/get_public_state calls remained zero; account/drinks/announcements succeeded; track_site_event returned PGRST202 specifically because the browser payload included unsupported site_scope; cleanup PASS_ZERO; artifact 9324297597 sha256 62a80b4ec09e2b8526c6bc0a4fbfbc190801c1454cba713eb5bfdac4a1c5a595.'
          evidence=ident.setdefault('evidence',[])
          if ev not in evidence: evidence.insert(0,ev)
          rpath.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          node fix-version-drift.mjs
          node check-v811-analytics-rpc-contract.mjs
          rm -f .github/workflows/v811-analytics-rpc-builder.yml
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align analytics RPC contract v811'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'RESULT=V811_ANALYTICS_RPC_BUILDER_PASS'
