name: S9 strictly parsed signed metadata JSON V223 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedStrictJsonIntentV223.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedStrictJsonIntentTestV223.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-strict-signed-json-v223.py'
      - '.github/workflows/s9-strict-signed-json-v223.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedStrictJsonIntentV223.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedStrictJsonIntentTestV223.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-strict-signed-json-v223.py'
      - '.github/workflows/s9-strict-signed-json-v223.yml'
permissions:
  contents: read
jobs:
  host_synthetic_and_android_dex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test exact typed flat JSON before HMAC verification
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-strict-signed-json-v223.py"
          python3 "$d/test-s9-signed-action-v198.py"
      - name: Verify future Android API28 compatibility without installing phone APK
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$work/classes" \
            "$root/S9MigratedSignedActionV198.java" \
            "$root/S9MigratedStrictJsonIntentV223.java"
          "$d8" --min-api 28 --output "$work/dex" $(find "$work/classes" -name '*.class' -print)
          python3 - "$work/dex/classes.dex" <<'PY'
          from pathlib import Path
          import sys
          content=Path(sys.argv[1]).read_bytes()
          assert content.startswith(b'dex\n') and 1000<len(content)<500000
          print("S9_STRICT_SIGNED_INTENT_V223_API28_OK")
          PY
