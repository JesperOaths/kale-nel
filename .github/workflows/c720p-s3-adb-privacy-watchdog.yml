name: Install local S3 Wi-Fi privacy watchdog
on:
  pull_request:
    paths:
      - 'ops/c720p/s3-wifi-adb-privacy-watchdog-20261016.py'
      - '.github/workflows/c720p-s3-adb-privacy-watchdog.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s3-wifi-adb-privacy-watchdog-20261016.py'
      - '.github/workflows/c720p-s3-adb-privacy-watchdog.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/s3-wifi-adb-privacy-watchdog-20261016.py
          python3 - <<'PY'
          import importlib.util
          f='ops/c720p/s3-wifi-adb-privacy-watchdog-20261016.py'
          spec=importlib.util.spec_from_file_location('watch',f)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert 'OnUnitInactiveSec=30min' in m.TIMER_TEXT
          assert 'camera' not in m.SERVICE_TEXT.lower()
          assert m.SERIAL.endswith(':5555')
          src=open(f).read()
          assert 'if not exposed():' in src
          assert 'command(["adb","-s",SERIAL,"usb"]' in src
          assert 'raise RuntimeError("S3_WI_FI_ADB_EXPOSURE_PERSISTS")' in src
          print('PRIVACY_WATCHDOG_TESTS_PASS')
          PY
  install:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src='ops/c720p/s3-wifi-adb-privacy-watchdog-20261016.py'
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          file="/tmp/s3-privacy-watchdog-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${file}' && printf '%s  %s\\n' '${sha}' '${file}' | sha256sum -c - >/dev/null && python3 '${file}' --install"
          idem="s3-adb-watchdog-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v command="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s3-privacy-monitor','maintenance',:'command',320,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S3_PRIVACY_WATCHDOG_JOB=$id"
          for i in $(seq 1 46); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q '"result": "installed"' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
