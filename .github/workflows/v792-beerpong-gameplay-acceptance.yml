name: v792 Beerpong gameplay acceptance

on:
  pull_request:
    paths:
      - 'beerpong.html'
      - 'check-beerpong-gameplay-v792.mjs'
      - '.github/workflows/v792-beerpong-gameplay-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beerpong-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run deterministic gameplay matrix
        run: node check-beerpong-gameplay-v792.mjs
