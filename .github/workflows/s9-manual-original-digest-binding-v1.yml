name: Task 21 forward-safe manual original digest binding
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_manual_media_digest_binding_v1.py'
      - 'ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py'
      - 'ops/c720p/s9-person-ml-v1/test-s9-manual-media-digest-binding-v1.py'
      - '.github/workflows/s9-manual-original-digest-binding-v1.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_manual_media_digest_binding_v1.py'
      - 'ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py'
      - 'ops/c720p/s9-person-ml-v1/test-s9-manual-media-digest-binding-v1.py'
      - '.github/workflows/s9-manual-original-digest-binding-v1.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify revision and original-byte-bound historical review safety
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/c720p/s9-person-ml-v1/s9_manual_media_digest_binding_v1.py \
            ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py \
            ops/c720p/s9-person-ml-v1/test-s9-manual-media-digest-binding-v1.py
          python3 ops/c720p/s9-person-ml-v1/test-s9-manual-media-digest-binding-v1.py
          python3 ops/c720p/s9-native-security/test-manual-recording-links-v1.py
          python3 ops/c720p/s9-native-security/test-security-group-v68.py
          python3 ops/c720p/s9-native-security/test-security-group-relay-v71.py
          echo TASK21_FUTURE_BINDINGS_SOURCE_ONLY_NO_HISTORICAL_REWRITES
