name: v815 align active version references

on:
  push:
    branches:
      - agent/v815-printify-live-catalog

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v815 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/v815-printify-live-catalog
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Apply canonical version drift fixer
        run: |
          node fix-version-drift.mjs
          git diff --check
          node check-version-drift.mjs

      - name: Commit mechanical alignment
        run: |
          if git diff --quiet; then
            echo "No version alignment changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v815: align active site version references"
          git push origin HEAD:agent/v815-printify-live-catalog
