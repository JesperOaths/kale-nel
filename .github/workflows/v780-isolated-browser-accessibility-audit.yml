name: v780 isolated browser accessibility audit

on:
  pull_request:
    paths:
      - 'scripts/audit-isolated-browser-accessibility-v780.mjs'
      - '.github/workflows/v780-isolated-browser-accessibility-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Chromium/axe tooling
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Run isolated no-write browser accessibility audit
        run: node scripts/audit-isolated-browser-accessibility-v780.mjs
