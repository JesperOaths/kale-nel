name: S9 disposable SD cross-app access probe V204 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204/**'
      - 'ops/c720p/s9-native-security/offline-worker/probe-s9-disposable-storage-access-v204.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-disposable-storage-access-v204.py'
      - '.github/workflows/s9-disposable-storage-probe-v204.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204/**'
      - 'ops/c720p/s9-native-security/offline-worker/probe-s9-disposable-storage-access-v204.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-disposable-storage-access-v204.py'
      - '.github/workflows/s9-disposable-storage-probe-v204.yml'
permissions:
  contents: read
jobs:
  host_only_safe_probe_compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify no media reads/writes and protected package cleanup
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/probe-s9-disposable-storage-access-v204.py"
          python3 "$d/test-s9-disposable-storage-access-v204.py"
      - name: Compile broadcast-only temporary app as Android API 28 DEX
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8" && test -x "$aapt"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/classes" "$stage/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$stage/classes" "$root/StorageProbe.java"
          "$d8" --min-api 28 --output "$stage/dex" $(find "$stage/classes" -name '*.class' -print)
          "$aapt" package -f -M "$root/AndroidManifest.xml" -I "$jar" -F "$stage/disposable-unsigned.apk"
          (cd "$stage/dex" && "$aapt" add "$stage/disposable-unsigned.apk" classes.dex)
          python3 - "$stage/dex/classes.dex" "$stage/disposable-unsigned.apk" <<'PY'
          from pathlib import Path
          import sys,zipfile
          dex=Path(sys.argv[1]).read_bytes()
          assert dex.startswith(b'dex\n') and 300<len(dex)<120000
          with zipfile.ZipFile(sys.argv[2]) as z:
              assert 'classes.dex' in z.namelist()
          print('S9_DISPOSABLE_STORAGE_V204_HOST_COMPILE_OK')
          PY
