name: Diagnose Cloudflare v763 edge routing

on:
  push:
    branches:
      - ops/finalize-cloudflare-v763-20260816

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Query Cloudflare, public DNS, and live edge responses
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=kalenel.nl&account.id=${CLOUDFLARE_ACCOUNT_ID}" > /tmp/zone.json

          python3 - <<'PY'
          import json,sys
          z=json.load(open('/tmp/zone.json'))
          if not z.get('success'):
              print('Cloudflare zone API failed:', z.get('errors'), file=sys.stderr); sys.exit(1)
          results=z.get('result') or []
          if len(results)!=1:
              print(f'Expected exactly one kalenel.nl zone, got {len(results)}', file=sys.stderr); sys.exit(1)
          zone=results[0]
          open('/tmp/zone_id','w').write(zone['id'])
          safe={k:zone.get(k) for k in ('name','status','paused','type','name_servers','original_name_servers')}
          json.dump(safe,open('/tmp/zone_safe.json','w'),indent=2)
          PY

          ZONE_ID="$(cat /tmp/zone_id)"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" > /tmp/routes.json
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=kalenel.nl" > /tmp/dns_apex.json
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=admin.kalenel.nl" > /tmp/dns_admin.json

          python3 - <<'PY'
          import json,sys
          for src,dst,kind in [('/tmp/routes.json','/tmp/routes_safe.json','routes'),('/tmp/dns_apex.json','/tmp/dns_apex_safe.json','dns'),('/tmp/dns_admin.json','/tmp/dns_admin_safe.json','dns')]:
              data=json.load(open(src))
              if not data.get('success'):
                  print(f'Cloudflare {kind} API failed: {data.get("errors")}', file=sys.stderr); sys.exit(1)
              if kind=='routes':
                  safe=[{'pattern':r.get('pattern'),'script':r.get('script')} for r in data.get('result',[])]
              else:
                  safe=[{'type':r.get('type'),'name':r.get('name'),'content':r.get('content'),'proxied':r.get('proxied'),'ttl':r.get('ttl')} for r in data.get('result',[])]
              json.dump(safe,open(dst,'w'),indent=2)
          PY

          dig +short NS kalenel.nl > /tmp/public_ns.txt || true
          dig +short A kalenel.nl > /tmp/public_apex_a.txt || true
          dig +short A admin.kalenel.nl > /tmp/public_admin_a.txt || true

          probe() {
            local method="$1" url="$2" name="$3"
            curl --silent --show-error --request "$method" --max-time 30 --connect-timeout 10 \
              --output "/tmp/${name}.body" --dump-header "/tmp/${name}.headers" \
              --write-out '%{http_code}' "$url" > "/tmp/${name}.status" || echo 'curl_error' > "/tmp/${name}.status"
          }
          probe GET 'http://kalenel.nl/' http_apex
          probe GET 'http://kalenel.nl/index.html?probe=cf-diagnostic&keep=1' http_path
          probe GET 'http://admin.kalenel.nl/admin.html?probe=cf-diagnostic' http_admin
          probe GET 'https://kalenel.nl/' https_apex
          probe GET 'https://admin.kalenel.nl/admin.html?probe=cf-diagnostic' https_admin

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          def hdr(name,key):
              p=Path(f'/tmp/{name}.headers')
              if not p.exists(): return ''
              val=''
              for line in p.read_text(errors='replace').splitlines():
                  if line.lower().startswith(key.lower()+':'):
                      val=line.split(':',1)[1].strip()
              return val
          def status(name):
              p=Path(f'/tmp/{name}.status')
              return p.read_text().strip() if p.exists() else 'missing'
          probes=[]
          for name,url in [
              ('http_apex','http://kalenel.nl/'),
              ('http_path','http://kalenel.nl/index.html?probe=cf-diagnostic&keep=1'),
              ('http_admin','http://admin.kalenel.nl/admin.html?probe=cf-diagnostic'),
              ('https_apex','https://kalenel.nl/'),
              ('https_admin','https://admin.kalenel.nl/admin.html?probe=cf-diagnostic')]:
              probes.append({'url':url,'status':status(name),'location':hdr(name,'Location'),'server':hdr(name,'Server'),'build':hdr(name,'X-Kalenel-Admin-Build')})
          json.dump(probes,open('/tmp/probes_safe.json','w'),indent=2)
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          zone=json.load(open('/tmp/zone_safe.json'))
          routes=json.load(open('/tmp/routes_safe.json'))
          apex=json.load(open('/tmp/dns_apex_safe.json'))
          admin=json.load(open('/tmp/dns_admin_safe.json'))
          probes=json.load(open('/tmp/probes_safe.json'))
          public_ns=[x.strip() for x in Path('/tmp/public_ns.txt').read_text().splitlines() if x.strip()]
          public_apex=[x.strip() for x in Path('/tmp/public_apex_a.txt').read_text().splitlines() if x.strip()]
          public_admin=[x.strip() for x in Path('/tmp/public_admin_a.txt').read_text().splitlines() if x.strip()]
          assigned=[str(x).rstrip('.') for x in (zone.get('name_servers') or [])]
          observed=[str(x).rstrip('.') for x in public_ns]
          ns_match=set(assigned)==set(observed) and bool(assigned)
          lines=[]
          lines.append('## Cloudflare v763 edge diagnostic')
          lines.append('')
          lines.append('The v763 Wrangler deployment command completed successfully, but the first live 308 acceptance check did not. This report records the post-deploy routing state without exposing credentials.')
          lines.append('')
          lines.append(f"- Zone status: `{zone.get('status')}`")
          lines.append(f"- Zone paused: `{zone.get('paused')}`")
          lines.append(f"- Zone type: `{zone.get('type')}`")
          lines.append(f"- Cloudflare-assigned nameservers: `{', '.join(assigned) or '<none>'}`")
          lines.append(f"- Publicly delegated nameservers: `{', '.join(observed) or '<none>'}`")
          lines.append(f"- Public NS matches Cloudflare assignment: `{ns_match}`")
          lines.append(f"- Public apex A: `{', '.join(public_apex) or '<none>'}`")
          lines.append(f"- Public admin A: `{', '.join(public_admin) or '<none>'}`")
          lines.append('')
          lines.append('### Worker routes')
          for r in routes:
              lines.append(f"- `{r.get('pattern')}` -> `{r.get('script')}`")
          if not routes: lines.append('- `<none>`')
          lines.append('')
          lines.append('### Cloudflare DNS records')
          for label,records in [('apex',apex),('admin',admin)]:
              for r in records:
                  lines.append(f"- {label}: `{r.get('type')} {r.get('name')} -> {r.get('content')}` proxied=`{r.get('proxied')}` ttl=`{r.get('ttl')}`")
              if not records: lines.append(f'- {label}: `<none>`')
          lines.append('')
          lines.append('### Live probes')
          for p in probes:
              lines.append(f"- `{p['url']}` -> status=`{p['status']}` location=`{p['location'] or '<none>'}` server=`{p['server'] or '<none>'}` build=`{p['build'] or '<none>'}`")
          lines.append('')
          if zone.get('status')!='active':
              lines.append('**Diagnosis:** Cloudflare reports the zone is not active. Worker deployment can succeed in the account while public traffic still bypasses the Worker until zone activation/delegation is complete.')
          elif not ns_match:
              lines.append('**Diagnosis:** The zone is marked active but public nameserver delegation does not match the Cloudflare assignment. Public traffic may not be reaching this Cloudflare zone.')
          elif not any(r.get('pattern')=='kalenel.nl/*' and r.get('script')=='kalenel-admin-gate' for r in routes):
              lines.append('**Diagnosis:** The apex Worker route is missing or bound to another script.')
          elif not any(r.get('proxied') is True for r in apex):
              lines.append('**Diagnosis:** The apex DNS record is not proxied, so the Worker route cannot intercept the request.')
          else:
              lines.append('**Diagnosis:** Zone authority, proxying, and the apex Worker route appear present; the live response mismatch needs a deeper Cloudflare edge/configuration check.')
          Path('/tmp/report.md').write_text('\n'.join(lines)+'\n')
          print(Path('/tmp/report.md').read_text())
          PY

          python3 - <<'PY'
          import json
          body=open('/tmp/report.md').read()
          json.dump({'body':body},open('/tmp/comment.json','w'))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/comment.json \
            'https://api.github.com/repos/JesperOaths/kale-nel/issues/122/comments' >/dev/null

          echo 'RESULT=CLOUDFLARE_V763_EDGE_DIAGNOSTIC_RECORDED'
