name: Discover live Cloudflare zone

on:
  push:
    branches:
      - ops/finalize-cloudflare-v763-20260816

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover accessible kalenel.nl zones and match public delegation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }

          curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --output /tmp/zones.json --write-out '%{http_code}' \
            'https://api.cloudflare.com/client/v4/zones?name=kalenel.nl&per_page=50' > /tmp/zones.status

          dig +short NS kalenel.nl > /tmp/public_ns.txt 2>/dev/null || true

          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=json.load(open('/tmp/zones.json'))
          public={x.strip().rstrip('.') for x in Path('/tmp/public_ns.txt').read_text().splitlines() if x.strip()}
          zones=[]
          for z in raw.get('result') or []:
            assigned={str(x).rstrip('.') for x in (z.get('name_servers') or [])}
            zones.append({
              'id':z.get('id'),
              'account_id':(z.get('account') or {}).get('id'),
              'account_name':(z.get('account') or {}).get('name'),
              'status':z.get('status'),
              'paused':z.get('paused'),
              'name_servers':sorted(assigned),
              'matches_public_ns':bool(assigned) and assigned==public
            })
          safe={'api_http':Path('/tmp/zones.status').read_text().strip(),'api_success':raw.get('success'),'api_errors':raw.get('errors') or [],'public_ns':sorted(public),'zones':zones}
          json.dump(safe,open('/tmp/discovery.json','w'),indent=2)
          matches=[z for z in zones if z['matches_public_ns']]
          if len(matches)==1:
            Path('/tmp/live_zone_id').write_text(matches[0]['id'] or '')
            Path('/tmp/live_account_id').write_text(matches[0]['account_id'] or '')
          print(json.dumps(safe,indent=2))
          PY

          LIVE_ZONE_ID="$(cat /tmp/live_zone_id 2>/dev/null || true)"
          if [[ -n "$LIVE_ZONE_ID" ]]; then
            curl --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --output /tmp/live_routes.json --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/zones/${LIVE_ZONE_ID}/workers/routes" > /tmp/live_routes.status || true
          else
            echo '{}' > /tmp/live_routes.json
            echo 'not_attempted' > /tmp/live_routes.status
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/discovery.json'))
          try: rr=json.load(open('/tmp/live_routes.json'))
          except Exception: rr={}
          routes=[{'pattern':r.get('pattern'),'script':r.get('script')} for r in (rr.get('result') or [])]
          lines=['## Live Cloudflare zone discovery','',f"- Zone-list API HTTP: `{d['api_http']}`",f"- API success: `{d['api_success']}`",f"- Public nameservers: `{', '.join(d['public_ns']) or '<none>'}`",f"- Accessible `kalenel.nl` zones with this token: `{len(d['zones'])}`",'']
          for i,z in enumerate(d['zones'],1):
            lines += [f"### Accessible zone {i}",f"- Account: `{z['account_name'] or '<unnamed>'}`",f"- Status: `{z['status']}`",f"- Nameservers: `{', '.join(z['name_servers']) or '<none>'}`",f"- Matches current public delegation: `{z['matches_public_ns']}`",'']
          matches=[z for z in d['zones'] if z['matches_public_ns']]
          lines.append('### Live-zone route visibility')
          lines.append(f"- Route API HTTP: `{Path('/tmp/live_routes.status').read_text().strip()}`")
          lines += [f"- `{r['pattern']}` -> `{r['script']}`" for r in routes] or ['- `<unavailable or no matching live zone accessible>`']
          lines.append('')
          if len(matches)==1:
            lines.append('**Result:** The current token can see the Cloudflare zone that actually owns the public nameserver delegation. Its account can be used for the corrected v763 deployment.')
          elif len(matches)==0:
            lines.append('**Result:** The current token cannot see the Cloudflare zone that owns the public `vida`/`anton` delegation. It only has access to another/pending zone, so deploying with this token cannot update the live Worker.')
          else:
            lines.append('**Result:** Multiple accessible zones unexpectedly match the public delegation; refusing to select one automatically.')
          report='\n'.join(lines)+'\n'
          Path('/tmp/report.md').write_text(report); print(report)
          json.dump({'body':report},open('/tmp/comment.json','w'))
          PY

          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary @/tmp/comment.json 'https://api.github.com/repos/JesperOaths/kale-nel/issues/122/comments' >/dev/null
          echo 'RESULT=LIVE_CLOUDFLARE_ZONE_DISCOVERY_RECORDED'
