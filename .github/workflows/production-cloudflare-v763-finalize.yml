name: Diagnose Cloudflare v763 edge routing

on:
  push:
    branches:
      - ops/finalize-cloudflare-v763-20260816

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record Cloudflare and public edge diagnostic
        shell: bash
        run: |
          set -u
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }

          cfget() {
            local url="$1" out="$2"
            curl --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --output "$out" --write-out '%{http_code}' "$url" > "${out}.status" || echo 'curl_error' > "${out}.status"
          }

          cfget "https://api.cloudflare.com/client/v4/zones?name=kalenel.nl&account.id=${CLOUDFLARE_ACCOUNT_ID}" /tmp/zone.json

          ZONE_ID="$(python3 - <<'PY'
          import json
          try:
            d=json.load(open('/tmp/zone.json'))
            r=d.get('result') or []
            print(r[0].get('id','') if len(r)==1 else '')
          except Exception:
            print('')
          PY
          )"

          if [[ -n "$ZONE_ID" ]]; then
            cfget "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" /tmp/routes.json
            cfget "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=kalenel.nl" /tmp/dns_apex.json
            cfget "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=admin.kalenel.nl" /tmp/dns_admin.json
          else
            echo 'not_attempted' > /tmp/routes.json.status; echo '{}' > /tmp/routes.json
            echo 'not_attempted' > /tmp/dns_apex.json.status; echo '{}' > /tmp/dns_apex.json
            echo 'not_attempted' > /tmp/dns_admin.json.status; echo '{}' > /tmp/dns_admin.json
          fi

          dig +short NS kalenel.nl > /tmp/public_ns.txt 2>/dev/null || true
          dig +short A kalenel.nl > /tmp/public_apex_a.txt 2>/dev/null || true
          dig +short A admin.kalenel.nl > /tmp/public_admin_a.txt 2>/dev/null || true

          probe() {
            local method="$1" url="$2" name="$3"
            curl --silent --show-error --request "$method" --max-time 30 --connect-timeout 10 \
              --output "/tmp/${name}.body" --dump-header "/tmp/${name}.headers" \
              --write-out '%{http_code}' "$url" > "/tmp/${name}.status" 2>/dev/null || echo 'curl_error' > "/tmp/${name}.status"
          }
          probe GET 'http://kalenel.nl/' http_apex
          probe GET 'http://kalenel.nl/index.html?probe=cf-diagnostic&keep=1' http_path
          probe GET 'http://admin.kalenel.nl/admin.html?probe=cf-diagnostic' http_admin
          probe GET 'https://kalenel.nl/' https_apex
          probe GET 'https://admin.kalenel.nl/admin.html?probe=cf-diagnostic' https_admin

          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(path):
            try: return json.load(open(path))
            except Exception: return {}
          def text(path):
            try: return Path(path).read_text(errors='replace').strip()
            except Exception: return ''
          def errors(d):
            return [{'code':e.get('code'),'message':e.get('message')} for e in (d.get('errors') or [])]
          zone_raw=load('/tmp/zone.json'); zone_results=zone_raw.get('result') or []
          zone=zone_results[0] if len(zone_results)==1 else {}
          routes_raw=load('/tmp/routes.json'); apex_raw=load('/tmp/dns_apex.json'); admin_raw=load('/tmp/dns_admin.json')
          routes=[{'pattern':r.get('pattern'),'script':r.get('script')} for r in (routes_raw.get('result') or [])]
          apex=[{'type':r.get('type'),'name':r.get('name'),'content':r.get('content'),'proxied':r.get('proxied'),'ttl':r.get('ttl')} for r in (apex_raw.get('result') or [])]
          admin=[{'type':r.get('type'),'name':r.get('name'),'content':r.get('content'),'proxied':r.get('proxied'),'ttl':r.get('ttl')} for r in (admin_raw.get('result') or [])]
          def hdr(name,key):
            p=Path(f'/tmp/{name}.headers')
            if not p.exists(): return ''
            v=''
            for line in p.read_text(errors='replace').splitlines():
              if line.lower().startswith(key.lower()+':'): v=line.split(':',1)[1].strip()
            return v
          probes=[]
          for name,url in [('http_apex','http://kalenel.nl/'),('http_path','http://kalenel.nl/index.html?probe=cf-diagnostic&keep=1'),('http_admin','http://admin.kalenel.nl/admin.html?probe=cf-diagnostic'),('https_apex','https://kalenel.nl/'),('https_admin','https://admin.kalenel.nl/admin.html?probe=cf-diagnostic')]:
            probes.append({'url':url,'status':text(f'/tmp/{name}.status'),'location':hdr(name,'Location'),'server':hdr(name,'Server'),'build':hdr(name,'X-Kalenel-Admin-Build')})
          public_ns=[x.strip().rstrip('.') for x in text('/tmp/public_ns.txt').splitlines() if x.strip()]
          assigned=[str(x).rstrip('.') for x in (zone.get('name_servers') or [])]
          ns_match=bool(assigned) and set(assigned)==set(public_ns)
          lines=['## Cloudflare v763 edge diagnostic','', 'Worker v763 deployment itself completed successfully. The initial production 308 acceptance failed, so this records the routing state without exposing credentials.','']
          lines += [f"- Zone API HTTP: `{text('/tmp/zone.json.status')}`", f"- Zone API errors: `{errors(zone_raw) or '<none>'}`", f"- Zone status: `{zone.get('status','<unavailable>')}`", f"- Zone paused: `{zone.get('paused','<unavailable>')}`", f"- Zone type: `{zone.get('type','<unavailable>')}`", f"- Cloudflare-assigned nameservers: `{', '.join(assigned) or '<unavailable>'}`", f"- Publicly delegated nameservers: `{', '.join(public_ns) or '<none>'}`", f"- Public NS matches Cloudflare assignment: `{ns_match if assigned else '<unknown>'}`", f"- Public apex A: `{text('/tmp/public_apex_a.txt').replace(chr(10), ', ') or '<none>'}`", f"- Public admin A: `{text('/tmp/public_admin_a.txt').replace(chr(10), ', ') or '<none>'}`", '']
          lines += ['### Cloudflare route/DNS API access', f"- Worker routes API HTTP: `{text('/tmp/routes.json.status')}` errors=`{errors(routes_raw) or '<none>'}`", f"- Apex DNS API HTTP: `{text('/tmp/dns_apex.json.status')}` errors=`{errors(apex_raw) or '<none>'}`", f"- Admin DNS API HTTP: `{text('/tmp/dns_admin.json.status')}` errors=`{errors(admin_raw) or '<none>'}`", '']
          lines.append('### Worker routes')
          lines += [f"- `{r.get('pattern')}` -> `{r.get('script')}`" for r in routes] or ['- `<unavailable or none>`']
          lines += ['', '### Cloudflare DNS records']
          for label,recs in [('apex',apex),('admin',admin)]:
            lines += [f"- {label}: `{r.get('type')} {r.get('name')} -> {r.get('content')}` proxied=`{r.get('proxied')}` ttl=`{r.get('ttl')}`" for r in recs] or [f'- {label}: `<unavailable or none>`']
          lines += ['', '### Live probes']
          lines += [f"- `{p['url']}` -> status=`{p['status']}` location=`{p['location'] or '<none>'}` server=`{p['server'] or '<none>'}` build=`{p['build'] or '<none>'}`" for p in probes]
          lines.append('')
          if zone and zone.get('status')!='active': diagnosis='Cloudflare reports the zone is not active; public traffic can bypass the deployed Worker until zone activation/delegation is complete.'
          elif assigned and not ns_match: diagnosis='Public nameserver delegation does not match the nameservers assigned to this Cloudflare zone.'
          elif routes and not any(r.get('pattern')=='kalenel.nl/*' and r.get('script')=='kalenel-admin-gate' for r in routes): diagnosis='The apex Worker route is missing or bound to another script.'
          elif apex and not any(r.get('proxied') is True for r in apex): diagnosis='The apex DNS record is not proxied, so the Worker route cannot intercept it.'
          elif not zone: diagnosis='The deployment token cannot read zone metadata; public DNS/live probes above are still authoritative for diagnosing whether traffic reaches Cloudflare.'
          else: diagnosis='Zone authority/proxy/route metadata appears compatible; inspect the live response data for the remaining edge mismatch.'
          lines.append(f'**Diagnosis:** {diagnosis}')
          report='\n'.join(lines)+'\n'; Path('/tmp/report.md').write_text(report); print(report)
          json.dump({'body':report},open('/tmp/comment.json','w'))
          PY

          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary @/tmp/comment.json 'https://api.github.com/repos/JesperOaths/kale-nel/issues/122/comments' >/dev/null
          echo 'RESULT=CLOUDFLARE_V763_EDGE_DIAGNOSTIC_RECORDED'
