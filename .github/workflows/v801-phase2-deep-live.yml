name: v801 Phase 2 deep live gameplay proof

on:
  push:
    branches: [proof/v801-phase2-deep-live]
    paths: ['.github/workflows/v801-phase2-deep-live.yml']

permissions:
  contents: read

concurrency:
  group: full-live-visual-audit
  cancel-in-progress: false

jobs:
  phase2-deep-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_SITE_SCOPE: friends
      GEJAST_BROWSER_TIMEOUT_MS: '25000'
      GEJAST_EXACT_MAIN_SHA: d5388341c5ca0a595f80f239ebb5cafa84b6af60
    steps:
      - name: Check out proof branch rooted at exact v801 main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v801-phase2-deep-live
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prove exact v801 product tree and live deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v801'
          for i in $(seq 1 60); do
            live="$(curl -fsS --max-time 10 https://kalenel.nl/VERSION 2>/dev/null | tr -d '\r\n' || true)"
            [ "$live" = 'v801' ] && break
            echo "deployment settle $i/60: ${live:-unavailable}"
            sleep 5
          done
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v801'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^\.github/workflows/v801-phase2-deep-live\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof-branch product drift:'; echo "$unexpected"; exit 1; }

      - name: Install deterministic browser and database runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          python3 <<'PY'
          from pathlib import Path
          src=Path('scripts/final-cert-live-browser-v792.mjs').read_text()
          src=src.replace('v792','v801').replace('V792','V801')
          Path('scripts/v801-phase2-deep-live.mjs').write_text(src)
          PY
          node --check scripts/v801-phase2-deep-live.mjs

      - name: Provision two hidden disposable players through current login contract
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V801DeepA_${suffix}"
          name2="V801DeepB_${suffix}"
          pin1='4826'
          pin2='7314'
          echo "::add-mask::$pin1"
          echo "::add-mask::$pin2"
          echo "GEJAST_PLAYER1_NAME=$name1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_NAME=$name2" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER1_PIN=$pin1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_PIN=$pin2" >> "$GITHUB_ENV"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          begin;
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v801-deep-a-' || lower(:'name1'), :'name1', true, 'md5:' || md5(:'pin1' || ':' || current_database()), true, true, true, 'friends'),
            ('v801-deep-b-' || lower(:'name2'), :'name2', true, 'md5:' || md5(:'pin2' || ':' || current_database()), true, true, true, 'friends');
          commit;
          SQL
          sessions="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 \
            -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          select public.account_login_v687(:'name1', :'pin1', 'friends', '{"proof":"v801-phase2"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'name2', :'pin2', 'friends', '{"proof":"v801-phase2"}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ ]]
          [[ "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"
          echo "::add-mask::$token2"
          echo "GEJAST_PLAYER1_TOKEN=$token1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_TOKEN=$token2" >> "$GITHUB_ENV"

      - name: Prove both current sessions before gameplay
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 \
            -v token1="$GEJAST_PLAYER1_TOKEN" -v token2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
          with states as (
            select public.account_public_state_v687(:'token1', :'token1', 'friends') a,
                   public.account_public_state_v687(:'token2', :'token2', 'friends') b
          )
          select coalesce(a->>'ok','false'),coalesce(a->>'display_name',''),
                 coalesce(b->>'ok','false'),coalesce(b->>'display_name','') from states;
          SQL
          )"
          test "$resolved" = "true|$GEJAST_PLAYER1_NAME|true|$GEJAST_PLAYER2_NAME"
          echo 'RESULT=V801_PHASE2_PRE_GAME_SESSIONS_PASS'

      - name: Run multi-context mobile reconnect and natural completion campaign
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/v801-phase2-deep-live.mjs; then
            echo 'First deep campaign attempt failed; retrying once after a short edge settle.'
            sleep 4
            node scripts/v801-phase2-deep-live.mjs
          fi

      - name: Prove current sessions survive completed gameplay
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 \
            -v token1="$GEJAST_PLAYER1_TOKEN" -v token2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
          with states as (
            select public.account_public_state_v687(:'token1', :'token1', 'friends') a,
                   public.account_public_state_v687(:'token2', :'token2', 'friends') b
          )
          select coalesce(a->>'ok','false'),coalesce(a->>'display_name',''),
                 coalesce(b->>'ok','false'),coalesce(b->>'display_name','') from states;
          SQL
          )"
          test "$resolved" = "true|$GEJAST_PLAYER1_NAME|true|$GEJAST_PLAYER2_NAME"
          echo 'RESULT=V801_PHASE2_POST_GAME_SESSIONS_PASS'

      - name: Cleanup every Phase 2 fixture and prove zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ] || [ -z "${GEJAST_PLAYER2_NAME:-}" ]; then
            echo 'Controlled names were never exported; nothing to clean.'
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v name1="$GEJAST_PLAYER1_NAME" -v name2="$GEJAST_PLAYER2_NAME" <<'SQL'
          begin;
          delete from public.paardenrace_match_history h
          using public.paardenrace_rooms r
          where h.room_id=r.id and (
            r.host_name in (:'name1',:'name2')
            or r.host_player_id in (select id from public.players where display_name in (:'name1',:'name2'))
            or r.created_by_player_id in (select id from public.players where display_name in (:'name1',:'name2'))
          );
          delete from public.klaverjas_online_games
          where created_by_player_name in (:'name1',:'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1',:'name2'));
          delete from public.pikken_games
          where created_by_player_name in (:'name1',:'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1',:'name2'));
          delete from public.paardenrace_rooms
          where host_name in (:'name1',:'name2')
             or host_player_id in (select id from public.players where display_name in (:'name1',:'name2'))
             or created_by_player_id in (select id from public.players where display_name in (:'name1',:'name2'));
          delete from public.gejast_active_player_metadata_v679
          where lower(coalesce(player_name,'')) in (lower(:'name1'),lower(:'name2'));
          delete from public.gejast_player_sessions_v746
          where player_id in (select id from public.players where display_name in (:'name1',:'name2'));
          delete from public.players
          where display_name in (:'name1',:'name2') and is_dummy=true and hidden_from_public=true;
          commit;
          SQL
          residue="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v name1="$GEJAST_PLAYER1_NAME" -v name2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select (select count(*) from public.players where display_name in (:'name1',:'name2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'name1',:'name2')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'name1'),lower(:'name2'))),
                 (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.paardenrace_rooms where host_name in (:'name1',:'name2'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0'
          echo 'RESULT=V801_PHASE2_ZERO_RESIDUE_PASS'

      - name: Final Phase 2 marker
        run: echo 'RESULT=V801_PHASE2_DEEP_LIVE_PASS'
