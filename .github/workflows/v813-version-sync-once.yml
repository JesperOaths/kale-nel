name: v813 version sync once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v813-version-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Synchronize all active product version markers
        shell: bash
        run: |
          set -euo pipefail
          node fix-version-drift.mjs
          node check-version-drift.mjs
          rm .github/workflows/v813-version-sync-once.yml
          git config user.name 'Kalenel Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release(v813): synchronize active product version markers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
