name: C720P filesystem reserve read-only preflight
on:
  pull_request:
    paths:
      - '.github/workflows/c720p-security-root-reserve-preflight.yml'
      - 'ops/c720p/s9-native-security/security-ext4-reserve-preflight.py'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-ext4-reserve-preflight.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/security-ext4-reserve-preflight.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/c720p/s9-native-security/security-ext4-reserve-preflight.py").read_text()
          assert 'C720P_ROOT_EXT4_RESERVE_PREFLIGHT_V1' in s
          for x in ('os.system(', 'os.remove(', 'shutil.rmtree(', 'shell=True',
                    'subprocess.Popen(', 'tune2fs","-m', 'sudo","tune2fs'):
           assert x not in s,x
          print("READ_ONLY_ROOT_PREFLIGHT_PASS")
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Private management route unavailable'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          file="ops/c720p/s9-native-security/security-ext4-reserve-preflight.py"
          hash="$(sha256sum "$file" | cut -d' ' -f1)"
          [[ "$hash" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          src="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${file}"
          temp="/tmp/security-root-reserve-preflight-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 25 '${src}' -o '${temp}' && printf '%s  %s\\n' '${hash}' '${temp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${temp}'"
          idem="security-root-preflight-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
           'github-actions-security-fs-preflight','diagnostic',:'cmd',150,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "FS_PREFLIGHT_JOB=$id"
          for i in $(seq 1 40); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 7500)"
              echo "$out"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_ROOT_EXT4_RESERVE_PREFLIGHT_V1' <<< "$out" || exit 1
              exit 0
            fi
            sleep 8
          done
          exit 1
