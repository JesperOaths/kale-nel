name: Orphan check audit

on:
  push:
    branches:
      - agent/orphan-check-audit-v792
    paths:
      - '.github/workflows/orphan-check-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Classify root check programs by authoritative and composed references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const checks = fs.readdirSync('.')
            .filter((name) => /^check-.*\.mjs$/.test(name))
            .sort();

          const pkg = fs.readFileSync('package.json', 'utf8');
          const workflowDir = '.github/workflows';
          const workflows = fs.readdirSync(workflowDir)
            .filter((name) => /\.ya?ml$/.test(name))
            .map((name) => [name, fs.readFileSync(path.join(workflowDir, name), 'utf8')]);
          const checkerBodies = checks.map((name) => [name, fs.readFileSync(name, 'utf8')]);

          const rows = checks.map((name) => {
            const npm = pkg.includes(name);
            const wf = workflows.filter(([, body]) => body.includes(name)).map(([file]) => file);
            const checkerRefs = checkerBodies
              .filter(([other, body]) => other !== name && body.includes(name))
              .map(([other]) => other);
            return { name, npm, wf, checkerRefs };
          });

          const noTopLevel = rows.filter((row) => !row.npm && row.wf.length === 0);
          const composed = noTopLevel.filter((row) => row.checkerRefs.length > 0);
          const trulyUnreferenced = noTopLevel.filter((row) => row.checkerRefs.length === 0);
          const workflowOnly = rows.filter((row) => !row.npm && row.wf.length > 0);

          console.log(`TOTAL_CHECKS=${rows.length}`);
          console.log(`NO_TOP_LEVEL_REFERENCE=${noTopLevel.length}`);
          console.log(`COMPOSED_BY_CHECKER=${composed.length}`);
          console.log(`TRULY_UNREFERENCED=${trulyUnreferenced.length}`);
          console.log(`WORKFLOW_ONLY=${workflowOnly.length}`);

          console.log('--- COMPOSED_BY_CHECKER ---');
          for (const row of composed) console.log(`${row.name} | inbound=${row.checkerRefs.join(',')}`);

          console.log('--- TRULY_UNREFERENCED ---');
          for (const row of trulyUnreferenced) console.log(row.name);

          console.log('--- WORKFLOW_ONLY ---');
          for (const row of workflowOnly) console.log(`${row.name} | workflows=${row.wf.join(',')}`);

          console.log('RESULT=ORPHAN_CHECK_AUDIT_V792_COMPLETE');
          NODE
