name: Orphan check audit

on:
  push:
    branches:
      - agent/orphan-check-audit-v792
    paths:
      - '.github/workflows/orphan-check-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Classify root check programs by authoritative references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const checks = fs.readdirSync('.')
            .filter((name) => /^check-.*\.mjs$/.test(name))
            .sort();

          const pkg = fs.readFileSync('package.json', 'utf8');
          const workflowDir = '.github/workflows';
          const workflows = fs.readdirSync(workflowDir)
            .filter((name) => /\.ya?ml$/.test(name))
            .map((name) => [name, fs.readFileSync(path.join(workflowDir, name), 'utf8')]);

          const rows = checks.map((name) => {
            const npm = pkg.includes(name);
            const wf = workflows.filter(([, body]) => body.includes(name)).map(([file]) => file);
            return { name, npm, wf };
          });

          const orphaned = rows.filter((row) => !row.npm && row.wf.length === 0);
          const npmOnly = rows.filter((row) => row.npm && row.wf.length === 0);
          const workflowOnly = rows.filter((row) => !row.npm && row.wf.length > 0);
          const both = rows.filter((row) => row.npm && row.wf.length > 0);

          console.log(`TOTAL_CHECKS=${rows.length}`);
          console.log(`ORPHANED=${orphaned.length}`);
          console.log(`NPM_ONLY=${npmOnly.length}`);
          console.log(`WORKFLOW_ONLY=${workflowOnly.length}`);
          console.log(`BOTH=${both.length}`);

          const print = (label, items) => {
            console.log(`--- ${label} ---`);
            for (const row of items) {
              console.log(`${row.name}${row.wf.length ? ` | workflows=${row.wf.join(',')}` : ''}`);
            }
          };

          print('ORPHANED', orphaned);
          print('WORKFLOW_ONLY', workflowOnly);
          print('NPM_ONLY', npmOnly);
          console.log('RESULT=ORPHAN_CHECK_AUDIT_V792_COMPLETE');
          NODE
