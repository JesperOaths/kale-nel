name: v809 runtime RPC builder

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

concurrency:
  group: v809-runtime-rpc-builder
  cancel-in-progress: false

env:
  BASE_SHA: 41b9643029595c22e68223ed7e860da4d2b6040b
  TARGET_BRANCH: agent/v809-runtime-rpc-contract-cleanup

jobs:
  build:
    if: github.head_ref == 'agent/v809-runtime-rpc-contract-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v809-runtime-rpc-contract-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify exact v809 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^\.github/workflows/v809-runtime-rpc-builder\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected branch drift:'; echo "$unexpected"; exit 1; }
          printf 'v809\n' > VERSION
          python3 <<'PY'
          from pathlib import Path
          import json, re

          def replace_exact(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'patch target missing: {path}')
              p.write_text(s.replace(old,new,1))

          # Announcements: current production read takes only scope; consume also requires session token.
          replace_exact('gejast-site-announcements.js',
          "  async function consumeAnnouncement(row){\n    try { await rpc('consume_player_site_announcement_scoped', { announcement_id_input: row.announcement_id, site_scope_input: scope() }); } catch(_){}\n  }",
          "  async function consumeAnnouncement(row){\n    let sessionToken = '';\n    try { sessionToken = cfg().getPlayerSessionToken ? String(cfg().getPlayerSessionToken()||'').trim() : ''; } catch(_) {}\n    if (!sessionToken) return;\n    try { await rpc('consume_player_site_announcement_scoped', { session_token: sessionToken, announcement_id_input: row.announcement_id, site_scope_input: scope() }); } catch(_){}\n  }")
          replace_exact('gejast-site-announcements.js',
          "      const data = await rpc('get_player_site_announcements_scoped', { site_scope_input: scope(), limit_count: 8 });",
          "      const data = await rpc('get_player_site_announcements_scoped', { site_scope_input: scope() });")

          # Drinks workflow: canonical get_drinks_page_public already owns verify_queue; remove empty compatibility read.
          replace_exact('gejast-drinks-workflow.js',
          "    const [pageRaw, verifyRaw, mineRaw, historyRaw, speedRaw] = await Promise.allSettled([\n      rpc('get_drinks_page_public', payload),\n      rpc('get_all_pending_drink_event_verifications_public', { session_token }),\n      rpc('get_my_pending_drink_requests_public', { session_token }),\n      rpc('get_verified_drinks_history_public', { limit_count: opts.history_limit ?? 40 }),\n      rpc('get_drink_speed_page_public', payload)\n    ]);\n    const page = pageRaw.status==='fulfilled' ? (pageRaw.value?.get_drinks_page_public||pageRaw.value||{}) : {};\n    const verify_queue = verifyRaw.status==='fulfilled' ? (verifyRaw.value?.get_all_pending_drink_event_verifications_public||verifyRaw.value||[]) : (page.verify_queue||[]);",
          "    const [pageRaw, mineRaw, historyRaw, speedRaw] = await Promise.allSettled([\n      rpc('get_drinks_page_public', payload),\n      rpc('get_my_pending_drink_requests_public', { session_token }),\n      rpc('get_verified_drinks_history_public', { limit_count: opts.history_limit ?? 40 }),\n      rpc('get_drink_speed_page_public', payload)\n    ]);\n    const page = pageRaw.status==='fulfilled' ? (pageRaw.value?.get_drinks_page_public||pageRaw.value||{}) : {};\n    const verify_queue = Array.isArray(page.verify_queue) ? page.verify_queue : (Array.isArray(page.all_pending_verifications) ? page.all_pending_verifications : []);")

          # Drinks add legacy fallback: same canonical page owns verify queue.
          replace_exact('drinks_add.html',
          "      const [pageState, verifyState, mineState, recentState] = await Promise.allSettled([\n        rpcWithTimeout('get_drinks_page_public', payload, 1100),\n        rpcWithTimeout('get_all_pending_drink_event_verifications_public', {session_token:token()}, 1400),\n        rpcWithTimeout('get_my_pending_drink_requests_public', {session_token:token()}, 1400),\n        rpcWithTimeout('get_verified_drinks_history_public', {limit_count:8}, 1400)\n      ]);\n      const pageRaw = pageState.status==='fulfilled' ? pageState.value : {};\n      const page = pageRaw?.get_drinks_page_public || pageRaw || {};\n      const verifyRaw = verifyState.status==='fulfilled' ? verifyState.value : [];\n      const mineRaw = mineState.status==='fulfilled' ? mineState.value : [];\n      const recentRaw = recentState.status==='fulfilled' ? recentState.value : [];\n      const verifyQueue = Array.isArray(verifyRaw) ? verifyRaw : (verifyRaw?.items || verifyRaw?.verify_queue || []);",
          "      const [pageState, mineState, recentState] = await Promise.allSettled([\n        rpcWithTimeout('get_drinks_page_public', payload, 1100),\n        rpcWithTimeout('get_my_pending_drink_requests_public', {session_token:token()}, 1400),\n        rpcWithTimeout('get_verified_drinks_history_public', {limit_count:8}, 1400)\n      ]);\n      const pageRaw = pageState.status==='fulfilled' ? pageState.value : {};\n      const page = pageRaw?.get_drinks_page_public || pageRaw || {};\n      const mineRaw = mineState.status==='fulfilled' ? mineState.value : [];\n      const recentRaw = recentState.status==='fulfilled' ? recentState.value : [];\n      const verifyQueue = Array.isArray(page.verify_queue) ? page.verify_queue : (Array.isArray(page.all_pending_verifications) ? page.all_pending_verifications : []);")

          # Floating verification prompt: replace two obsolete empty compatibility RPCs with canonical queue source.
          p=Path('drinks-verify-float.js'); s=p.read_text()
          start=s.find("      if (!item) {\n        try{\n          const allRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_all_pending_drink_event_verifications_public`")
          end=s.find("      if (!item || !canShowFor(`${item.kind||'drink'}:${item.id}`))", start)
          if start < 0 or end < 0: raise SystemExit('drinks-verify-float fallback block missing')
          replacement="""      if (!item) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_drinks_page_public`, {
            method:'POST',
            headers: headers(),
            body: JSON.stringify({session_token: token(), viewer_lat: pos?.coords?.latitude ?? null, viewer_lng: pos?.coords?.longitude ?? null})
          });
          const raw = await parse(res);
          const data = raw?.get_drinks_page_public || raw || {};
          const drinkItem = Array.isArray(data.verify_queue) ? data.verify_queue[0] : null;
          if (drinkItem && canShowFor(`drink:${drinkItem.id}`)) { drinkItem.kind = 'drink'; item = drinkItem; }
        } catch (_) {}
      }
"""
          p.write_text(s[:start]+replacement+s[end:])

          # Session state: remove obsolete get_public_state/session-token probes in favor of canonical account state.
          replace_exact('gejast-account-runtime.js',
          "  async function getPublicState(){ const token=playerToken(); if(!token) return null; try{ return await rpcFirst([{name:'get_public_state', body:{session_token:token}, options:{timeoutMs:1200}},{name:'account_public_state_v687', body:{session_token_input:token}, options:{timeoutMs:1200}}]); }catch(_){ return null; } }",
          "  async function getPublicState(){ const token=playerToken(); if(!token) return null; try{ return await rpc('account_public_state_v687', {session_token_input:token, site_scope_input:scope()}, {timeoutMs:1200}); }catch(_){ return null; } }")

          p=Path('gejast-session-corner.js'); s=p.read_text()
          start=s.find('  async function fetchViewer(token){')
          end=s.find('  function mount(){', start)
          if start < 0 or end < 0: raise SystemExit('session-corner viewer block missing')
          replacement="""  function scope(){ try { if(window.GEJAST_SCOPE_UTILS && window.GEJAST_SCOPE_UTILS.getScope) return window.GEJAST_SCOPE_UTILS.getScope(); } catch(_){} try { return new URLSearchParams(location.search).get('scope') === 'family' ? 'family' : 'friends'; } catch(_){} return 'friends'; }
  async function fetchViewer(token){
    if (!token || !SUPABASE_URL || !SUPABASE_KEY) return { name:'', coins:0 };
    let name = '';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/account_public_state_v687`, { method:'POST', mode:'cors', cache:'no-store', headers: rpcHeaders(), body: JSON.stringify({ session_token_input: token, site_scope_input: scope() }) });
      const data = await res.json().catch(()=>null);
      if (res.ok && data?.ok === true) name = data?.my_name || data?.display_name || data?.player_name || '';
    } catch {}
    if (!name) return { name:'', coins:0 };
    let coins = 0;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_my_caute_coins_public`, { method:'POST', mode:'cors', cache:'no-store', headers: rpcHeaders(), body: JSON.stringify({ session_token: token, session_token_input: token }) });
      const data = await res.json().catch(()=>null);
      if (res.ok) coins = Number(data?.balance ?? data?.caute_coins ?? data?.coin_balance ?? 0) || 0;
    } catch {}
    return { name, coins };
  }
"""
          p.write_text(s[:start]+replacement+s[end:])

          p=Path('home.html'); s=p.read_text()
          start=s.find('      async function validateToken(token){')
          end=s.find('      if (cfg.isPlayerSessionExpired', start)
          if start < 0 or end < 0: raise SystemExit('home validateToken block missing')
          replacement="""      async function validateToken(token){
        if (!token || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) return false;
        try {
          const res = await fetch(`${cfg.SUPABASE_URL}/rest/v1/rpc/account_public_state_v687`, { method:'POST', mode:'cors', cache:'no-store', headers: rpcHeaders(), body: JSON.stringify({ session_token_input: token, site_scope_input: family ? 'family' : 'friends' }) });
          const data = await parseResponse(res);
          const name = normalizeName(data && (data.my_name || data.display_name || data.player_name || ''));
          return !!(data && data.ok === true && name);
        } catch (_) { return false; }
      }
"""
          p.write_text(s[:start]+replacement+s[end:])

          replace_exact('gejast-combined-readers.js',
          "        RPC.callRpc('get_gejast_homepage_state', { session_token: sessionToken }).catch(() => RPC.callRpc('get_public_state', { session_token: sessionToken })),",
          "        RPC.callRpc('get_gejast_homepage_state', { session_token: sessionToken }).catch(() => RPC.callRpc('account_public_state_v687', { session_token_input: sessionToken, site_scope_input: RPC.getScope() })),")

          # Player runtime bundle accepts player_name_input/player_input/site_scope_input only.
          replace_exact('gejast-home-profile-runtime.js',
          "  async function loadPlayer(){ const p=new URLSearchParams(location.search).get('player')||''; if(!p) return null; const data=await rpc(RPC.player,{player_name_input:p,site_scope_input:scope(),session_token_input:playerSession()||null}); renderPlayer(data); return data; }",
          "  async function loadPlayer(){ const p=new URLSearchParams(location.search).get('player')||''; if(!p) return null; const data=await rpc(RPC.player,{player_name_input:p,site_scope_input:scope()}); renderPlayer(data); return data; }")

          checker=Path('check-v809-runtime-rpc-contract-cleanup.mjs')
          checker.write_text("""#!/usr/bin/env node
import assert from 'node:assert/strict';
import fs from 'node:fs';
const version=fs.readFileSync('VERSION','utf8').trim();
assert(Number(version.replace(/^v/i,''))>=809,'v809+ required');
const read=(p)=>fs.readFileSync(p,'utf8');
const ann=read('gejast-site-announcements.js');
assert(!ann.includes('limit_count: 8'),'announcement poll must not send obsolete limit_count');
assert(/consume_player_site_announcement_scoped[\\s\\S]{0,220}session_token: sessionToken/.test(ann),'announcement consume must send session_token');
const float=read('drinks-verify-float.js');
assert(float.includes('/rpc/get_drinks_page_public'),'verification float must use canonical drinks page queue');
assert(!float.includes('/rpc/get_all_pending_drink_event_verifications_public'),'verification float must not call empty pending compatibility RPC');
assert(!float.includes('/rpc/get_drink_event_vote_queue_public'),'verification float must not call empty vote-queue compatibility RPC');
const workflow=read('gejast-drinks-workflow.js');
assert(!workflow.includes("rpc('get_all_pending_drink_event_verifications_public'"),'drinks workflow must not call empty pending compatibility RPC');
assert(workflow.includes('Array.isArray(page.verify_queue)'),'drinks workflow must consume canonical page verify_queue');
const add=read('drinks_add.html');
assert(!add.includes("rpcWithTimeout('get_all_pending_drink_event_verifications_public'"),'drinks add must not call empty pending compatibility RPC');
assert(add.includes('Array.isArray(page.verify_queue)'),'drinks add must consume canonical page verify_queue');
for (const file of ['gejast-account-runtime.js','gejast-session-corner.js','home.html','gejast-combined-readers.js']) {
  assert(!/[\"']get_public_state[\"']/.test(read(file)),`${file} must not call legacy get_public_state session contract`);
}
assert(read('gejast-account-runtime.js').includes("rpc('account_public_state_v687'"),'account runtime must use canonical account_public_state_v687');
assert(read('gejast-session-corner.js').includes('/rpc/account_public_state_v687'),'session corner must use canonical account state');
assert(read('home.html').includes('/rpc/account_public_state_v687'),'home token validation must use canonical account state');
assert(read('gejast-combined-readers.js').includes("RPC.callRpc('account_public_state_v687'"),'homepage fallback must use canonical account state');
const hp=read('gejast-home-profile-runtime.js');
const playerLine=hp.match(/async function loadPlayer\(\)\{[^\n]+/s)?.[0]||'';
assert(playerLine.includes('player_name_input:p') && playerLine.includes('site_scope_input:scope()'),'player runtime bundle must send canonical player/scope args');
assert(!playerLine.includes('session_token_input'),'player runtime bundle must not send unsupported session_token_input');
console.log('PASS v809 runtime RPC contract cleanup');
""")

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); script=data['scripts']['verify:static']
          anchor='node check-v808-family-player-empty-alias.mjs'
          addition='node check-v809-runtime-rpc-contract-cleanup.mjs'
          if addition not in script:
              if anchor not in script: raise SystemExit('verify:static anchor missing')
              script=script.replace(anchor, anchor+' && '+addition)
          data['scripts']['verify:static']=script
          pkg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          checklist=Path('beta-live-write-checklist.json'); c=json.loads(checklist.read_text()); c['site_version']='v809'; checklist.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          gameplay=Path('gameplay-acceptance.json'); g=json.loads(gameplay.read_text()); g['site_version']='v809'; g['last_updated']='2026-08-18'; gameplay.write_text(json.dumps(g,indent=2,ensure_ascii=False)+'\n')

          certp=Path('release-certification.json'); cert=json.loads(certp.read_text())
          cert={
            'schema_version':1,'current_version':'v809','status':'REVALIDATION_REQUIRED',
            'previous_certified_version':'v808','previous_certified_product_sha':'7f6f7bc110807e85f52ff4d54927620dbbc9ffeb',
            'previous_certified_release_branch':'release/v808-certified-20260818',
            'reason':'v809 removes proven frontend/PostgREST contract drift and redundant empty compatibility reads. Fresh exact-current v809 live health and browser warning evidence are required before PASS.',
            'remaining_release_blockers':['Fresh exact-current v809 live health must pass.','Targeted authenticated browser proof must show the repaired RPC owners no longer emit their prior 404s.','Fresh visual/runtime regression evidence and cleanup must pass before certification.'],
            'required_next':['Merge only after canonical verification.','Run exact-current v809 health and targeted warning diagnostics.','Run authenticated visual/runtime closure and independently confirm zero controlled residue before PASS.'],
            'previous_certification_snapshot':{'certified_at':'2026-08-18','visual_artifact_sha256':'b017cbb66811ebd8c3bd8daf9ec7083df12db082ae7d6af209ef19422dd81af9'}
          }
          certp.write_text(json.dumps(cert,indent=2,ensure_ascii=False)+'\n')

          rp=Path('beta-readiness.json'); tracker=json.loads(rp.read_text()); tracker['site_version']='release candidate v809 / live v808 / certified rollback v808'; tracker['last_updated']='2026-08-18'
          ident=tracker.setdefault('deployment_identity',{}); ident['status']='ready_to_test'; ident['live_version']='v808'; ident['release_candidate_version']='v809'; ident['frontend_release_merge']='7f6f7bc110807e85f52ff4d54927620dbbc9ffeb'; ident['repository_head_at_audit']='41b9643029595c22e68223ed7e860da4d2b6040b'; ident['note']='v809 is a frontend-only release candidate over certified live v808. It replaces proven stale session and Drinks/announcement RPC payloads with current production contracts and removes redundant empty compatibility reads. No backend schema or gameplay rule changes. Fresh exact-current health and authenticated warning/visual proof are required before PASS.'
          evidence=ident.setdefault('evidence',[]); ev='2026-08-18 v809 candidate grounding: audit run 32134119010 / job 95701442104 mapped active warning callers; production signature/definition reads confirmed announcement and Drinks compatibility contracts plus canonical account/player runtime arguments. No production SQL mutation was performed.'
          if ev not in evidence: evidence.insert(0,ev)
          rp.write_text(json.dumps(tracker,indent=2,ensure_ascii=False)+'\n')
          PY
          node fix-version-drift.mjs
          node check-v809-runtime-rpc-contract-cleanup.mjs
          rm -f .github/workflows/v809-runtime-rpc-builder.yml
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          git diff --name-only "$BASE_SHA" | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align active runtime RPC contracts v809'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'RESULT=V809_RUNTIME_RPC_BUILDER_PASS'
