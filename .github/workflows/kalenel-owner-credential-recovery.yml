name: Kalenel owner credential recovery (encrypted)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'JesperOaths/kale-nel' && github.actor == 'JesperOaths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt owner credentials to the local recipient key
        env:
          RECIPIENT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAt7ui3Uho5DVmZqgu6ITi
            4JNDD3aqh43kPKopkd1AqLyC9gKKfr4a2WttJqr10xHmlkagpHhzE94HowkfmrfE
            rrZlXl1ekEQQ3xhvu4FUonrwjfd5GmYeSb/XUsqlTQxUkwGcgiIaSfJdDUJixf9J
            tG+sk8YqCJge42yirirhL3Ik0fZse4bhml1Pjd2xtXBnkFm16WZPJLnfg1jl+0oR
            fBKL/iHqYoufHMqcwX0hKzwqNCjh2XDKQzPpl4F+6rziOjIIA4R4qgNNWnxUsIGt
            T8W+6uudX2D8cJWcXG1AXLh2PID3P1XksRwH3AvNGSJ0NX77X/B8yRh3Sl/Hd1YL
            GBX0Ko2f2ArlDvzX10ZKM40i8PppSJ+jZnSG/SQBAedYPnhGB5pBQdx1/OElu+hI
            x1VfePVfDp97IjScpTl901bu3fHRbO/TO1meVcV1qbof8elFMs+4PPS1e4JV0vbD
            FsaHW0nn/xj14/ztjAccrCdX6z4DTHwZSNcPLP7zcHNmPVihce50BGuxiTPbe37r
            hmLVJGixUb7v/oM1Izno83oWta/AL22LzEHD/i9rIiv1J+IGiwnCrxh8Y6mb2Owx
            kEx7Ztifp3eIw3tL7EPXHgZ0VwLsTmZZ+mnDykOlmSyyZhNLNiHmHbaVq30AJMOs
            1vTfOoSsMbbRA+am5JSxhoUCAwEAAQ==
            -----END PUBLIC KEY-----
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ONE: ${{ secrets.CLOUDFLARE_API_TOKEN_ONE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOVERNANCE_ADMIN_TOKEN: ${{ secrets.GOVERNANCE_ADMIN_TOKEN }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const names = ["SUPABASE_ACCESS_TOKEN", "SUPABASE_DB_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_URL", "WEB_PUSH_VAPID_PUBLIC_KEY", "WEB_PUSH_VAPID_PRIVATE_KEY", "WEB_PUSH_VAPID_SUBJECT", "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_API_TOKEN_ONE", "CLOUDFLARE_ACCOUNT_ID", "GOVERNANCE_ADMIN_TOKEN"];
          const values = Object.fromEntries(names.filter(n => process.env[n]).map(n => [n, process.env[n]]));
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(JSON.stringify(values), 'utf8'), cipher.final()]);
          const encryptedKey = crypto.publicEncrypt({key: process.env.RECIPIENT_PUBLIC_KEY, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash:'sha256'}, key);
          fs.mkdirSync('owner-recovery', {mode:0o700});
          fs.writeFileSync('owner-recovery/credentials.encrypted.json', JSON.stringify({algorithm:'RSA-OAEP-SHA256+AES-256-GCM', key:encryptedKey.toString('base64'), iv:iv.toString('base64'), tag:cipher.getAuthTag().toString('base64'), ciphertext:ciphertext.toString('base64')}), {mode:0o600});
          console.log('Encrypted owner credential archive created. No plaintext is saved or printed.');
          NODE
      - name: Save encrypted owner archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kalenel-owner-credentials-encrypted
          path: owner-recovery/credentials.encrypted.json
          retention-days: 1
          if-no-files-found: error
