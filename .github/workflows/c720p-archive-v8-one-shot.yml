name: C720P Archive V8 one-shot publication
on:
  pull_request:
    paths:
      - '.github/workflows/c720p-archive-v8-one-shot.yml'
      - 'ops/c720p/s9-native-security/deploy-security-archive-drive-v8.py'
      - 'ops/c720p/security-archive-v8.trigger'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-archive-v8.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate archive deployment source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-security-archive-drive-v8.py
          python3 ops/c720p/s9-native-security/test-security-v7.py
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('ops/c720p/s9-native-security/security-archive-v7.html').read_text()
          assert all(x in s for x in ('id="driveTab"', 'id="localTab"', 'c720p-drive-saved.html', "showSource('drive');"))
          print('ARCHIVE_V8_SOURCE_VALIDATED')
          PY

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Submit one audited, SHA-pinned document deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "Missing private management connection"; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          html_hash="$(sha256sum ops/c720p/s9-native-security/security-archive-v7.html | cut -d' ' -f1)"
          script_hash="$(sha256sum ops/c720p/s9-native-security/deploy-security-archive-drive-v8.py | cut -d' ' -f1)"
          [[ "$html_hash" =~ ^[a-f0-9]{64}$ && "$script_hash" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          src="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/ops/c720p/s9-native-security/deploy-security-archive-drive-v8.py"
          tmp="/tmp/c720p-archive-v8-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 25 '${src}' -o '${tmp}' && printf '%s  %s\\n' '${script_hash}' '${tmp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${tmp}' --ref '${GITHUB_SHA}' --sha256 '${html_hash}'"
          idem="archive-v8-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          job_info="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id,job_state,disposition
          from c720p_agent.submit_management_job_v1(
            'github-actions-archive-v8','deployment',:'cmd',240,:'idem');
          SQL
          )"
          job_id="${job_info%%|*}"
          [[ "$job_id" =~ ^[0-9]+$ ]] || { echo "Did not receive a valid job ID"; exit 1; }
          echo "AUDITED_C720P_ARCHIVE_JOB_ID=$job_id"
          for attempt in $(seq 1 30); do
            result="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${job_id}" | head -n 1)"
            state="${result%%|*}"
            if [[ "$state" == done || "$state" == failed ]]; then
              outcome="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${job_id}" | head -c 3500)"
              echo "$outcome"
              [[ "$state" == done && "$result" == 'done|0' ]] || { echo "C720P installation job failed"; exit 1; }
              grep -Eq 'ARCHIVE_DRIVE_V8_(DEPLOYED|ALREADY_INSTALLED)' <<< "$outcome" || { echo "Expected readback marker missing"; exit 1; }
              grep -Fq "$html_hash" <<< "$outcome" || { echo "Installed document digest missing"; exit 1; }
              echo "ARCHIVE_V8_ON_DEVICE_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out without live installation confirmation; job may still run"
          exit 1
