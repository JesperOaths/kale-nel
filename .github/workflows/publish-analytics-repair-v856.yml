name: Publish analytics repair v856

on:
  push:
    paths:
      - '.github/workflows/publish-analytics-repair-v856.yml'

permissions:
  contents: read

concurrency:
  group: kalenel-admin-analytics-repair-v856
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN_A: ${{ secrets.CLOUDFARE_API_TOKEN_ONE }}
      TOKEN_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ONE }}
      TOKEN_C: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_SOURCE_REPOSITORY: ${{ vars.KALENEL_ADMIN_SOURCE_REPOSITORY }}
      ADMIN_SOURCE_REF: ${{ vars.KALENEL_ADMIN_SOURCE_REF }}
      REQUIRE_PRIVATE_ADMIN_SOURCE: ${{ vars.KALENEL_REQUIRE_PRIVATE_ADMIN_SOURCE }}
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out optional private admin source
        if: env.ADMIN_SOURCE_REPOSITORY != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.ADMIN_SOURCE_REPOSITORY }}
          ref: ${{ env.ADMIN_SOURCE_REF || 'main' }}
          token: ${{ secrets.KALENEL_ADMIN_SOURCE_TOKEN }}
          path: .private-admin-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Build protected admin assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.private-admin-source" ]]; then
            export KALENEL_PRIVATE_ADMIN_SOURCE_DIR="$GITHUB_WORKSPACE/.private-admin-source"
          fi
          if [[ "${REQUIRE_PRIVATE_ADMIN_SOURCE,,}" =~ ^(1|true|yes)$ ]]; then
            export KALENEL_REQUIRE_PRIVATE_ADMIN_SOURCE=1
          fi
          node scripts/build-admin-worker-assets.mjs
          test -f cloudflare/workers/admin-gate/static/admin_shop_analytics.html
          grep -q "core-first-v856" cloudflare/workers/admin-gate/static/admin_shop_analytics.html
          grep -q "Every product: traffic, sales, cost & margin" cloudflare/workers/admin-gate/static/admin_shop_analytics.html
          echo "Analytics repair is present in protected asset bundle."

      - name: Run Worker security tests
        run: node scripts/test-admin-worker-gate.mjs

      - name: Deploy with an authorized Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for label in A B C; do
            var="TOKEN_$label"
            token="${!var:-}"
            [[ -n "$token" ]] || continue

            account_json="$(curl --silent --show-error --max-time 20               -H "Authorization: Bearer $token"               'https://api.cloudflare.com/client/v4/accounts?per_page=50' || true)"
            account_id="$(printf '%s' "$account_json" | jq -r 'if .success == true and (.result|length) == 1 then .result[0].id else empty end' 2>/dev/null || true)"
            if [[ -z "$account_id" ]]; then
              echo "Token alias $label cannot uniquely resolve a Cloudflare account."
              continue
            fi

            echo "Trying Worker deployment with token alias $label."
            if CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account_id"               npx --yes wrangler@4.118.0 deploy --config cloudflare/workers/admin-gate/wrangler.toml; then
              echo "Worker deployed with token alias $label."
              success=1
              break
            fi
            echo "Token alias $label could not deploy the Worker."
          done
          [[ "$success" == "1" ]] || { echo "::error::No configured Cloudflare token could deploy the admin Worker."; exit 1; }

      - name: Verify protected analytics perimeter
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}'             'https://admin.kalenel.nl/admin_shop_analytics.html')"
          [[ "$status" == "401" ]] || { echo "::error::Expected protected analytics route to return 401 anonymously, got $status"; exit 1; }
          grep -qi '^cache-control: no-store' "$headers"
          grep -qi 'Admin login vereist' "$body"
          echo "Protected analytics route is live and remains access-controlled."
