name: Reviewed person OSNet appearance evidence UI
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/deploy-s9-reviewed-model-suggestions-v1.py'
      - 'ops/c720p/s9-native-security/test-s9-reviewed-model-suggestions-v1.py'
      - '.github/workflows/s9-reviewed-model-suggestions.yml'
  push:
    paths:
      - 'ops/c720p/s9-native-security/deploy-s9-reviewed-model-suggestions-v1.py'
      - 'ops/c720p/s9-native-security/test-s9-reviewed-model-suggestions-v1.py'
      - '.github/workflows/s9-reviewed-model-suggestions.yml'
permissions:
  contents: read
jobs:
  approved-appearance-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run deterministic browser-code parsing and guarded source regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-s9-reviewed-model-suggestions-v1.py
          python3 ops/c720p/s9-native-security/test-s9-reviewed-model-suggestions-v1.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/deploy-s9-reviewed-model-suggestions-v1.py').read_text()
          for marker in ('S9_REVIEWED_OSNET_SUGGESTIONS_LIVE_VERIFIED',
                         'S9_REVIEWED_OSNET_SUGGESTIONS_ROLLED_BACK',
                         "automatic_person_assignments!==0",
                         "other.scoreSource===match.scoreSource",
                         "human_review_required!==true",
                         "recordings_modified"):
              assert marker in s,marker
          for prohibited in ('pm install','am force-stop','camera_service_restart',
                             'automatic_person_approval', 'delete_recording('):
              assert prohibited not in s,prohibited
          print('S9_REVIEWED_OSNET_UI_SOURCE_CONTRACT_PASS')
          PY
