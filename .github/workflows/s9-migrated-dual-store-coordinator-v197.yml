name: S9 dual-store Save Delete coordinator V197 host crash-only checks
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCoordinatorV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCoordinatorTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-dual-store-coordinator-v197.py'
      - '.github/workflows/s9-migrated-dual-store-coordinator-v197.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCoordinatorV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCoordinatorTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-dual-store-coordinator-v197.py'
      - '.github/workflows/s9-migrated-dual-store-coordinator-v197.yml'
permissions:
  contents: read
jobs:
  synthetic-lock-and-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Java 8 dual-store fsync barrier and restart/rollback tests
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-dual-store-coordinator-v197.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          python3 "$d/test-s9-migrated-ledger-v193.py"
          python3 ops/c720p/security-runtime/test_s9_migrated_save_delete_contract_v181.py
          echo "S9_DUAL_STORE_V197_HOST_ONLY_NO_LIVE_MUTATIONS"
