name: C720P Security screenshot fixes V11
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-tracks-v7.html'
      - 'ops/c720p/s9-native-security/deploy-security-ui-v11.py'
      - '.github/workflows/c720p-security-ui-v11.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-ui-v11.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Syntax and screenshot regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-security-ui-v11.py
          python3 ops/c720p/s9-native-security/test-security-v7.py
          python3 - <<'PY'
          from pathlib import Path
          a=Path('ops/c720p/s9-native-security/security-tracks-v7.html').read_text()
          b=Path('ops/c720p/s9-native-security/deploy-security-ui-v11.py').read_text()
          for x in ('#more[hidden]','Math.max(0,entries.length-visible)',
                    'resetFilteredScroll();',"'person':'people'"):
           assert x in a,x
          assert "name==='camera'?'controls':name" in b
          assert "d.camera_temperature_c" in b
          assert "s9v5-rail-sd" in b
          print('SECURITY_SCREENSHOT_V11_STATIC_CHECKS_PASS')
          PY
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('ops/c720p/s9-native-security/security-tracks-v7.html','utf8');
          for(const match of html.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/g)){
           new vm.Script(match[1]);
          }
          console.log('SECURITY_TRACKS_V11_JAVASCRIPT_PARSE_PASS');
          JS
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Submit backed-up device patch and verify both published pages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Private C720P gateway unavailable'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          script="ops/c720p/s9-native-security/deploy-security-ui-v11.py"
          tpl="ops/c720p/s9-native-security/security-tracks-v7.html"
          script_hash="$(sha256sum "$script"|cut -d' ' -f1)"
          html_hash="$(sha256sum "$tpl"|cut -d' ' -f1)"
          [[ "$script_hash" =~ ^[a-f0-9]{64}$ && "$html_hash" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          src="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${script}"
          temp="/tmp/security-ui-v11-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${src}' -o '${temp}' && printf '%s  %s\\n' '${script_hash}' '${temp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${temp}' --ref '${GITHUB_SHA}' --sha256 '${html_hash}'"
          idem="security-ui-v11-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
           'github-actions-security-ui-v11','deployment',:'cmd',240,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid job"; exit 1; }
          echo "C720P_SECURITY_UI_V11_JOB=$id"
          for i in $(seq 1 35); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == failed\|* || "$state" == error\|* ]]; then
              result="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 5000)"
              echo "$result"
              [[ "$state" == 'done|0' ]] || { echo "Device deployment failed or rolled back"; exit 1; }
              grep -q 'SECURITY_UI_V11_VERIFIED' <<< "$result" || { echo "Missing on-device verification"; exit 1; }
              grep -Fq "$html_hash" <<< "$result" || { echo "Bad deployed template"; exit 1; }
              echo "SECURITY_UI_V11_HUB_PASS"
              exit 0
            fi
            sleep 9
          done
          echo "C720P job result pending";exit 1
