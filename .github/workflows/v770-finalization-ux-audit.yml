name: v770 finalization UX audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/v770-finalization-ux-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Scan active frontend for unfinished UX markers
        run: node scripts/audit-active-frontend-finalization-v770.mjs
      - name: Inspect deployed RPC contracts and stale runtime references
        run: node scripts/audit-runtime-contracts-v770.mjs
      - name: Fresh live v769 deployment health
        env:
          GEJAST_EXPECTED_VERSION: v769
          GEJAST_DEPLOY_WAIT_SECONDS: '180'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: npm run smoke:live
      - name: Fresh v769 scorer-content proof
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --retry 3 --retry-all-errors "https://kalenel.nl/VERSION?cb=${cb}" -o /tmp/version
          printf 'Live VERSION=' && cat /tmp/version && echo
          test "$(tr -d '\r\n' </tmp/version)" = "v769"
          curl -fsSL --retry 3 --retry-all-errors "https://kalenel.nl/scorer.html?cb=${cb}" -o /tmp/scorer.html
          grep -Fq '<div class="compact-divider">–</div>' /tmp/scorer.html
          grep -Fq 'empty.textContent = `Kies de bieding om ronde ${currentRoundIndex()} te starten.`;' /tmp/scorer.html
          grep -Fq 'id="saveMatchBtn"' /tmp/scorer.html
          grep -Fq "GEJAST_PAGE_VERSION='v769'" /tmp/scorer.html
          ! grep -Fq '<div class="compact-divider">?</div>' /tmp/scorer.html
          ! grep -Fq "empty.textContent = 'Kies de bieding om ronde 1 te starten.';" /tmp/scorer.html
          echo 'Fresh deployed v769 scorer content PASS.'
      - name: Beta read-only smoke
        run: npm run smoke:beta:read
      - name: Push health smoke without send
        run: npm run smoke:push
