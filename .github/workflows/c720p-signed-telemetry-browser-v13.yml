name: C720P signed telemetry browser audit V13
on:
  pull_request:
    paths:
      - '.github/workflows/c720p-signed-telemetry-browser-v13.yml'
      - 'ops/c720p/s9-native-security/security-signed-telemetry-browser-v13.py'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-signed-telemetry-browser-v13.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read-only scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/security-signed-telemetry-browser-v13.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/security-signed-telemetry-browser-v13.py').read_text()
          for positive in ('S9_SECURITY_SIGNED_TELEMETRY_BROWSER_V13','/new/api/live-person-watch','/new/api/saved','Target.closeTarget'):
            assert positive in s,positive
          for disallowed in ('shutil.rmtree(','.unlink(', 'os.remove(', 'subprocess.run(', 'localStorage', 'sessionStorage', 'document.cookie','console.log('):
            assert disallowed not in s,disallowed
          print('SIGNED_TELEMETRY_BROWSER_V13_READONLY_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run temporary Chromium Security session without modifying media
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Private gateway unavailable'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          path="ops/c720p/s9-native-security/security-signed-telemetry-browser-v13.py"
          digest="$(sha256sum "$path" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          location="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${path}"
          temp="/tmp/s9-security-telemetry-v13-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${location}' -o '${temp}' && printf '%s  %s\\n' '${digest}' '${temp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${temp}'"
          idem="s9-telemetry-browser-v13-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-telemetry-browser-v13','diagnostic',:'cmd',120,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'Diagnostic job not accepted'; exit 1; }
          echo "C720P_SIGNED_TELEMETRY_AUDIT_JOB_ID=$id"
          for tick in $(seq 1 40); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 8000)"
              echo "$out"
              [[ "$state" == 'done|0' ]] || { echo 'Device audit failed'; exit 1; }
              grep -q 'S9_SECURITY_SIGNED_TELEMETRY_BROWSER_V13' <<< "$out" || exit 1
              echo 'SIGNED_TELEMETRY_BROWSER_V13_CAPTURED'
              exit 0
            fi
            sleep 8
          done
          exit 1
