name: S9 V3 first guarded real-clip pilot
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-original-pilot.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-single-original-pilot.py'
      - '.github/workflows/s9-v3-first-original-live-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-original-pilot.py'
      - '.github/workflows/s9-v3-first-original-live-pilot.yml'
permissions:
  contents: read
concurrency:
  group: security-v3-one-original-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify one-clip privacy, replay and provenance invariants
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$root/run-s9-v3-single-original-pilot.py"
          python3 "$root/test-s9-v3-single-original-pilot.py"
          python3 "$root/test-s9-v3-resumable-archive.py"
          python3 "$root/test-s9-v3-ledger-reconciliation.py"
          python3 - <<'PY'
          from pathlib import Path
          code=Path('ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-original-pilot.py').read_text()
          assert '"--limit","1","--apply"' in code
          assert 'private_output_suppressed' in code
          assert 'before_approvals!=after_approvals' in code
          for forbidden in ('pm install','am force-stop','assign_person','delete_original'):
              assert forbidden not in code
          print('S9_SINGLE_CLIP_PRIVACY_GUARD_PASS')
          PY
  live-one-original:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run authorized single-source S9 phone-side archive pilot
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security/offline-worker'
          stage="/tmp/security-v3-oneclip-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$stage'"
          for script in run-s9-v3-single-original-pilot.py run-s9-v3-resumable-archive.py backfill-s9-original-roi-osnet-temporal-v2.py backfill-s9-hsv32-uniform-v2.py backfill-v40-person-rois-on-s9.py backfill-s9-original-person-roi-osnet.py run-s9-uniform-appearance-rankings-v3.py S9AppearanceRankingWorkerV3.java PhoneOfflineSimilarity.java install-s9-roi-partial-recovery-v3.py S9StandalonePersonRoiRecoveryV3.java; do
            src="$root/$script"
            digest="$(sha256sum "$src" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
            cmd="$cmd && curl -fsSL --retry 2 --max-time 35 '$url' -o '$stage/$script' && printf '%s  %s\\n' '$digest' '$stage/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/run-s9-v3-single-original-pilot.py'"
          idem="security-v3-oneclip-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v3-oneclip','security',:'cmd',690,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_V3_PRIVATE_PREFLIGHT_JOB=$id"
          for attempt in $(seq 1 155); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3500)"
              echo "$output"
              if [[ "$status" != 'done|0' ]]; then
                echo "S9 V3 single-original guarded pilot did not complete"; exit 1
              fi
              grep -q 'S9_V3_SINGLE_ORIGINAL_LIVE_PILOT' <<< "$output"
              grep -q '"raw_filenames_disclosed": false' <<< "$output"
              grep -q '"manual_review_decisions_modified": false' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          echo "S9 V3 single-original guarded pilot timed out"; exit 1
