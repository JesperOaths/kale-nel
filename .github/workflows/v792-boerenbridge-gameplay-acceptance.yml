name: v792 Boerenbridge gameplay acceptance

on:
  pull_request:
    paths:
      - 'boerenbridge.html'
      - 'check-boerenbridge-engine-v792.mjs'
      - '.github/workflows/v792-boerenbridge-gameplay-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boerenbridge-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run deterministic gameplay matrix
        run: node check-boerenbridge-engine-v792.mjs
