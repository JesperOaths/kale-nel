name: Security source health deploy

on:
  push:
    branches:
      - agent/dual-camera-security-deploy
    paths:
      - '.github/workflows/security-source-health-deploy.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TARGET_BRANCH: feature/security-source-health-ux

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Preserve patcher and production rollback source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/patch-security-source-health-ui.py /tmp/patch-security-source-health-ui.py
          python3 -m py_compile /tmp/patch-security-source-health-ui.py
          git fetch origin main "$TARGET_BRANCH"
          git show origin/main:cloudflare/workers/admin-gate/src/worker.js > /tmp/production-worker.js
          git show origin/main:security/index.html > /tmp/production-security.html
          test -s /tmp/production-worker.js
          test -s /tmp/production-security.html

      - name: Check out scoped target branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          unexpected=$(git diff --name-only origin/main...HEAD | grep -Ev '^$' || true)
          test -z "$unexpected"

      - name: Patch and validate source-aware viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch-security-source-health-ui.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('security/index.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('BLOCKER=INLINE_SCRIPT_NOT_FOUND')
          Path('/tmp/security-inline.js').write_text(m.group(1))
          PY
          node --check /tmp/security-inline.js
          grep -q 'sourceOnline:{new:false,s3:false}' security/index.html
          grep -q 'source_online' security/index.html
          grep -q '1/2 cameras online' security/index.html
          grep -q 'security-5 · source-aware dual camera' security/index.html
          ! grep -Eqi 'trycloudflare\.com|192\.168\.|media_token|hmac_secret|service_role' security/index.html
          node scripts/build-admin-worker-assets.mjs
          test -s cloudflare/workers/admin-gate/static/security/index.html
          git diff --check -- security/index.html
          echo SOURCE_HEALTH_STATIC_VALIDATION=PASS

      - name: Deploy with automatic production rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo SOURCE_HEALTH_DEPLOY_VERIFY_FAILED_ROLLING_BACK=YES
              cp /tmp/production-worker.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/production-security.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
              echo SOURCE_HEALTH_WORKER_ROLLBACK_ATTEMPTED=YES
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 12); do
            echo EDGE_VERIFY_ATTEMPT=$attempt
            root_code=$(curl -sS -o /dev/null -D /tmp/root.h -w '%{http_code}' https://kalenel.nl/security/ || true)
            new_code=$(curl -sS -o /dev/null -D /tmp/new.h -w '%{http_code}' https://kalenel.nl/security/new-clips/ || true)
            s3_code=$(curl -sS -o /dev/null -D /tmp/s3.h -w '%{http_code}' https://kalenel.nl/security/s3-clips/ || true)
            login_code=$(curl -sS -o /tmp/login.body -H 'content-type: application/json' --data '{"username":"x","password":"x","totp":"000000"}' -w '%{http_code}' https://kalenel.nl/security/auth/login || true)
            public_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            admin_code=$(curl -sS -o /dev/null -D /tmp/admin.h -w '%{http_code}' https://kalenel.nl/admin.html || true)
            root_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/root.h || true)
            new_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/new.h || true)
            s3_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/s3.h || true)
            admin_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/admin.h || true)
            echo ROOT=$root_code:$root_loc NEW=$new_code:$new_loc S3=$s3_code:$s3_loc LOGIN=$login_code PUBLIC=$public_code ADMIN=$admin_code:$admin_loc
            if [ "$root_code" = 302 ] && [ "$root_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2F' ] && [ "$new_code" = 302 ] && [ "$new_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2Fnew-clips%2F' ] && [ "$s3_code" = 302 ] && [ "$s3_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2Fs3-clips%2F' ] && [ "$login_code" = 401 ] && grep -q 'github_session_required' /tmp/login.body && [ "$public_code" = 200 ] && [ "$admin_code" = 302 ] && [ "$admin_loc" = 'https://admin.kalenel.nl/admin.html' ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          echo SOURCE_HEALTH_OUTER_GATE=PASS
          echo PUBLIC_SITE_REGRESSION=PASS
          echo SOURCE_HEALTH_WORKER_DEPLOY=PASS

      - name: Persist scoped viewer source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- security/index.html
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'security/index.html'
          git commit -m 'Show camera source availability in private security viewer'
          git push origin HEAD:"$TARGET_BRANCH"
          echo SOURCE_HEALTH_SOURCE_PERSISTED=PASS
