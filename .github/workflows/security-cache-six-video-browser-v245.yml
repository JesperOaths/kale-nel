name: Authenticated Security existing-client cache and all six video rendering V245-V246
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/smoke-security-existing-client-cache-v245.py'
      - 'ops/c720p/security-runtime/test-smoke-security-existing-client-cache-v245.py'
      - 'ops/c720p/security-runtime/smoke-security-all-six-video-v246.py'
      - 'ops/c720p/security-runtime/test-smoke-security-all-six-video-v246.py'
      - '.github/workflows/security-cache-six-video-browser-v245.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/smoke-security-existing-client-cache-v245.py'
      - 'ops/c720p/security-runtime/test-smoke-security-existing-client-cache-v245.py'
      - 'ops/c720p/security-runtime/smoke-security-all-six-video-v246.py'
      - 'ops/c720p/security-runtime/test-smoke-security-all-six-video-v246.py'
      - '.github/workflows/security-cache-six-video-browser-v245.yml'
permissions:
  contents: read
concurrency:
  group: security-cache-six-video-browser-v245
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 "$d/test-smoke-security-existing-client-cache-v245.py"
          python3 "$d/test-smoke-security-all-six-video-v246.py"
          python3 "$d/test-smoke-security-rendered-browser-v240.py"
  physical:
    needs: safety
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: One serialized SHA-pinned real HA Chromium cache-key test then all six media
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/security-cache-six-v245-${GITHUB_SHA:0:12}"
          cmd="umask 077 && install -d -m 700 '$stage'"
          for file in \
            ops/c720p/security-runtime/smoke-security-existing-client-cache-v245.py \
            ops/c720p/security-runtime/smoke-security-all-six-video-v246.py \
            ops/c720p/security-runtime/smoke-c720p-migrated-decoded-browser-v145.py; do
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$sha' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/smoke-security-existing-client-cache-v245.py' --run && /usr/bin/python3 '$stage/smoke-security-all-six-video-v246.py' --run"
          idem="security-cache-six-v245-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-cache-six-v245','diagnostic',:'cmd',520,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "SECURITY_CACHE_SIX_V245_PHYSICAL_JOB=$job"
          for n in $(seq 1 190); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 5600)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'SECURITY_CACHE_EXISTING_CLIENT_V245_VERIFIED' <<< "$output"
              grep -q '"js_reloaded_with_new_v_query": true' <<< "$output"
              grep -q '"no_media_or_review_changes": true' <<< "$output"
              grep -q '"automatic_remote_release_detection_not_tested": true' <<< "$output"
              grep -q 'SECURITY_ALL_SIX_VIDEO_RENDERED_V246_VERIFIED' <<< "$output"
              grep -q '"actual_migrated_mp4s_play_pause_seek_decoded": 6' <<< "$output"
              grep -q '"authenticated_1024byte_206_ranges": 6' <<< "$output"
              grep -q '"all_media_and_reviews_unchanged": true' <<< "$output"
              grep -q '"camera_dropped_output_frames_after": 0' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Rendered Security cache and six videos not jointly verified";exit 1
