name: S9 face evidence review V29

on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/test-face-review-evidence-gates-v29.js'
      - 'ops/c720p/s9-native-security/deploy-s9-face-review-v29.py'
      - '.github/workflows/c720p-s9-face-review-v29.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-face-folders-v22.html'
      - 'ops/c720p/s9-native-security/deploy-s9-face-review-v29.py'
      - '.github/workflows/c720p-s9-face-review-v29.yml'

permissions:
  contents: read

concurrency:
  group: c720p-face-review-v29
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate evidence scope, grouping, and safe HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-s9-face-review-v29.py
          node ops/c720p/s9-native-security/test-face-review-evidence-gates-v29.js
          python3 ops/c720p/s9-native-security/test-s9-face-recall-v27.py
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const src=fs.readFileSync('ops/c720p/s9-native-security/security-face-folders-v22.html','utf8');
          for(const [,body] of src.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/g)){
            if(body.trim())new vm.Script(body);
          }
          assert(src.includes('facePipelineStatus'));
          assert(!src.includes('innerHTML='));
          console.log('S9_FACE_REVIEW_INLINE_JS_PASS');
          JS
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Publish guarded authenticated face review, without camera restart
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Authorized deployment unavailable'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src="ops/c720p/s9-native-security/deploy-s9-face-review-v29.py"
          html="ops/c720p/s9-native-security/security-face-folders-v22.html"
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          ui="$(sha256sum "$html" | cut -d' ' -f1)"
          [[ "$sha" =~ ^[a-f0-9]{64}$ && "$ui" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          remote="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          dest="/tmp/s9-face-review-v29-${GITHUB_SHA:0:12}.py"
          command="curl -fSsL --max-time 36 '${remote}' -o '${dest}' && printf '%s  %s\n' '${sha}' '${dest}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${dest}' --ref '${GITHUB_SHA}' --ui-sha '${ui}'"
          idem="s9-face-review-v29-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$command" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-face-review-v29','deployment',:'cmd',260,:'idem'
          );
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_FACE_REVIEW_V29_JOB=$job"
          for i in $(seq 1 65); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 9500)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_FACE_REVIEW_V29_VERIFIED' <<< "$output" || exit 1
              exit 0
            fi
            sleep 5
          done
          echo 'Face review deployment outcome not yet verified'
          exit 1
