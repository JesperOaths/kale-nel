name: Guarded one-time Security V58 UI rollout
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-security-v58-guarded-once-20261019.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-security-v58-guarded-once-20261019.yml'
permissions:
  contents: read
concurrency:
  group: c720p-security-v58-one-time-rollout
  cancel-in-progress: false
env:
  TARGET_SHA: 4c1024582fa418256ce34bbcaabeaad868c12cbf
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate pinned source and People & Faces behavior
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/ops/c720p/s9-native-security"
          for file in security-people-v45.js security-people-v45.html test-people-v45.js; do
            curl -fSsL --retry 2 --max-time 30 "https://raw.githubusercontent.com/JesperOaths/kale-nel/$TARGET_SHA/ops/c720p/s9-native-security/$file" -o "$tmp/ops/c720p/s9-native-security/$file"
          done
          node --check "$tmp/ops/c720p/s9-native-security/security-people-v45.js"
          (cd "$tmp" && node ops/c720p/s9-native-security/test-people-v45.js)
          python3 -m py_compile ops/c720p/s9-native-security/deploy-people-v45.py
          python3 ops/c720p/s9-native-security/test-route-v50-idempotent.py
          echo 'SECURITY_V58_UI_PINNED_SOURCE_VALIDATED'
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Pinned dry-run and transactional live UI installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          file='ops/c720p/s9-native-security/deploy-people-v45.py'
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
          dest="/tmp/c720p-security-v58-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 35 '$uri' -o '$dest' && printf '%s  %s\\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$TARGET_SHA' --dry-run && /usr/bin/python3 '$dest' --ref '$TARGET_SHA'"
          idem="security-v58-ui-once-${TARGET_SHA:0:18}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-v58-ui','deployment',:'cmd',290,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_V58_UI_JOB=$id"
          for i in $(seq 1 70); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done\\|* || "$status" == error\\|* || "$status" == failed\\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 14000)"
              echo "$out"
              [[ "$status" == 'done|0' ]]
              grep -q 'S9_PEOPLE_V45_LIVE_ROUTE_DRY_RUN_PASS' <<< "$out"
              grep -q 'S9_PEOPLE_FACES_V45_ACTUAL_HUB_DEPLOY_VERIFIED' <<< "$out"
              echo 'SECURITY_V58_UI_ROLLOUT_VERIFIED'
              exit 0
            fi
            sleep 5
          done
          exit 1
