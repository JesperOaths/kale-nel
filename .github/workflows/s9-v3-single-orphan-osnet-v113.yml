name: S9 V3 genuine single missing OSNet recovery V113
on:
  # Start each cool window with one authentic source-verified OSNet crop.
  # Existing shared lock + cool Camera2 ring gate refuse overlapping work.
  schedule:
    - cron: '5 1,5,9,13,17,21 * * *'
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-orphan-osnet-v113.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-single-orphan-osnet-v113.py'
      - '.github/workflows/s9-v3-single-orphan-osnet-v113.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-orphan-osnet-v113.py'
      - '.github/workflows/s9-v3-single-orphan-osnet-v113.yml'
permissions:
  contents: read
concurrency:
  group: s9-v3-single-orphan-source-provenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test real-crop singleton and cool-camera guards
        shell: bash
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$root/run-s9-v3-single-orphan-osnet-v113.py"
          python3 "$root/test-s9-v3-single-orphan-osnet-v113.py"
          python3 "$root/test-s9-hsv-transport-v107.py"
          python3 "$root/test-s9-v3-partial-inventory.py"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/c720p/s9-native-security/offline-worker/run-s9-v3-single-orphan-osnet-v113.py").read_text()
          for forbidden in ("pm install","am force-stop","review_decide",
                            "auto_assign_person","delete_original"):
              assert forbidden not in s
          assert "old.extract_one(old_source)" in s
          assert "MAX_START_C=39.5" in s
          assert "fcntl.LOCK_EX|fcntl.LOCK_NB" in s
          print("S9_V3_SINGLE_GENUINE_OSNET_SOURCE_SAFETY_PASS")
          PY
  live-one-crop:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run at most one real S9 V40 OSNet repair if the recorder is cool
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root="ops/c720p/s9-native-security/offline-worker"
          stage="/tmp/s9-v3-visual-single-${GITHUB_SHA:0:12}"
          cmd="umask 077 && mkdir -p '$stage' && adb -s 192.168.178.250:5555 forward tcp:18808 tcp:8808 >/dev/null"
          for source in run-s9-v3-single-orphan-osnet-v113.py backfill-s9-hsv32-uniform-v2.py backfill-v40-person-rois-on-s9.py backfill-s9-original-roi-osnet-temporal-v2.py run-s9-uniform-appearance-rankings-v3.py; do
            path="$root/$source"
            digest="$(sha256sum "$path" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$path"
            cmd="$cmd && curl -fsSL --retry 2 --max-time 45 '$url' -o '$stage/$source' && printf '%s  %s\n' '$digest' '$stage/$source' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/run-s9-v3-single-orphan-osnet-v113.py' --apply"
          idem="s9-v3-single-osnet-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-one-real-osnet-recovery','security',:'cmd',700,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_V3_SINGLE_OSNET_MANAGEMENT_JOB=$id"
          for attempt in $(seq 1 165); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3000)"
              echo "$output"
              if [[ "$status" != 'done|0' ]]; then
                echo 'No verified new OSNet descriptor'; exit 1
              fi
              if grep -q 'S9_V3_ORPHAN_OSNET_RECOVERED' <<< "$output"; then
                grep -q '"single_real_osnet_vector_verified": true' <<< "$output"
                grep -q '"historical_v2_references_preserved": 57' <<< "$output"
                grep -q '"manual_review_decisions_modified": false' <<< "$output"
                grep -q '"private_identifiers_disclosed": false' <<< "$output"
                echo 'One genuine visual descriptor SHA-verified'
                exit 0
              fi
              if grep -q 'S9_V3_ORPHAN_OSNET_DEFERRED' <<< "$output"; then
                grep -q '"completed": false' <<< "$output"
                echo 'Phone too hot or 4K recorder not ready: safely deferred'
                exit 0
              fi
              echo 'Unverified one-crop result'; exit 1
            fi
            sleep 4
          done
          echo 'Single-crop recovery job timed out'; exit 1
