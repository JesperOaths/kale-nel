name: C720P kiosk CDP safe browser probe
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-v8-real-browser-probe.py'
      - 'ops/c720p/s9-native-security/test-security-browser-cdp-bounds.py'
      - '.github/workflows/c720p-security-browser-cdp-bounds.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-v8-real-browser-probe.py'
      - 'ops/c720p/s9-native-security/test-security-browser-cdp-bounds.py'
      - '.github/workflows/c720p-security-browser-cdp-bounds.yml'
permissions:
  contents: read
jobs:
  bounded-read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify bounded CDP reads without a kiosk or media changes
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-security-browser-cdp-bounds.py
          python3 -m py_compile ops/c720p/s9-native-security/security-v8-real-browser-probe.py
