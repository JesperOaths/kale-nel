name: v778 postmerge live proof

on:
  pull_request:
    paths:
      - 'scripts/check-live-v778-dynamic-accessibility.mjs'
      - 'scripts/finalize-live-v778-evidence.mjs'
      - '.github/workflows/v778-postmerge-live-proof.yml'

permissions:
  contents: write

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Hardened live route suite
        env:
          GEJAST_EXPECTED_VERSION: v778
          GEJAST_SMOKE_RETRIES: 4
        run: npm run smoke:live
      - name: Exact v778 dynamic accessibility edge proof
        run: node scripts/check-live-v778-dynamic-accessibility.mjs
      - name: Promote durable v778 evidence
        run: |
          node scripts/finalize-live-v778-evidence.mjs
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          git -c core.whitespace=cr-at-eol diff --check
      - name: Remove temporary proof machinery and commit evidence
        shell: bash
        run: |
          rm -f scripts/check-live-v778-dynamic-accessibility.mjs
          rm -f scripts/finalize-live-v778-evidence.mjs
          rm -f .github/workflows/v778-postmerge-live-proof.yml
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta-readiness.json
          git add -u scripts/check-live-v778-dynamic-accessibility.mjs scripts/finalize-live-v778-evidence.mjs .github/workflows/v778-postmerge-live-proof.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'docs: record live v778 accessibility proof'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
