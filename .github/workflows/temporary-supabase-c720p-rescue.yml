name: Temporary Supabase C720P Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-supabase-c720p-rescue.yml'

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Prefer official project restart
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'Management token available; requesting official project restart.'
            code=$(curl -sS -o /tmp/restart-body -w '%{http_code}' --connect-timeout 10 --max-time 30 \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' || true)
            echo "restart_http=${code}"
            if [ "$code" = 200 ] || [ "$code" = 201 ] || [ "$code" = 202 ]; then
              echo 'used_management_restart=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'used_management_restart=false' >> "$GITHUB_OUTPUT"

      - name: Wait after official restart
        if: steps.restart.outputs.used_management_restart == 'true'
        run: sleep 75

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Try pooler then direct Postgres rescue
        if: steps.restart.outputs.used_management_restart != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          export PGCONNECT_TIMEOUT=10
          rescue_sql="set statement_timeout='10s'; set lock_timeout='3s'; select now(); select cron.alter_job(job_id := 1, active := false) where exists(select 1 from cron.job where jobid=1 and active); select pg_terminate_backend(pid) from pg_stat_activity where pid<>pg_backend_pid() and datname=current_database() and backend_type='client backend' and state='idle' and usename in ('postgres','authenticator') and now()-state_change>interval '2 minutes'; notify pgrst, 'reload config';"
          echo 'Trying configured pooler URL.'
          if psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "$rescue_sql"; then
            echo 'RESCUE_PATH=pooler'
            exit 0
          fi
          echo 'Pooler unavailable; deriving direct Postgres credentials without printing them.'
          eval "$(python3 - <<'PY'
import os, urllib.parse, shlex
u=urllib.parse.urlsplit(os.environ['SUPABASE_DB_URL'])
user=urllib.parse.unquote(u.username or '')
password=urllib.parse.unquote(u.password or '')
db=(u.path or '/postgres').lstrip('/') or 'postgres'
# Pooler users are often postgres.<project-ref>; direct host uses postgres.
if user.startswith('postgres.'):
    user='postgres'
print('export DIRECT_PGUSER='+shlex.quote(user))
print('export DIRECT_PGPASSWORD='+shlex.quote(password))
print('export DIRECT_PGDATABASE='+shlex.quote(db))
PY
)"
          export PGPASSWORD="$DIRECT_PGPASSWORD"
          psql "host=db.${PROJECT_REF}.supabase.co port=5432 user=${DIRECT_PGUSER} dbname=${DIRECT_PGDATABASE} sslmode=require connect_timeout=10" \
            -X -v ON_ERROR_STOP=1 -c "$rescue_sql"
          echo 'RESCUE_PATH=direct'

      - name: Verify fresh database connection
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=10
          for i in 1 2 3 4; do
            if psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "set statement_timeout='8s'; select 'DB_OK '||now();"; then exit 0; fi
            sleep 10
          done
          echo 'Pooler verification still unavailable after rescue.'
          exit 3
