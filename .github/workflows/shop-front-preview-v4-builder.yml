name: Shop front preview v4 builder

on:
  push:
    branches:
      - fix/shop-front-previews-edge-to-edge
    paths:
      - '.github/scripts/build_shop_front_previews_v4.py'
      - '.github/workflows/shop-front-preview-v4-builder.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shop-front-previews-edge-to-edge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/scripts/build_shop_front_previews_v4.py
      - name: Commit previews
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shop/assets/product-previews/*-front-v4.webp
          if git diff --cached --quiet; then
            echo 'No preview changes.'
            exit 0
          fi
          git commit -m 'Build transparent edge-to-edge shop previews'
          git push origin HEAD:fix/shop-front-previews-edge-to-edge
