name: Shop price refresh once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shop-price-refresh-once.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force catalog refresh and verify classic-shirt prices
        shell: bash
        run: |
          set -euo pipefail
          base='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          curl --silent --show-error --max-time 20 "$base?refresh_probe=canonical-shirt-price-1" >/tmp/first.json || true
          sleep 12
          curl --silent --show-error --max-time 20 "$base?refresh_probe=canonical-shirt-price-2" >/tmp/final.json
          jq '{
            productCount:(.products|length),
            prices:[
              .products[]
              | select(.name=="Axolotl" or .name=="Jellyfish" or .name=="Orchid Mantis" or .name=="Aye-Aye")
              | {name,price,sizePrices:(.variants|map({key:.size,value:.price})|from_entries)}
            ]
          }' /tmp/final.json
