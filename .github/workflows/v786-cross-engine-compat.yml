name: v786 cross-engine compatibility audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Firefox/WebKit tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps firefox webkit
      - name: Read-only Firefox + WebKit acceptance
        run: node scripts/v786-cross-engine-audit.mjs
