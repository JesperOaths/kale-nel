name: v773 apply diagnostic self-consistency release

on:
  pull_request:
    paths:
      - 'scripts/apply-v773-diagnostic-self-consistency.mjs'
      - '.github/workflows/v773-apply-diagnostic-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v773-diagnostic-self-consistency'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply deterministic v773 diagnostic repair
        run: node scripts/apply-v773-diagnostic-self-consistency.mjs
      - name: Verify generated release candidate before commit
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          node check-diagnostic-self-consistency-v773.mjs
          git config core.whitespace cr-at-eol
          git diff --check
      - name: Commit v773 release candidate
        run: |
          set -euo pipefail
          rm -rf node_modules
          git config user.name 'Kale Nel Finalization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^node_modules/'; then
            echo 'Refusing to commit node_modules.' >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'v773: make diagnostics release-aware and truthful'
          git push origin HEAD:${GITHUB_HEAD_REF}
