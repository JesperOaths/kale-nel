name: Task14 read-only installed rollout schema producer verification
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-s9-rollout-success-task14.py'
      - 'ops/c720p/security-runtime/test-audit-s9-rollout-success-task14.py'
      - '.github/workflows/s9-task14-rollout-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-s9-rollout-success-task14.py'
      - 'ops/c720p/security-runtime/test-audit-s9-rollout-success-task14.py'
      - '.github/workflows/s9-task14-rollout-source-audit.yml'
permissions:
  contents: read
concurrency:
  group: s9-task14-rollout-source-audit
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Confirm no reinstall or result rewrite
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-s9-rollout-success-task14.py"
          python3 "$d/test-audit-s9-rollout-success-task14.py"
          python3 ops/c720p/s9-native-security/test-s9-7s-cool-rollout-v1.py
  physical:
    needs: synthetic
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Inspect exact installed APK candidate and currently deployed Python producer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          script=ops/c720p/security-runtime/audit-s9-rollout-success-task14.py
          producer=ops/c720p/s9-native-security/s9_7s_cool_rollout_v1.py
          src_sha="$(sha256sum "$script" | cut -d' ' -f1)"
          producer_sha="$(sha256sum "$producer" | cut -d' ' -f1)"
          stage="/tmp/s9-rollout-task14-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$script"
          cmd="umask 077 && curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$src_sha' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' --run --expected-producer-sha256 '$producer_sha'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="s9-rollout-task14-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-rollout-task14-readonly','diagnostic',:'cmd',200,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "S9_ROLLOUT_TASK14_PHYSICAL_JOB=$job"
          for i in $(seq 1 65); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3200)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_ROLLOUT_SUCCESS_SCHEMA_TASK14_PHYSICAL' <<< "$output"
              grep -q '"phone_apk_matches_exact_candidate": true' <<< "$output"
              grep -q '"no_camera_reinstall_or_restart": true' <<< "$output"
              grep -q '"original_videos_or_manual_reviews_modified": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Task14 producer source diagnostic not verified";exit 1
