name: Runtime residue audit

on:
  push:
    branches:
      - agent/runtime-residue-audit-v792
    paths:
      - '.github/workflows/runtime-residue-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inventory non-web artifacts and runtime data references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean);
          const runtimeSources = tracked.filter((p) => /\.(?:html|js|css)$/i.test(p) &&
            !p.startsWith('.github/') && !p.startsWith('cloudflare/') && !p.startsWith('scripts/') &&
            !p.startsWith('repo/') && !p.startsWith('mnt/') && !p.startsWith('deployment_forensics_v761/') && !/^check-/.test(p));
          const sourceText = runtimeSources.map((p) => [p, fs.readFileSync(p, 'utf8')]);

          const extCounts = new Map();
          for (const p of tracked) {
            const base = path.basename(p);
            const ext = path.extname(base).toLowerCase() || '<none>';
            extCounts.set(ext, (extCounts.get(ext) || 0) + 1);
          }

          console.log('--- EXTENSION_COUNTS ---');
          [...extCounts].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).forEach(([ext,count]) => console.log(`${ext}=${count}`));

          for (const ext of ['.json','.md','.txt','.csv','.xml','.webmanifest']) {
            const files = tracked.filter((p) => path.extname(p).toLowerCase() === ext);
            console.log(`--- ${ext} FILES=${files.length} ---`);
            for (const file of files) {
              const base = path.basename(file);
              const hits = [];
              for (const [src, text] of sourceText) {
                if (text.includes(file) || text.includes(base)) hits.push(src);
              }
              if (hits.length) console.log(`REFERENCED ${file} <- ${hits.join(',')}`);
            }
          }

          const dirs = new Map();
          for (const p of tracked) {
            const first = p.includes('/') ? p.split('/')[0] : '<root>';
            dirs.set(first, (dirs.get(first) || 0) + 1);
          }
          console.log('--- TOP_LEVEL_COUNTS ---');
          [...dirs].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).forEach(([dir,count]) => console.log(`${dir}=${count}`));
          console.log('RESULT=RUNTIME_DATA_REFERENCE_AUDIT_V792_COMPLETE');
          NODE
