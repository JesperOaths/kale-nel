name: Runtime residue audit

on:
  push:
    branches:
      - agent/runtime-residue-audit-v792
    paths:
      - '.github/workflows/runtime-residue-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Scan active web-source residue, duplicate owners and inbound references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' })
            .split(/\r?\n/).filter(Boolean);
          const web = tracked.filter((p) => /\.(?:html|js|css)$/i.test(p));
          const activeCandidates = web.filter((p) =>
            !p.startsWith('.github/') &&
            !p.startsWith('cloudflare/') &&
            !p.startsWith('scripts/') &&
            !/^check-/.test(p)
          );

          const markerRe = /\b(?:TODO|FIXME|HACK|XXX)\b/ig;
          const markers = [];
          for (const p of activeCandidates) {
            const lines = fs.readFileSync(p, 'utf8').split(/\r?\n/);
            lines.forEach((line, i) => {
              if (markerRe.test(line)) markers.push(`${p}:${i + 1}:${line.trim().slice(0, 180)}`);
              markerRe.lastIndex = 0;
            });
          }

          const suspiciousNames = activeCandidates.filter((p) =>
            /(?:^|[._ -])(old|backup|bak|copy|tmp|temp|archive|deprecated|legacy)(?:[._ -]|$)/i.test(p)
          );

          const hashes = new Map();
          for (const p of activeCandidates) {
            const body = fs.readFileSync(p);
            if (!body.length) continue;
            const hash = crypto.createHash('sha256').update(body).digest('hex');
            const group = hashes.get(hash) || [];
            group.push(p);
            hashes.set(hash, group);
          }
          const duplicates = [...hashes.entries()]
            .filter(([, paths]) => paths.length > 1)
            .map(([hash, paths]) => ({ hash, paths }));

          const versionNamed = activeCandidates.filter((p) => /v\d{3,}[a-z]?/i.test(p));

          const targets = [
            'repo/gejast-game-hq.css',
            'deployment_forensics_v761/',
            'mnt/data/v182build/',
            'gejast-family-rollout-v437.js',
            'gejast-family-rollout.js',
            'gejast-mobile-foundation-v581.css',
            'gejast-mobile-foundation-v582.css',
            'gejast-mobile-foundation-v581.js',
            'gejast-mobile-foundation-v582.js',
          ];
          const refs = new Map(targets.map((target) => [target, []]));
          for (const p of tracked) {
            if (!fs.statSync(p).isFile()) continue;
            let text;
            try { text = fs.readFileSync(p, 'utf8'); } catch { continue; }
            const lines = text.split(/\r?\n/);
            for (const target of targets) {
              if (p === target || p.startsWith(target)) continue;
              lines.forEach((line, i) => {
                if (line.includes(target)) refs.get(target).push(`${p}:${i + 1}:${line.trim().slice(0, 180)}`);
              });
            }
          }

          console.log(`TRACKED_WEB_FILES=${web.length}`);
          console.log(`ACTIVE_CANDIDATES=${activeCandidates.length}`);
          console.log(`TODO_FIXME_HACK_XXX=${markers.length}`);
          console.log(`SUSPICIOUS_OWNER_NAMES=${suspiciousNames.length}`);
          console.log(`BYTE_IDENTICAL_GROUPS=${duplicates.length}`);
          console.log(`VERSION_NAMED_WEB_FILES=${versionNamed.length}`);

          console.log('--- MARKERS ---');
          markers.forEach((x) => console.log(x));
          console.log('--- SUSPICIOUS_NAMES ---');
          suspiciousNames.forEach((x) => console.log(x));
          console.log('--- DUPLICATES ---');
          duplicates.forEach((x) => console.log(`${x.hash.slice(0, 12)} ${x.paths.join(' | ')}`));
          console.log('--- TARGET_REFERENCES ---');
          for (const [target, hits] of refs) {
            console.log(`TARGET=${target} INBOUND=${hits.length}`);
            hits.forEach((hit) => console.log(hit));
          }
          console.log('--- VERSION_NAMED ---');
          versionNamed.forEach((x) => console.log(x));
          console.log('RESULT=RUNTIME_RESIDUE_AUDIT_V792_COMPLETE');
          NODE
