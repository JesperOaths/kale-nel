name: v795 deterministic rebuild

on:
  push:
    branches:
      - agent/v795-watermark-sync
    paths:
      - '.github/workflows/v795-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel'
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v795-watermark-sync
          fetch-depth: 1

      - name: Build v795 from current main owners
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          function replaceRequired(path, from, to){
            const before=fs.readFileSync(path,'utf8');
            const after=before.replace(from,to);
            if(after===before) throw new Error(`${path}: required replacement did not apply`);
            fs.writeFileSync(path,after);
          }

          fs.writeFileSync('VERSION','v795\n');
          replaceRequired('check-version-drift.mjs','[-–—.]?','[-–—.·]?');
          replaceRequired('fix-version-drift.mjs','[-–—.]?','[-–—.·]?');
          NODE

          node fix-version-drift.mjs

          node <<'NODE'
          const fs=require('fs');

          const beta=JSON.parse(fs.readFileSync('beta-readiness.json','utf8'));
          beta.site_version='release candidate v795 / live v794';
          beta.last_updated='2026-08-16';
          if(beta.deployment_identity){
            beta.deployment_identity.live_version='v794';
            beta.deployment_identity.release_candidate_version='v795';
          }
          fs.writeFileSync('beta-readiness.json',JSON.stringify(beta,null,2)+'\n');

          const gameplay=JSON.parse(fs.readFileSync('gameplay-acceptance.json','utf8'));
          gameplay.site_version='v795';
          gameplay.last_updated='2026-08-16';
          fs.writeFileSync('gameplay-acceptance.json',JSON.stringify(gameplay,null,2)+'\n');

          const certification=JSON.parse(fs.readFileSync('release-certification.json','utf8'));
          certification.current_version='v795';
          certification.status='REVALIDATION_REQUIRED';
          certification.current_audit_issue=153;
          certification.reason='v795 preserves the v794 Klaverjas and Pikken/Paardenrace group-B repairs while synchronizing systemic stale visible version watermarks that the prior drift checker missed; exact-main production visual, feature-surface, and gameplay revalidation remains required.';
          fs.writeFileSync('release-certification.json',JSON.stringify(certification,null,2)+'\n');

          const v794Path='check-v794-klaverjas-public-surface.mjs';
          const v794=fs.readFileSync(v794Path,'utf8');
          const v794After=v794.replace(
            "assert.equal(fs.readFileSync('VERSION','utf8').trim(),'v794','v794 public-surface cleanup must carry VERSION v794');",
            "const currentVersion=Number((fs.readFileSync('VERSION','utf8').trim().match(/\\d+/)||['0'])[0]);\nassert.ok(currentVersion>=794,'v794 public-surface cleanup contract requires VERSION v794 or newer');"
          );
          if(v794After===v794) throw new Error('v794 Klaverjas version assertion replacement did not apply');
          fs.writeFileSync(v794Path,v794After);

          fs.writeFileSync('check-release-certification-state.mjs',`#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst version = fs.readFileSync('VERSION', 'utf8').trim();\nconst state = JSON.parse(fs.readFileSync('release-certification.json', 'utf8'));\n\nassert.equal(state.schema_version, 1, 'unsupported release certification schema');\nassert.equal(state.current_version, version, 'release certification state must track root VERSION');\nassert(['REVALIDATION_REQUIRED', 'PASS'].includes(state.status), 'invalid release certification state');\n\nif (state.status === 'PASS') {\n  const acceptancePath = \`final-acceptance-\${version}.json\`;\n  assert(fs.existsSync(acceptancePath), \`PASS requires \${acceptancePath}\`);\n  const final = JSON.parse(fs.readFileSync(acceptancePath, 'utf8'));\n  assert.equal(final.schema_version, 1, 'unsupported current final acceptance schema');\n  assert.equal(final.site_version, version, 'final acceptance must match current VERSION');\n  assert.equal(final.status, 'PASS', 'current final acceptance must be PASS');\n}\n\nconsole.log('Release certification state:', state.current_version, state.status);\n`);

          fs.writeFileSync('check-v795-visible-watermark-sync.mjs',`#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nconst version = fs.readFileSync('VERSION','utf8').trim();\nassert.equal(version,'v795','v795 watermark repair must carry VERSION v795');\n\nconst checker = fs.readFileSync('check-version-drift.mjs','utf8');\nconst fixer = fs.readFileSync('fix-version-drift.mjs','utf8');\nassert(checker.includes('[-–—.·]?'),'version drift checker must recognize the middle-dot watermark separator');\nassert(fixer.includes('[-–—.·]?'),'version drift fixer must recognize the middle-dot watermark separator');\n\nconst representative = ['home.html','login.html','leaderboard.html','beerpong.html','boerenbridge.html','klaverjas_quick_stats_v596_repo.html','klaverjas_scorer_v596_repo_ready.html','pikken_spectator.html'];\nfor (const file of representative) {\n  const body = fs.readFileSync(file,'utf8');\n  assert(body.includes('v795  -  Made by Bruis'),\`\${file} must expose the synchronized v795 visible watermark\`);\n}\n\nconst activeExt = new Set(['.html','.js','.mjs','.css']);\nconst ignoredDirs = new Set(['.git','node_modules','dist','build','.next','.vercel','coverage','tmp','temp','patch_bundles','repo','mnt']);\nconst ignoredFiles = new Set(['check-version-drift.mjs','fix-version-drift.mjs','check-v795-visible-watermark-sync.mjs']);\nfunction walk(dir,out=[]){ for(const entry of fs.readdirSync(dir,{withFileTypes:true})){ if(entry.isDirectory()){ if(!ignoredDirs.has(entry.name)) walk(path.join(dir,entry.name),out); } else out.push(path.join(dir,entry.name)); } return out; }\nfunction isArchivedFile(rel){ const base=path.basename(rel); if(/_(?:v\\d+|orig)\\.html$/i.test(base)) return true; if(/^gejast-v\\d+-repair\\.js$/i.test(base)&&!base.toLowerCase().includes(version.toLowerCase())) return true; if(/^README_v\\d+/i.test(base)||/^PATCH_NOTES_v\\d+/i.test(base)||/^GEJAST_v\\d+/i.test(base)) return true; return false; }\nconst stale=[];\nfor(const file of walk(process.cwd())){ const rel=path.relative(process.cwd(),file).replaceAll('\\\\','/'); if(isArchivedFile(rel)||ignoredFiles.has(path.basename(file))||!activeExt.has(path.extname(file).toLowerCase())) continue; const body=fs.readFileSync(file,'utf8'); for(const match of body.matchAll(/v(\\d+)\\s*·\\s*Made by Bruis/gi)) stale.push(\`\${rel}: \${match[0]}\`); }\nassert.deepEqual(stale,[],\`active middle-dot watermarks must be fully eliminated:\\n\${stale.join('\\n')}\`);\nconsole.log('v795 visible watermark synchronization ok.');\n`);

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const marker='node check-v794-klaverjas-public-surface.mjs';
          const insert='node check-v795-visible-watermark-sync.mjs';
          if(!pkg.scripts['verify:static'].includes('node check-v794-group-b-compat-panel.mjs')) throw new Error('current-main group-B regression was not preserved');
          if(!pkg.scripts['verify:static'].includes(insert)){
            if(!pkg.scripts['verify:static'].includes(marker)) throw new Error('v794 public-surface marker missing');
            pkg.scripts['verify:static']=pkg.scripts['verify:static'].replace(marker,`${marker} && ${insert}`);
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE

      - name: Commit deterministic v795 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rebuild v795 watermark synchronization on current main'
          git push origin HEAD:agent/v795-watermark-sync
