name: Private Security UI deployed source parity (validation only)
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9_security_component_health_v1.py'
      - 'ops/c720p/s9-native-security/security-hub-v30.js'
      - 'ops/c720p/s9-native-security/security-hub-v30.html'
      - 'ops/c720p/s9-native-security/c720p-surveillance.html'
      - 'ops/c720p/s9-native-security/test-private-pipeline-ui-source-parity-v1.py'
      - '.github/workflows/security-private-pipeline-ui-source-parity.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9_security_component_health_v1.py'
      - 'ops/c720p/s9-native-security/security-hub-v30.js'
      - 'ops/c720p/s9-native-security/security-hub-v30.html'
      - 'ops/c720p/s9-native-security/c720p-surveillance.html'
      - 'ops/c720p/s9-native-security/test-private-pipeline-ui-source-parity-v1.py'
      - '.github/workflows/security-private-pipeline-ui-source-parity.yml'
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Enforce source hashes, payload contracts and explicit no-identity UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/s9_security_component_health_v1.py
          python3 ops/c720p/s9-native-security/test-private-pipeline-ui-source-parity-v1.py
          node --check ops/c720p/s9-native-security/security-hub-v30.js
      - name: Assert source-only build does not deploy itself
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/security-private-pipeline-ui-source-parity.yml').read_text()
          assert not re.search(r'^\s*workflow_dispatch:',text,re.M)
          assert not re.search(r'^  deploy:',text,re.M)
          assert re.search(r'^  source-parity:',text,re.M)
          print('PRIVATE_PIPELINE_UI_VALIDATION_ONLY')
          PY
