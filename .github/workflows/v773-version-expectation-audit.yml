name: v773 stale version expectation audit

on:
  pull_request:
    paths:
      - 'scripts/audit-version-expectations-v773.mjs'
      - '.github/workflows/v773-version-expectation-audit.yml'
      - '*.html'
      - '*.js'
      - '*.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/audit-version-expectations-v773.mjs
