name: v771d Supabase transaction proof

on:
  pull_request:
    paths:
      - 'LIVE_V771D_DRINKS_TRANSACTIONAL_PROOF.sql'
      - 'ci/v771d-supabase-transaction-fixture.sql'
      - 'check-drinks-transactional-proof-v771d.mjs'
      - '.github/workflows/v771d-supabase-transaction-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v771d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v771d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production-like fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d v771d -v ON_ERROR_STOP=1 -f ci/v771d-supabase-transaction-fixture.sql

      - name: Capture fixture baseline
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.drink_events")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.drink_events where player_id=101 and status='pending'")" = "1"
          echo "Fixture baseline PASS."

      - name: Execute exact proof inside outer transaction
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/v771d_outer.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          \i LIVE_V771D_DRINKS_TRANSACTIONAL_PROOF.sql
          commit;
          SQL
          psql -h 127.0.0.1 -U postgres -d v771d -f /tmp/v771d_outer.sql

      - name: Independent post-run verification
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.drink_events")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.drink_events where player_id=101 and status='pending' and metadata->>'fixture'='preexisting-pending'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.drink_verification_votes")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select count(*) from public.gejast_player_sessions_v746 where session_token like 'OC_V771D_DRINKS_%'")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select unit_value from public.drink_event_types where lower(key)='ice'")" = "2.8"
          test "$(psql -h 127.0.0.1 -U postgres -d v771d -Atc "select last_value from public.drink_events_id_seq")" = "1"
          echo "v771d outer-transaction rollback/residue proof PASS."
