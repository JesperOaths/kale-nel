name: S9 existing AndroidKeystore HMAC ownership V202 (source only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAndroidKeystoreOwnerV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreKeyPairGuardV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreKeyPairGuardTestV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-existing-keystore-v202.py'
      - '.github/workflows/s9-existing-keystore-v202.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAndroidKeystoreOwnerV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreKeyPairGuardV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreKeyPairGuardTestV202.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-existing-keystore-v202.py'
      - '.github/workflows/s9-existing-keystore-v202.yml'
permissions:
  contents: read
jobs:
  test_and_android_dex:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Synthetic key distinction and no provisioning contract
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-existing-keystore-v202.py"
          echo "S9_V202_KEY_CUSTODY_NO_ALIAS_GENERATION_OR_PHONE"
      - name: Compile source-only AndroidKeystore resolver for API 28
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/classes" "$stage/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$stage/classes" \
            "$root/S9MigratedKeystoreKeyPairGuardV202.java" \
            "$root/S9MigratedAndroidKeystoreOwnerV202.java"
          "$d8" --min-api 28 --output "$stage/dex" $(find "$stage/classes" -name '*.class' -print)
          python3 - "$stage/dex/classes.dex" <<'PY'
          from pathlib import Path
          import sys
          blob=Path(sys.argv[1]).read_bytes()
          assert blob.startswith(b'dex\n') and 1000<len(blob)<500000
          print("S9_V202_EXISTING_KEY_OWNER_API28_DEX_OK",len(blob))
          PY
