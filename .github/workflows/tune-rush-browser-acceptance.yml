name: Tune Rush real browser acceptance
on:
  pull_request:
    paths:
      - 'music/**'
      - 'scripts/test-tune-rush-playback.mjs'
      - 'scripts/test-tune-rush-replay-db.mjs'
      - 'supabase/migrations/*musicquiz*'
      - 'scripts/tune-rush-browser-acceptance.mjs'
      - '.github/workflows/tune-rush-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
# These suites both open live room sessions in the shared Supabase backend.
# Serialize across workflows to avoid CI-only concurrent load spikes.
concurrency:
  group: tune-rush-live-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install test-only Playwright controller
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1 @electric-sql/pglite@0.5.11
      - name: Verify browser source syntax
        run: node --check scripts/tune-rush-browser-acceptance.mjs
      - name: Verify playback failure recovery and buzzer races
        run: node scripts/test-tune-rush-playback.mjs
      - name: Verify replay SQL in isolated PostgreSQL
        run: node scripts/test-tune-rush-replay-db.mjs
      - name: Run six-browser acceptance against actual PR page and live game database
        run: |
          set -euo pipefail
          echo "Using browser binary:"
          command -v google-chrome || command -v chromium || command -v chromium-browser
          python3 -m http.server 8080 --bind 127.0.0.1 --directory . >/tmp/tune-rush-test-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/music/ >/dev/null; then break; fi
            sleep 0.2
          done
          TUNE_RUSH_BASE="http://127.0.0.1:8080/music/?qa=candidate" node scripts/tune-rush-browser-acceptance.mjs
