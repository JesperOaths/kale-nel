name: Tune Rush real browser acceptance
on:
  pull_request:
    paths:
      - 'scripts/tune-rush-browser-acceptance.mjs'
      - '.github/workflows/tune-rush-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install test-only Playwright controller
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1
      - name: Verify browser source syntax
        run: node --check scripts/tune-rush-browser-acceptance.mjs
      - name: Run three-device-browser acceptance against public site
        run: |
          set -euo pipefail
          echo "Using browser binary:"
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node scripts/tune-rush-browser-acceptance.mjs
