name: v785 targeted final diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary browser tooling
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Diagnose exact v785 owners
        run: node scripts/diagnose-v785-final-findings.mjs
      - name: Persist temporary diagnostic result
        run: |
          test -f V785_DIAGNOSTIC_RESULTS.json
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V785_DIAGNOSTIC_RESULTS.json
          git commit -m "test: record temporary v785 diagnostic findings"
          git push origin HEAD:${{ github.head_ref }}
