name: C720P bounded root disk attribution V162
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-root-space-v162.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-root-space-v162.py'
      - '.github/workflows/c720p-root-space-attribution-v162.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-root-space-v162.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-root-space-v162.py'
      - '.github/workflows/c720p-root-space-attribution-v162.yml'
permissions:
  contents: read
concurrency:
  group: c720p-root-space-v162
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify bounded non-destructive disk attribution
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/audit-c720p-root-space-v162.py"
          python3 "$d/test-audit-c720p-root-space-v162.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Sample fixed-category disk usage with Camera2 health gating
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source="ops/c720p/security-runtime/audit-c720p-root-space-v162.py"
          digest="$(sha256sum "$source" | cut -d' ' -f1)"
          stage="/tmp/c720p-disk-v162-${GITHUB_SHA:0:13}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fsSL --max-time 35 '$uri' -o '$stage' && printf '%s  %s\\n' '$digest' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-root-space-v162-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-root-space-v162','diagnostic',:'cmd',150,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_ROOT_SPACE_V162_JOB=$job"
          for attempt in $(seq 1 105); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_ROOT_SPACE_ATTRIBUTION_V162' <<< "$output"
              grep -q '"read_only":true' <<< "$output"
              grep -q '"files_deleted":false' <<< "$output"
              grep -q '"recordings_modified":false' <<< "$output"
              grep -q '"capture_dropped_frames_after":0' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Read-only C720P storage category scan did not complete";exit 1
