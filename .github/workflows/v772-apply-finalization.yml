name: v772 apply finalization release

on:
  pull_request:
    paths:
      - 'scripts/apply-v772-finalization.mjs'
      - '.github/workflows/v772-apply-finalization.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v771f-finalization-residue-audit'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply mechanical v772 release candidate
        run: node scripts/apply-v772-finalization.mjs
      - name: Verify generated release candidate before commit
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          node check-finalization-residue-v772.mjs
          git diff --check
      - name: Commit v772 release candidate
        run: |
          set -euo pipefail
          git config user.name 'Kale Nel Finalization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'v772: remove public residue and polish homepage'
          git push origin HEAD:${GITHUB_HEAD_REF}
