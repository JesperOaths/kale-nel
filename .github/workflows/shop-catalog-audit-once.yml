name: Shop catalog audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shop-catalog-audit-once.yml'

permissions:
  contents: read

jobs:
  audit-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare upstream catalog to public projection
        shell: bash
        run: |
          set -euo pipefail
          url='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828?diagnostic=1&catalog_audit=1'
          status="$(curl --silent --show-error --max-time 35 --output /tmp/catalog-audit.json --write-out '%{http_code}' "$url" || true)"
          echo "HTTP=$status"
          jq '{ok,mode,stage,envTokenConfigured,shopCount,catalogAudit,elapsedMs}' /tmp/catalog-audit.json || cat /tmp/catalog-audit.json
