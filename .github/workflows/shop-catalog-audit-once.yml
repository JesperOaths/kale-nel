name: Shop catalog audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shop-catalog-audit-once.yml'

permissions:
  contents: read

jobs:
  audit-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect currently served public catalog
        shell: bash
        run: |
          set -euo pipefail
          base='https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/shop-catalog-v828'
          status="$(curl --silent --show-error --max-time 20 --output /tmp/public.json --write-out '%{http_code}' "$base?inventory_probe=1" || true)"
          echo "HTTP=$status"
          cat /tmp/public.json
          echo
          jq '{source,catalogSelection,generatedAt,stale,refreshScheduled,lastError,error,productCount:(.products|length),names:(.products|map(.name)|sort)}' /tmp/public.json || true
