name: S9 manual SD and Drive folder links
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - 'ops/c720p/s9-native-security/deploy-manual-recording-links-v1.py'
      - 'ops/c720p/s9-native-security/test-manual-recording-links-v1.py'
      - '.github/workflows/c720p-s9-manual-recording-links.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - 'ops/c720p/s9-native-security/deploy-manual-recording-links-v1.py'
      - '.github/workflows/c720p-s9-manual-recording-links.yml'
permissions:
  contents: read
concurrency:
  group: s9-manual-folder-links-v1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify private manual link provenance, persistence and UI
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-manual-recording-links-v1.py
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py ops/c720p/s9-native-security/deploy-manual-recording-links-v1.py
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-people-v45.js
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy checksum-pinned backed-up C720P local metadata API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source='ops/c720p/s9-native-security/deploy-manual-recording-links-v1.py'
          script_sha="$(sha256sum "$source" | cut -d' ' -f1)"
          backend_sha="$(sha256sum ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py | cut -d' ' -f1)"
          proxy_sha="$(sha256sum ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py | cut -d' ' -f1)"
          dest="/tmp/s9-manual-links-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fSsL --max-time 35 '$uri' -o '$dest' && printf '%s  %s\n' '$script_sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA' --backend-sha '$backend_sha' --proxy-sha '$proxy_sha'"
          idem="s9-manual-sd-drive-links-${GITHUB_SHA:0:21}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-manual-sd-drive-links','deployment',:'cmd',260,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_MANUAL_CLIP_LINKS_JOB=$id"
          for i in $(seq 1 75); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done\|* || "$status" == error\|* || "$status" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 9000)"
              echo "$output"
              [[ "$status" == 'done|0' ]]
              grep -q 'S9_MANUAL_CLIP_LINKS_DEPLOY_VERIFIED' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          exit 1
