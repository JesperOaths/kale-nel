name: C720P legacy Camera Clips migrated playback safety
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/patch-c720p-legacy-s9-migrated-player-v1.py'
      - 'ops/c720p/security-runtime/test-patch-c720p-legacy-s9-migrated-player-v1.py'
      - '.github/workflows/c720p-legacy-s9-player.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/patch-c720p-legacy-s9-migrated-player-v1.py'
permissions:
  contents: read
jobs:
  legacy-and-migrated:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 ops/c720p/security-runtime/test-patch-c720p-legacy-s9-migrated-player-v1.py
          python3 -m py_compile ops/c720p/security-runtime/patch-c720p-legacy-s9-migrated-player-v1.py
          echo C720P_MIGRATED_PLAYER_LOCAL_FEATURE_PRESERVATION_PASS
