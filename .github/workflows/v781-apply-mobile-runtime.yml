name: v781 apply mobile and runtime fixes

on:
  pull_request:
    paths:
      - 'scripts/apply-v781-mobile-runtime-fixes.mjs'
      - 'scripts/verify-v781-mobile-local.mjs'
      - 'check-mobile-touch-runtime-v781.mjs'
      - '.github/workflows/v781-apply-mobile-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic v781 patch
        run: node scripts/apply-v781-mobile-runtime-fixes.mjs
      - name: Verify permanent regressions and zero-write state
        run: |
          node check-mobile-touch-runtime-v781.mjs
          node check-rendered-accessibility-v780.mjs
          node check-keyboard-focus-accessibility-v779.mjs
          npm run verify
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          git -c core.whitespace=cr-at-eol diff --check
      - name: Install temporary mobile Chromium tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local candidate server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v781-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/VERSION && break; sleep 0.25; done
      - name: Rendered mobile proof on patched candidate
        run: node scripts/verify-v781-mobile-local.mjs
      - name: Remove one-time audit/builder/browser machinery and commit permanent v781 release
        shell: bash
        run: |
          rm -f scripts/audit-mobile-touch-v781.mjs
          rm -f scripts/apply-v781-mobile-runtime-fixes.mjs
          rm -f scripts/verify-v781-mobile-local.mjs
          rm -f .github/workflows/v781-mobile-touch-audit.yml
          rm -f .github/workflows/v781-apply-mobile-runtime.yml
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'fix: mobile runtime and touch targets v781'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
