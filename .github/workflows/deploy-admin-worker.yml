name: Deploy admin Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_ADMIN_WORKER to publish the protected admin Worker and assets'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kalenel-admin-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRMATION_INPUT: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out dispatched main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Validate explicit deployment approval and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_INPUT" != "DEPLOY_ADMIN_WORKER" ]]; then
            echo "Refusing deployment: confirmation must equal DEPLOY_ADMIN_WORKER." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Refusing deployment: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured as GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Build protected static asset bundle
        run: node scripts/build-admin-worker-assets.mjs

      - name: Verify v826 Shop orders asset is in deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'cloudflare/workers/admin-gate/static';
          const page = `${base}/admin_shop_orders.html`;
          const manifestPath = `${base}/admin-worker-manifest.json`;
          if (!fs.existsSync(page)) throw new Error('admin_shop_orders.html missing from Worker asset bundle');
          const html = fs.readFileSync(page, 'utf8');
          if (!html.includes('v826')) throw new Error('Shop orders asset is not v826');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest.protected_entrypoints.includes('admin_shop_orders.html')) {
            throw new Error('admin_shop_orders.html missing from protected entrypoint manifest');
          }
          console.log(`Verified ${page} and protected manifest entry.`);
          NODE

      - name: Run admin Worker security tests
        run: node scripts/test-admin-worker-gate.mjs

      - name: Dry-run Worker packaging
        run: npx --yes wrangler@4.118.0 deploy --config cloudflare/workers/admin-gate/wrangler.toml --dry-run

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4.118.0 deploy --config cloudflare/workers/admin-gate/wrangler.toml

      - name: Verify live protected perimeter and OAuth entrypoint
        shell: bash
        run: |
          set -euo pipefail

          admin_url='https://admin.kalenel.nl/admin_shop_orders.html'
          apex_url='https://kalenel.nl/admin_shop_orders.html'
          login_url='https://admin.kalenel.nl/login?return_to=/admin_shop_orders.html'

          admin_headers="$(mktemp)"
          admin_body="$(mktemp)"
          admin_status="$(curl --silent --show-error --max-time 20 --dump-header "$admin_headers" --output "$admin_body" --write-out '%{http_code}' "$admin_url")"
          [[ "$admin_status" == '401' ]] || { echo "Expected protected admin page to return 401 anonymously, got $admin_status" >&2; cat "$admin_headers" >&2; exit 1; }
          grep -qi '^cache-control: no-store' "$admin_headers" || { echo 'Missing no-store on protected admin response' >&2; exit 1; }
          grep -qi 'Admin login vereist' "$admin_body" || { echo 'Protected admin login body missing' >&2; exit 1; }

          apex_headers="$(mktemp)"
          apex_status="$(curl --silent --show-error --max-time 20 --dump-header "$apex_headers" --output /dev/null --write-out '%{http_code}' "$apex_url")"
          [[ "$apex_status" == '302' ]] || { echo "Expected apex admin route to redirect, got $apex_status" >&2; cat "$apex_headers" >&2; exit 1; }
          grep -qi '^location: https://admin\.kalenel\.nl/admin_shop_orders\.html' "$apex_headers" || { echo 'Apex admin redirect target mismatch' >&2; cat "$apex_headers" >&2; exit 1; }

          login_headers="$(mktemp)"
          login_status="$(curl --silent --show-error --max-time 20 --dump-header "$login_headers" --output /dev/null --write-out '%{http_code}' "$login_url")"
          [[ "$login_status" == '302' ]] || { echo "Expected OAuth login start to return 302, got $login_status" >&2; cat "$login_headers" >&2; exit 1; }
          grep -qi '^location: https://github\.com/login/oauth/authorize' "$login_headers" || { echo 'GitHub OAuth entrypoint missing after deployment' >&2; cat "$login_headers" >&2; exit 1; }

          echo 'Protected v826 admin route, apex redirect, and OAuth entrypoint verified.'
