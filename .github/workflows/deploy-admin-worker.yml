name: Deploy admin Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_ADMIN_WORKER to publish the protected admin Worker and assets'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kalenel-admin-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRMATION_INPUT: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN_ONE || secrets.CLOUDFLARE_API_TOKEN_ONE || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out dispatched main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Validate explicit deployment approval and token
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION_INPUT" != "DEPLOY_ADMIN_WORKER" ]]; then
            echo "Refusing deployment: confirmation must equal DEPLOY_ADMIN_WORKER." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Refusing deployment: no supported Cloudflare API token secret is configured." >&2
            exit 1
          fi

      - name: Resolve Cloudflare account ID automatically
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Using configured Cloudflare account ID."
            exit 0
          fi

          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          accounts_json="$(curl --silent --show-error --fail --max-time 20 -H "$auth" "$api/accounts?per_page=50")" || accounts_json=''
          account_id="$(printf '%s' "$accounts_json" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              try {
                const j = JSON.parse(raw || "{}");
                const rows = Array.isArray(j.result) ? j.result.filter(x => /^[a-f0-9]{32}$/i.test(String(x?.id || ""))) : [];
                if (j.success === true && rows.length === 1) process.stdout.write(String(rows[0].id));
              } catch {}
            });
          ')"

          if [[ -z "$account_id" ]]; then
            memberships_json="$(curl --silent --show-error --fail --max-time 20 -H "$auth" "$api/memberships?status=accepted&per_page=50")" || memberships_json=''
            account_id="$(printf '%s' "$memberships_json" | node --input-type=module -e '
              let raw="";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                try {
                  const j = JSON.parse(raw || "{}");
                  const ids = [...new Set((Array.isArray(j.result) ? j.result : [])
                    .map(x => String(x?.account?.id || ""))
                    .filter(x => /^[a-f0-9]{32}$/i.test(x)))];
                  if (j.success === true && ids.length === 1) process.stdout.write(ids[0]);
                } catch {}
              });
            ')"
          fi

          if [[ ! "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "Could not uniquely resolve the Cloudflare account ID from the scoped token." >&2
            echo "The token must be scoped to one account and retain Account Settings Read or Memberships Read." >&2
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Resolved the Cloudflare account ID from the scoped API token."

      - name: Build protected static asset bundle
        run: node scripts/build-admin-worker-assets.mjs

      - name: Verify v827 shop admin assets are in deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'cloudflare/workers/admin-gate/static';
          const manifestPath = `${base}/admin-worker-manifest.json`;
          const pages = ['admin_shop_orders.html', 'admin_shop_connection.html'];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          for (const name of pages) {
            const page = `${base}/${name}`;
            if (!fs.existsSync(page)) throw new Error(`${name} missing from Worker asset bundle`);
            const html = fs.readFileSync(page, 'utf8');
            if (!html.includes('v827')) throw new Error(`${name} is not v827`);
            if (!manifest.protected_entrypoints.includes(name)) throw new Error(`${name} missing from protected entrypoint manifest`);
            console.log(`Verified ${page} and protected manifest entry.`);
          }
          NODE

      - name: Run admin Worker security tests
        run: node scripts/test-admin-worker-gate.mjs

      - name: Dry-run Worker packaging
        run: npx --yes wrangler@4.118.0 deploy --config cloudflare/workers/admin-gate/wrangler.toml --dry-run

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4.118.0 deploy --config cloudflare/workers/admin-gate/wrangler.toml

      - name: Verify live protected perimeter and OAuth entrypoint
        shell: bash
        run: |
          set -euo pipefail

          for path in admin_shop_orders.html admin_shop_connection.html; do
            admin_url="https://admin.kalenel.nl/${path}"
            admin_headers="$(mktemp)"
            admin_body="$(mktemp)"
            admin_status="$(curl --silent --show-error --max-time 20 --dump-header "$admin_headers" --output "$admin_body" --write-out '%{http_code}' "$admin_url")"
            [[ "$admin_status" == '401' ]] || { echo "Expected protected ${path} to return 401 anonymously, got $admin_status" >&2; cat "$admin_headers" >&2; exit 1; }
            grep -qi '^cache-control: no-store' "$admin_headers" || { echo "Missing no-store on ${path}" >&2; exit 1; }
            grep -qi 'Admin login vereist' "$admin_body" || { echo "Protected admin login body missing for ${path}" >&2; exit 1; }
          done

          apex_headers="$(mktemp)"
          apex_status="$(curl --silent --show-error --max-time 20 --dump-header "$apex_headers" --output /dev/null --write-out '%{http_code}' 'https://kalenel.nl/admin_shop_orders.html')"
          [[ "$apex_status" == '302' ]] || { echo "Expected apex admin route to redirect, got $apex_status" >&2; cat "$apex_headers" >&2; exit 1; }
          grep -qi '^location: https://admin\.kalenel\.nl/admin_shop_orders\.html' "$apex_headers" || { echo 'Apex admin redirect target mismatch' >&2; cat "$apex_headers" >&2; exit 1; }

          login_headers="$(mktemp)"
          login_status="$(curl --silent --show-error --max-time 20 --dump-header "$login_headers" --output /dev/null --write-out '%{http_code}' 'https://admin.kalenel.nl/login?return_to=/admin_shop_connection.html')"
          [[ "$login_status" == '302' ]] || { echo "Expected OAuth login start to return 302, got $login_status" >&2; cat "$login_headers" >&2; exit 1; }
          grep -qi '^location: https://github\.com/login/oauth/authorize' "$login_headers" || { echo 'GitHub OAuth entrypoint missing after deployment' >&2; cat "$login_headers" >&2; exit 1; }

          echo 'Protected v827 shop admin routes, apex redirect, and OAuth entrypoint verified.'
