name: S9 historical V28 archival person re-review
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/s9-historical-gpu-relay.py'
      - 'ops/c720p/s9-native-security/test-s9-historical-gpu-relay.py'
      - 'ops/c720p/s9-native-security/test-s9-historical-v28.py'
      - 'ops/c720p/s9-native-security/deploy-s9-history-42c-relay.py'
      - '.github/workflows/c720p-s9-historical-v28.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/s9-historical-gpu-relay.py'
      - 'ops/c720p/s9-native-security/test-s9-historical-v28.py'
      - 'ops/c720p/s9-native-security/deploy-s9-history-42c-relay.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate old archive contracts and additive V28 results
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/s9-historical-gpu-relay.py ops/c720p/s9-native-security/deploy-s9-history-42c-relay.py
          python3 ops/c720p/s9-native-security/test-s9-historical-gpu-relay.py
          python3 ops/c720p/s9-native-security/test-s9-historical-v28.py

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install client for existing authorized C720P command gateway
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'Management connection not configured'; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
      - name: Publish checksum-verified C720P relay without camera changes
        shell: bash
        run: |
          set -euo pipefail
          installer='ops/c720p/s9-native-security/deploy-s9-history-42c-relay.py'
          source='ops/c720p/s9-native-security/s9-historical-gpu-relay.py'
          installer_sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          source_sha="$(sha256sum "$source" | cut -d' ' -f1)"
          dest="/tmp/c720p-s9-history-42c-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/$GITHUB_SHA/$installer"
          cmd="curl -fSsL --max-time 45 '$uri' -o '$dest' && printf '%s  %s\n' '$installer_sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA' --sha256 '$source_sha'"
          idem="s9-history-42c-${GITHUB_SHA:0:22}-$GITHUB_RUN_ATTEMPT"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-history-42c','deployment',:'cmd',180,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_HISTORY_42C_JOB=$id"
          for n in $(seq 1 55); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 6000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_HISTORY_42C_RELAY_VERIFIED' <<< "$output" || exit 1
              exit 0
            fi
            sleep 6
          done
          echo 'Relay update not confirmed'
          exit 1
