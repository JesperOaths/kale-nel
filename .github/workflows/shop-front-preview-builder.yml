name: Shop front preview builder

on:
  push:
    branches:
      - fix/shop-front-previews-all
    paths:
      - '.github/scripts/build_shop_front_previews.py'
      - '.github/workflows/shop-front-preview-builder.yml'
      - 'shop/assets/product-previews/hydrangea-front.webp'
      - 'shop/assets/product-previews/axolotl-front.webp'
      - 'shop/assets/product-previews/mantis-front.webp'
      - 'shop/assets/product-previews/queen-annes-lace-front.webp'
      - 'shop/assets/product-previews/thistle-front.webp'
      - 'shop/assets/product-previews/jellyfish-front.webp'
      - 'shop/assets/product-previews/dragonfly-front-v2.webp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shop-front-previews-all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/scripts/build_shop_front_previews.py
      - name: Commit previews
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shop/assets/product-previews/*-front-v3.webp
          if git diff --cached --quiet; then
            echo 'No preview changes.'
            exit 0
          fi
          git commit -m 'Build tightly cropped shop front previews'
          git push origin HEAD:fix/shop-front-previews-all
