name: Security V60 Processing Coverage guarded UI-only release
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-people-v60-coverage.py'
      - '.github/workflows/security-people-v60-coverage-release.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-people-v60-coverage.py'
permissions:
  contents: read
concurrency:
  group: c720p-security-people-v60-coverage-guarded
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate deterministic V59 source patch and browser script syntax
        run: |
          set -euo pipefail
          script='ops/c720p/s9-native-security/deploy-security-people-v60-coverage.py'
          python3 -m py_compile "$script"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base='https://raw.githubusercontent.com/JesperOaths/kale-nel/eaf8a58f1c733dbc9109348725669917eab1bb5b/ops/c720p/s9-native-security'
          mkdir -p "$tmp/ops/c720p/s9-native-security"
          for file in security-people-v45.js security-people-v45.html test-people-v45.js; do
            curl -fSsL --retry 2 --max-time 35 "$base/$file" -o "$tmp/ops/c720p/s9-native-security/$file"
          done
          python3 - "$tmp/ops/c720p/s9-native-security/security-people-v45.js" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          p=Path('ops/c720p/s9-native-security/deploy-security-people-v60-coverage.py')
          spec=importlib.util.spec_from_file_location('s9_v60',p)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          src=Path(sys.argv[1]);old=src.read_bytes();new=module.patch_coverage(old)
          assert old!=new and b'faceFetchError' in new
          assert b'Unavailable \xc2\xb7 retry Refresh' in new
          assert b'function folderApprovedSDClips(' in new
          assert b'function manualLink(' in new
          assert b'/new/api/drive-saved' in new
          src.write_bytes(new)
          print('SECURITY_V60_SOURCE_CONTRACT_PASS')
          PY
          node --check "$tmp/ops/c720p/s9-native-security/security-people-v45.js"
          (cd "$tmp" && node ops/c720p/s9-native-security/test-people-v45.js)
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Backup, SHA pin and verify V60 UI without touching camera or reviews
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          src='ops/c720p/s9-native-security/deploy-security-people-v60-coverage.py'
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
          dest="/tmp/security-people-v60-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 35 '$uri' -o '$dest' && printf '%s  %s\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --dry-run && /usr/bin/python3 '$dest'"
          idem="security-people-v60-coverage-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-v60-coverage','deployment',:'cmd',250,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_PEOPLE_V60_JOB=$id"
          for i in $(seq 1 58); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 12000)"
              echo "$out"
              [[ "$status" == 'done|0' ]]
              grep -q 'SECURITY_PEOPLE_V60_UI_DRY_RUN_PASS' <<< "$out"
              grep -q 'SECURITY_PEOPLE_V60_UI_DEPLOY_VERIFIED' <<< "$out"
              exit 0
            fi
            sleep 4
          done
          exit 1
