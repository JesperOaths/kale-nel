name: S9 guarded seven-second production rollout contract
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/s9_7s_cool_rollout_v1.py'
      - 'ops/c720p/s9-native-security/test-s9-7s-cool-rollout-v1.py'
      - 'ops/c720p/s9-native-security/c720p-s9-native-seven-second-rollout-v1.service'
      - 'ops/c720p/s9-native-security/c720p-s9-native-seven-second-rollout-v1.timer'
      - '.github/workflows/s9-7s-guarded-cool-rollout.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/s9_7s_cool_rollout_v1.py'
      - 'ops/c720p/s9-native-security/test-s9-7s-cool-rollout-v1.py'
permissions:
  contents: read
jobs:
  no-media-no-unsafe-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate strict 4K idle/thermal and fail-closed rollback contract
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/s9_7s_cool_rollout_v1.py
          python3 ops/c720p/s9-native-security/test-s9-7s-cool-rollout-v1.py
          echo S9_7S_COOL_GATED_ROLLOUT_GUARDED
