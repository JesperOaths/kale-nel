name: v806 Family stale RPC diagnostic

on:
  push:
    branches: [proof/v806-final-certification-20260818]
    paths: ['.github/workflows/v806-family-stale-rpc-diagnostic-20260818.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEJAST_VISUAL_DB_NAME: postgres
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_EXACT_MAIN_SHA: 87fa814d28c00035b770c0ff8959def27a00f059
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v806-final-certification-20260818
          fetch-depth: 0
      - name: Record run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v806-family-stale-diagnostic-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v806-family-stale-diagnostic-run-id.txt
          git commit -m 'test: record v806 Family RPC diagnostic run id'
          git push origin HEAD:proof/v806-final-certification-20260818
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Prepare diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GEJAST_EXACT_MAIN_SHA"
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Provision Family diagnostic identity
        run: node scripts/full-live-visual-fixtures-v801.mjs provision
      - name: Trace get_public_state initiators
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v806-family-rpc-trace.mjs <<'JS'
          import { chromium } from 'playwright';
          const token=process.env.GEJAST_FAMILY_TOKEN||'';
          const familyName=process.env.GEJAST_FAMILY_NAME||'';
          const chrome=process.env.GEJAST_SYSTEM_CHROME||'';
          if(!token||!familyName||!chrome) throw new Error('diagnostic env missing');
          const browser=await chromium.launch({headless:true,executablePath:chrome});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          await context.addInitScript(({token})=>{localStorage.setItem('jas_session_token_v11',token);sessionStorage.setItem('jas_session_token_v11',token);},{token});
          const routes=['/familie/index.html','/familie/profiles.html',`/familie/player.html?player=${encodeURIComponent(familyName)}&scope=family`,'/familie/boerenbridge.html','/familie/scorer.html'];
          let staleTotal=0;
          try{
            for(const route of routes){
              const page=await context.newPage();
              const cdp=await context.newCDPSession(page);
              await cdp.send('Network.enable');
              let routeStale=0;
              cdp.on('Network.requestWillBeSent',evt=>{
                if(!evt.request.url.includes('/rest/v1/rpc/get_public_state')) return;
                staleTotal++; routeStale++;
                const stack=evt.initiator?.stack?.callFrames||[];
                console.log('STALE_RPC_TRACE '+JSON.stringify({route,url:evt.request.url,initiatorType:evt.initiator?.type||'',stack:stack.map(f=>({functionName:f.functionName,url:f.url,lineNumber:f.lineNumber,columnNumber:f.columnNumber}))}));
              });
              await page.goto('https://kalenel.nl'+route,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForFunction(()=>/login\.html/i.test(location.pathname)||document.documentElement.getAttribute('data-gejast-auth-state')==='authenticated',null,{timeout:25000});
              if(/login\.html/i.test(page.url())) throw new Error(route+' login redirect');
              await page.waitForTimeout(2500);
              console.log(`ROUTE_STALE_COUNT route=${route} count=${routeStale} final=${page.url()}`);
              await page.close();
            }
            console.log(`RESULT=V806_FAMILY_STALE_RPC_DIAGNOSTIC stale_total=${staleTotal}`);
          }finally{await context.close().catch(()=>{});await browser.close().catch(()=>{});}
          JS
          node /tmp/v806-family-rpc-trace.mjs
      - name: Cleanup diagnostic fixtures
        if: always()
        run: node scripts/full-live-visual-fixtures-v801.mjs cleanup
