name: v769a Ballroom safe-read preflight

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.pull_request.head.ref == 'agent/v770-ballroom-safe-read-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify SQL repair is read-only and narrowly scoped
        run: node check-ballroom-safe-read-repair-v769a.mjs
      - name: Reproduce current production Ballroom safe-read defect without mutation
        env:
          GEJAST_EXPECT_BALLROOM_BROKEN: '1'
        run: node check-live-ballroom-safe-read-v769a.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Confirm current site remains live v769
        env:
          GEJAST_EXPECTED_VERSION: v769
          GEJAST_DEPLOY_WAIT_SECONDS: '0'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
