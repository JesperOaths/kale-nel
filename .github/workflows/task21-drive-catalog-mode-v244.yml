name: Task21 tighten trusted Drive catalog metadata and re-inventory V244
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/repair-task21-drive-catalog-mode-v244.py'
      - 'ops/c720p/security-runtime/test-repair-task21-drive-catalog-mode-v244.py'
      - '.github/workflows/task21-drive-catalog-mode-v244.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/repair-task21-drive-catalog-mode-v244.py'
      - 'ops/c720p/security-runtime/test-repair-task21-drive-catalog-mode-v244.py'
      - '.github/workflows/task21-drive-catalog-mode-v244.yml'
permissions:
  contents: read
concurrency:
  group: task21-drive-catalog-mode-v244
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 "$d/test-repair-task21-drive-catalog-mode-v244.py"
          python3 "$d/test-audit-manual-digest-coverage-task21.py"
  physical:
    needs: safety
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Tighten only group-write metadata then inventory authoritative manual history
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/task21-drive-catalog-v244-${GITHUB_SHA:0:12}"
          cmd="umask 077 && install -d -m 700 '$stage'"
          for file in \
            ops/c720p/security-runtime/repair-task21-drive-catalog-mode-v244.py \
            ops/c720p/security-runtime/audit-manual-digest-coverage-task21.py; do
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$sha' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/repair-task21-drive-catalog-mode-v244.py' --apply && /usr/bin/python3 '$stage/audit-manual-digest-coverage-task21.py' --run"
          idem="task21-catalog-v244-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-task21-drive-mode-v244','deployment',:'cmd',180,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "TASK21_DRIVE_MODE_V244_JOB=$job"
          for n in $(seq 1 60); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 5800)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'TASK21_DRIVE_CATALOG_MODE_V244_VERIFIED' <<< "$output"
              grep -q '"drive_catalog_bytes_unchanged": true' <<< "$output"
              grep -q '"manual_reviews_not_modified": true' <<< "$output"
              grep -q 'SECURITY_MANUAL_DIGEST_INVENTORY_TASK21' <<< "$output"
              grep -q '"historical_digest_backfilled": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          exit 1
