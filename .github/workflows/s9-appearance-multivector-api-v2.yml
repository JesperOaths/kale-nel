name: S9 appearance multivector v2 read-only API guard
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_multivector_appearance_api_v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/deploy-s9-multivector-api-v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-multivector-api-v2.py'
      - '.github/workflows/s9-appearance-multivector-api-v2.yml'
  push:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_multivector_appearance_api_v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/deploy-s9-multivector-api-v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-multivector-api-v2.py'
      - '.github/workflows/s9-appearance-multivector-api-v2.yml'
permissions:
  contents: read
jobs:
  no-identity-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test read-only v2 source-qualified API and guarded proxy release
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_multivector_appearance_api_v2.py
          python3 -m py_compile "$root/deploy-s9-multivector-api-v2.py"
          python3 "$root/test-s9-multivector-api-v2.py"
          python3 - <<'PY'
          from pathlib import Path
          api=Path("ops/c720p/s9-person-ml-v1/s9_multivector_appearance_api_v2.py").read_text()
          deploy=Path("ops/c720p/s9-native-security/offline-worker/deploy-s9-multivector-api-v2.py").read_text()
          for term in ("rankings-v2.json","s9_uniform_upper_torso_hsv32_v2",
                       "people_assigned_automatically", "human_review_required",
                       "/new/api/appearance-multivector-v2"):
              assert term in api,term
          for term in ("S9_UNIFORM_MULTIVECTOR_API_V2_LIVE_VERIFIED",
                       "S9_UNIFORM_V2_API_ROLLED_BACK",
                       "v1_api_overwritten", "video_or_review_data_changed"):
              assert term in deploy,term
          for text in (api,deploy):
              for banned in ("pm install","am force-stop","automatic_person_assign(",
                             "delete_original","review/decide"):
                  assert banned not in text,banned
          print("S9_V2_READONLY_SOURCE_QUALIFIED_ENDPOINT_GUARD_PASS")
          PY
