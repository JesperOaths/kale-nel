name: v792 final account browser certification

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - '.github/workflows/final-certification-account-v792.yml'
      - 'scripts/final-cert-account-v792.mjs'

permissions:
  contents: read

concurrency:
  group: v792-final-account-browser-certification
  cancel-in-progress: false

jobs:
  account-browser:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_ACCOUNT_PIN: '4827'
      GEJAST_BROWSER_TIMEOUT_MS: '30000'
    steps:
      - name: Check out exact merged main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install deterministic system Chrome and database clients
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'SUPABASE_DB_URL missing'; exit 1; }
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'GitHub runner system Chrome missing'; exit 1; }
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          node --check scripts/final-cert-account-v792.mjs
          "$chrome" --version
          if grep -qE 'npx[[:space:]]+playwright[[:space:]]+install|playwright[[:space:]]+install[[:space:]]+--with-deps' .github/workflows/final-certification-account-v792.yml; then
            echo 'Unbounded Playwright browser download reintroduced.'
            exit 1
          fi
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          echo 'RESULT=V813_ACCOUNT_SYSTEM_CHROME_RUNTIME_PASS'

      - name: Use transaction pooler for short-lived CI SQL
        shell: bash
        run: |
          set -euo pipefail
          ci_db_url="$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            *".pooler.supabase.com:5432/"*)
              ci_db_url="${SUPABASE_DB_URL/:5432\//:6543/}"
              ;;
          esac
          test -n "$ci_db_url"
          echo "::add-mask::$ci_db_url"
          echo "SUPABASE_DB_URL=$ci_db_url" >> "$GITHUB_ENV"
          echo 'RESULT=V813_ACCOUNT_SHORT_LIVED_DB_POOL_READY'

      - name: Provision one randomized requestable identity only
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name="CertAccount_${suffix}"
          email="certaccount_${suffix}@example.invalid"
          echo "GEJAST_ACCOUNT_NAME=$name" >> "$GITHUB_ENV"
          echo "GEJAST_ACCOUNT_EMAIL=$email" >> "$GITHUB_ENV"

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v name="$name" <<'SQL'
          insert into public.gejast_account_names_v671(site_scope,display_name,status)
          values ('friends', :'name', 'available');
          SQL

      - name: Request account in live Chromium
        env:
          GEJAST_ACCOUNT_MODE: request
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-cert-account-v792.mjs

      - name: Assert request landed and create no-email activation fixture
        shell: bash
        run: |
          set -euo pipefail
          claim_count="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At \
            -v name="$GEJAST_ACCOUNT_NAME" -v email="$GEJAST_ACCOUNT_EMAIL" <<'SQL'
          select count(*)
          from public.gejast_account_claims_v671
          where display_name=:'name' and requester_email=:'email' and status='pending';
          SQL
          )"
          test "$claim_count" = '1'

          activation_token="v792-account-$(openssl rand -hex 32)"
          echo "::add-mask::$activation_token"
          echo "GEJAST_ACTIVATION_TOKEN=$activation_token" >> "$GITHUB_ENV"

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name="$GEJAST_ACCOUNT_NAME" -v email="$GEJAST_ACCOUNT_EMAIL" -v token="$activation_token" <<'SQL'
          begin;
          update public.gejast_account_claims_v671
             set status='approved',
                 activation_token_hash=public._gejast_v671_hash(:'token'),
                 activation_token_expires_at=now()+interval '30 minutes',
                 approved_at=now(),
                 updated_at=now()
           where display_name=:'name'
             and requester_email=:'email'
             and status='pending';
          update public.gejast_account_names_v671
             set status='claimed', updated_at=now()
           where site_scope='friends' and display_name=:'name';
          commit;
          SQL

          mail_count="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -v email="$GEJAST_ACCOUNT_EMAIL" <<'SQL'
          select count(*) from public.outbound_email_jobs
          where lower(coalesce(recipient_email,to_email,''))=lower(:'email');
          SQL
          )"
          test "$mail_count" = '0'

      - name: Activate, prove state, logout and fresh-login in live Chromium
        env:
          GEJAST_ACCOUNT_MODE: activate_login
        shell: bash
        run: |
          set -euo pipefail
          node scripts/final-cert-account-v792.mjs

      - name: Prove database bridge, PIN and session expiry semantics
        shell: bash
        run: |
          set -euo pipefail
          summary="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F'|' \
            -v name="$GEJAST_ACCOUNT_NAME" -v email="$GEJAST_ACCOUNT_EMAIL" -v pin="$GEJAST_ACCOUNT_PIN" <<'SQL'
          select
            (select count(*) from public.gejast_account_claims_v671 where display_name=:'name' and requester_email=:'email' and status='activated'),
            (select count(*) from public.gejast_account_players_v671 where display_name=:'name' and email=:'email' and activated_at is not null),
            (select count(*) from public.players where display_name=:'name' and active=true and approved=true and hidden_from_public=false and is_dummy=false and public._gejast_secret_matches_v691(:'pin',pin_hash)),
            (select count(*) from public.gejast_account_sessions_v671 s join public.gejast_account_players_v671 p on p.id=s.player_id where p.display_name=:'name'),
            (select count(*) from public.gejast_player_sessions_v746 s join public.players p on p.id=s.player_id where p.display_name=:'name'),
            (select count(*) from public.outbound_email_jobs where lower(coalesce(recipient_email,to_email,''))=lower(:'email'));
          SQL
          )"
          IFS='|' read -r claims account_players players account_sessions player_sessions mail_jobs <<< "$summary"
          test "$claims" = '1'
          test "$account_players" = '1'
          test "$players" = '1'
          test "$account_sessions" -ge 1
          test "$player_sessions" -ge 2
          test "$mail_jobs" = '0'

          expired_token="v792-expired-$(openssl rand -hex 24)"
          echo "::add-mask::$expired_token"
          expired_ok="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At \
            -v name="$GEJAST_ACCOUNT_NAME" -v token="$expired_token" <<'SQL'
          with p as (
            select id,display_name,site_scope from public.players where display_name=:'name' limit 1
          ), ins as (
            insert into public.gejast_player_sessions_v746(session_token,player_id,display_name,site_scope,expires_at)
            select :'token',id,display_name,site_scope,now()-interval '1 minute' from p
            returning 1
          )
          select coalesce((public.account_public_state_v687(session_token_input => :'token', site_scope_input => 'friends')->>'ok')::boolean,false)
          from ins;
          SQL
          )"
          test "$expired_ok" = 'f'
          echo 'ACCOUNT_DATABASE_BRIDGE_AND_EXPIRY_PASS'

      - name: Cleanup every disposable account artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_ACCOUNT_NAME:-}" ] || [ -z "${GEJAST_ACCOUNT_EMAIL:-}" ]; then
            echo 'Disposable account identity was never exported; nothing to clean.'
            exit 0
          fi

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name="$GEJAST_ACCOUNT_NAME" -v email="$GEJAST_ACCOUNT_EMAIL" <<'SQL'
          begin;
          delete from public.gejast_active_player_metadata_v679
           where lower(coalesce(player_name,''))=lower(:'name')
              or claim_id in (select id from public.gejast_account_claims_v671 where display_name=:'name' and requester_email=:'email');
          delete from public.account_identity_events
           where lower(coalesce(desired_name,''))=lower(:'name')
              or lower(coalesce(requester_email,''))=lower(:'email')
              or player_id in (select id from public.players where display_name=:'name');
          delete from public.gejast_player_sessions_v746
           where player_id in (select id from public.players where display_name=:'name')
              or display_name=:'name';
          delete from public.gejast_account_sessions_v671
           where player_id in (select id from public.gejast_account_players_v671 where display_name=:'name');
          delete from public.outbound_email_jobs
           where lower(coalesce(recipient_email,to_email,''))=lower(:'email');
          delete from public.players where display_name=:'name';
          delete from public.gejast_account_players_v671 where display_name=:'name' and lower(coalesce(email,''))=lower(:'email');
          delete from public.gejast_account_claims_v671 where display_name=:'name' and lower(requester_email)=lower(:'email');
          delete from public.gejast_account_names_v671 where display_name=:'name' and site_scope='friends';
          commit;
          SQL

          residue="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F'|' \
            -v name="$GEJAST_ACCOUNT_NAME" -v email="$GEJAST_ACCOUNT_EMAIL" <<'SQL'
          select
            (select count(*) from public.gejast_account_names_v671 where display_name=:'name'),
            (select count(*) from public.gejast_account_claims_v671 where display_name=:'name'),
            (select count(*) from public.gejast_account_players_v671 where display_name=:'name'),
            (select count(*) from public.players where display_name=:'name'),
            (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,''))=lower(:'name')),
            (select count(*) from public.outbound_email_jobs where lower(coalesce(recipient_email,to_email,''))=lower(:'email'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0'
          echo 'Disposable account certification cleanup PASS.'

      - name: Final account certification marker
        run: echo 'RESULT=V792_FINAL_ACCOUNT_CERTIFICATION_PASS'
