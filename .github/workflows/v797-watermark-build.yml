name: v797 watermark hardening build

on:
  push:
    branches: [agent/v797-watermark-separator-hardening]
    paths: ['.github/workflows/v797-watermark-build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v797-watermark-separator-hardening
          fetch-depth: 1
      - name: Build v797 deterministically
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function rep(path,from,to){const before=fs.readFileSync(path,'utf8');const after=before.replace(from,to);if(after===before)throw new Error(`${path}: replacement missing`);fs.writeFileSync(path,after);}
          fs.writeFileSync('VERSION','v797\n');
          rep('check-version-drift.mjs',"v\\d+\\s*[-–—.·]?\\s*Made by Bruis","v\\d+\\s*[^\\w\\r\\n<>]{0,12}\\s*Made by Bruis");
          rep('fix-version-drift.mjs',"/v(\\d+)\\s*[-–—.·]?\\s*Made by Bruis/gi","/v(\\d+)\\s*[^\\w\\r\\n<>]{0,12}\\s*Made by Bruis/gi");
          NODE
          node fix-version-drift.mjs
          node <<'NODE'
          const fs=require('fs');
          const beta=JSON.parse(fs.readFileSync('beta-readiness.json','utf8'));
          beta.site_version='release candidate v797 / live v796'; beta.last_updated='2026-08-16';
          if(beta.deployment_identity){beta.deployment_identity.live_version='v796';beta.deployment_identity.release_candidate_version='v797';}
          fs.writeFileSync('beta-readiness.json',JSON.stringify(beta,null,2)+'\n');
          const gameplay=JSON.parse(fs.readFileSync('gameplay-acceptance.json','utf8')); gameplay.site_version='v797'; gameplay.last_updated='2026-08-16'; fs.writeFileSync('gameplay-acceptance.json',JSON.stringify(gameplay,null,2)+'\n');
          const checklist=JSON.parse(fs.readFileSync('beta-live-write-checklist.json','utf8')); checklist.site_version='v797'; fs.writeFileSync('beta-live-write-checklist.json',JSON.stringify(checklist,null,2)+'\n');
          const cert=JSON.parse(fs.readFileSync('release-certification.json','utf8')); cert.current_version='v797'; cert.status='REVALIDATION_REQUIRED'; cert.current_audit_issue=153; cert.reason='v797 hardens visible watermark version synchronization after the exact-v796 feature proof exposed 14 active v757 fallback labels using an encoding-damaged question-mark separator that the prior drift checker/fixer did not recognize. The repair broadens separator matching, synchronizes all active frontend owners to v797, and requires fresh exact-main deployment/visual/feature revalidation before PASS. Gameplay owners are unchanged.'; fs.writeFileSync('release-certification.json',JSON.stringify(cert,null,2)+'\n');

          fs.writeFileSync('check-v797-watermark-separator-hardening.mjs',`#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\nconst version=fs.readFileSync('VERSION','utf8').trim();\nconst current=Number((version.match(/\\d+/)||['0'])[0]);\nassert.ok(current>=797,'v797 watermark separator contract requires VERSION v797 or newer');\nfor(const owner of ['check-version-drift.mjs','fix-version-drift.mjs']){const body=fs.readFileSync(owner,'utf8');assert(body.includes('[^\\\\w\\\\r\\\\n<>]{0,12}'),\`\${owner} must recognize arbitrary short punctuation/encoding-damaged watermark separators\`);}\nconst activeExt=new Set(['.html','.js','.mjs','.css']);\nconst ignoredDirs=new Set(['.git','node_modules','dist','build','.next','.vercel','coverage','tmp','temp','patch_bundles','repo','mnt']);\nconst ignoredFiles=new Set(['check-version-drift.mjs','fix-version-drift.mjs','check-v797-watermark-separator-hardening.mjs']);\nfunction walk(dir,out=[]){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){if(entry.isDirectory()){if(!ignoredDirs.has(entry.name))walk(path.join(dir,entry.name),out);}else out.push(path.join(dir,entry.name));}return out;}\nfunction archived(rel){const base=path.basename(rel);return (/^gejast-v\\d+-repair\\.js$/i.test(base)&&!base.toLowerCase().includes(version.toLowerCase()))||/^README_v\\d+/i.test(base)||/^PATCH_NOTES_v\\d+/i.test(base)||/^GEJAST_v\\d+/i.test(base);}\nconst stale=[]; const damaged=[];\nfor(const file of walk(process.cwd())){const rel=path.relative(process.cwd(),file).replaceAll('\\\\','/');if(archived(rel)||ignoredFiles.has(path.basename(file))||!activeExt.has(path.extname(file).toLowerCase()))continue;const text=fs.readFileSync(file,'utf8');for(const m of text.matchAll(/v(\\d+)\\s*([^\\w\\r\\n<>]{0,12})\\s*Made by Bruis/gi)){if(\`v\${m[1]}\`!==version && !(m[1]==='762' && ['admin.html','cloudflare/workers/admin-gate/static/admin.html','scripts/test-admin-static-assets-html-handling.mjs','scripts/test-admin-worker-gate.mjs'].includes(rel)))stale.push(\`\${rel}: \${m[0]}\`);if(/[?�]/.test(m[2]))damaged.push(\`\${rel}: \${m[0]}\`);}}\nassert.deepEqual(stale,[],\`stale active visible watermarks remain:\\n\${stale.join('\\n')}\`);\nassert.deepEqual(damaged,[],\`encoding-damaged watermark separators remain:\\n\${damaged.join('\\n')}\`);\nfor(const file of ['despimarkt.html','paardenrace.html','paardenrace_live.html','scorer.html','toepen.html','drinks_speed.html']){const body=fs.readFileSync(file,'utf8');assert(body.includes(\`\${version}  -  Made by Bruis\`),\`\${file} must carry normalized current fallback watermark\`);}\nconsole.log('v797 watermark separator hardening ok for',version);\n`);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const marker='node check-v796-published-versioned-html.mjs'; const next='node check-v797-watermark-separator-hardening.mjs'; if(!pkg.scripts['verify:static'].includes(next)){if(!pkg.scripts['verify:static'].includes(marker))throw new Error('v796 marker missing');pkg.scripts['verify:static']=pkg.scripts['verify:static'].replace(marker,`${marker} && ${next}`);} fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Commit v797 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize damaged visible version watermarks'
          git push origin HEAD:agent/v797-watermark-separator-hardening
