name: v805 Toepen v801a PostgREST proof

on:
  push:
    branches: [proof/v805-toepen-v801a-rest-20260818]
    paths: ['.github/workflows/v805-toepen-v801a-rest-proof.yml']

permissions:
  contents: write

concurrency:
  group: v805-toepen-v801a-rest-proof
  cancel-in-progress: false

jobs:
  toepen-v801a-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_EXACT_MAIN_SHA: b64a116f2b2684d1fbd475b40c2b76f569d40942
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: '-c statement_timeout=12000'
    steps:
      - name: Check out proof branch rooted at exact current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v805-toepen-v801a-rest-20260818
          fetch-depth: 0

      - name: Record proof run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s\n' "$GITHUB_RUN_ID" > .proof/v805-toepen-v801a-rest-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v805-toepen-v801a-rest-run-id.txt
          git commit -m 'test: record v801a PostgREST proof run id'
          git push origin HEAD:proof/v805-toepen-v801a-rest-20260818

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prove exact product tree and healthy public data plane
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v805'
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v805'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^(scripts/v805-toepen-v801a-rest-proof\.mjs|\.github/workflows/v805-toepen-v801a-rest-proof\.yml|\.proof/v805-toepen-v801a-rest-run-id\.txt)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof-branch product drift:'; echo "$unexpected"; exit 1; }
          GEJAST_DATA_PLANE_TIMEOUT_MS=10000 GEJAST_DATA_PLANE_ATTEMPTS=2 GEJAST_DATA_PLANE_RETRY_DELAY_MS=750 node check-live-data-plane.mjs
          node check-toepen-idempotency-owner-guard-v801a.mjs
          guard="$(timeout 15s psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          select (position('toepen_game_owner_mismatch' in pg_get_functiondef('public.create_toepen_game(text,jsonb,text)'::regprocedure)) > 0)::text;
          SQL
          )"
          test "$guard" = 'true'
          echo 'RESULT=V805_TOEPEN_V801A_EXACT_MAIN_AND_DEPLOYED_GUARD_PASS'

      - name: Provision hidden disposable Friends identities
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V805T801A_${suffix}"
          name2="V805T801B_${suffix}"
          client="v805-t801-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pin1='4826'; pin2='7314'
          echo "::add-mask::$pin1"; echo "::add-mask::$pin2"
          {
            echo "GEJAST_PLAYER1_NAME=$name1"
            echo "GEJAST_PLAYER2_NAME=$name2"
            echo "GEJAST_TOEPEN_CLIENT_ID=$client"
          } >> "$GITHUB_ENV"
          timeout 20s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v805-t801-a-'||lower(:'name1'),:'name1',true,'md5:'||md5(:'pin1'||':'||current_database()),true,true,true,'friends'),
            ('v805-t801-b-'||lower(:'name2'),:'name2',true,'md5:'||md5(:'pin2'||':'||current_database()),true,true,true,'friends');
          SQL
          sessions="$(timeout 20s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          select public.account_login_v687(:'name1',:'pin1','friends','{"proof":"v805-toepen-v801a-rest"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'name2',:'pin2','friends','{"proof":"v805-toepen-v801a-rest"}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ && "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"; echo "::add-mask::$token2"
          {
            echo "GEJAST_PLAYER1_TOKEN=$token1"
            echo "GEJAST_PLAYER2_TOKEN=$token2"
          } >> "$GITHUB_ENV"
          echo 'RESULT=V805_TOEPEN_V801A_REST_FIXTURES_PASS'

      - name: Prove owner guard through public PostgREST
        run: node scripts/v805-toepen-v801a-rest-proof.mjs

      - name: Cleanup controlled fixtures and prove zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ]; then echo 'No controlled identities were provisioned.'; exit 0; fi
          timeout 30s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" -v client="${GEJAST_TOEPEN_CLIENT_ID:-__none__}" <<'SQL'
          begin;
          delete from public.toepen_round_results where game_id in (select id from public.toepen_games where client_match_id=:'client');
          delete from public.toepen_rounds where game_id in (select id from public.toepen_games where client_match_id=:'client');
          delete from public.toepen_game_participants where game_id in (select id from public.toepen_games where client_match_id=:'client');
          delete from public.toepen_games where client_match_id=:'client';
          delete from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'));
          delete from public.gejast_player_sessions_v746 where player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.players where display_name in (:'n1',:'n2') and hidden_from_public=true and is_dummy=true;
          commit;
          SQL
          residue="$(timeout 20s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" -v client="${GEJAST_TOEPEN_CLIENT_ID:-__none__}" <<'SQL'
          select (select count(*) from public.players where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'))),
                 (select count(*) from public.toepen_games where client_match_id=:'client'),
                 (select count(*) from public.toepen_game_participants where game_id in (select id from public.toepen_games where client_match_id=:'client')),
                 (select count(*) from public.toepen_rounds where game_id in (select id from public.toepen_games where client_match_id=:'client')),
                 (select count(*) from public.toepen_round_results where game_id in (select id from public.toepen_games where client_match_id=:'client'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0|0'
          echo 'RESULT=V805_TOEPEN_V801A_REST_ZERO_RESIDUE_PASS'

      - name: Final marker
        run: echo 'RESULT=V805_TOEPEN_V801A_POSTGREST_PROOF_PASS'
