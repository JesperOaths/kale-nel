name: C720P recordings to S9+ microSD — verified import
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/c720p_to_s9_verified_media_stage_v2.py'
      - 'ops/c720p/security-runtime/test-c720p-to-s9-import-v2.py'
      - 'ops/c720p/s9-person-ml-v1/s9_c720p_imported_media_api_v1.py'
      - 'ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py'
      - 'ops/c720p/s9-native-security/security-review-v8.html'
      - '.github/workflows/c720p-to-s9-verified-import.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/c720p_to_s9_verified_media_stage_v2.py'
      - 'ops/c720p/security-runtime/test-c720p-to-s9-import-v2.py'
permissions:
  contents: read
jobs:
  audited-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/c720p_to_s9_verified_media_stage_v2.py ops/c720p/s9-person-ml-v1/s9_c720p_imported_media_api_v1.py ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py
          python3 ops/c720p/security-runtime/test-c720p-to-s9-import-v2.py
          echo C720P_TO_S9_SHA_VERIFIED_PRIVATE_IMPORT_SAFE
