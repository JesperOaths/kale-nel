name: v775 finalize live evidence

on:
  pull_request:
    paths:
      - 'scripts/finalize-v775-live-evidence.mjs'
      - '.github/workflows/v775-finalize-live-evidence.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Finalize v775 deployment evidence
        run: node scripts/finalize-v775-live-evidence.mjs
      - name: Verify evidence-only final state
        run: |
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          node check-public-surface-security-v775.mjs
          git config core.whitespace cr-at-eol
          git diff --check
      - name: Commit evidence-only state
        run: |
          git add -A
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v775a record live public-surface proof'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
