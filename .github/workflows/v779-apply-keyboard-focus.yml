name: v779 apply keyboard focus hardening

on:
  pull_request:
    paths:
      - 'scripts/apply-v779-keyboard-focus.mjs'
      - '.github/workflows/v779-apply-keyboard-focus.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic v779 patch
        run: node scripts/apply-v779-keyboard-focus.mjs
      - name: Verify v779 release candidate
        run: |
          node check-keyboard-focus-accessibility-v779.mjs
          node check-static-control-accessibility-v777.mjs
          node check-dynamic-control-accessibility-v778.mjs
          npm run verify
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          git -c core.whitespace=cr-at-eol diff --check
      - name: Remove one-time audit/builder machinery and commit permanent v779 release
        shell: bash
        run: |
          rm -f scripts/audit-keyboard-focus-v779.mjs
          rm -f scripts/apply-v779-keyboard-focus.mjs
          rm -f .github/workflows/v779-keyboard-focus-audit.yml
          rm -f .github/workflows/v779-apply-keyboard-focus.yml
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'accessibility: harden keyboard focus v779'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
