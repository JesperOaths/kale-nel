name: v771 post-merge live proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v771-postmerge-live-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Hardened live v771 deployment health
        env:
          GEJAST_EXPECTED_VERSION: v771
          GEJAST_DEPLOY_WAIT_SECONDS: '300'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: npm run smoke:live
      - name: Prove deployed Rad truthful nomination copy
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --retry 3 --retry-all-errors "https://kalenel.nl/rad.html?cb=${cb}" -o /tmp/rad.html
          grep -Fq 'id="submitNominationBtn" type="button">Kiezen</button>' /tmp/rad.html
          grep -Fq 'Uitdeel-opdracht gekozen voor ${target}.' /tmp/rad.html
          grep -Fq 'window.GEJAST_DRINKS_WORKFLOW.createDrinkEvent' /tmp/rad.html
          if grep -Fq 'id="submitNominationBtn" type="button">Opslaan</button>' /tmp/rad.html; then
            echo 'Old misleading Rad Opslaan button is still deployed.'
            exit 1
          fi
          if grep -Fq 'Uitdeel-opdracht opgeslagen voor ${target}.' /tmp/rad.html; then
            echo 'Old misleading Rad opgeslagen status is still deployed.'
            exit 1
          fi
          echo 'Deployed Rad v771 truthful nomination copy PASS.'
      - name: Current beta readiness report
        run: npm run beta:readiness
      - name: Push health without send
        run: npm run smoke:push
