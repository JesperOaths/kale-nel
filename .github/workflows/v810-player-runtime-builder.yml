name: v810 player runtime builder

on:
  push:
    branches: [agent/v810-player-runtime-overload]
    paths: ['.github/workflows/v810-player-runtime-builder.yml']

permissions:
  contents: write

concurrency:
  group: v810-player-runtime-builder
  cancel-in-progress: false

env:
  BASE_SHA: 6b2e28175aa07705945db42107cff112800864b7
  TARGET_BRANCH: agent/v810-player-runtime-overload

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v810-player-runtime-overload
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build exact v810 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^\.github/workflows/v810-player-runtime-builder\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected branch drift:'; echo "$unexpected"; exit 1; }
          printf 'v810\n' > VERSION
          python3 <<'PY'
          from pathlib import Path
          import json

          p=Path('gejast-home-profile-runtime.js')
          s=p.read_text()
          old="  async function loadPlayer(){ const p=new URLSearchParams(location.search).get('player')||''; if(!p) return null; const data=await rpc(RPC.player,{player_name_input:p,site_scope_input:scope()}); renderPlayer(data); return data; }"
          new="  async function loadPlayer(){ const p=new URLSearchParams(location.search).get('player')||''; if(!p) return null; const data=await rpc(RPC.player,{player_name_input:p,player_input:p,site_scope_input:scope()}); renderPlayer(data); return data; }"
          if old not in s: raise SystemExit('v810 player runtime patch target missing')
          p.write_text(s.replace(old,new,1))

          Path('check-v810-player-runtime-overload-disambiguation.mjs').write_text("""#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst version=fs.readFileSync('VERSION','utf8').trim();\nassert(Number(version.replace(/^v/i,''))>=810,'v810+ required');\nconst src=fs.readFileSync('gejast-home-profile-runtime.js','utf8');\nconst line=src.match(/async function loadPlayer\\(\\)\\{[^\\n]+/)?.[0]||'';\nassert(line.includes('player_name_input:p'),'player_name_input missing');\nassert(line.includes('player_input:p'),'explicit player_input is required to select the three-argument production overload');\nassert(line.includes('site_scope_input:scope()'),'site scope missing');\nassert(!line.includes('session_token_input'),'unsupported session token argument must not return');\nconsole.log('PASS v810 player runtime overload disambiguation');\n""")

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); script=data['scripts']['verify:static']
          anchor='node check-v809-runtime-rpc-contract-cleanup.mjs'; addition='node check-v810-player-runtime-overload-disambiguation.mjs'
          if addition not in script:
              if anchor not in script: raise SystemExit('v809 verify anchor missing')
              script=script.replace(anchor,anchor+' && '+addition)
          data['scripts']['verify:static']=script
          pkg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          cpath=Path('beta-live-write-checklist.json'); c=json.loads(cpath.read_text()); c['site_version']='v810'; cpath.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          gpath=Path('gameplay-acceptance.json'); g=json.loads(gpath.read_text()); g['site_version']='v810'; g['last_updated']='2026-08-18'; gpath.write_text(json.dumps(g,indent=2,ensure_ascii=False)+'\n')

          cert={
            'schema_version':1,'current_version':'v810','status':'REVALIDATION_REQUIRED',
            'previous_certified_version':'v808','previous_certified_product_sha':'7f6f7bc110807e85f52ff4d54927620dbbc9ffeb','previous_certified_release_branch':'release/v808-certified-20260818',
            'superseded_uncertified_version':'v809','superseded_uncertified_product_sha':'6b2e28175aa07705945db42107cff112800864b7',
            'reason':'v810 disambiguates the production get_player_runtime_bundle_v687 overload by sending player_name_input, player_input and site_scope_input explicitly. v809 browser proof showed the stale 404 families were removed but the two-argument player bundle call returned HTTP 300.',
            'remaining_release_blockers':['Fresh exact-current v810 live health must pass.','Authenticated browser proof must show get_player_runtime_bundle_v687 succeeds and the v809 repaired stale RPC families remain clean.','Fresh visual/runtime evidence and independent zero-residue cleanup are required before PASS.'],
            'required_next':['Merge only after canonical verification.','Run exact-current v810 health plus targeted authenticated RPC proof.','Run full authenticated visual audit and independently confirm zero controlled residue before certification.']
          }
          Path('release-certification.json').write_text(json.dumps(cert,indent=2,ensure_ascii=False)+'\n')

          rpath=Path('beta-readiness.json'); r=json.loads(rpath.read_text()); r['site_version']='release candidate v810 / live v809 / certified rollback v808'; r['last_updated']='2026-08-18'
          ident=r.setdefault('deployment_identity',{}); ident['status']='ready_to_test'; ident['live_version']='v809'; ident['release_candidate_version']='v810'; ident['frontend_release_merge']='6b2e28175aa07705945db42107cff112800864b7'; ident['repository_head_at_audit']='6b2e28175aa07705945db42107cff112800864b7'; ident['note']='v810 is a one-owner frontend follow-up over live v809. Exact-current v809 proof 32135584678 established zero calls to the three removed stale RPCs and successful canonical account/Drinks/announcement responses, while exposing HTTP 300 on the overloaded player runtime bundle. v810 sends the explicit third player_input argument to select the full production overload. Certified rollback remains v808.'
          ev='2026-08-18 v809 diagnostic run 32135584678: get_all_pending_drink_event_verifications_public=0, get_drink_event_vote_queue_public=0, get_public_state=0; account_public_state_v687=13 successful responses, get_drinks_page_public=4, get_player_site_announcements_scoped=6; get_player_runtime_bundle_v687 returned HTTP 300 because the two-argument payload matched two production overloads; cleanup PASS_ZERO.'
          evidence=ident.setdefault('evidence',[])
          if ev not in evidence: evidence.insert(0,ev)
          rpath.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          node fix-version-drift.mjs
          node check-v810-player-runtime-overload-disambiguation.mjs
          rm -f .github/workflows/v810-player-runtime-builder.yml
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: disambiguate player runtime overload v810'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'RESULT=V810_PLAYER_RUNTIME_BUILDER_PASS'
