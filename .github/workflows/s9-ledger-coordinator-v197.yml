name: S9 dualstore Save Delete coordinator V197 (host only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerCoordinatorV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerCoordinatorTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-ledger-coordinator-v197.py'
      - '.github/workflows/s9-ledger-coordinator-v197.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerCoordinatorV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerCoordinatorTestV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-ledger-coordinator-v197.py'
      - '.github/workflows/s9-ledger-coordinator-v197.yml'
permissions:
  contents: read
jobs:
  synthetic_only_no_phone_access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify serialized journal and private checkpoint synthetic crash recovery
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/test-s9-ledger-coordinator-v197.py"
          python3 "$d/test-s9-ledger-coordinator-v197.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          python3 "$d/test-s9-ledger-trusted-head-v195.py"
          python3 "$d/test-s9-migrated-ledger-v193.py"
