name: v770 Node24 app runtime proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prove-node24:
    if: github.event.pull_request.head.ref == 'agent/v770-node24-app-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: agent/v770-node24-app-runtime
          fetch-depth: 0
      - name: Set up application Node 24 LTS line
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Report runtime
        run: node --version && npm --version
      - name: Synchronize root lockfile engine metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package metadata missing');
          lock.packages[''].engines = { ...(lock.packages[''].engines || {}), node: '>=24' };
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Full repository verification
        run: npm run verify
      - name: Hardened live deployment smoke
        env:
          GEJAST_EXPECTED_VERSION: v766
          GEJAST_DEPLOY_WAIT_SECONDS: '0'
        run: npm run smoke:live
      - name: Beta read-only smoke
        run: npm run smoke:beta:read
      - name: Push health smoke without send
        run: npm run smoke:push
      - name: Commit lockfile metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile metadata change required.'
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "Refusing unexpected staged files: $changed"
            exit 1
          fi
          git commit -m "ci: synchronize Node24 lockfile engine policy"
          git push origin HEAD:agent/v770-node24-app-runtime
