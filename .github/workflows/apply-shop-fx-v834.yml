name: Apply shop USD EUR v834

"on":
  push:
    branches:
      - fix/shop-usd-eur-v834
    paths:
      - '.github/workflows/apply-shop-fx-v834.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Convert Printify USD amounts to EUR before pricing and routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              return s.replace(old, new, 1)

          # Catalog: convert Printify USD production cost before applying the €5 margin.
          path = Path('supabase/functions/shop-catalog-v828/index.ts')
          s = path.read_text(encoding='utf-8')
          s = replace_once(s,
              'import { createClient } from "npm:@supabase/supabase-js@2.57.4";\n',
              'import { createClient } from "npm:@supabase/supabase-js@2.57.4";\nimport { fxAuditSnapshot, resolveUsdEurRate, retailEurCentsFromUsdCost } from "../_shared/shop-fx.mjs";\n',
              'catalog fx import')
          s = replace_once(s,
              '''const MARGIN_CENTS = 500;\nconst retailEurosFromCost = (costCents: unknown) => {\n  const n = Number(costCents);\n  return Number.isFinite(n) && n > 0 ? Math.ceil((Math.round(n) + MARGIN_CENTS) / 100) : 0;\n};\n''',
              'const MARGIN_CENTS = 500;\n',
              'catalog raw-cost helper')
          s = replace_once(s, 'function publicProduct(product: any) {', 'function publicProduct(product: any, fx: any) {', 'catalog publicProduct signature')
          s = replace_once(s,
              '      price: retailEurosFromCost(variant?.cost),',
              '      price: retailEurCentsFromUsdCost(variant?.cost, fx, MARGIN_CENTS) / 100,',
              'catalog variant price')
          s = replace_once(s,
              '''async function buildCatalog(supabase: any) {\n  const token = await resolveToken(supabase);\n  const { shop, products } = await selectShopAndProducts(token);\n''',
              '''async function buildCatalog(supabase: any) {\n  const token = await resolveToken(supabase);\n  const fx = await resolveUsdEurRate(supabase);\n  const { shop, products } = await selectShopAndProducts(token);\n''',
              'catalog resolve FX')
          s = replace_once(s, '    .map(publicProduct)\n', '    .map((product: any) => publicProduct(product, fx))\n', 'catalog map with FX')
          s = replace_once(s,
              '''    generatedAt: new Date().toISOString(), source: "printify-direct-v832",\n    shop: { id: String(shop?.id || ""), salesChannel: text(shop?.sales_channel) }, products: cleanProducts,\n''',
              '''    generatedAt: new Date().toISOString(), source: "printify-direct-v832", fx: fxAuditSnapshot(fx),\n    shop: { id: String(shop?.id || ""), salesChannel: text(shop?.sales_channel) }, products: cleanProducts,\n''',
              'catalog FX audit')
          s = replace_once(s,
              '      marginEuros: MARGIN_CENTS / 100, rounding: "whole-euro-ceiling", artworkFirst: true,\n',
              '      marginEuros: MARGIN_CENTS / 100, rounding: "whole-euro-ceiling", sourceCurrency: "USD", displayCurrency: "EUR", fx: payload?.fx || null, artworkFirst: true,\n',
              'catalog health FX')
          path.write_text(s, encoding='utf-8')

          # Checkout: all scoring and charged amounts become EUR cents; raw USD is retained for audit.
          path = Path('supabase/functions/shop-manual-checkout-v832/index.ts')
          s = path.read_text(encoding='utf-8')
          s = replace_once(s,
              '} from "./fulfillment-routing.mjs";\n',
              '''} from "./fulfillment-routing.mjs";\nimport {\n  fxAuditSnapshot,\n  PRINTIFY_SOURCE_CURRENCY,\n  resolveUsdEurRate,\n  retailEurCentsFromUsdCost,\n  usdCentsToEurCents,\n} from "../_shared/shop-fx.mjs";\n''',
              'checkout fx import')
          s = replace_once(s,
              '''const MARGIN_CENTS = 500;\nconst retailCentsFromCost = (cost: unknown) => {\n  const n = Math.round(Number(cost));\n  return Number.isFinite(n) && n > 0 ? Math.ceil((n + MARGIN_CENTS) / 100) * 100 : 0;\n};\n''',
              'const MARGIN_CENTS = 500;\n',
              'checkout raw-cost helper')
          s = replace_once(s,
              '    const printifyToken = await resolvePrintifyToken(sb);\n',
              '    const printifyToken = await resolvePrintifyToken(sb);\n    const fx = await resolveUsdEurRate(sb);\n',
              'checkout resolve FX')
          s = replace_once(s,
              '      const unit = retailCentsFromCost(freshVariant?.cost);\n',
              '      const unit = retailEurCentsFromUsdCost(freshVariant?.cost, fx, MARGIN_CENTS);\n',
              'checkout retail conversion')
          s = replace_once(s,
              '''        quantity: qty,\n        cost_cents: Math.round(Number(freshVariant.cost)),\n        mapping_approval_id: "",\n''',
              '''        quantity: qty,\n        cost_cents: usdCentsToEurCents(freshVariant.cost, fx),\n        source_cost_cents: Math.round(Number(freshVariant.cost)),\n        source_currency: PRINTIFY_SOURCE_CURRENCY,\n        mapping_approval_id: "",\n''',
              'checkout source candidate conversion')
          s = replace_once(s,
              '''          quantity: qty,\n          cost_cents: validation.cost_cents,\n          mapping_approval_id: mapping.approval_id,\n''',
              '''          quantity: qty,\n          cost_cents: usdCentsToEurCents(validation.cost_cents, fx),\n          source_cost_cents: validation.cost_cents,\n          source_currency: PRINTIFY_SOURCE_CURRENCY,\n          mapping_approval_id: mapping.approval_id,\n''',
              'checkout mapped candidate conversion')
          s = replace_once(s,
              '''        const shipping = cheapestShippingQuote(quote);\n        if (shipping) quotedPlans.push({ plan, shipping, route_key: pfLineItems.map((item: any) => `${item.product_id}:${item.variant_id}`).join("|") });\n''',
              '''        const sourceShipping = cheapestShippingQuote(quote);\n        if (sourceShipping) {\n          const shipping = {\n            ...sourceShipping,\n            cents: usdCentsToEurCents(sourceShipping.cents, fx),\n            source_cents: sourceShipping.cents,\n            source_currency: PRINTIFY_SOURCE_CURRENCY,\n          };\n          quotedPlans.push({ plan, shipping, route_key: pfLineItems.map((item: any) => `${item.product_id}:${item.variant_id}`).join("|") });\n        }\n''',
              'checkout shipping conversion')
          s = replace_once(s,
              '''    const shippingCents = selected.shipping.cents;\n    const fulfillmentEstimatedImportCents''',
              '''    const shippingCents = selected.shipping.cents;\n    const shippingSourceCents = Math.max(0, Math.round(Number(selected.shipping.source_cents || 0)));\n    const fulfillmentEstimatedImportCents''',
              'checkout raw shipping audit')
          s = replace_once(s,
              '''      item.fulfillment_cost_cents = route.cost_cents;\n      item.fulfillment_estimated_import_cents_per_unit''',
              '''      item.fulfillment_cost_cents = route.cost_cents;\n      item.fulfillment_source_cost_cents = route.source_cost_cents;\n      item.fulfillment_source_currency = route.source_currency || PRINTIFY_SOURCE_CURRENCY;\n      item.fulfillment_estimated_import_cents_per_unit''',
              'checkout line-item FX audit')
          s = replace_once(s,
              '''      id: orderId, status: "pending", currency: "eur", subtotal_cents: subtotalCents, shipping_cents: shippingCents, tax_cents: 0, discount_cents: 0, total_cents: totalCents,\n      shipping_method: shippingMethod, shipping_method_code: shippingMethodCode, line_items: authoritative, shipping_address: addressTo,\n''',
              '''      id: orderId, status: "pending", currency: "eur", subtotal_cents: subtotalCents, shipping_cents: shippingCents, tax_cents: 0, discount_cents: 0, total_cents: totalCents,\n      shipping_method: shippingMethod, shipping_method_code: shippingMethodCode, shipping_source_currency: PRINTIFY_SOURCE_CURRENCY, shipping_source_cents: shippingSourceCents, fx_snapshot: fxAuditSnapshot(fx), line_items: authoritative, shipping_address: addressTo,\n''',
              'checkout order FX audit')
          path.write_text(s, encoding='utf-8')

          # Preview: same EUR scoring path as checkout, while retaining the raw USD quote.
          path = Path('supabase/functions/shop-delivery-preview-v833/index.ts')
          s = path.read_text(encoding='utf-8')
          s = replace_once(s,
              '} from "./fulfillment-routing.mjs";\n',
              '''} from "./fulfillment-routing.mjs";\nimport { fxAuditSnapshot, PRINTIFY_SOURCE_CURRENCY, resolveUsdEurRate, usdCentsToEurCents } from "../_shared/shop-fx.mjs";\n''',
              'preview fx import')
          s = replace_once(s,
              '    const printifyToken = await resolvePrintifyToken(sb);\n',
              '    const printifyToken = await resolvePrintifyToken(sb);\n    const fx = await resolveUsdEurRate(sb);\n',
              'preview resolve FX')
          s = replace_once(s,
              '''      const cost = Math.round(Number(freshVariant?.cost));\n      if (!Number.isFinite(cost) || cost <= 0) throw new Error(`Invalid authoritative production cost: ${clean(row.cached.product.name)}`);\n''',
              '''      const sourceCost = Math.round(Number(freshVariant?.cost));\n      if (!Number.isFinite(sourceCost) || sourceCost <= 0) throw new Error(`Invalid authoritative production cost: ${clean(row.cached.product.name)}`);\n      const cost = usdCentsToEurCents(sourceCost, fx);\n''',
              'preview source production conversion')
          s = replace_once(s,
              '''        quantity: qty,\n        cost_cents: cost,\n        mapping_approval_id: "",\n''',
              '''        quantity: qty,\n        cost_cents: cost,\n        source_cost_cents: sourceCost,\n        source_currency: PRINTIFY_SOURCE_CURRENCY,\n        mapping_approval_id: "",\n''',
              'preview source candidate audit')
          s = replace_once(s,
              '''          quantity: qty,\n          cost_cents: validation.cost_cents,\n          mapping_approval_id: mapping.approval_id,\n''',
              '''          quantity: qty,\n          cost_cents: usdCentsToEurCents(validation.cost_cents, fx),\n          source_cost_cents: validation.cost_cents,\n          source_currency: PRINTIFY_SOURCE_CURRENCY,\n          mapping_approval_id: mapping.approval_id,\n''',
              'preview mapped candidate conversion')
          s = replace_once(s,
              '''        const shipping = cheapestShippingQuote(quote);\n        if (shipping) quotedPlans.push({ plan, shipping, route_key: lineItems.map((item: any) => `${item.product_id}:${item.variant_id}`).join("|") });\n''',
              '''        const sourceShipping = cheapestShippingQuote(quote);\n        if (sourceShipping) {\n          const shipping = {\n            ...sourceShipping,\n            cents: usdCentsToEurCents(sourceShipping.cents, fx),\n            source_cents: sourceShipping.cents,\n            source_currency: PRINTIFY_SOURCE_CURRENCY,\n          };\n          quotedPlans.push({ plan, shipping, route_key: lineItems.map((item: any) => `${item.product_id}:${item.variant_id}`).join("|") });\n        }\n''',
              'preview shipping conversion')
          s = replace_once(s,
              '''      shipping_cents: selected.shipping.cents,\n      shipping_method: selected.shipping.name,\n''',
              '''      shipping_cents: selected.shipping.cents,\n      shipping_source_cents: Math.max(0, Math.round(Number(selected.shipping.source_cents || 0))),\n      shipping_source_currency: PRINTIFY_SOURCE_CURRENCY,\n      fx: fxAuditSnapshot(fx),\n      shipping_method: selected.shipping.name,\n''',
              'preview response FX audit')
          path.write_text(s, encoding='utf-8')

          # Static acceptance checks: prove conversion semantics and reject the old raw-cent pricing path.
          path = Path('check-shop-commerce-v817.mjs')
          s = path.read_text(encoding='utf-8')
          s = replace_once(s,
              "import crypto from 'node:crypto';\n",
              "import crypto from 'node:crypto';\nimport { parseEcbUsdRate, retailEurCentsFromUsdCost, usdCentsToEurCents } from './supabase/functions/_shared/shop-fx.mjs';\n",
              'checker FX imports')
          s = replace_once(s,
              "const catalogEdge = read('supabase/functions/shop-catalog-v828/index.ts');\n",
              "const catalogEdge = read('supabase/functions/shop-catalog-v828/index.ts');\nconst fxShared = read('supabase/functions/_shared/shop-fx.mjs');\n",
              'checker shared read')
          s = replace_once(s,
              "const directMigration = read('supabase/migrations/20260910183000_shop_printify_direct_v828.sql');\n",
              "const directMigration = read('supabase/migrations/20260910183000_shop_printify_direct_v828.sql');\nconst fxMigration = read('supabase/migrations/20260916014900_shop_usd_eur_fx_v834.sql');\n",
              'checker migration read')
          fx_block = '''// Printify API money fields are USD cents. Every customer-facing EUR amount and\n// every fulfillment score is converted server-side before the €5 margin or totals\n// are applied; raw USD source amounts and the exact FX snapshot remain auditable.\nconst ecbSample = parseEcbUsdRate("<Cube time='2026-09-15'><Cube currency='USD' rate='1.1539'/></Cube>");\nassert.equal(ecbSample.eur_usd, 1.1539);\nassert.equal(ecbSample.usd_eur, 0.8666262241);\nassert.equal(usdCentsToEurCents(1661, ecbSample.usd_eur), 1439);\nassert.equal(retailEurCentsFromUsdCost(1661, ecbSample.usd_eur, 500), 2000);\nassert.equal(usdCentsToEurCents(1039, ecbSample.usd_eur), 900);\nassert.match(fxShared, /shop_fx_rates/);\nassert.match(fxShared, /eurofxref-daily\\.xml/);\nassert.match(fxShared, /MAX_OBSERVED_AGE_MS/);\nassert.match(fxMigration, /fx_snapshot jsonb/);\nassert.match(fxMigration, /shipping_source_currency text/);\nassert.match(fxMigration, /shipping_source_cents integer/);\nassert.match(deliveryPreviewEdge, /usdCentsToEurCents/);\nassert.match(deliveryPreviewEdge, /shipping_source_cents/);\nassert.match(deliveryPreviewEdge, /fxAuditSnapshot/);\n\n'''
          anchor = '// Catalog pricing is derived from Printify fulfillment cost, not retail price:\n'
          if anchor not in s:
              raise SystemExit('missing patch anchor: checker FX block')
          s = s.replace(anchor, fx_block + anchor, 1)
          s = replace_once(s,
              '''assert.match(catalogEdge, /retailEurosFromCost/);\nassert.match(catalogEdge, /Math\\.ceil\\(\\(Math\\.round\\(n\\) \\+ MARGIN_CENTS\\) \\/ 100\\)/);\nassert.match(catalogEdge, /price:\\s*retailEurosFromCost\\(variant\\?\\.cost\\)/);\n''',
              '''assert.match(catalogEdge, /resolveUsdEurRate/);\nassert.match(catalogEdge, /retailEurCentsFromUsdCost/);\nassert.match(catalogEdge, /price:\\s*retailEurCentsFromUsdCost\\(variant\\?\\.cost, fx, MARGIN_CENTS\\) \\/ 100/);\nassert.match(catalogEdge, /sourceCurrency:\\s*"USD"/);\nassert.match(catalogEdge, /displayCurrency:\\s*"EUR"/);\n''',
              'checker catalog pricing assertions')
          s = replace_once(s,
              '''assert.match(checkoutEdge, /retailCentsFromCost/);\nassert.match(checkoutEdge, /Math\\.ceil\\(\\(n \\+ MARGIN_CENTS\\) \\/ 100\\) \\* 100/);\nassert.match(checkoutEdge, /retailCentsFromCost\\(freshVariant\\?\\.cost\\)/);\n''',
              '''assert.match(checkoutEdge, /resolveUsdEurRate/);\nassert.match(checkoutEdge, /retailEurCentsFromUsdCost/);\nassert.match(checkoutEdge, /retailEurCentsFromUsdCost\\(freshVariant\\?\\.cost, fx, MARGIN_CENTS\\)/);\nassert.match(checkoutEdge, /usdCentsToEurCents/);\nassert.match(checkoutEdge, /shipping_source_cents/);\nassert.match(checkoutEdge, /fx_snapshot:\\s*fxAuditSnapshot\\(fx\\)/);\n''',
              'checker checkout pricing assertions')
          path.write_text(s, encoding='utf-8')
          PY

          npm ci
          node --check supabase/functions/_shared/shop-fx.mjs
          node check-shop-commerce-v817.mjs
          npm run verify
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/shop-fx.mjs \
                  supabase/functions/shop-catalog-v828/index.ts \
                  supabase/functions/shop-manual-checkout-v832/index.ts \
                  supabase/functions/shop-delivery-preview-v833/index.ts \
                  supabase/migrations/20260916014900_shop_usd_eur_fx_v834.sql \
                  check-shop-commerce-v817.mjs
          git commit -m 'fix: convert Printify USD money to EUR before pricing'
          git push
