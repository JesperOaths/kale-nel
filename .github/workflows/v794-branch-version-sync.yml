name: v794 branch version sync

on:
  push:
    branches:
      - fix/v794-group-b-status-panel
    paths:
      - '.github/workflows/v794-branch-version-sync.yml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel'
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v794-group-b-status-panel
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Synchronize active frontend to v794
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 'v793'
          printf 'v794\n' > VERSION
          node fix-version-drift.mjs
          node - <<'NODE'
          const fs=require('fs');
          const certPath='release-certification.json';
          const state=JSON.parse(fs.readFileSync(certPath,'utf8'));
          if(state.current_version!=='v793') throw new Error(`Unexpected certification source version: ${state.current_version}`);
          state.current_version='v794';
          state.status='REVALIDATION_REQUIRED';
          state.prior_certification={version:'v792',issue:131,artifact:'final-acceptance-v792.json'};
          state.current_audit_issue=153;
          state.reason='Screenshot-driven group-B compatibility panel repair requires fresh production visual, feature-surface, and gameplay revalidation.';
          fs.writeFileSync(certPath,JSON.stringify(state,null,2)+'\n');

          const checklistPath='beta-live-write-checklist.json';
          const checklist=JSON.parse(fs.readFileSync(checklistPath,'utf8'));
          if(checklist.site_version!=='v793') throw new Error(`Unexpected live-write checklist source version: ${checklist.site_version}`);
          if(!Array.isArray(checklist.items) || checklist.items.length!==0) throw new Error('Live-write checklist must remain disarmed during version synchronization');
          checklist.site_version='v794';
          fs.writeFileSync(checklistPath,JSON.stringify(checklist,null,2)+'\n');

          const readinessPath='beta-readiness.json';
          const readiness=JSON.parse(fs.readFileSync(readinessPath,'utf8'));
          if(readiness.deployment_identity?.release_candidate_version!=='v793') throw new Error(`Unexpected readiness candidate: ${readiness.deployment_identity?.release_candidate_version}`);
          readiness.site_version='release candidate v794 / live v792';
          readiness.last_updated='2026-08-16';
          readiness.deployment_identity.release_candidate_version='v794';
          readiness.deployment_identity.evidence=Array.isArray(readiness.deployment_identity.evidence)?readiness.deployment_identity.evidence:[];
          readiness.deployment_identity.evidence.push('v794 candidate: screenshot inspection proved the visible Pikken/Paardenrace group-B status panel was interpreting the deployed v687-compat wrapper as the obsolete v661 totals shape; this release corrects that frontend interpretation and remains REVALIDATION_REQUIRED until post-deploy visual/game/feature proof.');
          fs.writeFileSync(readinessPath,JSON.stringify(readiness,null,2)+'\n');
          NODE
          node check-version-drift.mjs
          node check-release-certification-state.mjs

      - name: Verify synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify

      - name: Commit synchronized version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION release-certification.json beta-live-write-checklist.json beta-readiness.json '*.html' '*.js' '*.mjs' '*.css' ':!repo/**' ':!mnt/**' || true
          git add -u
          git diff --cached --quiet && { echo 'Expected v794 version changes were not produced'; exit 1; }
          git commit -m 'chore: synchronize active frontend to v794'
          git push origin HEAD:fix/v794-group-b-status-panel
