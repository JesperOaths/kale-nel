name: S9 dual-store SecretKey coordinator V200
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedCoordinatorSecretKeyTestV200.java'
      - '.github/workflows/s9-dualstore-keystore-compat-v200.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedDualStoreCommitV197.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedCoordinatorSecretKeyTestV200.java'
      - '.github/workflows/s9-dualstore-keystore-compat-v200.yml'
permissions:
  contents: read
jobs:
  compile-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Test synthetic Keystore signer route and retained safety
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          javac -source 8 -target 8 -d "$tmp" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedCoordinatorSecretKeyTestV200.java"
          java -cp "$tmp" nl.kalenel.s9offline.S9MigratedCoordinatorSecretKeyTestV200
          python3 "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-migrated-ledger-v193.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          echo S9_COORDINATOR_V200_HOST_PARITY_PASSED
      - name: Compile and convert all production Java to Android API 28 DEX
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/classes" "$tmp/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$tmp/classes" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedDualStoreCommitV197.java"
          "$d8" --min-api 28 --output "$tmp/dex" $(find "$tmp/classes" -name '*.class' -print)
          test -s "$tmp/dex/classes.dex"
          echo S9_COORDINATOR_V200_ANDROID_DEX_SOURCE_READY
