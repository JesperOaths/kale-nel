name: Live deployment health

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Read expected deployed version
        shell: bash
        run: echo "GEJAST_EXPECTED_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Verify deployed public and admin surfaces
        env:
          GEJAST_DEPLOY_WAIT_SECONDS: '240'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: node check-live-routes.mjs
      - name: Verify live Shopify shop catalog
        env:
          GEJAST_SHOP_TIMEOUT_MS: '15000'
          GEJAST_SHOP_MIN_PRODUCTS: '20'
        run: node check-live-shop.mjs
      - name: Verify live admin GitHub OAuth outer boundary
        env:
          GEJAST_ADMIN_AUTH_TIMEOUT_MS: '15000'
        run: node check-live-admin-auth-boundary.mjs
      - name: Verify Supabase auth data-plane liveness
        id: data_plane
        continue-on-error: true
        env:
          GEJAST_DATA_PLANE_TIMEOUT_MS: '10000'
          GEJAST_DATA_PLANE_ATTEMPTS: '2'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '750'
        run: node check-live-data-plane.mjs
      - name: Run primary read-only beta acceptance
        if: always() && (steps.data_plane.outcome == 'success' || steps.data_plane.outcome == 'failure')
        env:
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
        run: node check-beta-readonly-surfaces.mjs
      - name: Run extended read-only beta acceptance
        if: always() && (steps.data_plane.outcome == 'success' || steps.data_plane.outcome == 'failure')
        env:
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
        run: node check-beta-readonly-extended.mjs
      - name: Record live beta performance probe
        if: always() && (steps.data_plane.outcome == 'success' || steps.data_plane.outcome == 'failure')
        env:
          GEJAST_PERF_TIMEOUT_MS: '20000'
        run: node check-beta-performance.mjs
      - name: Enforce Supabase auth data-plane health
        if: always() && steps.data_plane.outcome == 'failure'
        shell: bash
        run: |
          echo 'DATA_PLANE_HEALTH_ENFORCEMENT_FAIL read-only auth probe failed; see Verify Supabase auth data-plane liveness above.'
          exit 1
