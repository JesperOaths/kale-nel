name: C720P migrated S9 verified playback authenticated relay V143
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-migrated-auth-relay-v143.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-migrated-auth-relay-v143.py'
      - '.github/workflows/c720p-migrated-auth-relay-v143.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-migrated-auth-relay-v143.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-migrated-auth-relay-v143.py'
      - '.github/workflows/c720p-migrated-auth-relay-v143.yml'
permissions:
  contents: read
concurrency:
  group: c720p-migrated-auth-relay-v143
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exact authenticated routes, range safety and no media mutations
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/deploy-c720p-migrated-auth-relay-v143.py"
          python3 "$d/test-deploy-c720p-migrated-auth-relay-v143.py"
          python3 "$d/test-c720p-to-s9-import-v2.py"
          python3 "$d/test-deploy-c720p-legacy-bridges-v133.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify existing S9 Range then deploy exact missing authorized 8794 routes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          file="ops/c720p/security-runtime/deploy-c720p-migrated-auth-relay-v143.py"
          hash="$(sha256sum "$file" | cut -d' ' -f1)"
          stage="/tmp/s9-c720p-migrated-auth-v143-${GITHUB_SHA:0:15}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
          cmd="curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$hash' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' && /usr/bin/python3 '$stage' --apply"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-migrated-auth-v143-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-migrated-auth-v143','deployment',:'cmd',490,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "C720P_MIGRATED_AUTH_V143_JOB=$id"
          for i in $(seq 1 157); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3600)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_MIGRATED_AUTH_V143_PREFLIGHT' <<< "$output"
              grep -q 'C720P_MIGRATED_AUTH_V143_VERIFIED' <<< "$output"
              grep -q '"bounded_range_206": true' <<< "$output"
              grep -q '"range_hash_equal_to_s9_proxy": true' <<< "$output"
              grep -q '"videos_modified": false' <<< "$output"
              grep -q '"camera_apk_modified": false' <<< "$output"
              grep -q '"manual_reviews_modified": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Authenticated migrated-media relay physical verification timed out";exit 1
