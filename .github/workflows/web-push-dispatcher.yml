name: GEJAST web push dispatcher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate a targeted queued job without sending; requeues it after validation.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      require_explicit_target:
        description: 'Require WEB_PUSH_TARGET_SUBSCRIPTION_ID before processing jobs.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_subscription_id:
        description: 'Explicit target web_push_subscriptions.id for controlled test sends.'
        required: false
        default: ''
      max_jobs:
        description: 'Maximum jobs to process. Use 1 for targeted proofs.'
        required: false
        default: '25'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: gejast-web-push-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dispatcher dependencies
        run: npm ci

      - name: Run dispatcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
          WEB_PUSH_WORKER_ID: github-actions-dispatcher
          WEB_PUSH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          WEB_PUSH_REQUIRE_EXPLICIT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.require_explicit_target || 'false' }}
          WEB_PUSH_TARGET_SUBSCRIPTION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_subscription_id || '' }}
          WEB_PUSH_MAX_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_jobs || '25' }}
        run: node web_push_dispatcher.js
