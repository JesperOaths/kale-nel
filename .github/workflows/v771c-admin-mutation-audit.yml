name: v771c admin mutation perimeter proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v771c-admin-mutation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v771c-admin-mutation-audit
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Inventory admin mutation contracts
        run: node scripts/audit-admin-mutations-v771c.mjs
      - name: Verify permanent admin mutation perimeter
        run: node check-admin-mutation-perimeter-v771c.mjs
      - name: Consolidate readiness after passing perimeter proof
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply-v771c-admin-readiness.mjs ]; then
            node scripts/apply-v771c-admin-readiness.mjs
            rm scripts/apply-v771c-admin-readiness.mjs
          else
            echo 'Admin readiness consolidation already applied.'
          fi
      - name: Full repository verification
        run: npm run verify
      - name: Current readiness report
        run: npm run beta:readiness
      - name: Extended protected-admin read proof
        run: npm run smoke:beta:extended
      - name: Live v771 health
        env:
          GEJAST_EXPECTED_VERSION: v771
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
      - name: Commit expected ordinary files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta-readiness.json beta-live-write-checklist.json check-beta-readiness-current-v770d.mjs check-live-write-safety-v770e.mjs
          git add -u scripts/apply-v771c-admin-readiness.mjs
          if git diff --cached --quiet; then
            echo 'No ordinary readiness changes to commit.'
            exit 0
          fi
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(beta-readiness\.json|beta-live-write-checklist\.json|check-beta-readiness-current-v770d\.mjs|check-live-write-safety-v770e\.mjs|scripts/apply-v771c-admin-readiness\.mjs)$' || true)"
          if [ -n "$bad" ]; then echo "Unexpected staged files:"; echo "$bad"; exit 1; fi
          git commit -m "v771c retire broad admin mutation beta blocker"
          git push origin HEAD:agent/v771c-admin-mutation-audit
