name: v794 synchronize frontend version markers

on:
  push:
    branches:
      - fix/v794-klaverjas-public-surface-cleanup
    paths:
      - '.github/workflows/v794-sync-version-markers.yml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v794-klaverjas-public-surface-cleanup
          fetch-depth: 0
      - name: Synchronize active frontend markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 'v794'
          node fix-version-drift.mjs
          node check-version-drift.mjs
          if git diff --quiet; then
            echo 'No version-marker changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: synchronize v794 frontend version markers'
          git push origin HEAD:fix/v794-klaverjas-public-surface-cleanup
