name: S9 native face quality evidence - read only
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/audit-face-quality-local-v1.py'
      - 'ops/c720p/s9-native-security/test-face-quality-local-v1.py'
      - '.github/workflows/c720p-s9-face-quality-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/audit-face-quality-local-v1.py'
      - '.github/workflows/c720p-s9-face-quality-readonly.yml'
permissions:
  contents: read
concurrency:
  group: s9-face-quality-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test no-export metadata and image-quality analysis
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-face-quality-local-v1.py
          python3 -m py_compile ops/c720p/s9-native-security/audit-face-quality-local-v1.py
  audit:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Request a bounded in-memory audit on C720P using an existing CV2 venv
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source='ops/c720p/s9-native-security/audit-face-quality-local-v1.py'
          sha="$(sha256sum "$source" | cut -d' ' -f1)"
          dest="/tmp/s9-face-quality-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fSsL --max-time 35 '$uri' -o '$dest' && printf '%s  %s\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /home/jespern/c720p-home-hub/person-detector/venv/bin/python '$dest'"
          idem="s9-face-quality-inmem-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-face-quality','diagnostic',:'cmd',540,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_FACE_QUALITY_READONLY_JOB=$id"
          for i in $(seq 1 115); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done\|* || "$status" == error\|* || "$status" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              echo "$output"
              [[ "$status" == 'done|0' ]]
              grep -q 'S9_FACE_SOURCE_QUALITY_AUDIT' <<< "$output"
              exit 0
            fi
            sleep 5
          done
          echo 'Read-only image-quality audit timed out.'
          exit 1
