name: v805 Supabase connection recycle

on:
  push:
    branches:
      - proof/v805-current-recovery
    paths:
      - .github/workflows/v805-supabase-connection-recycle.yml

permissions:
  contents: read

jobs:
  recycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_DATA_PLANE_TIMEOUT_MS: 10000
      GEJAST_DATA_PLANE_ATTEMPTS: 2
      GEJAST_DATA_PLANE_RETRY_DELAY_MS: 750
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify database secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'SUPABASE_DB_URL missing'; exit 1; }

      - name: Install PostgreSQL client if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Pre-recycle database probe
        shell: bash
        run: |
          set -euo pipefail
          PGCONNECT_TIMEOUT=10 timeout 20s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -c "select now() as checked_at, current_database() as database, current_user as user_name;"

      - name: Recycle client backends
        shell: bash
        run: |
          set -euo pipefail
          PGCONNECT_TIMEOUT=10 timeout 20s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -c "select count(*) as terminated_client_backends from pg_stat_activity a where a.pid <> pg_backend_pid() and a.backend_type = 'client backend' and pg_terminate_backend(a.pid);"

      - name: Allow services to reconnect
        run: sleep 8

      - name: Post-recycle database probe
        shell: bash
        run: |
          set -euo pipefail
          PGCONNECT_TIMEOUT=10 timeout 20s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -c "select now() as checked_at, current_database() as database, current_user as user_name;"

      - name: Verify public auth data plane
        shell: bash
        run: node check-live-data-plane.mjs
