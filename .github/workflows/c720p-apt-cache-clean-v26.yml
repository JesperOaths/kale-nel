name: C720P guarded APT cache reclaim for face V26
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/clean-apt-cache-face-v26.py'
      - '.github/workflows/c720p-apt-cache-clean-v26.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/clean-apt-cache-face-v26.py'
      - '.github/workflows/c720p-apt-cache-clean-v26.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/s9-native-security/clean-apt-cache-face-v26.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/clean-apt-cache-face-v26.py').read_text()
          for x in ('apt-get","clean','cached_deb_allocated_mib','native_camera_not_healthy',
                    'installed_packages_changed','"sudo","-n"','camera_post'):
              assert x in s,x
          for bad in ('autoremove','full-upgrade','apt-get","remove','shutil.rmtree','path.unlink('):
              assert bad not in s,bad
          print('SAFE_APT_CACHE_ONLY_TESTS_PASS')
          PY
  reclaim:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; fi
          src='ops/c720p/s9-native-security/clean-apt-cache-face-v26.py'
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          tmp="/tmp/apt-cache-safe-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${tmp}' && printf '%s  %s\\n' '${sha}' '${tmp}' | sha256sum -c - >/dev/null && python3 '${tmp}' --apply"
          idem="c720p-safe-apt-v26-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-apt-disposable-cache','maintenance',:'cmd',180,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "APT_RECLAIM_JOB=$id"
          for i in $(seq 1 40); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 9000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_FACE_V26_APT_RECLAIM' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
