name: Build v801 visual audit authenticated contexts

on:
  push:
    branches: [test/v801-visual-audit-auth-context]
    paths: ['.github/workflows/build-v801-visual-audit-auth-context.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: test/v801-visual-audit-auth-context
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Patch and verify permanent visual-audit runner
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/patch-v801-visual-audit-auth.py
          node --check scripts/full-live-visual-audit-v792.mjs
          grep -q "contextual authenticated capture ended at login" scripts/full-live-visual-audit-v792.mjs
          grep -q "context__index__authenticated" scripts/full-live-visual-audit-v792.mjs
          grep -q "context__family__index" scripts/full-live-visual-audit-v792.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/full-live-visual-audit-v792.mjs
          git commit -m 'test: authenticate full visual audit contexts'
          git push origin HEAD:test/v801-visual-audit-auth-context
