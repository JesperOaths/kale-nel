name: Repair and retry US phone shipping v840

"on":
  push:
    branches:
      - fix/us-phone-shipping-v840
    paths:
      - '.github/workflows/retry-us-phone-shipping-v840.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Repair stale v839 live-check expectation and retrigger patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-us-phone-shipping-v840.yml')
          s = path.read_text(encoding='utf-8')
          needle = "          s = replace_once(s, 'assert.match(index, /20260916-delivery-v833-r2/);', 'assert.match(index, /20260916-delivery-v840-r1/);', 'checker delivery token')\n"
          addition = needle + "          s = replace_once(s, 'assert.match(liveShopCheck, /20260916-delivery-v833-r2/);', 'assert.match(liveShopCheck, /20260916-delivery-v840-r1/);', 'checker live delivery token')\n"
          if 'checker live delivery token' not in s:
              if needle not in s:
                  raise SystemExit('missing workflow anchor for live delivery token repair')
              s = s.replace(needle, addition, 1)
              path.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-us-phone-shipping-v840.yml
          if git diff --cached --quiet; then
            echo 'Repair already present.'
            exit 0
          fi
          git commit -m 'ci: repair v840 live delivery assertion'
          git push
