name: v789 full gameplay playtest

on:
  push:
    branches:
      - 'agent/v789-full-site-gameplay-playtest'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Permanent verification first
        run: npm run verify
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v789-http.log 2>&1 &
          echo $! >/tmp/v789-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/VERSION >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v789-http.log
          exit 1
      - name: Playtest all playable surfaces without production writes
        env:
          V789_BASE_URL: http://127.0.0.1:4173
        run: node scripts/v789-full-gameplay-playtest.mjs
      - name: Prove repository stayed clean
        run: |
          git diff --check
          git status --short
