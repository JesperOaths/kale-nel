name: S9 signed TLS time witness V234 (no clocks changed)
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9_signed_time_witness_v234.py'
      - 'ops/c720p/security-runtime/test-s9-signed-time-witness-v234.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9TrustedClockBridgeTestV234.java'
      - '.github/workflows/s9-signed-tls-time-witness-v234.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9_signed_time_witness_v234.py'
      - 'ops/c720p/security-runtime/test-s9-signed-time-witness-v234.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9TrustedClockBridgeTestV234.java'
      - '.github/workflows/s9-signed-tls-time-witness-v234.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-tls-clock-v234
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Prove independent time witnesses and V198 HMAC/TLL without auth bypass
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/s9_signed_time_witness_v234.py" "$d/test-s9-signed-time-witness-v234.py"
          python3 "$d/test-s9-signed-time-witness-v234.py"
          python3 "$d/test-audit-c720p-signed-action-clock-v226.py"
  physical:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bounded read-only C720P HTTPS time witness with native 4K guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          d="ops/c720p/security-runtime"
          file="s9_signed_time_witness_v234.py"
          stage="/tmp/c720p-s9-time-witness-v234-${GITHUB_SHA:0:12}.py"
          digest="$(sha256sum "$d/$file" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$d/$file"
          cmd="curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$digest' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-s9-verified-clock-v234-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-tls-time-witness-v234','diagnostic',:'cmd',120,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_TIME_WITNESS_V234_JOB=$job"
          for i in $(seq 1 100); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3200)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_SIGNED_TIME_WITNESS_V234' <<< "$output"
              grep -q '"status":"independent_tls_witness_verified"' <<< "$output"
              grep -q '"read_only":true' <<< "$output"
              grep -q '"hub_clock_repaired":false' <<< "$output"
              grep -q '"future_production_signing_enabled":false' <<< "$output"
              grep -q '"camera_dropped_frames_after":0' <<< "$output"
              grep -q '"private_secrets_accessed":false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Time witness not proven";exit 1
