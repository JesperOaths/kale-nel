name: v776 apply account journey polish

on:
  pull_request:
    paths:
      - 'scripts/apply-v776-account-journey-polish.mjs'
      - '.github/workflows/v776-apply-account-journey-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Apply deterministic v776 polish
        run: node scripts/apply-v776-account-journey-polish.mjs
      - name: Verify release candidate
        run: |
          node check-account-journey-polish-v776.mjs
          npm run verify
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          git -c core.whitespace=cr-at-eol diff --check
      - name: Remove one-time audit/builder machinery and commit permanent v776 release
        shell: bash
        run: |
          rm -f scripts/audit-final-product-ux-v776.mjs
          rm -f .github/workflows/v776-final-product-acceptance-audit.yml
          rm -f scripts/apply-v776-account-journey-polish.mjs
          rm -f .github/workflows/v776-apply-account-journey-polish.yml
          rm -rf node_modules
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'release: polish account journey accessibility v776'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
