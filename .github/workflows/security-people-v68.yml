name: Security people multi-person filing V68
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py'
      - 'ops/c720p/s9-native-security/test-people-v45.js'
      - 'ops/c720p/s9-native-security/test-manual-recording-links-v1.py'
      - 'ops/c720p/s9-native-security/*people-v68.py'
      - '.github/workflows/security-people-v68.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-people-v68.py'
      - '.github/workflows/security-people-v68.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate multi-identity selections and guarded deployment
        run: |
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-people-v45.js
          python3 ops/c720p/s9-native-security/test-manual-recording-links-v1.py
          python3 ops/c720p/s9-native-security/test-security-people-v68.py
          python3 -m py_compile ops/c720p/s9-native-security/deploy-security-people-v68.py ops/c720p/s9-person-ml-v1/s9_manual_recording_links.py
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: c720p-security-people-v68
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy guarded source-qualified multi-person filing with read-only verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security'
          staging="/tmp/security-people-v68-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$staging'"
          for script in deploy-security-people-v68.py deploy-security-drive-person-v66.py deploy-security-filing-v65.py security-step4-cdp-safe.py; do
            src="$root/$script"
            dig="$(sha256sum "$src" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
            cmd="$cmd && curl -fSsL --max-time 40 '$url' -o '$staging/$script' && printf '%s  %s\\n' '$dig' '$staging/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && python3 '$staging/deploy-security-people-v68.py' --ref '${GITHUB_SHA}' && python3 '$staging/deploy-security-people-v68.py' --ref '${GITHUB_SHA}' --apply"
          idem="security-people-v68-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-people-v68','deployment',:'cmd',480,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_PEOPLE_V68_JOB=$id"
          for i in $(seq 1 110); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 14000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 5000)"
              echo "$out"
              if [[ "$status" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'PEOPLE_V68_DEPLOY_VERIFIED' <<< "$out"
              grep -q '"review_files_unchanged": true' <<< "$out"
              exit 0
            fi
            sleep 4
          done
          exit 1
