name: v787 live production closure proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Permanent v787 repository verification
        run: npm run verify
      - name: Hardened public v787 route suite
        env:
          GEJAST_EXPECTED_VERSION: v787
          GEJAST_SMOKE_RETRIES: 8
        run: npm run smoke:live
      - name: Read-only beta surfaces
        run: |
          npm run smoke:beta:read
          npm run smoke:beta:extended
      - name: Live performance budgets
        run: npm run smoke:beta:perf
      - name: Install temporary Firefox and WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps firefox webkit
      - name: Prove live v787 Family aliases
        run: node scripts/v787-live-family-alias-proof.mjs
