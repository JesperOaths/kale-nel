name: v770d beta readiness audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/v770d-beta-readiness-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Current tracked beta readiness
        run: npm run beta:readiness
      - name: Base beta read-only surfaces
        run: npm run smoke:beta:read
      - name: Extended beta read-only surfaces
        run: npm run smoke:beta:extended
      - name: Beta performance report
        env:
          GEJAST_PERF_FAIL_ON_BUDGET: '0'
        run: npm run smoke:beta:perf
      - name: Hardened live deployment health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
