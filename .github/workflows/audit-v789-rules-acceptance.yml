name: audit v789 rules acceptance

on:
  push:
    branches:
      - 'agent/full-gameplay-acceptance-v789'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Permanent verification first
        run: npm run verify
      - name: Install isolated browsers
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Build isolated fixture
        run: |
          rm -rf /tmp/kalenel-audit-site
          mkdir -p /tmp/kalenel-audit-site
          tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C /tmp/kalenel-audit-site
          cat > /tmp/kalenel-audit-site/gejast-home-gate.js <<'EOF'
          (function(){
            try {
              document.documentElement.classList.remove('gejast-auth-pending');
              document.documentElement.classList.add('gejast-auth-ready');
              if (document.body) {
                document.body.classList.remove('boot-pending');
                document.body.classList.remove('page-loading');
              }
            } catch (_) {}
            window.GEJAST_HOME_GATE = { audit: true };
          })();
          EOF
          cat >> /tmp/kalenel-audit-site/gejast-config.js <<'EOF'
          ;(function(){
            window.GEJAST_CONFIG = window.GEJAST_CONFIG || {};
            window.GEJAST_CONFIG.requireMatchEntrySession = function(){ return true; };
            window.GEJAST_CONFIG.ensurePlayerSessionOrRedirect = function(){ return true; };
            window.GEJAST_CONFIG.requirePlayerSession = function(){ return true; };
          })();
          EOF
      - name: Start isolated local site
        run: |
          cd /tmp/kalenel-audit-site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kalenel-audit-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/VERSION >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kalenel-audit-http.log
          exit 1
      - name: Core gameplay acceptance
        id: core_gameplay
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/audit-v789-core-gameplay.mjs
      - name: Deep Pikken and Paardenrace acceptance
        id: deep_rules
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/audit-v789-rules-acceptance.mjs
      - name: Beurs Balzaal and Drinks Speed acceptance
        id: extra_systems
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/audit-v789-extra-systems.mjs
      - name: Enforce acceptance results
        if: always()
        run: |
          test "${{ steps.core_gameplay.outcome }}" = "success" || { echo "Core gameplay acceptance failed"; exit 1; }
          test "${{ steps.deep_rules.outcome }}" = "success" || { echo "Deep rules acceptance failed"; exit 1; }
          test "${{ steps.extra_systems.outcome }}" = "success" || { echo "Extra systems acceptance failed"; exit 1; }
      - name: Prove repository stayed clean
        if: always()
        run: |
          git diff --check
          git status --short
