name: S9 native archive catalog client
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/phone_archive_catalog_v1.py'
      - 'ops/c720p/security-runtime/test-phone-archive-catalog-v1.py'
      - 'ops/c720p/s9-native-security/src/nl/kalenel/s9security/PhoneArchiveCatalog.java'
      - 'ops/c720p/s9-native-security/fast-recent-s9-clip-index.py'
      - 'ops/c720p/s9-person-ml-v1/local-sd-catalog.py'
      - '.github/workflows/s9-phone-archive-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/phone_archive_catalog_v1.py'
      - 'ops/c720p/security-runtime/test-phone-archive-catalog-v1.py'
      - 'ops/c720p/s9-native-security/src/nl/kalenel/s9security/PhoneArchiveCatalog.java'
      - 'ops/c720p/s9-native-security/fast-recent-s9-clip-index.py'
      - 'ops/c720p/s9-person-ml-v1/local-sd-catalog.py'
      - '.github/workflows/s9-phone-archive-catalog.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 ops/c720p/security-runtime/test-phone-archive-catalog-v1.py
          python3 ops/c720p/s9-native-security/test-phone-native-media-range-proxy.py
          python3 -m compileall -q ops/c720p/security-runtime/phone_archive_catalog_v1.py ops/c720p/s9-person-ml-v1/local-sd-catalog.py ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py ops/c720p/s9-native-security/fast-recent-s9-clip-index.py
          bash -n ops/c720p/s9-native-security/fetch-source.sh
