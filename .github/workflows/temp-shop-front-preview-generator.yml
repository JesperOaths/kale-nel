name: TEMP shop front preview generator

on:
  push:
    branches:
      - fix/shop-front-preview-only
    paths:
      - scripts/generate-shop-front-previews.py
      - .github/workflows/temp-shop-front-preview-generator.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/shop-front-preview-only
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate front-only previews
        run: python scripts/generate-shop-front-previews.py
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/assets/product-previews/*-front.webp
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'Shop: generate front-only print previews'
          git push origin HEAD:fix/shop-front-preview-only
