name: Patch v793 gameplay metadata

on:
  push:
    branches:
      - fix/v793-visual-audit-repairs
    paths:
      - '.github/workflows/patch-v793-gameplay-metadata.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v793-visual-audit-repairs
      - name: Bind gameplay tracker to current release without changing evidence strength
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='gameplay-acceptance.json';
          const tracker=JSON.parse(fs.readFileSync(file,'utf8'));
          tracker.site_version='v793';
          tracker.last_updated='2026-08-16';
          fs.writeFileSync(file,JSON.stringify(tracker,null,2)+'\n');
          NODE
          node check-gameplay-acceptance-current.mjs
      - name: Commit gameplay metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameplay-acceptance.json
          git commit -m 'test: bind gameplay tracker to v793'
          git push origin HEAD:fix/v793-visual-audit-repairs
