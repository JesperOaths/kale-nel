name: Sync v803 candidate metadata

on:
  push:
    branches: [agent/v803-homepage-live-request-storm]
    paths: ['.github/workflows/v803-sync-candidate-metadata.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v803-homepage-live-request-storm
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize truthful v803 candidate state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path('beta-readiness.json')
          d=json.loads(p.read_text())
          d['site_version']='release candidate v803 / live v802'
          d['last_updated']='2026-08-17'
          dep=d.setdefault('deployment_identity',{})
          dep['release_candidate_version']='v803'
          dep['live_version']='v802'
          dep['note']=(
            'v803 release candidate: exact-v802 diagnostics proved gejast-config.js globally injects gejast-v725-repair.js, whose 1-second boot loop redundantly called get_homepage_live_state_public_scoped on authenticated index.html. '
            'v803 gives the canonical gejast-live-summary runtime ownership of homepage hydration and bounds the legacy fallback to at most one call; deterministic cadence regression reports canonical=0. '
            'Production remains live v802 until merge/deploy. Existing v802 live deployment health remains PASS, while exact-current authenticated visual/live-write revalidation is still blocked by the Supabase data-plane outage. SQL-only Toepen v801a remains permission-gated and undeployed.'
          )
          ev=dep.setdefault('evidence',[])
          new=[
            '2026-08-17 v803 candidate: exact-v802 homepage request cadence inventory run 31981237343 and legacy repair load-graph run 31981327145 proved the shipped one-second redundant homepage-live RPC owner; v803 regression requires zero legacy calls when canonical live-summary ownership is present.',
          ]
          for item in reversed(new):
            if item not in ev: ev.insert(0,item)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          p=Path('gameplay-acceptance.json')
          d=json.loads(p.read_text())
          d['site_version']='v803'
          d['last_updated']='2026-08-17'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          npm ci
          npm run verify || true
          git rm .github/workflows/v803-sync-candidate-metadata.yml
          git config user.name 'JesperOaths'
          git config user.email '150788310+JesperOaths@users.noreply.github.com'
          git add beta-readiness.json gameplay-acceptance.json
          git add -u
          git commit -m 'cert: synchronize v803 release candidate state'
          git push origin HEAD:agent/v803-homepage-live-request-storm
