name: One-shot v814 Web Push display ACK finalizer

on:
  push:
    branches:
      - agent/v814-web-push-display-ack

permissions:
  contents: write

concurrency:
  group: v814-web-push-display-ack-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Finalize v814 runtime and provenance
        run: node scripts/apply-v814-web-push-display-ack.mjs
      - name: Propagate v814 active-runtime version
        run: node fix-version-drift.mjs
      - name: Verify version consistency
        run: node check-version-drift.mjs
      - name: Verify final runtime and guard syntax
        run: |
          node --check web_push_dispatcher.js
          node --check gejast-sw.js
          node --check scripts/check-v814-web-push-display-ack.mjs
          node check-active-js-syntax.mjs
      - name: Remove one-shot builder machinery
        run: |
          rm scripts/apply-v814-web-push-display-ack.mjs
          rm .github/workflows/v814-web-push-display-ack-builder.yml
      - name: Verify permanent v814 lifecycle and provenance guard
        run: node scripts/check-v814-web-push-display-ack.mjs
      - name: Commit finalized v814 release branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v814 Web Push display ACK lifecycle'
          git push origin HEAD:agent/v814-web-push-display-ack
