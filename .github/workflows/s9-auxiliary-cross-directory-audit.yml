name: S9 auxiliary cross-directory read-only audit
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9-auxiliary-cross-directory-v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-cross-directory-v1.py'
      - '.github/workflows/s9-auxiliary-cross-directory-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9-auxiliary-cross-directory-v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-cross-directory-v1.py'
      - '.github/workflows/s9-auxiliary-cross-directory-audit.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate read-only role reconciliation
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/s9-auxiliary-cross-directory-v1.py
          python3 ops/c720p/security-runtime/test-s9-auxiliary-cross-directory-v1.py
          echo S9_AUXILIARY_CROSS_DIRECTORY_READ_ONLY_TESTS_PASS
