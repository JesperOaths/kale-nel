name: v816 one-time version sync

on:
  push:
    branches:
      - agent/v816-shopify-checkout

permissions:
  contents: write

concurrency:
  group: v816-version-sync
  cancel-in-progress: false

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/v816-shopify-checkout
      - name: Synchronize v816 references
        run: node fix-version-drift.mjs
      - name: Commit mechanical version sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No version drift to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v816: synchronize site-wide version references'
          git push origin HEAD:agent/v816-shopify-checkout
