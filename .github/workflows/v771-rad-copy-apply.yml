name: v771 Rad nomination copy apply

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v771-rad-nomination-truthful-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: agent/v771-rad-nomination-truthful-copy
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply narrow Rad UX fix
        run: node scripts/apply-v771-rad-nomination-copy.mjs
      - name: Synchronize active version/cache markers
        run: node fix-version-drift.mjs
      - name: Remove temporary ordinary generator
        run: rm scripts/apply-v771-rad-nomination-copy.mjs
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Full repository verification
        run: npm run verify
      - name: Current deployed v770 read-only health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
      - name: Commit generated v771 release safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add check-rad-local-nomination-copy-v771.mjs
          if git diff --cached --name-only | grep -q '^node_modules/'; then echo 'Refusing node_modules.'; exit 1; fi
          count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "Staged tracked release files=$count"
          if [ "$count" -gt 250 ]; then echo 'Refusing unexpectedly broad release diff.'; exit 1; fi
          git commit -m "v771 make Rad nomination copy truthful"
          git push origin HEAD:agent/v771-rad-nomination-truthful-copy
