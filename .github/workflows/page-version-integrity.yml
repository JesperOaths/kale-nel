name: Published page version integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - 'VERSION'
      - 'check-version-drift.mjs'
      - 'check-all-page-version-identity-v875.mjs'
      - 'check-all-published-page-versions.mjs'
      - 'scripts/published-page-inventory.mjs'
      - 'scripts/check-live-published-page-versions.mjs'
      - '.github/workflows/page-version-integrity.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - 'VERSION'
      - 'check-version-drift.mjs'
      - 'check-all-page-version-identity-v875.mjs'
      - 'check-all-published-page-versions.mjs'
      - 'scripts/published-page-inventory.mjs'
      - 'scripts/check-live-published-page-versions.mjs'
      - '.github/workflows/page-version-integrity.yml'

permissions:
  contents: read
  deployments: read

concurrency:
  group: page-version-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Verify repository page version ownership
        run: |
          set -euo pipefail
          node --check scripts/published-page-inventory.mjs
          node --check scripts/check-live-published-page-versions.mjs
          node --check check-version-drift.mjs
          node --check check-all-page-version-identity-v875.mjs
          node --check check-all-published-page-versions.mjs
          node check-version-drift.mjs
          node check-all-page-version-identity-v875.mjs
          node check-all-published-page-versions.mjs

      - name: Wait for exact main deployment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_version="$(tr -d '\r\n ' < VERSION)"
          deployed_sha=''
          deployment_state=''
          actual_version=''

          for i in $(seq 1 60); do
            deployments="$(curl -fsS --max-time 15               -H "Authorization: Bearer ${GH_TOKEN}"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" || true)"
            deployment_id="$(printf '%s' "$deployments" | node --input-type=module -e '
              let raw="";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data",c=>raw+=c);
              process.stdin.on("end",()=>{
                try {
                  const rows=JSON.parse(raw||"[]");
                  const hit=Array.isArray(rows)?rows.find(x=>String(x?.sha||"")===process.env.GITHUB_SHA&&String(x?.environment||"")==="github-pages"):null;
                  if(hit?.id) process.stdout.write(String(hit.id));
                } catch {}
              });
            ')"

            if [ -n "$deployment_id" ]; then
              statuses="$(curl -fsS --max-time 15                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20" || true)"
              deployment_state="$(printf '%s' "$statuses" | node --input-type=module -e '
                let raw="";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data",c=>raw+=c);
                process.stdin.on("end",()=>{
                  try {
                    const rows=JSON.parse(raw||"[]");
                    if(Array.isArray(rows)&&rows[0]?.state) process.stdout.write(String(rows[0].state));
                  } catch {}
                });
              ')"
              if [ "$deployment_state" = 'success' ]; then
                deployed_sha="$GITHUB_SHA"
                break
              fi
              if [ "$deployment_state" = 'failure' ] || [ "$deployment_state" = 'error' ] || [ "$deployment_state" = 'inactive' ]; then
                echo "Exact GitHub Pages deployment reached terminal state: sha=$GITHUB_SHA state=$deployment_state" >&2
                exit 1
              fi
            fi
            if [ "$i" -lt 60 ]; then sleep 10; fi
          done

          if [ "$deployed_sha" != "$GITHUB_SHA" ]; then
            echo "Exact GitHub Pages deployment was not proven for tested SHA $GITHUB_SHA (last state: ${deployment_state:-absent})." >&2
            exit 1
          fi

          for i in $(seq 1 12); do
            actual_version="$(curl -fsS --max-time 10 "https://kalenel.nl/VERSION?version_integrity_run=${GITHUB_RUN_ID}&attempt=${i}&sha=${GITHUB_SHA}" 2>/dev/null | tr -d '\r\n ' || true)"
            if [ "$actual_version" = "$expected_version" ]; then
              echo "DEPLOYED_EXACT_SHA_PARITY sha=$GITHUB_SHA deployment_state=$deployment_state version=$actual_version attempt=$i"
              exit 0
            fi
            if [ "$i" -lt 12 ]; then sleep 5; fi
          done
          echo "Exact deployment succeeded but live VERSION did not match: expected=$expected_version actual=${actual_version:-unavailable}" >&2
          exit 1

      - name: Verify every deployed page route version
        if: github.event_name != 'pull_request'
        env:
          GEJAST_BASE_URL: https://kalenel.nl/
          GEJAST_LIVE_VERSION_CONCURRENCY: '12'
          GEJAST_LIVE_VERSION_TIMEOUT_MS: '15000'
        run: node scripts/check-live-published-page-versions.mjs
