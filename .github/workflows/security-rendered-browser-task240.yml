name: Authenticated Security rendered status polling video acceptance V240
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/smoke-security-rendered-system-playback-v240.py'
      - 'ops/c720p/security-runtime/test-smoke-security-rendered-browser-v240.py'
      - '.github/workflows/security-rendered-browser-task240.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/smoke-security-rendered-system-playback-v240.py'
      - 'ops/c720p/security-runtime/test-smoke-security-rendered-browser-v240.py'
      - '.github/workflows/security-rendered-browser-task240.yml'
permissions:
  contents: read
concurrency:
  group: security-rendered-browser-task240
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Syntax and strict authenticated browser result tests
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/smoke-security-rendered-system-playback-v240.py"
          python3 "$d/test-smoke-security-rendered-browser-v240.py"
          python3 "$d/test-smoke-c720p-legacy-jpeg-browser-v190.py"
          echo SECURITY_BROWSER_V240_SOURCE_ONLY_NO_UI_MUTATION
  physical:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bounded authenticated HA Chromium UI and one decoded video without Save Delete
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/security-v240-browser-${GITHUB_SHA:0:12}"
          cmd="umask 077 && install -d -m 700 '$stage'"
          for file in \
            "ops/c720p/security-runtime/smoke-security-rendered-system-playback-v240.py" \
            "ops/c720p/security-runtime/smoke-c720p-migrated-decoded-browser-v145.py"; do
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$sha' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/smoke-security-rendered-system-playback-v240.py' && /usr/bin/python3 '$stage/smoke-security-rendered-system-playback-v240.py' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="security-rendered-browser-v240-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-rendered-v240','diagnostic',:'cmd',360,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "SECURITY_RENDERED_V240_JOB=$job"
          for i in $(seq 1 125); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'SECURITY_SYSTEM_RENDERED_BROWSER_V240_VERIFIED' <<< "$output"
              grep -q '"actual_system_status_panels_verified": 2' <<< "$output"
              grep -q '"hidden_pane_health_fetch_count": 0' <<< "$output"
              grep -q '"one_video_play_pause_seek_verified": true' <<< "$output"
              grep -q '"authorized_206_range_bounded": true' <<< "$output"
              grep -q '"client_cache_refresh_across_release_not_tested": true' <<< "$output"
              grep -q '"camera_dropped_output_frames_after": 0' <<< "$output"
              grep -q '"all_migrations_media_or_reviews_unchanged": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Rendered Security browser acceptance incomplete";exit 1
