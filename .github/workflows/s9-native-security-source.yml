name: S9 Native Security Source Safety
on:
  pull_request:
    paths:
      - "ops/c720p/s9-native-security/**"
      - "ops/c720p/s9-person-ml-v1/s9_hub_playback.py"
      - "ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py"
      - ".github/workflows/s9-native-security-source.yml"
  push:
    paths:
      - "ops/c720p/s9-native-security/**"
      - "ops/c720p/s9-person-ml-v1/s9_hub_playback.py"
      - "ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py"
      - ".github/workflows/s9-native-security-source.yml"
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Shell syntax and source safety contracts
        run: |
          set -euo pipefail
          for file in ops/c720p/s9-native-security/*.sh; do bash -n "$file"; done
          python3 ops/c720p/s9-native-security/test_pipeline_contract.py
          python3 ops/c720p/s9-native-security/test-historical-event-categories.py
          python3 ops/c720p/s9-native-security/test-live-person-watch.py
          python3 ops/c720p/s9-native-security/test-native-camera-controls.py
          python3 ops/c720p/s9-native-security/test-native-garden-phone-status.py
          python3 ops/c720p/s9-native-security/test-garden-realtime-priority.py
          python3 -m py_compile ops/c720p/s9-native-security/check-s9-garden-priority.py
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_phone_garden_status.py ops/c720p/s9-native-security/patch-native-garden-watch-ui.py
          python3 ops/c720p/s9-native-security/test-appearance-review.py
          python3 ops/c720p/s9-native-security/test-stage-verified-deployment.py
          python3 ops/c720p/s9-native-security/test-anonymous-index-ui.py
          python3 ops/c720p/s9-native-security/test-s9-face-review.py
          python3 ops/c720p/s9-native-security/test-s9-historical-gpu-relay.py
          python3 -m py_compile ops/c720p/s9-native-security/s9-historical-gpu-relay.py
          python3 ops/c720p/s9-native-security/test-s9-integrated-security-ui.py
          python3 ops/c720p/s9-native-security/test-s9-saved-video-orientation.py
          python3 ops/c720p/s9-native-security/test-s9-motion-dark-policy.py
          python3 ops/c720p/s9-native-security/test-garden-only-retention.py
          python3 ops/c720p/s9-native-security/test-adaptive-garden-archive-cadence.py
          python3 ops/c720p/s9-native-security/test-two-frame-deep-face.py
          python3 ops/c720p/s9-native-security/test-production-face-model-preservation.py
          python3 ops/c720p/s9-native-security/test-security-live-fetch-fallback.py
          python3 ops/c720p/s9-native-security/test-native-preview-8fps.py
          python3 ops/c720p/s9-native-security/test-async-preview-jpeg.py
          python3 ops/c720p/s9-native-security/test-phone-sensor-telemetry.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-security-sensor-timing-ui.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-security-live-8fps-display.py
          python3 ops/c720p/s9-native-security/test-security-saved-tab-date-nav.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-security-saved-tab-date-nav.py
          python3 ops/c720p/s9-native-security/test-security-date-category-folders.py
          python3 ops/c720p/s9-native-security/test-security-fallback-dated-stills.py
          python3 ops/c720p/s9-native-security/test-legacy-stills-optin-ui.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-security-fallback-dated-stills.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-security-live-fetch-fallback.py ops/c720p/s9-native-security/patch-security-date-category-folders.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-s9-saved-video-orientation.py
          python3 -m py_compile ops/c720p/s9-native-security/patch-s9-integrated-security-ui.py
          python3 -m py_compile ops/c720p/s9-native-security/deploy-anonymous-clips-index.py ops/c720p/s9-native-security/patch-anonymous-tracks-ui.py ops/c720p/s9-person-ml-v1/local-sd-catalog.py ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py
          python3 -m py_compile ops/c720p/s9-native-security/stage-verified-deployment.py
          python3 ops/c720p/s9-native-security/test-drive-person-batch-catalog.py
          python3 ops/c720p/s9-native-security/test-drive-visitor-review.py
          python3 -m py_compile ops/c720p/s9-native-security/s9_appearance_review.py
          python3 -m py_compile ops/c720p/s9-native-security/drive-person-batch-catalog.py ops/c720p/s9-person-ml-v1/s9_drive_visitor_review.py
          python3 - <<'PY'
          import importlib.util,re
          from pathlib import Path
          p=Path("ops/c720p/s9-native-security/patch-drive-visitor-review-ui.py")
          spec=importlib.util.spec_from_file_location("v",p)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          scripts=re.findall(r'<script[^>]+>(.*?)</script>',mod.SNIPPET,re.S)
          assert len(scripts)==1
          Path("/tmp/s9-drive-review-ui.js").write_text(scripts[0])
          PY
          node --check /tmp/s9-drive-review-ui.js
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_native_camera_controls.py ops/c720p/s9-native-security/patch-native-camera-controls-ui.py
          python3 -m py_compile ops/c720p/s9-native-security/legacy-drive-person-corpus.py ops/c720p/s9-native-security/live-person-watch.py ops/c720p/s9-native-security/patch-live-person-watch-ui.py
          python3 - <<'PY'
          import re
          import importlib.util
          from pathlib import Path
          p=Path("ops/c720p/s9-native-security/patch-live-person-watch-ui.py")
          spec=importlib.util.spec_from_file_location("s9_watch",p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          scripts=re.findall(r'<script[^>]+>(.*?)</script>',m.SNIPPET,re.S)
          assert len(scripts)==1
          Path("/tmp/s9-live-person-watch.js").write_text(scripts[0])
          PY
          node --check /tmp/s9-live-person-watch.js
          python3 - <<'PY'
          import importlib.util,re
          from pathlib import Path
          p=Path("ops/c720p/s9-native-security/patch-anonymous-tracks-ui.py")
          spec=importlib.util.spec_from_file_location("anon_panel",p)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          scripts=re.findall(r'<script[^>]+>(.*?)</script>',mod.SNIPPET,re.S)
          assert len(scripts)==1
          Path("/tmp/s9-anonymous-tracks.js").write_text(scripts[0])
          PY
          node --check /tmp/s9-anonymous-tracks.js
          python3 - <<'PY'
          import importlib.util,re
          from pathlib import Path
          p=Path("ops/c720p/s9-native-security/patch-s9-face-review-ui.py")
          spec=importlib.util.spec_from_file_location("s9_face_widget",p)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          js=re.findall(r'<script[^>]+>(.*?)</script>',mod.SNIPPET,re.S)
          assert len(js)==1
          Path("/tmp/s9-face-review.js").write_text(js[0])
          PY
          node --check /tmp/s9-face-review.js
      - name: Test smooth recorded playback and original byte ranges
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-hub-smooth-playback.py
          python3 ops/c720p/s9-native-security/test-phone-native-media-range-proxy.py
          python3 -m py_compile \
            ops/c720p/s9-person-ml-v1/s9_hub_playback.py \
            ops/c720p/s9-person-ml-v1/s9_sd_proxy_extension.py \
            ops/c720p/s9-native-security/patch-smooth-security-video.py \
            ops/c720p/s9-native-security/patch-smooth-live-relay.py
          node --check ops/c720p/s9-native-security/security-video-playback.js
          node --check ops/c720p/s9-native-security/test-smooth-security-video.cjs
      - name: Check smooth playback patch idempotence and authenticated routing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import re
          import subprocess
          import tempfile
          import urllib.parse
          from pathlib import Path

          root = Path("ops/c720p/s9-native-security")
          def load(filename):
              spec = importlib.util.spec_from_file_location(filename, root / filename)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          ui = load("patch-smooth-security-video.py")
          client = '<script src="/local/c720p-secure-relay-client.js"></script>'
          bodies = {
              "security": '<script>/* S9_SECURITY_LIVE_V4_AUTHENTICATED_MJPEG_FETCH_FALLBACK */async function streams(on){}function refreshPhoneBatteries(){}</script>',
              "home": '<script>function isOn(){return true}async function setSource(_kind,_url,badge,msg){}async function selectSource(){}</script>',
              "clips": '<video id="player" controls></video><script>const path="/new/saved/clip/test.mp4";</script>',
              "saved": '<video id="player" controls></video><script>const path="/new/saved/clip/test.mp4";</script>',
              "faces": '<div id="s9-faces-appearances-gallery-v1"></div><video id="player" controls></video><script>const client=window.parent.C720PSecureRelay;const path="/new/saved/clip/test.mp4";</script>',
          }
          with tempfile.TemporaryDirectory() as temporary:
              for kind, body in bodies.items():
                  before = "<html><head>" + ("" if kind == "faces" else client) + "</head><body>" + body + "</body></html>"
                  after = ui.patch(before, kind)
                  assert ui.patch(after, kind) == after, kind + " patch must be idempotent"
                  assert after.count(ui.SCRIPT) == 1, kind + " must load shared playback once"
                  for index, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', after, re.S)):
                      path = Path(temporary) / (kind + str(index) + ".js")
                      path.write_text(script)
                      subprocess.run(["node", "--check", str(path)], check=True)
              try:
                  ui.patch("<html><head></head><body></body></html>", "clips")
              except ValueError:
                  pass
              else:
                  raise AssertionError("missing authenticated relay must reject UI patch")

          relay = load("patch-smooth-live-relay.py")
          before = '''import urllib.parse, urllib.request
          class Handler:
           def do_HEAD(self): self.go(True)
           def empty(self,status):return status
           def go(self,head=False):
            path=urllib.parse.urlsplit(self.path).path
            if not self.authorized:return self.empty(401)
            if path=='/phone-batteries.json':return self.empty(200)
           def archive(self,cam,subpath):
            url=f'http://127.0.0.1:8795/{cam}{subpath}';req=urllib.request.Request(url)
            return req.full_url
          '''
          after = relay.patch(before)
          assert relay.patch(after) == after, "relay patch must be idempotent"
          namespace = {}
          exec(compile(after, "patched-relay-test", "exec"), namespace)
          handler = namespace["Handler"]()
          calls = []
          handler.smooth_live = lambda head=False: calls.append(head)
          handler.path = "/new/live.mp4"
          handler.authorized = False
          assert handler.go() == 401 and calls == [], "unauthenticated live request must reject"
          handler.authorized = True
          handler.go(True)
          assert calls == [True], "authenticated HEAD must select fixed live route"
          for mode in ("prepare", "hub", "https://untrusted.test/video.mp4"):
              handler.path = "/new/saved/clip/test.mp4?auth=private&playback=" + urllib.parse.quote(mode, safe="")
              expected = "http://127.0.0.1:8795/new/saved/clip/test.mp4"
              if mode in ("prepare", "hub"):
                  expected += "?playback=" + mode
              assert handler.archive("new", "/saved/clip/test.mp4") == expected, "only playback modes may reach fixed archive upstream"
          print("SMOOTH_PLAYBACK_PATCH_CONTRACTS_OK")
          PY
      - name: Compile Camera2 and offline TFLite classifier against Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$(printenv ANDROID_HOME || true)"
          test -n "$SDK_ROOT" || SDK_ROOT="/usr/local/lib/android/sdk"
          ANDROID_JAR="$(find "$SDK_ROOT/platforms" -name android.jar | sort -V | tail -1)"
          test -s "$ANDROID_JAR"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/lib" "$WORK/classes"
          for part in tensorflow-lite tensorflow-lite-api tensorflow-lite-gpu tensorflow-lite-gpu-api; do
            curl -fLsS --retry 2 --max-time 60 \
              "https://repo.maven.apache.org/maven2/org/tensorflow/$part/2.14.0/$part-2.14.0.aar" \
              -o "$WORK/lib/$part.aar"
            unzip -p "$WORK/lib/$part.aar" classes.jar > "$WORK/lib/$part.jar"
            test -s "$WORK/lib/$part.jar"
          done
          CLASSPATH="$ANDROID_JAR:$WORK/lib/tensorflow-lite.jar:$WORK/lib/tensorflow-lite-api.jar:$WORK/lib/tensorflow-lite-gpu.jar:$WORK/lib/tensorflow-lite-gpu-api.jar"
          javac -source 8 -target 8 -cp "$CLASSPATH" -d "$WORK/classes" \
            ops/c720p/s9-native-security/src/nl/kalenel/s9security/*.java
          test -s "$WORK/classes/nl/kalenel/s9security/CameraService.class"
          test -s "$WORK/classes/nl/kalenel/s9security/AnonymousClipTracks.class"
          test -s "$WORK/classes/nl/kalenel/s9security/PreviewJpeg.class"
          echo "S9_NATIVE_SECURITY_ANDROID_CLASSES_COMPILE_OK"
      - name: Test evidence budget decisions
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          javac -d "$WORK"             ops/c720p/s9-native-security/src/nl/kalenel/s9security/RecordingRate.java             ops/c720p/s9-native-security/tests/RecordingRateTest.java
          java -cp "$WORK" nl.kalenel.s9security.RecordingRateTest
          javac -d "$WORK" \
            ops/c720p/s9-native-security/src/nl/kalenel/s9security/CameraOrientation.java \
            ops/c720p/s9-native-security/tests/CameraOrientationTest.java
          java -cp "$WORK" nl.kalenel.s9security.CameraOrientationTest
          javac -d "$WORK" \
            ops/c720p/s9-native-security/src/nl/kalenel/s9security/PhoneMediaRange.java \
            ops/c720p/s9-native-security/tests/PhoneMediaRangeTest.java
          java -cp "$WORK" nl.kalenel.s9security.PhoneMediaRangeTest
          javac -d "$WORK" \
            ops/c720p/s9-native-security/src/nl/kalenel/s9security/CaptureCadence.java \
            ops/c720p/s9-native-security/src/nl/kalenel/s9security/H264AnnexB.java \
            ops/c720p/s9-native-security/tests/LiveVideoPrimitivesTest.java
          java -cp "$WORK" nl.kalenel.s9security.LiveVideoPrimitivesTest

  anonymous-tracklets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test clip-scoped anonymous tracklets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s9-anonymous-test
          javac -d /tmp/s9-anonymous-test ops/c720p/s9-native-security/src/nl/kalenel/s9security/AnonymousClipTracks.java ops/c720p/s9-native-security/tests/AnonymousClipTracksTest.java
          java -cp /tmp/s9-anonymous-test nl.kalenel.s9security.AnonymousClipTracksTest
