name: v789 gameplay runtime proof
on:
  push:
    branches:
      - 'agent/v789-gameplay-runtime-repair'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Permanent verification first
        run: npm run verify
      - name: Install isolated browser dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local v789 candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v789-runtime-proof-http.log 2>&1 &
          echo $! >/tmp/v789-runtime-proof-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/VERSION >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v789-runtime-proof-http.log
          exit 1
      - name: Prove repaired runtime owners across three browser engines
        env:
          V789_PROOF_BASE: http://127.0.0.1:4173
        run: node scripts/v789-gameplay-runtime-proof.mjs
      - name: Prove proof made no repository mutation
        if: always()
        run: |
          git diff --check -- scripts/v789-gameplay-runtime-proof.mjs .github/workflows/v789-gameplay-runtime-proof.yml
          git status --short
