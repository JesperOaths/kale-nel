name: v813 Klaverjas overflow containment once

on:
  push:
    branches:
      - agent/v813-housekeeping-observable
    paths:
      - '.github/workflows/v813-klaverjas-overflow-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out v813 working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v813-housekeeping-observable
          fetch-depth: 0

      - name: Contain long authenticated player names and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('klaverjas_room.html')
          s=p.read_text()
          old='.score-cell{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffaf3}'
          new='.score-cell{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fffaf3}.score-cell .muted{min-width:0;overflow-wrap:anywhere;word-break:break-word}'
          if old not in s:
              raise SystemExit('expected Klaverjas score-cell CSS contract not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq '.score-cell{min-width:0;overflow:hidden;' klaverjas_room.html
          grep -Fq '.score-cell .muted{min-width:0;overflow-wrap:anywhere;word-break:break-word}' klaverjas_room.html
          rm .github/workflows/v813-klaverjas-overflow-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add klaverjas_room.html .github/workflows/v813-klaverjas-overflow-once.yml
          git commit -m 'fix(ui): contain Klaverjas long-name overflow'
          git push origin HEAD:agent/v813-housekeeping-observable
