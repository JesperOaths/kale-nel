name: v813 autonomous quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplemental-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Run canonical repository verification
        run: npm run verify

      - name: Run PR safety rules
        run: node scripts/check-pr-rules.mjs

      - name: Run Pages publication boundary check
        run: node scripts/check-pages-publication-boundary-v792.mjs

      - name: Run independent static publication integrity audit
        run: node scripts/audit-v813-static-integrity.mjs

      - name: Audit dependency graph
        run: npm audit --audit-level=high
