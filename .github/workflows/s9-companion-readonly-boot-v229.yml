name: S9 read-only companion startup admission V229 (source only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedCompanionBootReadinessV229.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedApprovedSixDigestV230.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedApprovedSixDigestTestV230.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-approved-six-digest-v230.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-companion-boot-readiness-v229.py'
      - '.github/workflows/s9-companion-readonly-boot-v229.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedCompanionBootReadinessV229.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedApprovedSixDigestV230.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedApprovedSixDigestTestV230.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-approved-six-digest-v230.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-companion-boot-readiness-v229.py'
      - '.github/workflows/s9-companion-readonly-boot-v229.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure no boot write, no stale or unauthenticated state
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-companion-boot-readiness-v229.py"
          python3 "$d/test-s9-approved-six-digest-v230.py"
          python3 "$d/test-s9-three-key-custody-v227.py"
          python3 "$d/test-s9-sealed-manifest-source-v216.py"
      - name: Compile read-only app boot admission to Android API28 DEX
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$work/classes" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedVerifiedSourceV198.java" \
            "$d/S9MigratedSealedSourceManifestV216.java" \
            "$d/S9MigratedKeystoreKeyPairGuardV202.java" \
            "$d/S9MigratedAndroidKeystoreOwnerV202.java" \
            "$d/S9MigratedThreeKeyCustodyV227.java" \
            "$d/S9MigratedManifestKeyCustodyV227.java" \
            "$d/S9MigratedReadOnlyStateV225.java" \
            "$d/S9MigratedThreeKeyEnrollmentV227.java" \
            "$d/S9MigratedAndroidThreeKeyOwnerV227.java" \
            "$d/S9MigratedApprovedSixDigestV230.java" \
            "$d/S9MigratedCompanionBootReadinessV229.java"
          "$d8" --min-api 28 --output "$work/dex" $(find "$work/classes" -name '*.class' -print)
          test -s "$work/dex/classes.dex"
          echo S9_COMPANION_BOOT_V229_SOURCE_ONLY_ANDROID_API28_PASS
