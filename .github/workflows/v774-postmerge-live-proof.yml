name: v774 postmerge public edge proof

on:
  pull_request:
    paths:
      - 'check-live-v774-production-acceptance.mjs'
      - '.github/workflows/v774-postmerge-live-proof.yml'
      - 'beta-readiness.json'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prove full hardened live route suite at v774
        env:
          GEJAST_EXPECTED_VERSION: v774
          GEJAST_DEPLOY_WAIT_SECONDS: '120'
          GEJAST_SMOKE_RETRIES: '3'
        run: node check-live-routes.mjs
      - name: Prove v774 production acceptance fixes on public edge
        env:
          GEJAST_DEPLOY_WAIT_SECONDS: '120'
        run: node check-live-v774-production-acceptance.mjs
