name: v785 final acceptance release builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-v785:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary browser tooling
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Apply deterministic v785 product patch
        run: |
          node scripts/build-v785-final-acceptance-fixes.mjs
          node fix-version-drift.mjs
      - name: Full permanent repository verification
        run: npm run verify
      - name: Candidate browser proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v785-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          node scripts/prove-v785-final-fixes.mjs
      - name: Clean temporary builder machinery and commit candidate
        run: |
          rm -f .github/workflows/v785-release-builder.yml
          rm -f scripts/build-v785-final-acceptance-fixes.mjs
          rm -f scripts/prove-v785-final-fixes.mjs
          rm -rf node_modules
          git config core.whitespace cr-at-eol
          git diff --check
          test ! -e V785_DIAGNOSTIC_RESULTS.json
          test ! -e V785_DIAGNOSTIC_SUMMARY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final acceptance findings v785"
          git push origin HEAD:${{ github.head_ref }}
