name: S9 low-duty recovery evidence refresh safety
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9_auxiliary_media_probe_v1.py'
      - 'ops/c720p/security-runtime/s9_auxiliary_low_duty_refresh_v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-low-duty-refresh-v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-deferral-v1.py'
      - 'ops/c720p/security-runtime/c720p-s9-auxiliary-recovery-refresh-v1.service'
      - 'ops/c720p/security-runtime/c720p-s9-auxiliary-recovery-refresh-v1.timer'
      - '.github/workflows/s9-auxiliary-recovery-low-duty-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9_auxiliary_low_duty_refresh_v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-low-duty-refresh-v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-deferral-v1.py'
permissions:
  contents: read
jobs:
  safe-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          PYTHONPATH=ops/c720p/security-runtime python3 ops/c720p/security-runtime/test-s9-auxiliary-low-duty-refresh-v1.py
          PYTHONPATH=ops/c720p/security-runtime python3 ops/c720p/security-runtime/test-s9-auxiliary-deferral-v1.py
          python3 -m py_compile ops/c720p/security-runtime/s9_auxiliary_media_probe_v1.py ops/c720p/security-runtime/s9_auxiliary_low_duty_refresh_v1.py
          echo S9_AUXILIARY_LOW_DUTY_SAFE
