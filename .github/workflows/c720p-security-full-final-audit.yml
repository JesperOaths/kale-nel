name: C720P full Security final production audit
on:
  pull_request:
    paths:
      - '.github/workflows/c720p-security-full-final-audit.yml'
      - 'ops/c720p/s9-native-security/security-full-final-audit-20261011.py'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-full-final-audit-20261011.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify audit syntax and read-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/security-full-final-audit-20261011.py
          python3 - <<'PY'
          from pathlib import Path
          t=Path('ops/c720p/s9-native-security/security-full-final-audit-20261011.py').read_text()
          for x in ('SECURITY_FULL_FINAL_AUDIT_V1','/new/api/drive-saved','/new/api/saved',
                    '/new/drive/saved/clip/','/new/saved/clip/','security-review-v8.html',
                    'last_frame_age_ms','driveTab','hub_disk_critical'):
           if x not in t and x!='driveTab':raise AssertionError(x)
          for x in ('os.system(', 'subprocess.Popen(', 'shutil.rmtree(', '.unlink(', 'os.remove(', 'os.replace(', 'subprocess.run(["adb"'):
           assert x not in t, x
          print('SECURITY_READONLY_AUDIT_SOURCE_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run one read-only audit on the C720P and collect results
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Private management gateway not configured'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          filename="ops/c720p/s9-native-security/security-full-final-audit-20261011.py"
          hash="$(sha256sum "$filename" | cut -d' ' -f1)"
          [[ "$hash" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${filename}"
          destination="/tmp/security-readonly-audit-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${origin}' -o '${destination}' && printf '%s  %s\\n' '${hash}' '${destination}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${destination}'"
          idem="security-readonly-final-audit-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
           'github-actions-security-audit','diagnostic',:'cmd',420,:'idem'
          );
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]] || { echo 'No authenticated C720P job accepted'; exit 1; }
          echo "C720P_SECURITY_AUDIT_JOB_ID=$job"
          for i in $(seq 1 61); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${job}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${job}" | head -c 20000)"
              echo "$out"
              [[ "$state" == 'done|0' ]] || { echo 'Audit job failed'; exit 1; }
              grep -q 'SECURITY_FULL_FINAL_AUDIT_V1' <<< "$out" || { echo 'No audit payload returned'; exit 1; }
              echo 'SECURITY_FULL_FINAL_AUDIT_CAPTURED'
              exit 0
            fi
            sleep 10
          done
          echo 'Audit result not yet available'
          exit 1
