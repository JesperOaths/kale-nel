name: v792 final live browser certification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/final-certification-live-browser-v792.yml'
      - 'scripts/final-cert-live-browser-v792.mjs'
      - 'scripts/prepare-live-browser-runtime-v813.mjs'

permissions:
  contents: read

concurrency:
  group: v792-final-live-browser-certification
  cancel-in-progress: false

jobs:
  live-browser:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_SITE_SCOPE: friends
      GEJAST_BROWSER_TIMEOUT_MS: '25000'
    steps:
      - name: Check out exact merged main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prepare deterministic system Chrome test runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'SUPABASE_DB_URL missing'; exit 1; }
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'GitHub runner system Chrome missing'; exit 1; }
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          GEJAST_SYSTEM_CHROME="$chrome" node scripts/prepare-live-browser-runtime-v813.mjs
          node --check scripts/prepare-live-browser-runtime-v813.mjs
          node --check scripts/.generated-final-cert-live-browser-system-chrome.mjs
          "$chrome" --version
          if grep -qE 'npx[[:space:]]+playwright[[:space:]]+install|playwright[[:space:]]+install[[:space:]]+--with-deps' .github/workflows/final-certification-live-browser-v792.yml; then
            echo 'Unbounded Playwright browser download reintroduced.'
            exit 1
          fi
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          echo 'RESULT=V792_FINAL_CERT_SYSTEM_CHROME_RUNTIME_PASS'

      - name: Provision randomized disposable certification identities
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="CertA_${suffix}"
          name2="CertB_${suffix}"
          token1="v792-cert-$(openssl rand -hex 32)"
          token2="v792-cert-$(openssl rand -hex 32)"
          echo "::add-mask::$token1"
          echo "::add-mask::$token2"
          echo "GEJAST_PLAYER1_TOKEN=$token1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_TOKEN=$token2" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER1_NAME=$name1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_NAME=$name2" >> "$GITHUB_ENV"

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name1="$name1" -v name2="$name2" -v token1="$token1" -v token2="$token2" <<'SQL'
          begin;
          with ins as (
            insert into public.players(slug,display_name,active,approved,hidden_from_public,is_dummy,site_scope)
            values
              ('final-cert-a-' || lower(:'name1'), :'name1', true, true, true, true, 'friends'),
              ('final-cert-b-' || lower(:'name2'), :'name2', true, true, true, true, 'friends')
            returning id,display_name
          )
          insert into public.gejast_player_sessions_v746(session_token,player_id,display_name,site_scope,expires_at)
          select case when display_name=:'name1' then :'token1' else :'token2' end,id,display_name,'friends',now()+interval '30 minutes'
          from ins;

          with ins as (
            insert into public.gejast_account_players_v671(site_scope,display_name,email,activated_at)
            values
              ('friends', :'name1', lower(:'name1') || '@example.invalid', now()),
              ('friends', :'name2', lower(:'name2') || '@example.invalid', now())
            returning id,display_name
          )
          insert into public.gejast_account_sessions_v671(session_token,player_id,site_scope,expires_at)
          select case when display_name=:'name1' then :'token1' else :'token2' end,id,'friends',now()+interval '30 minutes'
          from ins;
          commit;
          SQL

      - name: Prove both session resolver chains before browser writes
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F'|' \
            -v token1="$GEJAST_PLAYER1_TOKEN" -v token2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
          select coalesce(public._gejast_v687_session_name(:'token1'),''),
                 coalesce(public._gejast_v687_session_name(:'token2'),''),
                 coalesce((public._jas_session_player(:'token1')).display_name,''),
                 coalesce((public._jas_session_player(:'token2')).display_name,'');
          SQL
          )"
          expected="$GEJAST_PLAYER1_NAME|$GEJAST_PLAYER2_NAME|$GEJAST_PLAYER1_NAME|$GEJAST_PLAYER2_NAME"
          test "$resolved" = "$expected"
          echo 'Both disposable account/player session resolver chains PASS.'

      - name: Run live Chromium multi-context mobile and completion acceptance
        shell: bash
        run: |
          set -euo pipefail
          # The public Pages/edge path can briefly return an empty document while a
          # same-version deployment is converging. The campaign is destructive only to
          # its own disposable fixtures and has its own room cleanup, so allow exactly
          # one full clean retry. A deterministic product failure still fails twice.
          runtime='scripts/.generated-final-cert-live-browser-system-chrome.mjs'
          if ! node "$runtime"; then
            echo 'First browser campaign attempt failed; retrying once after edge settle.'
            sleep 4
            node "$runtime"
          fi

      - name: Cleanup all disposable certification state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ] || [ -z "${GEJAST_PLAYER2_NAME:-}" ]; then
            echo 'Fixture names were never exported; nothing to clean.'
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name1="$GEJAST_PLAYER1_NAME" -v name2="$GEJAST_PLAYER2_NAME" \
            -v token1="${GEJAST_PLAYER1_TOKEN:-missing}" -v token2="${GEJAST_PLAYER2_TOKEN:-missing}" <<'SQL'
          begin;

          -- Remove browser-created game parents first. Their child rows are either
          -- CASCADE-owned or become harmless history rows; test-owned history is
          -- removed explicitly before its Paardenrace parent disappears.
          delete from public.paardenrace_match_history h
          using public.paardenrace_rooms r
          where h.room_id = r.id
            and (
              r.host_name in (:'name1', :'name2')
              or r.host_player_id in (select id from public.players where display_name in (:'name1', :'name2'))
              or r.created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'))
            );

          delete from public.klaverjas_online_games
          where created_by_player_name in (:'name1', :'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));

          delete from public.pikken_games
          where created_by_player_name in (:'name1', :'name2')
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));

          delete from public.paardenrace_rooms
          where host_name in (:'name1', :'name2')
             or host_player_id in (select id from public.players where display_name in (:'name1', :'name2'))
             or created_by_player_id in (select id from public.players where display_name in (:'name1', :'name2'));

          delete from public.gejast_player_sessions_v746 where session_token in (:'token1', :'token2');
          delete from public.gejast_account_sessions_v671 where session_token in (:'token1', :'token2');
          delete from public.players where display_name in (:'name1', :'name2') and is_dummy=true and hidden_from_public=true;
          delete from public.gejast_account_players_v671 where display_name in (:'name1', :'name2') and email like '%@example.invalid';
          commit;
          SQL

          residue="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F'|' \
            -v name1="$GEJAST_PLAYER1_NAME" -v name2="$GEJAST_PLAYER2_NAME" \
            -v token1="${GEJAST_PLAYER1_TOKEN:-missing}" -v token2="${GEJAST_PLAYER2_TOKEN:-missing}" <<'SQL'
          select (select count(*) from public.players where display_name in (:'name1',:'name2')),
                 (select count(*) from public.gejast_account_players_v671 where display_name in (:'name1',:'name2')),
                 (select count(*) from public.gejast_player_sessions_v746 where session_token in (:'token1',:'token2')),
                 (select count(*) from public.gejast_account_sessions_v671 where session_token in (:'token1',:'token2')),
                 (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'name1',:'name2')),
                 (select count(*) from public.paardenrace_rooms where host_name in (:'name1',:'name2'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0|0'
          echo 'Disposable browser-certification identities, sessions and game parents cleanup PASS.'

      - name: Final browser certification marker
        run: echo 'RESULT=V792_FINAL_LIVE_BROWSER_CERTIFICATION_PASS'
