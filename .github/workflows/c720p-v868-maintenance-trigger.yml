name: C720P v868 maintenance trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c720p-v868-maintenance-trigger.yml'
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enqueue fixed C720P maintenance job
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --connect-timeout 10 --max-time 30             https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/ops-c720p-v868-maintenance
