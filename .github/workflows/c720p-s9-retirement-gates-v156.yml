name: C720P S9 migration retirement safety audit V156
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-retirement-v156.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-retirement-v156.py'
      - '.github/workflows/c720p-s9-retirement-gates-v156.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/audit-c720p-s9-retirement-v156.py'
      - 'ops/c720p/security-runtime/test-audit-c720p-s9-retirement-v156.py'
      - '.github/workflows/c720p-s9-retirement-gates-v156.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-retirement-audit-v156
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Never promote an unproven local recording retirement
        shell: bash
        run: |
          set -euo pipefail
          root=ops/c720p/security-runtime
          python3 -m py_compile "$root/audit-c720p-s9-retirement-v156.py"
          python3 "$root/test-audit-c720p-s9-retirement-v156.py"
          echo C720P_S9_RETIREMENT_NOT_APPROVED_CI_PASS

  physical-audit:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read-only current C720P local/S9 manifest retirement blockers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          script="ops/c720p/security-runtime/audit-c720p-s9-retirement-v156.py"
          digest="$(sha256sum "$script" | cut -d' ' -f1)"
          stage="/tmp/c720p-s9-retirement-${GITHUB_SHA:0:12}"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$script"
          cmd="umask 077 && mkdir -p '$stage' && curl -fsSL --retry 2 --max-time 35 '$url' -o '$stage/audit.py' && printf '%s  %s\n' '$digest' '$stage/audit.py' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage/audit.py'"
          idem="c720p-s9-retirement-readonly-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-s9-retirement-readonly','diagnostic',:'cmd',110,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "RETIREMENT_AUDIT_JOB=$id"
          for attempt in $(seq 1 65); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]];then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3500)"
              echo "$out"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_S9_MIGRATED_RETIREMENT_V156' <<< "$out"
              grep -q '"eligible_for_local_removal": false' <<< "$out"
              grep -q '"retention_required": true' <<< "$out"
              grep -q '"read_only": true' <<< "$out"
              exit 0
            fi
            sleep 3
          done
          echo "C720P retirement audit incomplete";exit 1
