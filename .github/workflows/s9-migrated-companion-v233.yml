name: S9 migrated companion V233 unsigned safety
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/migrated-companion-v233/**'
      - '.github/workflows/s9-migrated-companion-v233.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/migrated-companion-v233/**'
      - '.github/workflows/s9-migrated-companion-v233.yml'
permissions:
  contents: read
jobs:
  static_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check pinned source, unexported manifest, prohibited signing and physical guard contract
        run: python3 ops/c720p/s9-native-security/migrated-companion-v233/test_companion_v233.py
