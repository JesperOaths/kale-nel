name: one-shot v812 final certification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-v812-final-certification.yml']

permissions:
  contents: write

concurrency:
  group: v812-final-certification
  cancel-in-progress: false

env:
  PRODUCT_SHA: 710213fabda6dc520aa6f92696b918d221e29866
  PROOF_BRANCH: proof/v812-final-certification-20260818
  GEJAST_BASE_URL: https://kalenel.nl/
  GEJAST_SITE_SCOPE: friends
  SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  PGCONNECT_TIMEOUT: '10'
  PGOPTIONS: '-c statement_timeout=20000'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v812-final-certification-20260818
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Record exact certification run and prove tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git show "$PRODUCT_SHA:VERSION" | tr -d '\r\n')" = 'v812'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v812-final-cert-run-id.txt
          git add .proof/v812-final-cert-run-id.txt
          git commit -m 'test: record exact v812 final certification run'
          git push origin HEAD:"$PROOF_BRANCH"
          unexpected="$(git diff --name-only "$PRODUCT_SHA"..HEAD | grep -Ev '^\.proof/v812-final-cert-run-id\.txt$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof branch drift:'; echo "$unexpected"; exit 1; }
          echo 'RESULT=V812_EXACT_PRODUCT_TREE_PASS'

      - name: Prepare deterministic runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npm audit --omit=dev --audit-level=high
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
          echo 'RESULT=V812_CERT_RUNTIME_READY_PASS'

      - name: Exact-current live health
        id: health
        continue-on-error: true
        shell: bash
        env:
          GEJAST_EXPECTED_VERSION: v812
          GEJAST_DEPLOY_WAIT_SECONDS: '240'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
          GEJAST_ADMIN_AUTH_TIMEOUT_MS: '15000'
          GEJAST_DATA_PLANE_TIMEOUT_MS: '10000'
          GEJAST_DATA_PLANE_ATTEMPTS: '2'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '750'
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
          GEJAST_PERF_TIMEOUT_MS: '20000'
        run: |
          set -euo pipefail
          node check-live-routes.mjs
          node check-live-admin-auth-boundary.mjs
          node check-live-data-plane.mjs
          node check-beta-readonly-surfaces.mjs
          node check-beta-readonly-extended.mjs
          node check-beta-performance.mjs
          echo 'RESULT=V812_EXACT_LIVE_HEALTH_PASS'

      - name: Provision deep-live identities
        id: deep_provision
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V812DeepA_${suffix}"; name2="V812DeepB_${suffix}"
          pin1='4826'; pin2='7314'
          echo "::add-mask::$pin1"; echo "::add-mask::$pin2"
          { echo "DEEP_PLAYER1_NAME=$name1"; echo "DEEP_PLAYER2_NAME=$name2"; } >> "$GITHUB_ENV"
          timeout 25s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$name1" -v n2="$name2" -v p1="$pin1" -v p2="$pin2" <<'SQL'
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v812-cert-a-'||lower(:'n1'),:'n1',true,'md5:'||md5(:'p1'||':'||current_database()),true,true,true,'friends'),
            ('v812-cert-b-'||lower(:'n2'),:'n2',true,'md5:'||md5(:'p2'||':'||current_database()),true,true,true,'friends');
          SQL
          sessions="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$name1" -v n2="$name2" -v p1="$pin1" -v p2="$pin2" <<'SQL'
          select public.account_login_v687(:'n1',:'p1','friends','{"proof":"v812-final-cert"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'n2',:'p2','friends','{"proof":"v812-final-cert"}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ && "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"; echo "::add-mask::$token2"
          { echo "DEEP_PLAYER1_TOKEN=$token1"; echo "DEEP_PLAYER2_TOKEN=$token2"; } >> "$GITHUB_ENV"
          echo 'RESULT=V812_DEEP_FIXTURES_PASS'

      - name: Prepare exact-v812 deep browser campaign
        if: steps.deep_provision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          src=Path('scripts/final-cert-live-browser-v792.mjs').read_text()
          src=src.replace('v792','v812').replace('V792','V812')
          src=src.replace("chromium.launch({ headless: true })", "chromium.launch({ headless: true, executablePath: process.env.GEJAST_SYSTEM_CHROME })")
          old="""  await page.waitForTimeout(900);\n  if (/login\\.html/i.test(page.url())) throw new Error(`${label} unexpectedly redirected to login`);\n  const body = (await page.locator('body').innerText()).trim();"""
          new="""  await page.waitForFunction(() => {\n    const root=document.documentElement;\n    const primary=root.getAttribute('data-gejast-auth-state');\n    const legacySettled=!root.classList.contains('gejast-auth-pending');\n    return /login\\.html/i.test(location.pathname) || (primary === 'authenticated' && legacySettled);\n  }, null, { timeout });\n  if (/login\\.html/i.test(page.url())) throw new Error(`${label} unexpectedly redirected to login`);\n  await page.waitForTimeout(150);\n  const body = (await page.locator('body').innerText()).trim();"""
          if old not in src: raise SystemExit('deep auth-settle patch target missing')
          src=src.replace(old,new,1)
          if 'executablePath: process.env.GEJAST_SYSTEM_CHROME' not in src: raise SystemExit('system Chrome patch failed')
          Path('scripts/v812-final-cert-deep.mjs').write_text(src)
          PY
          node --check scripts/v812-final-cert-deep.mjs

      - name: Run exact-v812 deep live gameplay
        id: deep
        if: steps.deep_provision.outcome == 'success'
        continue-on-error: true
        env:
          GEJAST_PLAYER1_NAME: ${{ env.DEEP_PLAYER1_NAME }}
          GEJAST_PLAYER2_NAME: ${{ env.DEEP_PLAYER2_NAME }}
          GEJAST_PLAYER1_TOKEN: ${{ env.DEEP_PLAYER1_TOKEN }}
          GEJAST_PLAYER2_TOKEN: ${{ env.DEEP_PLAYER2_TOKEN }}
          GEJAST_BROWSER_TIMEOUT_MS: '25000'
        run: node scripts/v812-final-cert-deep.mjs

      - name: Prove deep sessions survive gameplay
        id: deep_sessions
        if: steps.deep_provision.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          state="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v t1="$DEEP_PLAYER1_TOKEN" -v t2="$DEEP_PLAYER2_TOKEN" <<'SQL'
          with s as (select public.account_public_state_v687(:'t1',:'t1','friends') a, public.account_public_state_v687(:'t2',:'t2','friends') b)
          select coalesce(a->>'ok','false'),coalesce(b->>'ok','false') from s;
          SQL
          )"
          test "$state" = 'true|true'
          echo 'RESULT=V812_DEEP_POST_GAME_SESSIONS_PASS'

      - name: Cleanup deep-live fixtures
        if: always() && steps.deep_provision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$DEEP_PLAYER1_NAME" -v n2="$DEEP_PLAYER2_NAME" <<'SQL'
          begin;
          delete from public.paardenrace_match_history h using public.paardenrace_rooms r where h.room_id=r.id and (r.host_name in (:'n1',:'n2') or r.created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2')));
          delete from public.klaverjas_online_games where created_by_player_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.pikken_games where created_by_player_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.paardenrace_rooms where host_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'));
          delete from public.gejast_player_sessions_v746 where player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.players where display_name in (:'n1',:'n2') and hidden_from_public=true and is_dummy=true;
          commit;
          SQL
          residue="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$DEEP_PLAYER1_NAME" -v n2="$DEEP_PLAYER2_NAME" <<'SQL'
          select (select count(*) from public.players where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'))),
                 (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'n1',:'n2')),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'n1',:'n2')),
                 (select count(*) from public.paardenrace_rooms where host_name in (:'n1',:'n2'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0'
          echo 'RESULT=V812_DEEP_ZERO_RESIDUE_PASS'

      - name: Provision authenticated Friends and Family visual identities
        id: visual_provision
        continue-on-error: true
        run: node scripts/full-live-visual-fixtures-v801.mjs provision

      - name: Prepare v812 authenticated runtime contract proof
        if: steps.visual_provision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin proof/v810-runtime-contract
          git show origin/proof/v810-runtime-contract:scripts/v810-runtime-contract-live-proof.mjs > scripts/v812-runtime-contract-live-proof.mjs
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/v812-runtime-contract-live-proof.mjs')
          s=p.read_text().replace('v810','v812').replace('V810','V812')
          s=s.replace("const diagnosticNames=new Set(['track_site_event','get_public_player_unified_scoped','get_homepage_boot_bundle_scoped','save_game_match_summary']);", "const diagnosticNames=new Set(['track_site_event','get_public_player_unified_scoped','get_public_shared_player_stats_scoped','get_public_player_game_insights_scoped','get_homepage_boot_bundle_scoped','save_game_match_summary']);")
          zero_old="['get_all_pending_drink_event_verifications_public','get_drink_event_vote_queue_public','get_public_state']"
          zero_new="['get_all_pending_drink_event_verifications_public','get_drink_event_vote_queue_public','get_public_state','get_public_player_unified_scoped']"
          s=s.replace(zero_old,zero_new)
          success_old="['account_public_state_v687','get_drinks_page_public','get_player_site_announcements_scoped','get_player_runtime_bundle_v687']"
          success_new="['account_public_state_v687','get_drinks_page_public','get_player_site_announcements_scoped','get_player_runtime_bundle_v687','track_site_event','get_public_shared_player_stats_scoped','get_public_player_game_insights_scoped']"
          s=s.replace(success_old,success_new)
          repaired_old="new Set(['get_all_pending_drink_event_verifications_public','get_drink_event_vote_queue_public','get_public_state','get_player_site_announcements_scoped','get_player_runtime_bundle_v687'])"
          repaired_new="new Set(['get_all_pending_drink_event_verifications_public','get_drink_event_vote_queue_public','get_public_state','get_public_player_unified_scoped','get_player_site_announcements_scoped','get_player_runtime_bundle_v687','track_site_event','get_public_shared_player_stats_scoped','get_public_player_game_insights_scoped'])"
          s=s.replace(repaired_old,repaired_new)
          if "get_public_player_unified_scoped'].length" in s: pass
          p.write_text(s)
          PY
          node --check scripts/v812-runtime-contract-live-proof.mjs

      - name: Run v812 authenticated runtime contract proof
        id: runtime_contract
        if: steps.visual_provision.outcome == 'success'
        continue-on-error: true
        env:
          GEJAST_WARNING_PROOF_TIMEOUT_MS: '25000'
          GEJAST_WARNING_PROOF_SETTLE_MS: '4500'
        run: node scripts/v812-runtime-contract-live-proof.mjs

      - name: Prepare system-Chrome visual audit
        if: steps.visual_provision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/full-live-visual-audit-v792.mjs')
          s=p.read_text()
          old="chromium.launch({ headless: true })"
          new="chromium.launch({ headless: true, executablePath: process.env.GEJAST_SYSTEM_CHROME })"
          if old in s: s=s.replace(old,new)
          if new not in s: raise SystemExit('visual system Chrome patch missing')
          p.write_text(s)
          PY
          node --check scripts/full-live-visual-audit-v792.mjs

      - name: Capture and inspect all authenticated visual routes
        id: visual_scan
        if: steps.visual_provision.outcome == 'success'
        continue-on-error: true
        env:
          GEJAST_VISUAL_TIMEOUT_MS: '25000'
          GEJAST_VISUAL_SETTLE_MS: '5000'
        run: node scripts/full-live-visual-audit-v792.mjs

      - name: Refine only declared authenticated aliases
        id: visual_refine
        if: always() && steps.visual_provision.outcome == 'success'
        continue-on-error: true
        run: node scripts/refine-expected-visual-aliases-v809.mjs

      - name: Enforce refined visual report
        id: visual_enforce
        if: always() && steps.visual_provision.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f visual-audit/report.json
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('visual-audit/report.json','utf8'));
          const rows=Array.isArray(r.records)?r.records:(Array.isArray(r.routes)?r.routes:[]);
          const broken=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='broken');
          const warn=rows.filter(x=>String(x.judgement||x.status||'').toLowerCase()==='warn');
          console.log(`RESULT=V812_VISUAL_REPORT records=${rows.length} broken=${broken.length} warn=${warn.length}`);
          if(broken.length){ console.error(JSON.stringify(broken.slice(0,10),null,2)); process.exit(1); }
          JS

      - name: Upload exact v812 certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v812-final-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v812-runtime-proof/
            visual-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup authenticated visual fixtures
        id: visual_cleanup
        if: always() && steps.visual_provision.outcome == 'success'
        continue-on-error: true
        run: node scripts/full-live-visual-fixtures-v801.mjs cleanup

      - name: Independent final zero-residue sweep
        id: residue
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          d1="V812DeepA_${suffix}"; d2="V812DeepB_${suffix}"; v1="VisualA_${suffix}"; v2="VisualB_${suffix}"; vf="VisualFamily_${suffix}"
          residue="$(timeout 30s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v d1="$d1" -v d2="$d2" -v v1="$v1" -v v2="$v2" -v vf="$vf" <<'SQL'
          select
            (select count(*) from public.players where display_name in (:'d1',:'d2',:'v1',:'v2',:'vf')),
            (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'d1',:'d2',:'v1',:'v2',:'vf')),
            (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'d1'),lower(:'d2'),lower(:'v1'),lower(:'v2'),lower(:'vf'))),
            (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'d1',:'d2',:'v1',:'v2',:'vf')),
            (select count(*) from public.pikken_games where created_by_player_name in (:'d1',:'d2',:'v1',:'v2',:'vf')),
            (select count(*) from public.paardenrace_rooms where host_name in (:'d1',:'d2',:'v1',:'v2',:'vf'));
          SQL
          )"
          echo "FINAL_RESIDUE=$residue"
          test "$residue" = '0|0|0|0|0|0'
          echo 'RESULT=V812_INDEPENDENT_ZERO_RESIDUE_PASS'

      - name: Final exact-v812 certification gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.health.outcome }}" = 'success'
          test "${{ steps.deep_provision.outcome }}" = 'success'
          test "${{ steps.deep.outcome }}" = 'success'
          test "${{ steps.deep_sessions.outcome }}" = 'success'
          test "${{ steps.visual_provision.outcome }}" = 'success'
          test "${{ steps.runtime_contract.outcome }}" = 'success'
          test "${{ steps.visual_refine.outcome }}" = 'success'
          test "${{ steps.visual_enforce.outcome }}" = 'success'
          test "${{ steps.visual_cleanup.outcome }}" = 'success'
          test "${{ steps.residue.outcome }}" = 'success'
          echo 'RESULT=V812_FINAL_CERTIFICATION_AUTOMATED_PASS'
