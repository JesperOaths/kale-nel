name: v812 + v812a-b final certification

on:
  push:
    branches: [proof/v812ab-final-certification-20260818]
    paths: ['.github/workflows/ops-v812-final-certification.yml']

permissions:
  contents: write

concurrency:
  group: v812ab-final-certification-20260818
  cancel-in-progress: false

env:
  PRODUCT_SHA: 8984988a19a5d1ffc6682d9a75712d34c8ed23a4
  PROOF_BRANCH: proof/v812ab-final-certification-20260818
  GEJAST_BASE_URL: https://kalenel.nl/
  GEJAST_SITE_SCOPE: friends
  SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  PGCONNECT_TIMEOUT: '10'
  PGOPTIONS: '-c statement_timeout=20000'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact certification branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v812ab-final-certification-20260818
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Run fail-closed exact-v812ab certification
        run: bash scripts/v812ab-final-certification-runner.sh

      - name: Upload exact certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v812ab-final-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            certification-evidence/
            v812-runtime-proof/
            visual-audit/
          if-no-files-found: warn
          retention-days: 14
