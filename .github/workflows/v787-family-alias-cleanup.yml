name: v787 family alias release builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and verify clean v787 candidate
        run: node scripts/build-v787-family-alias-cleanup.mjs
      - name: Commit clean candidate
        run: |
          rm -rf node_modules
          git config core.whitespace cr-at-eol
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: clean family redirect aliases v787"
          git push origin HEAD:${{ github.head_ref }}
