name: S9 person tracks v25 aggregate audit
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/audit-person-tracks-v25.py'
      - '.github/workflows/c720p-audit-person-tracks-v25.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/audit-person-tracks-v25.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          python3 -m py_compile ops/c720p/s9-native-security/audit-person-tracks-v25.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/audit-person-tracks-v25.py').read_text()
          for bad in ['.unlink(', 'rmtree(', 'adb ', 'os.system(', 'shell=True', 'image_bytes', 'video_file']:
              assert bad not in s,bad
          assert 'S9_TRACKS_V25_AGGREGATE_AUDIT' in s
          print('S9_TRACKS_AUDIT_READ_ONLY_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src='ops/c720p/s9-native-security/audit-person-tracks-v25.py'
          sum="$(sha256sum "$src" | cut -d' ' -f1)"
          local="/tmp/person-tracks-audit-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${local}' && printf '%s  %s\\n' '${sum}' '${local}' | sha256sum -c - >/dev/null && python3 '${local}'"
          idem="s9-person-tracks-audit-${GITHUB_SHA:0:23}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-person-tracks-audit','diagnostic',:'cmd',135,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "TRACKS_AUDIT_JOB=$id"
          for i in $(seq 1 30); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q 'S9_TRACKS_V25_AGGREGATE_AUDIT' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
