name: v792 Rad normalization prep

on:
  push:
    branches:
      - fix/v792-rad-normalized-probability

permissions:
  contents: write

jobs:
  prepare-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare v792 Rad normalization
        run: node scripts/prepare-v792-rad-normalization.mjs

      - name: Permanent verification
        run: npm run verify

      - name: Focused Rad validity regression
        run: node check-rad-probability-validity-v792.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Commit verified v792 product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated v792 changes to commit."
            exit 1
          fi
          git commit -m "v792: normalize Rad probability labels"
          git push origin HEAD:fix/v792-rad-normalized-probability
