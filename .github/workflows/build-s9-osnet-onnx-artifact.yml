name: Pretrained OSNet x1.0 static ONNX export (isolated build artifact)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py'
      - '.github/workflows/build-s9-osnet-onnx-artifact.yml'
  push:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py'
      - '.github/workflows/build-s9-osnet-onnx-artifact.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install official CPU-only Torch stack in CI rather than filling the C720P
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir torch==2.8.0 torchvision==0.23.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir \
            torchreid==0.2.5 onnx==1.19.0 onnxruntime==1.22.1 \
            numpy==1.26.4 gdown pillow scipy imageio h5py scikit-learn \
            yacs tqdm cython tensorboard opencv-python-headless==4.10.0.84 \
            huggingface_hub
      - name: Resolve real pretrained OSNet ImageNet checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          from huggingface_hub import hf_hub_download
          checkpoint=Path.home()/'.cache/torch/checkpoints/osnet_x1_0_imagenet.pth'
          checkpoint.parent.mkdir(parents=True,exist_ok=True)
          try:
              source=hf_hub_download(repo_id='kaiyangzhou/osnet',
                                     filename='osnet_x1_0_imagenet.pth')
              shutil.copy2(source,checkpoint)
              print('OSNET_PUBLIC_UPSTREAM_CHECKPOINT_STAGED')
          except Exception as exc:
              # torchreid pretrained=True is allowed to fetch its published
              # ImageNet weights via gdown when the HF mirror lacks the file.
              print('OSNET_HF_MIRROR_UNAVAILABLE_UPSTREAM_DOWNLOAD_REQUIRED',
                    type(exc).__name__)
          PY
      - name: Export static 512D model and numerically verify PyTorch vs ONNX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s9-models"
          python ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py \
            --output "$RUNNER_TEMP/s9-models/visual_backbone_512d.onnx" \
            --manifest "$RUNNER_TEMP/s9-models/visual_backbone_512d.manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'s9-models/visual_backbone_512d.manifest.json'
          d=json.loads(p.read_text())
          assert d['pretrained'] is True
          assert d['input_shape']==[1,3,256,128]
          assert d['output_shape']==[1,512]
          assert d['cosine_torch_onnx']>=.999
          assert d['pretrained_backbone_coverage']>=.90
          print('OSNET_REAL_PRETRAINED_EXPORT_CONTRACT_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s9-osnet-512d-onnx-verified
          path: ${{ runner.temp }}/s9-models/*
          if-no-files-found: error
          retention-days: 30
