name: Pretrained OSNet x1.0 static ONNX export (isolated build artifact)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py'
      - '.github/workflows/build-s9-osnet-onnx-artifact.yml'
  push:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py'
      - '.github/workflows/build-s9-osnet-onnx-artifact.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install official CPU-only Torch stack in CI rather than filling the C720P
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir torch==2.8.0 torchvision==0.23.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir \
            torchreid==0.2.5 onnx==1.19.0 onnxruntime==1.22.1 \
            numpy==1.26.4 gdown pillow scipy imageio h5py scikit-learn \
            yacs tqdm cython tensorboard opencv-python-headless==4.10.0.84 \
            huggingface_hub
      - name: Resolve real pretrained OSNet ImageNet checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          from huggingface_hub import hf_hub_download
          checkpoint=Path.home()/'.cache/torch/checkpoints/osnet_x1_0_imagenet.pth'
          checkpoint.parent.mkdir(parents=True,exist_ok=True)
          try:
              source=hf_hub_download(repo_id='kaiyangzhou/osnet',
                                     filename='osnet_x1_0_imagenet.pth')
              shutil.copy2(source,checkpoint)
              print('OSNET_PUBLIC_UPSTREAM_CHECKPOINT_STAGED')
          except Exception as exc:
              # torchreid pretrained=True is allowed to fetch its published
              # ImageNet weights via gdown when the HF mirror lacks the file.
              print('OSNET_HF_MIRROR_UNAVAILABLE_UPSTREAM_DOWNLOAD_REQUIRED',
                    type(exc).__name__)
          PY
      - name: Export static 512D model and numerically verify PyTorch vs ONNX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s9-models"
          python ops/c720p/s9-native-security/offline-worker/export-osnet-512d.py \
            --output "$RUNNER_TEMP/s9-models/visual_backbone_512d.onnx" \
            --manifest "$RUNNER_TEMP/s9-models/visual_backbone_512d.manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'s9-models/visual_backbone_512d.manifest.json'
          d=json.loads(p.read_text())
          assert d['pretrained'] is True
          assert d['input_shape']==[1,3,256,128]
          assert d['output_shape']==[1,512]
          assert d['cosine_torch_onnx']>=.999
          assert d['pretrained_backbone_coverage']>=.90
          print('OSNET_REAL_PRETRAINED_EXPORT_CONTRACT_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s9-osnet-512d-onnx-verified
          path: ${{ runner.temp }}/s9-models/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: s9-osnet-512d-onnx-verified
          path: ${{ runner.temp }}/s9-publish
      - name: Verify manifest and publish checksummed public model asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/s9-publish"
          python3 - "$folder" <<'PY'
          import hashlib,json,pathlib,sys
          d=pathlib.Path(sys.argv[1])
          m=json.loads((d/'visual_backbone_512d.manifest.json').read_text())
          model=d/'visual_backbone_512d.onnx'
          sha=hashlib.sha256(model.read_bytes()).hexdigest()
          if (sha!=m['sha256'] or model.stat().st_size!=m['bytes']
              or m['cosine_torch_onnx']<.999
              or m['input_shape']!=[1,3,256,128]
              or m['output_shape']!=[1,512]
              or m.get('pretrained_backbone_coverage',0)<.9
              or m.get('pretrained_checkpoint_sha256')!='fe2d63f9157c28a4a8d8ca29bec12d5b2988ac0346d712025789ea9174968e79'):
              raise SystemExit('OSNet export/manifest integrity validation failed')
          print('S9_OSNET_PUBLIC_RELEASE_ARTIFACT_VERIFIED '+sha)
          PY
          tag='s9-offline-osnet-x1-0-512d-20261019'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'OSNet release already exists; refusing to overwrite model'
            exit 1
          fi
          gh release create "$tag" "$folder/visual_backbone_512d.onnx"             "$folder/visual_backbone_512d.manifest.json"             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease             --title 'Verified OSNet x1.0 512D offline S9+ model'             --notes 'Pretrained OSNet x1.0, PyTorch-to-ONNX parity verified; standalone S9+ appearance-descriptor asset, no personal footage and no camera APK changes. Inspect accompanying SHA256 manifest. This is not evidence of biometric identity.'
          echo 'S9_OSNET_PUBLIC_RELEASE_PUBLISHED'
