name: Production repository governance finalization

on:
  push:
    branches:
      - ops/finalize-governance-20260816

permissions:
  contents: read
  issues: write

jobs:
  enforce-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOVERNANCE_ADMIN_TOKEN: ${{ secrets.GOVERNANCE_ADMIN_TOKEN }}
      GH_ISSUE_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact governance branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Enforce main PR and canonical CI gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOVERNANCE_ADMIN_TOKEN:-}" || { echo 'GOVERNANCE_ADMIN_TOKEN missing'; exit 1; }

          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          owner='JesperOaths'; repo='kale-nel'
          base=f'https://api.github.com/repos/{owner}/{repo}'
          token=os.environ['GOVERNANCE_ADMIN_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kalenel-governance-finalizer'}
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode()
            h=dict(headers)
            if data is not None: h['Content-Type']='application/json'
            r=urllib.request.Request(base+path,data=data,headers=h,method=method)
            try:
              with urllib.request.urlopen(r,timeout=30) as res:
                raw=res.read().decode(); return json.loads(raw) if raw else None
            except urllib.error.HTTPError as e:
              body=e.read().decode(errors='replace')
              print(f'GitHub API {method} {path} failed: HTTP {e.code}: {body}',file=sys.stderr); raise
          global_rule=req('GET','/rulesets/14810246')
          if global_rule.get('enforcement')!='active': raise SystemExit('Existing recovery ruleset is not active')
          if global_rule.get('conditions',{}).get('ref_name',{}).get('include')!=['~ALL']: raise SystemExit('Existing recovery ruleset target changed unexpectedly')
          global_types={r.get('type') for r in global_rule.get('rules',[])}
          if not {'deletion','non_fast_forward'}.issubset(global_types): raise SystemExit('Existing deletion/non-fast-forward protections missing')
          bypass=global_rule.get('bypass_actors') or []
          if not bypass: raise SystemExit('Existing emergency recovery bypass missing; refusing governance mutation')
          if global_rule.get('current_user_can_bypass')!='always': raise SystemExit('Current admin token cannot exercise existing emergency recovery bypass')
          desired={
            'name':'Main PR and CI gate','target':'branch','enforcement':'active','bypass_actors':bypass,
            'conditions':{'ref_name':{'include':['refs/heads/main'],'exclude':[]}},
            'rules':[
              {'type':'pull_request','parameters':{'allowed_merge_methods':['merge','squash','rebase'],'dismiss_stale_reviews_on_push':False,'require_code_owner_review':False,'require_last_push_approval':False,'required_approving_review_count':0,'required_review_thread_resolution':False}},
              {'type':'required_status_checks','parameters':{'required_status_checks':[{'context':'verify','integration_id':15368},{'context':'audit','integration_id':15368}],'strict_required_status_checks_policy':True,'do_not_enforce_on_create':False}}
            ]
          }
          all_rules=req('GET','/rulesets')
          matches=[r for r in all_rules if r.get('name')==desired['name']]
          if len(matches)>1: raise SystemExit('Multiple Main PR and CI gate rulesets already exist; refusing ambiguous mutation')
          if matches:
            rid=matches[0]['id']; result=req('PUT',f'/rulesets/{rid}',desired); action='updated'
          else:
            result=req('POST','/rulesets',desired); rid=result['id']; action='created'
          result=req('GET',f'/rulesets/{rid}')
          if result.get('name')!=desired['name'] or result.get('enforcement')!='active': raise SystemExit('Main gate not active after write')
          if result.get('conditions',{}).get('ref_name',{}).get('include')!=['refs/heads/main']: raise SystemExit('Main gate is not scoped exactly to main')
          if result.get('bypass_actors')!=bypass: raise SystemExit('Emergency recovery bypass was not preserved exactly')
          if result.get('current_user_can_bypass')!='always': raise SystemExit('Current admin lost emergency bypass on new gate')
          rules={r['type']:r for r in result.get('rules',[])}
          if 'pull_request' not in rules or 'required_status_checks' not in rules: raise SystemExit('Required main governance rules missing')
          if (rules['pull_request'].get('parameters') or {}).get('required_approving_review_count')!=0: raise SystemExit('Unexpected review approval requirement')
          checks=rules['required_status_checks'].get('parameters') or {}
          got={(x.get('context'),x.get('integration_id')) for x in checks.get('required_status_checks',[])}
          if got!={('verify',15368),('audit',15368)}: raise SystemExit(f'Canonical status check set mismatch: {got!r}')
          if checks.get('strict_required_status_checks_policy') is not True: raise SystemExit('Strict status-check policy not enabled')
          global_after=req('GET','/rulesets/14810246')
          for key in ('name','target','enforcement','conditions','rules','bypass_actors'):
            if global_after.get(key)!=global_rule.get(key): raise SystemExit(f'Existing global recovery ruleset changed unexpectedly: {key}')
          safe={'action':action,'ruleset_id':rid,'name':result.get('name'),'enforcement':result.get('enforcement'),'target_include':result.get('conditions',{}).get('ref_name',{}).get('include'),'required_checks':['GEJAST verification / verify','Dependency security / audit'],'strict_status_checks':True,'pull_request_required':True,'approvals_required':0,'allowed_merge_methods':['merge','squash','rebase'],'emergency_bypass_preserved':True,'current_admin_can_bypass':result.get('current_user_can_bypass'),'global_ruleset_14810246_unchanged':True}
          json.dump(safe,open('/tmp/governance-proof.json','w'),indent=2); print(json.dumps(safe,indent=2))
          PY

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/governance-proof.json'))
          lines=[
            '## Repository governance finalization proof','',
            'The explicitly authorized production governance change has been applied and read back from GitHub.','',
            f"- Main-only ruleset: `{p['name']}` (id `{p['ruleset_id']}`)",
            f"- Enforcement: `{p['enforcement']}`",
            f"- Target: `{p['target_include'][0]}` only",
            f"- Pull request required: `{p['pull_request_required']}`",
            f"- Required approvals: `{p['approvals_required']}`",
            '- Required checks: `GEJAST verification / verify`, `Dependency security / audit`',
            f"- Strict status-check policy: `{p['strict_status_checks']}`",
            '- Existing deletion + non-fast-forward ruleset `14810246`: unchanged',
            '- Existing owner/admin emergency recovery bypass: preserved exactly',
            f"- Current admin can exercise recovery bypass: `{p['current_admin_can_bypass']}`",'',
            'This resolves the governance policy and enforcement boundary without making the path-filtered Paardenrace proof globally required.'
          ]
          json.dump({'body':'\n'.join(lines)+'\n'},open('/tmp/issue-comment.json','w'))
          PY
          curl -fsS -X POST -H "Authorization: Bearer ${GH_ISSUE_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary @/tmp/issue-comment.json 'https://api.github.com/repos/JesperOaths/kale-nel/issues/110/comments' >/dev/null
          echo 'RESULT=MAIN_PR_AND_CANONICAL_CI_GOVERNANCE_PASS'
