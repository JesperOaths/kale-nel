name: v796 exact-main rebuild

on:
  push:
    branches: [agent/v796-legacy-klaverjas-live-alias]
    paths: ['.github/workflows/v796-rebuild-on-current-main.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v796-legacy-klaverjas-live-alias
          fetch-depth: 1
      - name: Rebuild v796 from exact current main
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function rep(path,from,to){const before=fs.readFileSync(path,'utf8');const after=before.replace(from,to);if(after===before)throw new Error(`${path}: replacement missing`);fs.writeFileSync(path,after);}
          fs.writeFileSync('VERSION','v796\n');
          const archiveLine="  if (/_(?:v\\d+|orig)\\.html$/i.test(base)) return true;\n";
          for(const path of ['check-version-drift.mjs','fix-version-drift.mjs']) rep(path,archiveLine,'');
          fs.writeFileSync('klaverjas_live_v596.html',`<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,max-image-preview:none"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Klaverjas live</title><script>window.GEJAST_PAGE_VERSION='v796';</script><script>(function(){const source=new URLSearchParams(location.search||'');const url=new URL('./klaverjas_live.html',location.href);source.forEach((value,key)=>url.searchParams.set(key,value));const legacy=source.get('match_id');if(legacy&&!source.get('client_match_id'))url.searchParams.set('client_match_id',legacy);url.searchParams.delete('match_id');location.replace(url.toString());})();</script></head><body><div class="site-credit-watermark" data-version-watermark>v796  -  Made by Bruis</div></body></html>\n`);
          NODE
          node fix-version-drift.mjs
          node <<'NODE'
          const fs=require('fs');
          const beta=JSON.parse(fs.readFileSync('beta-readiness.json','utf8')); beta.site_version='release candidate v796 / live v795'; beta.last_updated='2026-08-16'; if(beta.deployment_identity){beta.deployment_identity.live_version='v795';beta.deployment_identity.release_candidate_version='v796';} fs.writeFileSync('beta-readiness.json',JSON.stringify(beta,null,2)+'\n');
          const gameplay=JSON.parse(fs.readFileSync('gameplay-acceptance.json','utf8')); gameplay.site_version='v796'; gameplay.last_updated='2026-08-16'; fs.writeFileSync('gameplay-acceptance.json',JSON.stringify(gameplay,null,2)+'\n');
          const checklist=JSON.parse(fs.readFileSync('beta-live-write-checklist.json','utf8')); checklist.site_version='v796'; fs.writeFileSync('beta-live-write-checklist.json',JSON.stringify(checklist,null,2)+'\n');
          const cert=JSON.parse(fs.readFileSync('release-certification.json','utf8')); cert.current_version='v796'; cert.status='REVALIDATION_REQUIRED'; cert.current_audit_issue=153; cert.reason='v796 preserves the v795 gameplay, feature-surface, watermark and v794 status repairs while replacing the sole publicly published exact-version Klaverjas legacy live page with a canonical compatibility redirect and making public exact-version HTML visible to version-drift verification. Exact-main v796 deployment and complete visual revalidation remain required; successful exact-v795 gameplay and feature-surface proofs remain applicable because v796 changes no gameplay or feature owner.'; fs.writeFileSync('release-certification.json',JSON.stringify(cert,null,2)+'\n');

          let v795=fs.readFileSync('check-v795-visible-watermark-sync.mjs','utf8');
          v795=v795.replace("assert.equal(version,'v795','v795 watermark repair must carry VERSION v795');","const currentVersion=Number((version.match(/\\d+/)||['0'])[0]);\nassert.ok(currentVersion>=795,'v795 watermark repair contract requires VERSION v795 or newer');");
          v795=v795.replace(/assert\(body\.includes\('v796  -  Made by Bruis'\),`\$\{file\} must expose the synchronized v795 visible watermark`\);|assert\(body\.includes\('v795  -  Made by Bruis'\),`\$\{file\} must expose the synchronized v795 visible watermark`\);/,"assert(body.includes(`${version}  -  Made by Bruis`),`${file} must expose the synchronized current visible watermark`);");
          v795=v795.replace("if(/_(?:v\\d+|orig)\\.html$/i.test(base)) return true; ","");
          fs.writeFileSync('check-v795-visible-watermark-sync.mjs',v795);

          fs.writeFileSync('check-v796-published-versioned-html.mjs',`#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\nconst version=fs.readFileSync('VERSION','utf8').trim();\nconst currentVersion=Number((version.match(/\\d+/)||['0'])[0]);\nassert.ok(currentVersion>=796,'v796 legacy public-route repair contract requires VERSION v796 or newer');\nfor(const owner of ['check-version-drift.mjs','fix-version-drift.mjs']){const body=fs.readFileSync(owner,'utf8');assert(!body.includes('/_(?:v\\\\d+|orig)\\\\.html$/i'),\`\${owner} must not classify publicly shipped versioned HTML as archived by filename\`);}\nconst ignoredDirs=new Set(['.git','node_modules','dist','build','.next','.vercel','coverage','tmp','temp','patch_bundles','repo','mnt','cloudflare']);\nfunction walk(dir,out=[]){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){if(entry.isDirectory()){if(!ignoredDirs.has(entry.name))walk(path.join(dir,entry.name),out);}else out.push(path.join(dir,entry.name));}return out;}\nconst versioned=walk(process.cwd()).map(file=>path.relative(process.cwd(),file).replaceAll('\\\\','/')).filter(rel=>/_(?:v\\d+)\\.html$/i.test(path.basename(rel)));\nassert.deepEqual(versioned,['klaverjas_live_v596.html'],'the sole published exact-version HTML compatibility route must remain explicit');\nconst alias=fs.readFileSync('klaverjas_live_v596.html','utf8');\nassert(alias.length<1800,'legacy Klaverjas live compatibility route must remain redirect-only and small');\nassert(alias.includes("new URL('./klaverjas_live.html'"),'legacy route must hand off to canonical Klaverjas live');\nassert(alias.includes("source.get('match_id')")&&alias.includes("url.searchParams.set('client_match_id',legacy)"),'legacy match_id must translate to client_match_id');\nassert(alias.includes('location.replace(url.toString())'),'legacy route must replace itself with canonical route');\nfor(const forbidden of ['supabase','<form','<button','fetch(','get_public_state'])assert(!alias.toLowerCase().includes(forbidden.toLowerCase()),\`legacy alias retained obsolete owner: \${forbidden}\`);\nassert(alias.includes(\`\${version}  -  Made by Bruis\`),'legacy alias must expose current watermark fallback');\nconsole.log('v796 published versioned HTML compatibility boundary ok for',version);\n`);

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const marker='node check-v795-visible-watermark-sync.mjs'; const next='node check-v796-published-versioned-html.mjs'; if(!pkg.scripts['verify:static'].includes(next)){if(!pkg.scripts['verify:static'].includes(marker))throw new Error('v795 verifier marker missing');pkg.scripts['verify:static']=pkg.scripts['verify:static'].replace(marker,`${marker} && ${next}`);} fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Commit rebuilt v796 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rebuild v796 legacy-route repair on current main'
          git push origin HEAD:agent/v796-legacy-klaverjas-live-alias
