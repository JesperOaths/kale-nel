name: Push tote v838 PR branch

on:
  push:
    paths:
      - '.github/workflows/push-tote-v838-branch.yml'

permissions:
  contents: write

jobs:
  build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse verified v838 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-tote-handle-color-v838.yml').read_text()
          start_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'tote-v838-patch.py', 'exec'), {})
          Path('.github/workflows/push-tote-v838-branch.yml').unlink()
          PY

      - name: Verify v838 source contract
        shell: bash
        run: |
          node --check shop/tote-handle-color-v838.js
          node check-shop-commerce-v817.mjs

      - name: Push PR branch
        shell: bash
        run: |
          git config user.name "JesperOaths"
          git config user.email "150788310+JesperOaths@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v838: tote handle color selection"
          git push --force-with-lease origin HEAD:agent/v838-tote-handle-color
