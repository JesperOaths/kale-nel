name: C720P S9 verified APK migration
on:
  pull_request:
    paths:
      - 'ops/c720p/offload-stale-build-evidence-s9-ram-v2.py'
      - '.github/workflows/c720p-s9-archive-20261014.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/offload-stale-build-evidence-s9-ram-v2.py'
      - '.github/workflows/c720p-s9-archive-20261014.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-verified-migration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/offload-stale-build-evidence-s9-ram-v2.py
          python3 ops/c720p/test-offload-stale-build-evidence-s9-ram-v2.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/offload-stale-build-evidence-s9-ram-v2.py').read_text()
          candidates=s.split('HISTORICAL_APK_GENERATIONS = (',1)[1].split(')',1)[0]
          assert '"s9-detection-review-v38"' in candidates
          assert '"s9-detection-review-v39"' in candidates
          assert '"s9-night-detection-v41"' not in candidates
          assert 'active == checksum' in s
          assert 'remote_hash(final) != checksum' in s
          print('S9_ARCHIVE_HISTORIC_APK_SAFETY_SCOPE_PASS')
          PY
  migrate:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Archive eligible old APKs to S9 microSD
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          file='ops/c720p/offload-stale-build-evidence-s9-ram-v2.py'
          sum="$(sha256sum "$file" | cut -d' ' -f1)"
          remote="/tmp/c720p-s9-archive-${GITHUB_SHA:0:12}.py"
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${file}"
          command="curl -fSsL --max-time 30 '${origin}' -o '${remote}' && printf '%s  %s\\n' '${sum}' '${remote}' | sha256sum -c - >/dev/null && python3 '${remote}' --execute"
          key="s9-archive-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v command="$command" -v key="$key" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-verified-archive','maintenance',:'command',780,:'key');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "S9_ARCHIVE_MIGRATION_JOB=$job"
          for i in $(seq 1 115); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 22000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q 'S9_RAM_OFFLOAD_RESULT' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
