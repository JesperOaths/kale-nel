name: S9 People & Faces V45 real workspace
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/test-people-v45.js'
      - 'ops/c720p/s9-native-security/deploy-people-v45.py'
      - 'ops/c720p/s9-native-security/test-route-v50-idempotent.py'
      - '.github/workflows/c720p-s9-people-v45.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-people-v45.html'
      - 'ops/c720p/s9-native-security/security-people-v45.js'
      - 'ops/c720p/s9-native-security/test-people-v45.js'
      - '.github/workflows/c720p-s9-people-v45.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exercise real UI and secure review actions
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-people-v45.js
          python3 -m py_compile ops/c720p/s9-native-security/deploy-people-v45.py
          python3 ops/c720p/s9-native-security/test-route-v50-idempotent.py
          python3 - <<'PY'
          from pathlib import Path
          d=Path("ops/c720p/s9-native-security/deploy-people-v45.py").read_text()
          for marker in ("c720p-surveillance.html", "security-people-v33.html",
                         "security-people-v50.html", "security-tracks-v50.html",
                         "security-visible-route-v50-20261018", "legacy_route_redirected",
                         "fresh_iframe_assets_installed", "archive_records_disappeared",
                         "HA_not_serving_new_version_", "S9_PEOPLE_V45_DEPLOY_ROLLED_BACK"):
              assert marker in d,marker
          print("S9_VISIBLE_IFRAME_ROUTE_CONTRACT_PASS")
          PY
