name: Build v801a Toepen owner guard retry

on:
  push:
    branches: [sql/v801a-toepen-idempotency-owner-guard]
    paths: ['.github/workflows/build-v801a-toepen-owner-guard-retry.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: sql/v801a-toepen-idempotency-owner-guard
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Generate and verify repair
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/build-v801a-toepen-owner.py
          node check-toepen-idempotency-owner-guard-v801a.mjs
          npm run verify:static
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GEJAST_v801a_toepen_idempotency_owner_guard.sql GEJAST_v801a_toepen_idempotency_owner_guard_ROLLBACK.sql check-toepen-idempotency-owner-guard-v801a.mjs package.json
          git commit -m 'fix: guard Toepen idempotent replay ownership'
          git push origin HEAD:sql/v801a-toepen-idempotency-owner-guard
