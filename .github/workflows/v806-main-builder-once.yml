name: One-shot v806 branch builder

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v806-main-builder-once.yml']

permissions:
  contents: write

jobs:
  build-v806:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v806-canonical-session-runtime
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply deterministic v806 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-v806-canonical-session-runtime.py
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('release-certification.json')
          old=json.loads(p.read_text())
          data={
            'schema_version': 1,
            'current_version': 'v806',
            'status': 'REVALIDATION_REQUIRED',
            'previous_certified_version': 'v805',
            'previous_certified_product_sha': 'b64a116f2b2684d1fbd475b40c2b76f569d40942',
            'previous_certified_release_branch': 'release/v805-certified-20260818',
            'previous_certified_tag': 'v805-certified-20260818',
            'reason': 'v806 changes shipped player-session runtime and nested shared-asset resolution; fresh exact-current evidence is required before PASS.',
            'remaining_release_blockers': [
              'Fresh exact-current v806 live health must pass.',
              'Fresh exact-current v806 multi-context/deep gameplay must pass.',
              'Fresh authenticated v806 visual audit plus manual screenshot review must pass.',
              'Controlled production fixtures must be independently verified at zero residue.'
            ],
            'required_next': [
              'Run exact-current health.',
              'Run deep live gameplay acceptance.',
              'Run full authenticated visual audit and manually inspect the artifact.',
              'Verify zero residue and then write final-acceptance-v806.json before setting PASS.'
            ],
            'previous_certification_snapshot': {
              'certified_at': old.get('certified_at'),
              'visual_artifact_sha256': (old.get('authoritative_evidence') or {}).get('post_v801a_visual_artifact_sha256')
            }
          }
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          node check-version-drift.mjs
          node check-v806-canonical-session-runtime.mjs
          node check-release-certification-state.mjs
          npm ci
          npm run verify
      - name: Commit only the v806 product candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v806-canonical-session-runtime.yml
          rm -f scripts/prepare-v806-canonical-session-runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: canonicalize session runtime and family assets v806'
          git push origin HEAD:agent/v806-canonical-session-runtime
          echo 'RESULT=V806_BRANCH_BUILDER_PASS'
