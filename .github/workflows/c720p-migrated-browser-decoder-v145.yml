name: C720P decoded authenticated S9 migrated video smoke V145
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-migrated-decoded-browser-v145.py'
      - 'ops/c720p/security-runtime/test-migrated-decoded-browser-v145.py'
      - '.github/workflows/c720p-migrated-browser-decoder-v145.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-migrated-decoded-browser-v145.py'
      - 'ops/c720p/security-runtime/test-migrated-decoded-browser-v145.py'
      - '.github/workflows/c720p-migrated-browser-decoder-v145.yml'
permissions:
  contents: read
concurrency:
  group: c720p-migrated-decoded-browser-v145
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fail closed on metadata-only or no decoded video frames
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/smoke-c720p-migrated-decoded-browser-v145.py"
          python3 "$d/test-migrated-decoded-browser-v145.py"
          python3 "$d/test-smoke-c720p-legacy-auth-browser-v136.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Sample short muted migrated S9 video in disposable HA tab
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          file="ops/c720p/security-runtime/smoke-c720p-migrated-decoded-browser-v145.py"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          stage="/tmp/s9-migrated-browser-v145-${GITHUB_SHA:0:14}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
          cmd="curl -fsSL --max-time 35 '$uri' -o '$stage' && printf '%s  %s\\n' '$digest' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage' && /usr/bin/python3 '$stage' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-migrated-decoded-v145-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-migrated-decoded-v145','diagnostic',:'cmd',380,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_MIGRATED_BROWSER_DECODE_V145_JOB=$job"
          for attempt in $(seq 1 125); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3000)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              grep -q 'C720P_MIGRATED_BROWSER_DECODE_V145_VERIFIED' <<< "$output"
              grep -q '"authenticated_migrated_video_decoded": true' <<< "$output"
              grep -q '"decoded_frames":' <<< "$output"
              grep -q '"no_originals_modified": true' <<< "$output"
              grep -q '"no_manual_reviews_modified": true' <<< "$output"
              grep -q '"camera_dropped_output_frames_after": 0' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "S9 migrated video browser decode was not proven";exit 1
