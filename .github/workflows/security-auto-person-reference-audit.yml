name: Automatic Person real reference coverage audit
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/audit-auto-person-reference-readiness.py'
      - 'ops/c720p/s9-native-security/test-auto-person-face-specific-audit-v117.py'
      - '.github/workflows/security-auto-person-reference-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/audit-auto-person-reference-readiness.py'
      - 'ops/c720p/s9-native-security/test-auto-person-face-specific-audit-v117.py'
      - '.github/workflows/security-auto-person-reference-audit.yml'
permissions:
  contents: read
concurrency:
  group: c720p-automatic-person-readonly-reference-audit
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check bounded, metadata-only inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/audit-auto-person-reference-readiness.py
          python3 ops/c720p/s9-native-security/test-auto-person-face-specific-audit-v117.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('ops/c720p/s9-native-security/audit-auto-person-reference-readiness.py').read_text()
          for banned in ("method='POST'","method=\"POST\"","video.play(", "manualLink(", "subprocess", "face_image_bytes"):
              assert banned not in src,banned
          for required in ("face_alignment_verified", "face_crop_requires_manual_review","approved_by_folder","drive_recordings"):
              assert required in src,required
          print('AUTO_PERSON_FACE_READINESS_READONLY_SOURCE_PASS')
          PY
  audit:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run metadata-only SD and Drive reference audit on C720P
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          src='ops/c720p/s9-native-security/audit-auto-person-reference-readiness.py'
          hash="$(sha256sum "$src" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
          dest="/tmp/security-auto-reference-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 35 '$url' -o '$dest' && printf '%s  %s\n' '$hash' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest'"
          idem="security-auto-face-reference-audit-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-auto-person-reference','diagnostic',:'cmd',230,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_AUTO_PERSON_EVIDENCE_AUDIT_JOB=$id"
          for i in $(seq 1 50); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              stdout="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              stderr="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 2200)"
              echo "$stdout"
              if [[ "$state" != 'done|0' ]]; then echo "$stderr";exit 1;fi
              grep -q 'S9_AUTO_PERSON_REAL_EVIDENCE_READINESS' <<< "$stdout"
              exit 0
            fi
            sleep 4
          done
          exit 1
