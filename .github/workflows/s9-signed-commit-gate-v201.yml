name: S9 signed intent Keystore and two-store metadata gate V201
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedCommitGateV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedCommitGateTestV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-signed-commit-gate-v201.py'
      - '.github/workflows/s9-signed-commit-gate-v201.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedActionV198.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedCommitGateV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedSignedCommitGateTestV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-signed-commit-gate-v201.py'
      - '.github/workflows/s9-signed-commit-gate-v201.yml'
permissions:
  contents: read
jobs:
  host-signed-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Test independent source, user, nonce, time, signed POST and durability gates
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-signed-commit-gate-v201.py"
          python3 "$d/test-s9-signed-action-v198.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
          python3 "$d/test-s9-migrated-source-v198.py"
          python3 "$d/test-s9-ledger-internal-checkpoint-v196.py"
          python3 "$d/test-s9-migrated-ledger-v193.py"
          echo S9_SIGNED_GATE_V201_HOST_ONLY_NO_REMOTE_WRITE
      - name: Compile source-only S9 signer and coordinator for Android API 28 DEX
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/classes" "$tmp/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$tmp/classes" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedSignedActionV198.java" \
            "$d/S9MigratedSignedCommitGateV201.java" \
            "$d/S9MigratedVerifiedSourceV198.java"
          "$d8" --min-api 28 --output "$tmp/dex" $(find "$tmp/classes" -name '*.class' -print)
          test -s "$tmp/dex/classes.dex"
          echo S9_SIGNED_GATE_V201_ANDROID_DEX_COMPILED_NO_PHONE_INSTALL
