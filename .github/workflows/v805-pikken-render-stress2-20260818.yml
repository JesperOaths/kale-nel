name: v805 Pikken fresh-room render stress corrected

on:
  push:
    branches: [proof/v805-pikken-render-stress2-20260818]
    paths: ['.github/workflows/v805-pikken-render-stress2-20260818.yml']

permissions:
  contents: write

concurrency:
  group: v805-pikken-render-stress2-20260818
  cancel-in-progress: false

jobs:
  pikken-render-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_EXACT_MAIN_SHA: b64a116f2b2684d1fbd475b40c2b76f569d40942
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: '-c statement_timeout=20000'
    steps:
      - name: Check out exact-current proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v805-pikken-render-stress2-20260818
          fetch-depth: 0

      - name: Record proof run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s\n' "$GITHUB_RUN_ID" > .proof/v805-pikken-stress2-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v805-pikken-stress2-run-id.txt
          git commit -m 'test: record corrected v805 Pikken stress run id'
          git push origin HEAD:proof/v805-pikken-render-stress2-20260818

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prove exact v805 product tree and healthy data plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v805'
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v805'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^(scripts/v805-pikken-render-stress-proof\.mjs|\.github/workflows/v805-pikken-render-stress2-20260818\.yml|\.proof/v805-pikken-stress2-run-id\.txt)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof-branch drift:'; echo "$unexpected"; exit 1; }
          GEJAST_DATA_PLANE_TIMEOUT_MS=10000 GEJAST_DATA_PLANE_ATTEMPTS=2 GEJAST_DATA_PLANE_RETRY_DELAY_MS=750 node check-live-data-plane.mjs
          echo 'RESULT=V805_PIKKEN_STRESS2_EXACT_MAIN_PASS'

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Provision two hidden disposable players
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V805PkStress2A_${suffix}"
          name2="V805PkStress2B_${suffix}"
          pin1='4826'; pin2='7314'
          echo "::add-mask::$pin1"; echo "::add-mask::$pin2"
          {
            echo "GEJAST_PLAYER1_NAME=$name1"
            echo "GEJAST_PLAYER2_NAME=$name2"
          } >> "$GITHUB_ENV"
          timeout 25s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v805-pkstress2-a-'||lower(:'name1'),:'name1',true,'md5:'||md5(:'pin1'||':'||current_database()),true,true,true,'friends'),
            ('v805-pkstress2-b-'||lower(:'name2'),:'name2',true,'md5:'||md5(:'pin2'||':'||current_database()),true,true,true,'friends');
          SQL
          sessions="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          select public.account_login_v687(:'name1',:'pin1','friends','{"proof":"v805-pikken-stress2"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'name2',:'pin2','friends','{"proof":"v805-pikken-stress2"}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ && "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"; echo "::add-mask::$token2"
          {
            echo "GEJAST_PLAYER1_TOKEN=$token1"
            echo "GEJAST_PLAYER2_TOKEN=$token2"
          } >> "$GITHUB_ENV"
          echo 'RESULT=V805_PIKKEN_STRESS2_FIXTURES_PASS'

      - name: Run 20 fresh-room two-context stress cycles with no retries
        env:
          GEJAST_STRESS_CYCLES: '20'
        run: node scripts/v805-pikken-render-stress-proof.mjs

      - name: Cleanup controlled fixtures and prove zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ]; then echo 'No controlled identities were provisioned.'; exit 0; fi
          timeout 30s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          begin;
          delete from public.pikken_games where created_by_player_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'));
          delete from public.gejast_player_sessions_v746 where player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.players where display_name in (:'n1',:'n2') and hidden_from_public=true and is_dummy=true;
          commit;
          SQL
          residue="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select (select count(*) from public.players where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'))),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'n1',:'n2'));
          SQL
          )"
          test "$residue" = '0|0|0|0'
          echo 'RESULT=V805_PIKKEN_STRESS2_ZERO_RESIDUE_PASS'
