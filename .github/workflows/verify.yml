name: GEJAST verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'sql/**'

concurrency:
  group: gejast-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || vars.KALENEL_REQUIRE_PRIVATE_ADMIN_SOURCE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Reject untrusted private-source push
        if: github.event_name == 'push' && vars.KALENEL_REQUIRE_PRIVATE_ADMIN_SOURCE == '1' && github.actor != 'JesperOaths'
        run: |
          echo "Private admin source verification is restricted to trusted JesperOaths pushes." >&2
          exit 1

      - name: Validate optional private admin source for CI
        if: github.event_name == 'push' && github.actor == 'JesperOaths'
        shell: bash
        env:
          ADMIN_SOURCE_REPOSITORY: ${{ vars.KALENEL_ADMIN_SOURCE_REPOSITORY }}
          REQUIRE_PRIVATE_ADMIN_SOURCE: ${{ vars.KALENEL_REQUIRE_PRIVATE_ADMIN_SOURCE }}
          ADMIN_SOURCE_TOKEN: ${{ secrets.KALENEL_ADMIN_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          require_private="${REQUIRE_PRIVATE_ADMIN_SOURCE,,}"
          if [[ "$require_private" =~ ^(1|true|yes)$ ]] && [[ -z "${ADMIN_SOURCE_REPOSITORY:-}" ]]; then
            echo "Private admin source is required for verification but KALENEL_ADMIN_SOURCE_REPOSITORY is not configured." >&2
            exit 1
          fi
          if [[ -n "${ADMIN_SOURCE_REPOSITORY:-}" && -z "${ADMIN_SOURCE_TOKEN:-}" ]]; then
            echo "Private admin source repository is configured but KALENEL_ADMIN_SOURCE_TOKEN is missing." >&2
            exit 1
          fi

      - name: Check out private admin source for CI
        if: github.event_name == 'push' && github.actor == 'JesperOaths' && vars.KALENEL_ADMIN_SOURCE_REPOSITORY != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.KALENEL_ADMIN_SOURCE_REPOSITORY }}
          ref: ${{ vars.KALENEL_ADMIN_SOURCE_REF || 'main' }}
          token: ${{ secrets.KALENEL_ADMIN_SOURCE_TOKEN }}
          path: .private-admin-source
          persist-credentials: false

      - name: Overlay verified private admin source for legacy regressions
        if: github.event_name == 'push' && github.actor == 'JesperOaths' && vars.KALENEL_ADMIN_SOURCE_REPOSITORY != ''
        env:
          KALENEL_PRIVATE_ADMIN_SOURCE_DIR: ${{ github.workspace }}/.private-admin-source
        run: node scripts/overlay-private-admin-source.mjs
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Canonical repository verification
        run: npm run verify
      - name: v813 private security worker boundary
        run: node scripts/test-security-worker-gate-v813.mjs
      - name: v779 security live relay and auto-start boundary
        run: node scripts/test-security-v779-live-relay.mjs
      - name: v813 secure active-name compatibility runtime
        run: node scripts/test-auth-gate-active-names-v813.mjs
      - name: v813 bounded transient auth retry
        run: node scripts/test-auth-gate-transient-v813.mjs
      - name: v813 login-name public RPC boundary
        run: node scripts/test-login-names-fallback-v813.mjs
      - name: Independent static publication integrity
        run: node scripts/audit-v813-static-integrity.mjs
      - name: v812f direct data boundary
        run: node check-v812f-direct-data-boundary.mjs
      - name: v813h Paardenrace ladder scratch contract
        run: node scripts/check-v813h-paardenrace-ladder-contract.mjs
      - name: v813i read-path timeout hardening
        run: node scripts/check-v813i-read-path-timeout-hardening.mjs
      - name: v813 post-certification admin/drinks DB provenance
        run: node scripts/check-v813-post-cert-admin-drinks-hardening.mjs
      - name: v813 post-certification Web Push RPC hardening
        run: node scripts/check-v813-post-cert-web-push-rpc-hardening.mjs
      - name: v813 post-certification admin-session RPC hardening
        run: node scripts/check-v813-post-cert-admin-session-rpc-hardening.mjs
      - name: v813 final anonymous SECURITY DEFINER hardening
        run: node scripts/check-v813-final-anon-security-definer-hardening.mjs
      - name: Reconstructed Paardenrace RPC source safety
        run: node check-paardenrace-rpc-source-safety.mjs
      - name: Paardenrace backend minimum evidence
        run: node check-paardenrace-minimum-backend-v792.mjs
      - name: v814 Web Push display ACK lifecycle and provenance
        run: node scripts/check-v814-web-push-display-ack.mjs
