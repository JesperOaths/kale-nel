name: GEJAST verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: gejast-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: JavaScript syntax
        run: npm run verify:js

      - name: RPC coverage
        run: node check-rpc-coverage.mjs

      - name: Local reference integrity
        run: node check-local-refs.mjs

      - name: Online Klaverjas static regression
        run: npm run verify:klaverjas

      - name: Toepen static regression
        run: node check-toepen.mjs

      - name: Homepage root-fix regression
        run: node check-homepage-root-fixes.mjs

      - name: Active frontend encoding regression
        run: node check-active-frontend-encoding-v767.mjs

      - name: Klaverjas finished-game handoff regression
        run: node check-klaverjas-round-finish-handoff-v768.mjs

      - name: Klaverjas round scorer polish regression
        run: node check-klaverjas-round-scorer-polish-v769.mjs

      - name: Ballroom safe-read v769a repair boundary
        run: node check-ballroom-safe-read-repair-v769a.mjs

      - name: GitHub Actions Node24 runtime pins
        run: node check-github-actions-node24-runtime.mjs

      - name: Node24 CI runtime policy
        run: node check-node24-ci-runtime.mjs

      - name: Version drift gate
        run: node check-version-drift.mjs
