name: GEJAST verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: gejast-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: JavaScript syntax
        run: npm run verify:js

      - name: RPC coverage
        run: node check-rpc-coverage.mjs

      - name: Local reference integrity
        run: node check-local-refs.mjs

      - name: Online Klaverjas static regression
        run: npm run verify:klaverjas

      - name: Toepen static regression
        run: node check-toepen.mjs

      - name: Version drift report
        continue-on-error: true
        run: node check-version-drift.mjs
