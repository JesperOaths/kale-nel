name: GEJAST verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'sql/**'

concurrency:
  group: gejast-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Canonical repository verification
        run: npm run verify
      - name: v813 private security worker boundary
        run: node scripts/test-security-worker-gate-v813.mjs
      - name: v813 secure active-name compatibility runtime
        run: node scripts/test-auth-gate-active-names-v813.mjs
      - name: v813 bounded transient auth retry
        run: node scripts/test-auth-gate-transient-v813.mjs
      - name: v813 login-name public RPC boundary
        run: node scripts/test-login-names-fallback-v813.mjs
      - name: v813 certification session token contract
        run: node scripts/test-cert-session-token-contract-v813.mjs
      - name: v813 data-plane retry contract
        run: node scripts/test-data-plane-probe-contract-v813.mjs
      - name: Independent static publication integrity
        run: node scripts/audit-v813-static-integrity.mjs
      - name: v812f direct data boundary
        run: node check-v812f-direct-data-boundary.mjs
      - name: Reconstructed Paardenrace RPC source safety
        run: node check-paardenrace-rpc-source-safety.mjs
      - name: Paardenrace backend minimum evidence
        run: node check-paardenrace-minimum-backend-v792.mjs
