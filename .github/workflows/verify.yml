name: GEJAST verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

concurrency:
  group: gejast-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Canonical repository verification
        run: npm run verify
      - name: Reconstructed Paardenrace RPC source safety
        run: node check-paardenrace-rpc-source-safety.mjs
      - name: Paardenrace backend minimum evidence
        run: node check-paardenrace-minimum-backend-v792.mjs
