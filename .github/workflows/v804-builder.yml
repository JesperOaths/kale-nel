name: Build v804 idempotent v725 boot

on:
  push:
    branches: [agent/v804-v725-idempotent-boot]
    paths: ['.github/workflows/v804-builder.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v804-v725-idempotent-boot
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply narrow v804 repair and synchronize version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('gejast-v725-repair.js')
          s=p.read_text()
          replacements=[
            (
              "function patchPikkenPage(){ if(!/pikken\\.html/i.test(location.pathname)) return; try{",
              "function patchPikkenPage(){ if(!/pikken\\.html/i.test(location.pathname)) return; if(window.__gejastV725PikkenPagePatched) return; window.__gejastV725PikkenPagePatched=true; try{"
            ),
            (
              "function patchPaardenracePages(){ if(!/paardenrace(_live)?\\.html/i.test(location.pathname)) return; document.body.classList.add('gejast-v724-strong-card');",
              "function patchPaardenracePages(){ if(!/paardenrace(_live)?\\.html/i.test(location.pathname)) return; if(window.__gejastV725PaardenracePagePatched) return; window.__gejastV725PaardenracePagePatched=true; document.body.classList.add('gejast-v724-strong-card');"
            ),
            (
              "function boot(){ injectCss(); patchPikkenContract(); patchPikkenPage(); patchPaardenraceApi(); patchPaardenracePages(); patchHomepageLiveCards(); monitorPaardenraceLive(); }\n  ready(boot); setInterval(()=>{ boot(); if(!document.hidden) monitorPaardenraceLive(); },1000);",
              "let booted=false;\n  function boot(){ if(booted) return; booted=true; injectCss(); patchPikkenContract(); patchPikkenPage(); patchPaardenraceApi(); patchPaardenracePages(); patchHomepageLiveCards(); if(!document.hidden) monitorPaardenraceLive(); }\n  ready(boot);\n  if(!window.__gejastV725PaardenraceMonitorTimer){ window.__gejastV725PaardenraceMonitorTimer=setInterval(()=>{ if(!document.hidden) monitorPaardenraceLive(); },2500); }"
            )
          ]
          for old,new in replacements:
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one source match, got {count}: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          Path('VERSION').write_text('v804\n')
          PY
          node fix-version-drift.mjs
          npm ci
          npm run verify
      - name: Commit verified v804 product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JesperOaths'
          git config user.email '150788310+JesperOaths@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make legacy v725 boot idempotent'
          git push origin HEAD:agent/v804-v725-idempotent-boot
