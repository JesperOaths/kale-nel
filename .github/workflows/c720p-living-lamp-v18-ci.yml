name: Living-room lamp V18 motion regression

on:
  pull_request:
    paths:
      - 'ops/c720p/frontcam_motion_v18_normal_light_patch.py'
      - 'ops/c720p/tests/test_living_lamp_v18_contract.py'
      - '.github/workflows/c720p-living-lamp-v18-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/frontcam_motion_v18_normal_light_patch.py'
      - 'ops/c720p/tests/test_living_lamp_v18_contract.py'
      - '.github/workflows/c720p-living-lamp-v18-ci.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Compile and validate source guard contracts without device writes
        run: |
          python -m py_compile ops/c720p/frontcam_motion_v18_normal_light_patch.py
          python -m unittest discover -s ops/c720p/tests -p test_living_lamp_v18_contract.py -v
