name: C720P private Cloud browser inspect

on:
  push:
    branches: ['ops/c720p-drive-oauth-recovery']
    paths: ['.github/workflows/ops-c720p-cdp-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Relaunch only isolated OAuth browser and inspect Cloud page
        shell: python
        run: |
          import json, os, time, urllib.request
          token=os.environ['SUPABASE_ACCESS_TOKEN']; ref=os.environ['PROJECT_REF']
          api=f'https://api.supabase.com/v1/projects/{ref}/database/query'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          command_b64='  '
          def q(sql, read_only=False):
              req=urllib.request.Request(api,data=json.dumps({'query':sql,'read_only':read_only}).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=45) as r: return json.loads(r.read().decode())
          ins=f"insert into c720p_agent.jobs(command,timeout_seconds,idempotency_key) values (convert_from(decode('{command_b64}','base64'),'UTF8'),120,'oauth-cdp-inspect-20260916-v1') returning id,state;"
          row=q(ins)[0]; job=int(row['id']); print('JOB=',job)
          for i in range(45):
              time.sleep(4)
              r=q(f"select id,state,attempts,exit_code,finished_at,stdout,stderr from c720p_agent.jobs where id={job};",True)[0]
              print(f"POLL {i+1}: {r.get('state')} exit={r.get('exit_code')}")
              if r.get('state') in ('done','error','cancelled'):
                  print('=== STDOUT ==='); print(r.get('stdout') or '')
                  print('=== STDERR ==='); print(r.get('stderr') or '')
                  if r.get('state')!='done' or r.get('exit_code') not in (0,None): raise SystemExit(2)
                  break
          else: raise SystemExit('Timed out waiting for browser inspect')
