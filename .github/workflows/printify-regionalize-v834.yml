name: "Printify Gildan 5000 regionalization v834"

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regionalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Regionalize Gildan 5000 products
        shell: bash
        env:
          ENDPOINT: "https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-regionalize-gildan5000-v834"
          ADMIN_KEY: "uNw2kKDleHLyM4GyRm-ZbNzhs8czhHCYMPPtKZ6H4cPfqTFggrpGmZsQVx-kPOgX"
        run: |
          set -u
          failed=0
          for region in EU UK CA AU; do
            echo "=== ${region} ==="
            code=$(curl --silent --show-error --max-time 150 \
              --output "result-${region}.json" \
              --write-out '%{http_code}' \
              --request POST "$ENDPOINT" \
              --header 'content-type: application/json' \
              --header "x-admin-key: $ADMIN_KEY" \
              --data "{\"region\":\"${region}\"}") || code=000
            cat "result-${region}.json"
            echo
            if [ "$code" != "200" ]; then
              echo "HTTP failure for ${region}: ${code}"
              failed=1
              continue
            fi
            ok=$(jq -r '.ok // false' "result-${region}.json" 2>/dev/null || echo false)
            if [ "$ok" != "true" ]; then
              echo "Regionalization failed for ${region}"
              failed=1
            fi
          done
          exit "$failed"
