name: Apply tote handle-color v838

on:
  push:
    paths:
      - '.github/workflows/apply-tote-handle-color-v838.yml'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap tote handle-color v838')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v838 tote handle-color behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          # Catalog: all clothing stays white-only. Tote bags expose only Black/White handles.
          path = 'supabase/functions/shop-catalog-v828/index.ts'
          replace_once(path,
          '''function isWhiteVariant(product: any, variant: any) {
            if (variant?.is_enabled === false) return false;
            const color = resolvedOptions(product, variant).find((item) => item.type === "color");
            return !color || /^white$/i.test(text(color.value));
          }''',
          '''function isToteProduct(product: any) {
            return /\\btote\\b/i.test(text(product?.title));
          }
          function isPublicVariant(product: any, variant: any) {
            if (variant?.is_enabled === false) return false;
            const color = colorFrom(product, variant);
            if (isToteProduct(product)) return /^(?:black|white)$/i.test(color);
            return !color || /^white$/i.test(color);
          }''')
          replace_once(path,
          '''    .map((image: any, index: number) => ({ image: text(image?.src), label: text(image?.position || `View ${index + 1}`), index }))''',
          '''    .map((image: any, index: number) => ({
              image: text(image?.src),
              label: text(image?.position || `View ${index + 1}`),
              index,
              variantIds: Array.isArray(image?.variant_ids) ? image.variant_ids.map((id: unknown) => String(id)) : [],
            }))''')
          replace_once(path,
          '''  return media.slice(0, 24).map(({ image, label }: any) => ({ image, label }));''',
          '''  return media.slice(0, 24).map(({ image, label, variantIds }: any) => ({ image, label, variantIds }));''')
          replace_once(path,
          '''    .filter((variant: any) => isWhiteVariant(product, variant))''',
          '''    .filter((variant: any) => isPublicVariant(product, variant))''')
          replace_once(path,
          '''  const collection = collectionFor(product);
            return {''',
          '''  const collection = collectionFor(product);
            const colors = [...new Set(priced.map((variant: any) => text(variant?.color)).filter(Boolean))];
            const selectorType = isToteProduct(product) ? "handle-color" : "size";
            return {''')
          replace_once(path,
          '''    sizes, mockups, image: mockups[0]?.image || "", baseKey: String(product?.blueprint_id || "shirt"),''',
          '''    sizes, colors, selectorType, mockups, image: mockups[0]?.image || "", baseKey: String(product?.blueprint_id || "shirt"),''')
          replace_once(path,
          '''      ok: true, mode: "bruis-direct-catalog-v836", usesShopifyApi: false, whiteVariantsOnly: true,''',
          '''      ok: true, mode: "bruis-direct-catalog-v836", usesShopifyApi: false, whiteVariantsOnly: false, toteHandleColors: ["Black", "White"],''')

          # Checkout authority: accept only Black/White for a tote and retain the actual selected color.
          path = 'supabase/functions/shop-manual-checkout-v832/index.ts'
          replace_once(path,
          '''function isWhiteVariant(product: any, variant: any) {
            const color = optionValues(product, variant).find(x => x.type === "color")?.value;
            return !color || /^white$/i.test(text(color));
          }''',
          '''function colorFromVariant(product: any, variant: any) {
            return text(optionValues(product, variant).find(x => x.type === "color")?.value);
          }
          function isToteProduct(product: any) {
            return /\\btote\\b/i.test(text(product?.title));
          }
          function isCustomerVariantAllowed(product: any, variant: any) {
            const color = colorFromVariant(product, variant);
            if (isToteProduct(product)) return /^(?:black|white)$/i.test(color);
            return !color || /^white$/i.test(color);
          }''')
          replace_once(path,
          '''      if (!freshVariant || freshVariant?.is_enabled === false || freshVariant?.is_available === false || !isWhiteVariant(freshProduct, freshVariant)) throw new Error(`Selected variant is unavailable: ${clean(row.cached.product.name)}`);''',
          '''      if (!freshVariant || freshVariant?.is_enabled === false || freshVariant?.is_available === false || !isCustomerVariantAllowed(freshProduct, freshVariant)) throw new Error(`Selected variant is unavailable: ${clean(row.cached.product.name)}`);''')
          replace_once(path,
          '''      const size = sizeFromVariant(freshProduct, freshVariant) || text(cachedVariant.size).toUpperCase();
                subtotalCents += unit * qty;''',
          '''      const color = colorFromVariant(freshProduct, freshVariant) || "White";
                const size = isToteProduct(freshProduct)
                  ? `${color} handles`
                  : (sizeFromVariant(freshProduct, freshVariant) || text(cachedVariant.size).toUpperCase());
                subtotalCents += unit * qty;''')
          replace_once(path,
          '''        image: text(raw?.image || row.cached.product.image), collection: text(row.cached.product.collection), color: "White",''',
          '''        image: text(raw?.image || row.cached.product.image), collection: text(row.cached.product.collection), color,''')

          # Delivery preview: validate the same color exception and call it a handle color in parcel details.
          path = 'supabase/functions/shop-delivery-preview-v833/index.ts'
          replace_once(path,
          '''function isWhiteVariant(product: any, variant: any) {
            const color = optionValues(product, variant).find(x => x.type === "color")?.value;
            return !color || /^white$/i.test(text(color));
          }''',
          '''function colorFromVariant(product: any, variant: any) {
            return text(optionValues(product, variant).find(x => x.type === "color")?.value);
          }
          function isToteProduct(product: any) {
            return /\\btote\\b/i.test(text(product?.title));
          }
          function isCustomerVariantAllowed(product: any, variant: any) {
            const color = colorFromVariant(product, variant);
            if (isToteProduct(product)) return /^(?:black|white)$/i.test(color);
            return !color || /^white$/i.test(color);
          }''')
          replace_once(path,
          '''      if (!freshVariant || freshVariant?.is_enabled === false || freshVariant?.is_available === false || !isWhiteVariant(freshProduct, freshVariant)) throw new Error(`Selected variant is unavailable: ${clean(row.cached.product.name)}`);''',
          '''      if (!freshVariant || freshVariant?.is_enabled === false || freshVariant?.is_available === false || !isCustomerVariantAllowed(freshProduct, freshVariant)) throw new Error(`Selected variant is unavailable: ${clean(row.cached.product.name)}`);''')
          replace_once(path,
          '''      const cost = usdCentsToEurCents(sourceCost, fx);

                const candidates: any[] = [{''',
          '''      const cost = usdCentsToEurCents(sourceCost, fx);
                const color = colorFromVariant(freshProduct, freshVariant) || "White";
                const itemLabel = isToteProduct(freshProduct) ? `${color} handles` : clean(row.cached.variant.size);

                const candidates: any[] = [{''')
          p = Path(path)
          text = p.read_text()
          count = text.count('item_size: clean(row.cached.variant.size),')
          if count != 2:
              raise SystemExit(f'Expected 2 delivery item_size occurrences, got {count}')
          p.write_text(text.replace('item_size: clean(row.cached.variant.size),', 'item_size: itemLabel,'))

          # Frontend. We deliberately keep the existing data-size plumbing because the hardened
          # checkout uses it. For this product only, those values become Black/White and map to
          # the exact Printify variant IDs/SKUs. The gallery is filtered by Printify variant_ids.
          Path('shop/tote-handle-color-v838.js').write_text(r'''(() => {
            'use strict';
            const COLORS = Object.freeze(['Black', 'White']);
            const selected = new Map();
            const isTote = product => /\btote\b/i.test(String(product?.name || product?.title || product?.baseLabel || ''));
            const optionValue = (variant, name) => String((Array.isArray(variant?.options) ? variant.options : [])
              .find(option => String(option?.name || '').trim().toLowerCase() === String(name || '').trim().toLowerCase())?.value || '').trim();
            const colorOf = variant => String(variant?.handleColor || variant?.color || optionValue(variant, 'color') || '').trim();
            const allowed = value => COLORS.find(color => color.toLowerCase() === String(value || '').trim().toLowerCase()) || '';

            function viewsFor(product, color){
              const variant = (Array.isArray(product?.variants) ? product.variants : []).find(item => colorOf(item) === color);
              const variantId = String(variant?.id || '');
              const all = Array.isArray(product?.allMockups) ? product.allMockups : (Array.isArray(product?.mockups) ? product.mockups : []);
              if(!variantId) return all;
              const exact = all.filter(view => Array.isArray(view?.variantIds) && view.variantIds.map(String).includes(variantId));
              return exact.length ? exact : all;
            }

            function applyMedia(product, color){
              const views = viewsFor(product, color);
              product.mockups = views;
              product.image = views[0]?.image || product.image || '';
            }

            if(typeof normalizeProduct === 'function'){
              const previousNormalize = normalizeProduct;
              normalizeProduct = raw => {
                const product = previousNormalize(raw);
                if(!isTote(product)) return product;
                product.selectorType = 'handle-color';
                product.allMockups = Array.isArray(product.mockups) ? product.mockups.map(view => ({...view})) : [];
                product.variants = (Array.isArray(product.variants) ? product.variants : [])
                  .filter(variant => !!allowed(colorOf(variant)))
                  .map(variant => {
                    const color = allowed(colorOf(variant));
                    const physicalSize = String(variant?.size || optionValue(variant, 'size') || '').trim();
                    const options = (Array.isArray(variant?.options) ? variant.options : []).map(option =>
                      String(option?.name || '').trim().toLowerCase() === 'size'
                        ? {...option, value: color}
                        : {...option}
                    );
                    return {...variant, physicalSize, handleColor: color, size: color, options};
                  });
                const colors = COLORS.filter(color => product.variants.some(variant => colorOf(variant) === color));
                product.colors = colors;
                product.sizes = colors;
                const current = allowed(selected.get(String(product.id))) || colors[0] || 'Black';
                selected.set(String(product.id), current);
                applyMedia(product, current);
                return product;
              };
            }

            if(typeof renderProducts === 'function'){
              const previousRender = renderProducts;
              renderProducts = function(){
                if(Array.isArray(products)){
                  products.filter(isTote).forEach(product => {
                    const id = String(product.id);
                    const current = allowed(selected.get(id)) || product.sizes?.[0] || 'Black';
                    selected.set(id, current);
                    applyMedia(product, current);
                  });
                }
                previousRender();
                if(!Array.isArray(products)) return;
                products.filter(isTote).forEach(product => {
                  const id = String(product.id);
                  const select = document.querySelector(`[data-size="${CSS.escape(id)}"]`);
                  if(!select) return;
                  select.value = allowed(selected.get(id)) || product.sizes?.[0] || 'Black';
                  select.dataset.handleColor = 'true';
                  const label = select.closest('label');
                  if(label && label.firstChild?.nodeType === Node.TEXT_NODE) label.firstChild.nodeValue = 'Handle color\n            ';
                });
              };
            }

            document.addEventListener('change', event => {
              const select = event.target.closest?.('select[data-size][data-handle-color="true"]');
              if(!select) return;
              const id = String(select.dataset.size || '');
              const product = Array.isArray(products) ? products.find(item => String(item.id) === id) : null;
              const color = allowed(select.value);
              if(!product || !isTote(product) || !color) return;
              selected.set(id, color);
              applyMedia(product, color);
              renderProducts();
            });

            window.BRUIS_TOTE_HANDLE_COLOR_V838 = Object.freeze({
              version: 'v838',
              selectorLabel: 'Handle color',
              colors: COLORS,
              variantBoundMockups: true,
              exactVariantSelection: true
            });
          })();
          ''')

          # Wire the behavior before checkout captures add-to-cart and bump the visible version.
          path = 'shop/index.html'
          replace_once(path,
          '''  <script src="store.js?v=20260916-storefront-v837-r1" defer></script>''',
          '''  <script src="store.js?v=20260916-storefront-v837-r1" defer></script>
            <script src="tote-handle-color-v838.js?v=20260916-storefront-v838-r1" defer></script>''')
          replace_once(path, '<span class="version-watermark">v837</span>', '<span class="version-watermark">v838</span>')

          # Canonical source checker.
          path = 'check-shop-commerce-v817.mjs'
          p = Path(path); text = p.read_text()
          text = text.replace("const storefrontPolish = read('shop/storefront-polish-v832.js');", "const storefrontPolish = read('shop/storefront-polish-v832.js');\nconst toteHandleColor = read('shop/tote-handle-color-v838.js');")
          text = text.replace('// v837 presents the shop entirely as Bruis, keeps the cart control always available,', '// v838 keeps the Bruis checkout behavior and adds exact tote handle-color selection,')
          text = text.replace("assert.match(index, /customer-facing-checkout-v837\\.js/);", "assert.match(index, /customer-facing-checkout-v837\\.js/);\nassert.match(index, /tote-handle-color-v838\\.js\\?v=20260916-storefront-v838-r1/);\nassert.match(toteHandleColor, /Handle color/);\nassert.match(toteHandleColor, /variantBoundMockups:\\s*true/);\nassert.match(toteHandleColor, /exactVariantSelection:\\s*true/);")
          text = text.replace("assert.match(index, /version-watermark[^>]*>v837</);", "assert.match(index, /version-watermark[^>]*>v838</);")
          text = text.replace("assert.match(catalogEdge, /whiteVariantsOnly:\\s*true/);", "assert.match(catalogEdge, /whiteVariantsOnly:\\s*false/);\nassert.match(catalogEdge, /toteHandleColors:\\s*\\[\"Black\", \"White\"\\]/);\nassert.match(catalogEdge, /isPublicVariant/);\nassert.match(catalogEdge, /variantIds/);")
          text = text.replace("assert.match(checkoutEdge, /isWhiteVariant/);", "assert.match(checkoutEdge, /isCustomerVariantAllowed/);\nassert.match(checkoutEdge, /isToteProduct/);\nassert.match(checkoutEdge, /\\$\\{color\\} handles/);")
          text = text.replace('// Main deployment check validates the v837 customer shell and all authoritative', '// Main deployment check validates the v838 customer shell and all authoritative')
          text = text.replace("assert.match(liveShopCheck, /RESULT=V837_BRUIS_SHOP_PASS/);", "assert.match(liveShopCheck, /RESULT=V838_BRUIS_SHOP_PASS/);")
          text = text.replace("console.log('Shop commerce v837 Bruis-copy + shipping-total + sticky-cart + cost-plus-5 contract passed.');", "console.log('Shop commerce v838 tote-handle-color + Bruis-copy + shipping-total + sticky-cart + cost-plus-5 contract passed.');")
          p.write_text(text)

          # Live checker. It remains read-only; only assertions change.
          path = 'check-live-shop.mjs'
          p = Path(path); text = p.read_text()
          text = text.replace("assert.ok(Array.isArray(product?.sizes) && product.sizes.length > 0, `product ${product?.name} has no sizes`);", "if(!/\\btote\\b/i.test(String(product?.name || product?.baseLabel || ''))) assert.ok(Array.isArray(product?.sizes) && product.sizes.length > 0, `product ${product?.name} has no sizes`);")
          text = text.replace("assert.match(String(variant?.color || ''), /^white$/i, `${product?.name} exposed a non-white variant`);", "const tote = /\\btote\\b/i.test(String(product?.name || product?.baseLabel || ''));\n      if(tote) assert.match(String(variant?.color || ''), /^(?:black|white)$/i, `${product?.name} exposed an unsupported tote handle color`);\n      else assert.match(String(variant?.color || ''), /^white$/i, `${product?.name} exposed a non-white clothing variant`);")
          text = text.replace("assert.match(html, /version-watermark[^>]*>v837</, 'Live shop must expose v837 watermark');", "assert.match(html, /version-watermark[^>]*>v838</, 'Live shop must expose v838 watermark');")
          text = text.replace("assert.match(html, /direct-commerce-v832\\.js\\?v=20260916-storefront-v837-r1/, 'Live shop must load the v837 direct commerce bridge');", "assert.match(html, /direct-commerce-v832\\.js\\?v=20260916-storefront-v837-r1/, 'Live shop must retain the direct commerce bridge');\nassert.match(html, /tote-handle-color-v838\\.js\\?v=20260916-storefront-v838-r1/, 'Live shop must load tote handle-color behavior');")
          text = text.replace("console.log(`shop page: HTTP 200, v837 present, ${pageElapsed}ms`);", "console.log(`shop page: HTTP 200, v838 present, ${pageElapsed}ms`);")
          marker = "const bridge = await textAsset(DIRECT_BRIDGE_URL, 'direct-commerce-v832.js');"
          if marker not in text: raise SystemExit('Missing live checker bridge marker')
          text = text.replace(marker, "const toteUi = await textAsset('https://kalenel.nl/shop/tote-handle-color-v838.js?v=20260916-storefront-v838-r1', 'tote-handle-color-v838.js');\nassert.match(toteUi, /Handle color/, 'tote selector must be Handle color');\nassert.match(toteUi, /Black.*White|White.*Black/s, 'tote selector must expose Black and White');\nassert.match(toteUi, /variantBoundMockups:\\s*true/, 'tote gallery must use selected-variant mockups');\nassert.match(toteUi, /exactVariantSelection:\\s*true/, 'tote cart must use the exact selected variant');\n\n" + marker, 1)
          text = text.replace("assert.equal(catalogHealth?.whiteVariantsOnly, true, 'catalog health must report white-only variants');", "assert.equal(catalogHealth?.whiteVariantsOnly, false, 'catalog health must report the tote color exception');\nassert.deepEqual(catalogHealth?.toteHandleColors, ['Black', 'White'], 'catalog health must expose exactly Black and White tote handle colors');")
          text = text.replace("console.log('RESULT=V837_BRUIS_SHOP_PASS');", "console.log('RESULT=V838_BRUIS_SHOP_PASS');")
          p.write_text(text)

          # Self-delete one-shot workflow so it cannot linger or rerun accidentally.
          Path('.github/workflows/apply-tote-handle-color-v838.yml').unlink()
          PY

      - name: Verify source contract
        shell: bash
        run: |
          node --check shop/tote-handle-color-v838.js
          node check-shop-commerce-v817.mjs

      - name: Commit v838
        shell: bash
        run: |
          git config user.name "JesperOaths"
          git config user.email "150788310+JesperOaths@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v838: tote handle color selection"
          git push origin HEAD:main
