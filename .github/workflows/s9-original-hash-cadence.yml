      - 'ops/c720p/security-runtime/c720p-s9-original-hash-ledger-catchup-v2.conf'
      - 'ops/c720p/security-runtime/test-c720p-s9-original-hash-ledger-catchup-v2.py'
      - '.github/workflows/s9-original-hash-cadence.yml'
  push:
    branches: [main]
