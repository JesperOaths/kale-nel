      - name: Preserve on-phone camera thermal gate and exclusive integrity locks
        run: |
          python3 ops/c720p/security-runtime/test-c720p-s9-original-hash-ledger-catchup-v2.py
          echo S9_INTEGRITY_CATCHUP_GUARDED
