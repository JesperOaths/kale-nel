name: Temporary Windows OpenClaw runner probe 20260916

on:
  push:
    branches:
      - ops/windows-openclaw-probe-20260916

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 3
    steps:
      - name: Probe Windows and OpenClaw without changes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "PROBE_TIME=$(Get-Date -Format o)"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "USERNAME=$env:USERNAME"
          Write-Output "USERPROFILE=$env:USERPROFILE"
          Write-Output "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Output "HOSTNAME=$(hostname)"
          $oc = Get-Command openclaw.cmd -ErrorAction SilentlyContinue
          if (-not $oc) { $oc = Get-Command openclaw -ErrorAction SilentlyContinue }
          if ($oc) {
            Write-Output "OPENCLAW_BIN=$($oc.Source)"
            & $oc.Source --version
            & $oc.Source gateway status --json
          } else {
            Write-Output 'OPENCLAW_BIN=NOT_ON_PATH'
            $fallback = 'C:\Users\jespe\AppData\Roaming\npm\openclaw.cmd'
            Write-Output "OPENCLAW_FALLBACK_EXISTS=$(Test-Path -LiteralPath $fallback)"
            if (Test-Path -LiteralPath $fallback) {
              & $fallback --version
              & $fallback gateway status --json
            }
          }
          try {
            $task = Get-ScheduledTask -TaskName 'OpenClaw Gateway' -ErrorAction Stop
            Write-Output "GATEWAY_TASK_STATE=$($task.State)"
            Write-Output "GATEWAY_TASK_PATH=$($task.TaskPath)"
          } catch {
            Write-Output 'GATEWAY_TASK=NOT_FOUND_OR_INACCESSIBLE'
          }
          try {
            $tcp = Test-NetConnection -ComputerName 127.0.0.1 -Port 18789 -InformationLevel Quiet
            Write-Output "PORT_18789=$tcp"
          } catch {
            Write-Output 'PORT_18789=PROBE_FAILED'
          }
