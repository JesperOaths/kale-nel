name: Verify six migrated C720P snapshots in authenticated Chromium V181
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-all-migrated-jpegs-v181.py'
      - 'ops/c720p/security-runtime/test-smoke-c720p-all-migrated-jpegs-v181.py'
      - '.github/workflows/c720p-six-migrated-jpegs-browser-v181.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-all-migrated-jpegs-v181.py'
      - 'ops/c720p/security-runtime/test-smoke-c720p-all-migrated-jpegs-v181.py'
      - '.github/workflows/c720p-six-migrated-jpegs-browser-v181.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c720p-six-private-jpegs-v181
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Six JPEG byte checks, negative Range, and browser privacy assertions
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/smoke-c720p-all-migrated-jpegs-v181.py"
          python3 "$d/test-smoke-c720p-all-migrated-jpegs-v181.py"
          python3 ops/c720p/s9-person-ml-v1/test-s9-c720p-snapshots-v163.py
          python3 "$d/test-smoke-c720p-all-migrated-browser-v146.py"
  physical:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate all six SHA-verified JPEGs on 8795, 8794, authenticated Chromium
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/c720p-jpeg-smoke-v181-${GITHUB_SHA:0:12}"
          cmd="umask 077 && install -d -m 700 '$stage'"
          for file in \
            "ops/c720p/security-runtime/smoke-c720p-all-migrated-jpegs-v181.py" \
            "ops/c720p/security-runtime/smoke-c720p-legacy-auth-browser-v136.py" \
            "ops/c720p/s9-person-ml-v1/s9_c720p_snapshots_v163.py"; do
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$digest' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/smoke-c720p-all-migrated-jpegs-v181.py' && /usr/bin/python3 '$stage/smoke-c720p-all-migrated-jpegs-v181.py' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-jpeg-v181-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-jpeg-browser-v181','diagnostic',:'cmd',580,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_JPEG_V181_JOB=$job"
          for n in $(seq 1 175); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 4300)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_S9_ALL_SNAPSHOTS_V181_VERIFIED' <<< "$output"
              grep -q 'C720P_S9_ALL_JPEG_HOST_V181_VERIFIED' <<< "$output"
              grep -q '"authenticated_all_six_jpegs": true' <<< "$output"
              grep -q '"sha256_matched_on_both_private_ports": 6' <<< "$output"
              grep -q '"camera_4k_ready_after": true' <<< "$output"
              grep -q '"c720p_mp4s_and_jpegs_still_required": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Six authenticated JPEG verification not complete";exit 1
