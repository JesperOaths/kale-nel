name: S9 rescan feedback API aggregate visibility V318
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_evidence_quality_v1.py'
      - 'ops/c720p/s9-native-security/test-s9-priority-feedback-api-v318.py'
      - 'ops/c720p/s9-native-security/test-s9-source-verified-gap-revocation-v355.py'
      - '.github/workflows/s9-priority-feedback-api-v318.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_evidence_quality_v1.py'
      - 'ops/c720p/s9-native-security/test-s9-priority-feedback-api-v318.py'
      - 'ops/c720p/s9-native-security/test-s9-source-verified-gap-revocation-v355.py'
      - '.github/workflows/s9-priority-feedback-api-v318.yml'
permissions:
  contents: read
jobs:
  source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile and test original evidence API plus no-identity aggregate feedback
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_evidence_quality_v1.py
          python3 ops/c720p/s9-native-security/test-s9-priority-feedback-api-v318.py
          python3 ops/c720p/s9-native-security/test-s9-source-verified-gap-revocation-v355.py
          python3 ops/c720p/s9-native-security/test-evidence-quality-v1.py
          echo S9_RESCAN_FEEDBACK_API_V318_NO_PHONE_ORIGINALS_OR_APPROVAL_MUTATION
