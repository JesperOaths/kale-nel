name: Automatic Person V63 real kiosk read-only acceptance
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/verify-automatic-person-v63-browser-readonly.py'
      - '.github/workflows/security-auto-person-v63-browser-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/verify-automatic-person-v63-browser-readonly.py'
      - '.github/workflows/security-auto-person-v63-browser-readonly.yml'
permissions:
  contents: read
concurrency:
  group: security-auto-person-v63-readonly-browser
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify browser probe cannot mutate a saved person or play media
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/verify-automatic-person-v63-browser-readonly.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/c720p/s9-native-security/verify-automatic-person-v63-browser-readonly.py')
          text=p.read_text()
          for forbidden in ('"method":"POST"',"'method':'POST'",'video.play(', 'manualLink(', 'human_confirmed:true', '.src=/new/saved/', "fetch('/new/saved/"):
              assert forbidden not in text,forbidden
          for required in ('Target.createTarget','Target.closeTarget','security_auto_person_browser_timeout','return true;'):
              assert required in text,required
          print('AUTO_PERSON_READONLY_CDP_CONTRACT_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify the actual Security tab with a disposable background browser
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security'
          tmp="/tmp/security-auto-v63-browser-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$tmp'"
          for name in security-step4-cdp-safe.py verify-automatic-person-v63-browser-readonly.py; do
            checksum="$(sha256sum "$root/$name" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$root/$name"
            cmd="$cmd && curl -fSsL --max-time 35 '$url' -o '$tmp/$name' && printf '%s  %s\n' '$checksum' '$tmp/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$tmp/verify-automatic-person-v63-browser-readonly.py'"
          idem="security-auto-v63-kiosk-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-auto-person-browser','diagnostic',:'cmd',230,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_AUTO_PERSON_BROWSER_JOB=$id"
          for i in $(seq 1 50); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              stdout="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 9000)"
              stderr="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 2500)"
              echo "$stdout"
              if [[ "$state" != 'done|0' ]]; then echo "$stderr";exit 1;fi
              grep -q 'SECURITY_AUTO_PERSON_V63_REAL_BROWSER_ACCEPTANCE_PASS' <<< "$stdout"
              exit 0
            fi
            sleep 4
          done
          exit 1
