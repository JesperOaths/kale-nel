name: Tune Rush live three-client smoke
on:
  pull_request:
    paths:
      - 'music/**'
      - 'sql/musicquiz*.sql'
      - 'supabase/functions/music-game-v1/**'
      - 'scripts/tune-rush-smoke.mjs'
      - '.github/workflows/tune-rush-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Live three-session anonymous guest acceptance
        run: node scripts/tune-rush-smoke.mjs
