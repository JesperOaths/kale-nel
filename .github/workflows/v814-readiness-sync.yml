name: One-shot v814 readiness metadata sync

on:
  push:
    branches:
      - agent/v814-web-push-display-ack

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Patch readiness metadata only
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='beta-readiness.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.site_version='release candidate v814 / live v813 / certified baseline v813';
          data.last_updated='2026-08-30';
          data.deployment_identity.live_version='v813';
          data.deployment_identity.release_candidate_version='v814';
          data.deployment_identity.note='v814 release candidate: explicit Web Push display-ACK telemetry is implemented with separate provider-accepted and browser-display states; production migrations are reconciled in source control and the permanent lifecycle/provenance guard is wired into CI. v813 remains the last fully certified baseline. Exact-current v814 deployment, controlled targeted display-ACK proof, authenticated visual/live-browser revalidation and zero-residue cleanup remain required before promotion.';
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n','utf8');
          NODE
          node check-beta-readiness-current-v770d.mjs
      - name: Commit readiness metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta-readiness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync v814 beta-readiness metadata'
          git push origin HEAD:agent/v814-web-push-display-ack
