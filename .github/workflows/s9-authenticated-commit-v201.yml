name: S9 signed source durable transaction V201 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAuthenticatedCommitV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAuthenticatedCommitTestV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-authenticated-commit-v201.py'
      - '.github/workflows/s9-authenticated-commit-v201.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAuthenticatedCommitV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedAuthenticatedCommitTestV201.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-authenticated-commit-v201.py'
      - '.github/workflows/s9-authenticated-commit-v201.yml'
permissions:
  contents: read
jobs:
  offline_synthetic_and_api28_dex:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify HMAC intent, original-source digest, human approval and both durable stores
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/test-s9-authenticated-commit-v201.py"
          python3 "$d/test-s9-authenticated-commit-v201.py"
          python3 "$d/test-s9-signed-action-v198.py"
          python3 "$d/test-s9-migrated-source-v198.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
          echo "V201_SYNTHETIC_ONLY_NO_PHONE_NO_MEDIA_MODIFICATIONS"
      - name: Compile full V201 chain as Android API 28 DEX without connecting to phone
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/classes" "$stage/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$stage/classes" \
            "$root/S9MigratedMetadataLedgerV193.java" \
            "$root/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$root/S9MigratedDualStoreCommitV197.java" \
            "$root/S9MigratedVerifiedSourceV198.java" \
            "$root/S9MigratedSignedActionV198.java" \
            "$root/S9MigratedAuthenticatedCommitV201.java"
          "$d8" --min-api 28 --output "$stage/dex" $(find "$stage/classes" -name '*.class' -print)
          python3 - "$stage/dex/classes.dex" <<'PY'
          from pathlib import Path
          import sys
          blob=Path(sys.argv[1]).read_bytes()
          assert blob.startswith(b'dex\n') and 3000<len(blob)<1500000
          print("S9_V201_ANDROID_API28_DEX_OK",len(blob))
          PY
