name: v787 family alias Firefox WebKit proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Firefox and WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps firefox webkit
      - name: Prove v787 Family aliases locally
        run: node scripts/v787-family-alias-browser-proof.mjs
