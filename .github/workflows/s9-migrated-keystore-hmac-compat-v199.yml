name: S9 metadata HMAC SecretKey compatibility V199
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerTrustedCheckpointV196.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreSignerTestV199.java'
      - '.github/workflows/s9-migrated-keystore-hmac-compat-v199.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedLedgerTrustedCheckpointV196.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedKeystoreSignerTestV199.java'
      - '.github/workflows/s9-migrated-keystore-hmac-compat-v199.yml'
permissions:
  contents: read
jobs:
  offline-signer-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Test signers and existing journal checkpoint contracts
        shell: bash
        run: |
          set -euo pipefail
          dir=ops/c720p/s9-native-security/offline-worker
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          javac -source 8 -target 8 -d "$work" \
            "$dir/S9MigratedMetadataLedgerV193.java" \
            "$dir/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$dir/S9MigratedKeystoreSignerTestV199.java"
          java -cp "$work" nl.kalenel.s9offline.S9MigratedKeystoreSignerTestV199
          python3 "$dir/test-s9-migrated-ledger-v193.py"
          python3 "$dir/test-s9-ledger-internal-checkpoint-v196.py"
          python3 "$dir/test-s9-dual-store-commit-v197.py"
          ! grep -q 'getEncoded()' "$dir/S9MigratedMetadataLedgerV193.java"
          ! grep -q 'getEncoded()' "$dir/S9MigratedLedgerTrustedCheckpointV196.java"
      - name: Test production classes compile as Android Java 8
        shell: bash
        run: |
          set -euo pipefail
          dir=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$work/classes" \
            "$dir/S9MigratedMetadataLedgerV193.java" \
            "$dir/S9MigratedLedgerTrustedCheckpointV196.java"
          "$d8" --min-api 28 --output "$work/dex" $(find "$work/classes" -name '*.class' -print)
          test -s "$work/dex/classes.dex"
          echo S9_HMAC_SECRETKEY_ANDROID_DEX_COMPILED
