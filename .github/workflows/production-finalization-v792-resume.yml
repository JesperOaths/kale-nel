name: v792 production finalization resume

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-finalization-v792-resume.yml'

permissions:
  contents: read

concurrency:
  group: v792-production-finalization-resume
  cancel-in-progress: false

jobs:
  resume-production:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_ALLOW_LIVE_WRITE_BETA: I_APPROVE_LIVE_BETA_WRITES
      GEJAST_SITE_SCOPE: friends
      GEJAST_REQUIRE_TWO_PLAYER: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          test -n "${SUPABASE_DB_URL:-}" || { echo 'SUPABASE_DB_URL missing'; exit 1; }

      - name: Apply v792b-v792h Online Klaverjas production repairs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            GEJAST_v792b_klaverjas_online_transition_guard.sql
            GEJAST_v792c_klaverjas_online_rules_guard.sql
            GEJAST_v792d_klaverjas_online_transition_compat.sql
            GEJAST_v792e_klaverjas_online_bid_rank_guard.sql
            GEJAST_v792f_klaverjas_online_persistence_guard.sql
            GEJAST_v792g_klaverjas_online_roem_wrapper_fix.sql
            GEJAST_v792h_klaverjas_online_recovery_snapshot_bridge.sql
          )
          for file in "${files[@]}"; do
            echo "Applying $file"
            psql "$SUPABASE_DB_URL" -X --set ON_ERROR_STOP=1 --set statement_timeout=120000 --file "$file"
          done

      - name: Prove hardened Klaverjas production contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regprocedure('public._klaverjas_online_full_deal_valid(jsonb)') is null then raise exception 'v792b missing'; end if;
            if to_regprocedure('public._klaverjas_online_card_legal(jsonb,jsonb,integer,text,jsonb)') is null then raise exception 'v792c missing'; end if;
            if to_regprocedure('public._klaverjas_online_human_transition_valid(jsonb,jsonb,integer)') is null then raise exception 'v792d missing'; end if;
            if to_regprocedure('public._klaverjas_online_bid_rank(jsonb)') is null then raise exception 'v792e missing'; end if;
            if to_regprocedure('public._klaverjas_online_save_state_v792e_inner(text,uuid,jsonb,jsonb,jsonb)') is null then raise exception 'v792f missing'; end if;
            if to_regprocedure('public._klaverjas_online_roem_points(jsonb,text)') is null then raise exception 'v792g missing'; end if;
            if to_regprocedure('public._klaverjas_online_save_state_v792f_inner(text,uuid,jsonb,jsonb,jsonb)') is null then raise exception 'v792h missing'; end if;
            if has_function_privilege('anon','public._klaverjas_online_bid_rank(jsonb)','EXECUTE')
               or has_function_privilege('authenticated','public._klaverjas_online_bid_rank(jsonb)','EXECUTE')
               or has_function_privilege('anon','public._klaverjas_online_roem_points(jsonb,text)','EXECUTE')
               or has_function_privilege('authenticated','public._klaverjas_online_roem_points(jsonb,text)','EXECUTE')
               or has_function_privilege('anon','public._klaverjas_online_save_state_v792f_inner(text,uuid,jsonb,jsonb,jsonb)','EXECUTE')
               or has_function_privilege('authenticated','public._klaverjas_online_save_state_v792f_inner(text,uuid,jsonb,jsonb,jsonb)','EXECUTE') then
              raise exception 'private helper client execute leak';
            end if;
            if not has_function_privilege('anon','public.klaverjas_online_save_state(text,uuid,jsonb,jsonb,jsonb)','EXECUTE')
               or not has_function_privilege('authenticated','public.klaverjas_online_save_state(text,uuid,jsonb,jsonb,jsonb)','EXECUTE') then
              raise exception 'public save grant missing';
            end if;
            if public._klaverjas_online_bid_rank('{"action":"bid","player":0,"team":1,"mode":"suit","suit":"hearts","points":80}'::jsonb) <> 82 then
              raise exception 'bid rank parity failed';
            end if;
            if public._klaverjas_online_roem_points('[{"player":0,"card":{"id":"hearts-A","suit":"hearts","rank":"A"}},{"player":1,"card":{"id":"hearts-K","suit":"hearts","rank":"K"}},{"player":2,"card":{"id":"hearts-Q","suit":"hearts","rank":"Q"}},{"player":3,"card":{"id":"clubs-7","suit":"clubs","rank":"7"}}]'::jsonb,'clubs') <> 20 then
              raise exception 'wrapped roem parity failed';
            end if;
          end
          $$;
          SQL

      - name: Provision masked ephemeral Beta1 and Beta2 production sessions
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.gejast_account_players_v671(site_scope,display_name,email,activated_at)
          select 'friends','Beta1','beta1@example.invalid',now()
          where not exists (
            select 1 from public.gejast_account_players_v671 where site_scope='friends' and lower(display_name)='beta1'
          );
          insert into public.gejast_account_players_v671(site_scope,display_name,email,activated_at)
          select 'friends','Beta2','beta2@example.invalid',now()
          where not exists (
            select 1 from public.gejast_account_players_v671 where site_scope='friends' and lower(display_name)='beta2'
          );
          SQL

          read -r token1 token2 < <(
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F' ' <<'SQL'
            with ids as (
              select
                (select id from public.gejast_account_players_v671 where site_scope='friends' and lower(display_name)='beta1' order by created_at desc limit 1) as account1,
                (select id from public.gejast_account_players_v671 where site_scope='friends' and lower(display_name)='beta2' order by created_at desc limit 1) as account2,
                (select id from public.players where lower(display_name)='beta1' and coalesce(active,true)=true order by id limit 1) as player1,
                (select id from public.players where lower(display_name)='beta2' and coalesce(active,true)=true order by id limit 1) as player2
            ), tokens as (
              select 'v792-final-' || encode(gen_random_bytes(24),'hex') as token1,
                     'v792-final-' || encode(gen_random_bytes(24),'hex') as token2,
                     * from ids
            ), acc1 as (
              insert into public.gejast_account_sessions_v671(session_token,player_id,site_scope,expires_at)
              select token1,account1,'friends',now()+interval '30 minutes' from tokens
              returning session_token
            ), acc2 as (
              insert into public.gejast_account_sessions_v671(session_token,player_id,site_scope,expires_at)
              select token2,account2,'friends',now()+interval '30 minutes' from tokens
              returning session_token
            ), player1_session as (
              insert into public.gejast_player_sessions_v746(session_token,player_id,display_name,site_scope,expires_at)
              select token1,player1,'Beta1','friends',now()+interval '30 minutes' from tokens
              returning session_token
            ), player2_session as (
              insert into public.gejast_player_sessions_v746(session_token,player_id,display_name,site_scope,expires_at)
              select token2,player2,'Beta2','friends',now()+interval '30 minutes' from tokens
              returning session_token
            )
            select token1,token2 from tokens;
            SQL
          )
          test -n "${token1:-}" && test -n "${token2:-}" || { echo 'Ephemeral session provisioning failed'; exit 1; }
          echo "::add-mask::$token1"
          echo "::add-mask::$token2"
          echo "GEJAST_PLAYER1_TOKEN=$token1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_TOKEN=$token2" >> "$GITHUB_ENV"

      - name: Prove ephemeral sessions resolve consistently
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v token1="$GEJAST_PLAYER1_TOKEN" -v token2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
          do $$
          begin
            if public._gejast_v687_session_name(:'token1') <> 'Beta1' then raise exception 'Beta1 Pikken resolver failed'; end if;
            if public._gejast_v687_session_name(:'token2') <> 'Beta2' then raise exception 'Beta2 Pikken resolver failed'; end if;
            if public._gejast_name_for_session(:'token1') <> 'Beta1' then raise exception 'Beta1 Paardenrace resolver failed'; end if;
            if public._gejast_name_for_session(:'token2') <> 'Beta2' then raise exception 'Beta2 Paardenrace resolver failed'; end if;
            if (public._jas_session_player(:'token1')).display_name <> 'Beta1' then raise exception 'Beta1 Jas resolver failed'; end if;
            if (public._jas_session_player(:'token2')).display_name <> 'Beta2' then raise exception 'Beta2 Jas resolver failed'; end if;
          end
          $$;
          SQL

      - name: Run reversible authenticated two-player production gameplay smoke
        shell: bash
        run: |
          set -euo pipefail
          node check-live-game-flows.mjs

      - name: Remove ephemeral beta sessions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GEJAST_PLAYER1_TOKEN:-}" ] && [ -n "${GEJAST_PLAYER2_TOKEN:-}" ]; then
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
              -v token1="$GEJAST_PLAYER1_TOKEN" -v token2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
            delete from public.gejast_player_sessions_v746 where session_token in (:'token1',:'token2');
            delete from public.gejast_account_sessions_v671 where session_token in (:'token1',:'token2');
            SQL
          fi

      - name: Queue one targeted Bruis production push
        id: queue_push
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo 'SUPABASE_URL missing'; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing'; exit 1; }
          test -n "${WEB_PUSH_VAPID_PUBLIC_KEY:-}" || { echo 'WEB_PUSH_VAPID_PUBLIC_KEY missing'; exit 1; }
          test -n "${WEB_PUSH_VAPID_PRIVATE_KEY:-}" || { echo 'WEB_PUSH_VAPID_PRIVATE_KEY missing'; exit 1; }
          read -r target_id job_id < <(
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F' ' <<'SQL'
            with target as (
              select id,player_id,display_name,site_scope
                from public.web_push_subscriptions
               where display_name='Bruis' and disabled_at is null
                 and nullif(endpoint,'') is not null
                 and nullif(coalesce(p256dh_key,p256dh),'') is not null
                 and nullif(coalesce(auth_key,auth),'') is not null
               order by last_seen_at desc nulls last,updated_at desc,id desc
               limit 1
            ), ins as (
              insert into public.web_push_jobs(
                status,target_player_id,target_subscription_id,title,body,target_url,payload,
                site_scope,trigger_kind,target_player_name,dedupe_key,notification_tag,require_interaction
              )
              select 'queued',player_id,id,'GEJAST productietest',
                     'Gecontroleerde push-test na de v792 productiehardening.',
                     './push_beta_test.html?push_test=production-finalization-v792',
                     jsonb_build_object('kind','admin_targeted_test','target_subscription_id',id,'source','production-finalization-v792'),
                     coalesce(site_scope,'friends'),'admin_targeted_test',display_name,
                     'production-finalization-v792:'||id||':'||to_char(clock_timestamp(),'YYYYMMDDHH24MISSMS'),
                     'production-finalization-v792-'||id,false
                from target
              returning id,target_subscription_id
            )
            select target_subscription_id,id from ins;
            SQL
          )
          test -n "${target_id:-}" && test -n "${job_id:-}" || { echo 'No eligible push target/job'; exit 1; }
          echo "target_id=$target_id" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Queued controlled push job $job_id for subscription $target_id"

      - name: Send exactly the targeted production push
        shell: bash
        env:
          WEB_PUSH_WORKER_ID: production-finalization-v792
          WEB_PUSH_DRY_RUN: 'false'
          WEB_PUSH_REQUIRE_EXPLICIT_TARGET: 'true'
          WEB_PUSH_TARGET_SUBSCRIPTION_ID: ${{ steps.queue_push.outputs.target_id }}
          WEB_PUSH_MAX_JOBS: '1'
        run: |
          set -euo pipefail
          node web_push_dispatcher.js

      - name: Prove targeted push terminal state
        shell: bash
        env:
          PUSH_JOB_ID: ${{ steps.queue_push.outputs.job_id }}
          PUSH_TARGET_ID: ${{ steps.queue_push.outputs.target_id }}
        run: |
          set -euo pipefail
          status="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c "select status from public.web_push_jobs where id=${PUSH_JOB_ID}::bigint")"
          error_code="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c "select coalesce(error_code,'') from public.web_push_jobs where id=${PUSH_JOB_ID}::bigint")"
          echo "Targeted push terminal status: $status ${error_code:+($error_code)}"
          test "$status" = 'sent' || { echo 'Targeted push was not delivered'; exit 1; }
          active="$(psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c "select case when disabled_at is null then 'active' else 'disabled' end from public.web_push_subscriptions where id=${PUSH_TARGET_ID}::bigint")"
          test "$active" = 'active' || { echo 'Target subscription was disabled'; exit 1; }

      - name: Re-run deterministic Worker v763 build and security suite
        shell: bash
        run: |
          set -euo pipefail
          npm run admin-worker:build
          npm run admin-worker:test

      - name: Production database gameplay and push finalization complete
        run: echo 'RESULT=V792_SQL_GAMEPLAY_PUSH_FINALIZATION_PASS'
