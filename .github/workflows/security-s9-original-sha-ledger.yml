name: S9 private original integrity ledger
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9-original-hash-ledger-v1.py'
      - 'ops/c720p/security-runtime/test-s9-original-hash-ledger-v1.py'
      - 'ops/c720p/security-runtime/c720p-s9-original-hash-ledger-v1.*'
      - '.github/workflows/security-s9-original-sha-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9-original-hash-ledger-v1.py'
      - 'ops/c720p/security-runtime/test-s9-original-hash-ledger-v1.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/s9-original-hash-ledger-v1.py
          PYTHONPATH=ops/c720p/security-runtime python3 ops/c720p/security-runtime/test-s9-original-hash-ledger-v1.py
          grep -q 'CPUQuota=10%' ops/c720p/security-runtime/c720p-s9-original-hash-ledger-v1.service
          grep -q 'OnUnitInactiveSec=20min' ops/c720p/security-runtime/c720p-s9-original-hash-ledger-v1.timer
