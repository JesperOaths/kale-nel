name: S9 migrated action wire V231 host-only safety
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedActionWireV231.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedActionWireTestV231.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-action-wire-v231.py'
      - '.github/workflows/s9-migrated-action-wire-v231.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedActionWireV231.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedActionWireTestV231.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-action-wire-v231.py'
      - '.github/workflows/s9-migrated-action-wire-v231.yml'
permissions:
  contents: read
jobs:
  bounded_transport_neutral_parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify strict V231 parser with synthetic signed V198 payloads
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-action-wire-v231.py"
          python3 "$d/test-s9-signed-action-v198.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
