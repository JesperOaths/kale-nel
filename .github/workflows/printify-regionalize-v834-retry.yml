name: Finish missing AU Gildan 5000 routes

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/printify-regionalize-v834-retry.yml'

permissions:
  contents: read

jobs:
  regionalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Finish missing AU routes
        shell: bash
        env:
          ENDPOINT: https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-au-gildan5000-missing-v834
          RUN_KEY: g5000-au-missing-20260916-GR2x3jdpPvF7
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 600 \
            --output result.json \
            --write-out '%{http_code}' \
            --request POST "$ENDPOINT" \
            --header 'content-type: application/json' \
            --header "x-run-key: $RUN_KEY" \
            --data '{}')
          jq '{ok,routed,mapping_rows,upsert_error,error,results}' result.json || cat result.json
          test "$code" = "200"
          test "$(jq -r '.ok // false' result.json)" = "true"
