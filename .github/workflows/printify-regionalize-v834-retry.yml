name: Finish Gildan 5000 regionalization v834

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/printify-regionalize-v834-retry.yml'

permissions:
  contents: read

jobs:
  regionalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Regionalize all Gildan 5000 products
        shell: bash
        env:
          ENDPOINT: https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-regionalize-gildan5000-v834
          RUN_KEY: xgqDK-T7Ri6SpqUrmL51bt-A9axN0nQuTn66uFNUCGw
        run: |
          set -u
          failed=0
          for region in EU UK CA AU; do
            echo "=== ${region} ==="
            code=$(curl --silent --show-error --max-time 300 \
              --output "result-${region}.json" \
              --write-out '%{http_code}' \
              --request POST "$ENDPOINT" \
              --header 'content-type: application/json' \
              --header "x-admin-key: $RUN_KEY" \
              --data "{\"region\":\"${region}\"}") || code=000
            jq '{ok,region,provider_id,source_count,routed_count,mapping_rows,upsert_error,error,results:[(.results // [])[]|{title,target_id,created,ok,visible,enabled_count,shipping,error,validation}]}' "result-${region}.json" 2>/dev/null || cat "result-${region}.json"
            if [ "$code" != "200" ] || [ "$(jq -r '.ok // false' "result-${region}.json" 2>/dev/null)" != "true" ]; then
              echo "Regionalization did not fully pass for ${region} (HTTP ${code})"
              failed=1
            fi
          done
          exit "$failed"
