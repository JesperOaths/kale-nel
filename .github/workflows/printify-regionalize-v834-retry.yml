name: Probe complete Despinoza text payload

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/printify-regionalize-v834-retry.yml'

permissions:
  contents: read

jobs:
  regionalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe hidden EU route copy with full text payload
        shell: bash
        env:
          ENDPOINT: https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-despinoza-textlayer-probe-v834
          RUN_KEY: despinoza-textlayer-probe-20260916-U6rP9x
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 900 \
            --output result.json \
            --write-out '%{http_code}' \
            --request POST "$ENDPOINT" \
            --header 'content-type: application/json' \
            --header "x-run-key: $RUN_KEY" \
            --data '{}')
          jq . result.json
          test "$code" = "200"
          test "$(jq -r '.ok // false' result.json)" = "true"
