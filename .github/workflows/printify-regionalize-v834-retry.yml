name: Inspect Despinoza mockup assets

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/printify-regionalize-v834-retry.yml'

permissions:
  contents: read

jobs:
  regionalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect source mockups and print assets
        shell: bash
        env:
          ENDPOINT: https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/printify-despinoza-mockup-diag-v834
          RUN_KEY: despinoza-mockup-diag-20260916-4Kp8z
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 900 \
            --request POST "$ENDPOINT" \
            --header 'content-type: application/json' \
            --header "x-run-key: $RUN_KEY" \
            --data '{}' | jq .
