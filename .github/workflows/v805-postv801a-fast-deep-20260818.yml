name: v805 post-v801a fast deep-live proof

on:
  push:
    branches: [proof/v805-postv801a-fast-deep-20260818]
    paths: ['.github/workflows/v805-postv801a-fast-deep-20260818.yml']

permissions:
  contents: write

concurrency:
  group: v805-postv801a-fast-deep-20260818
  cancel-in-progress: false

jobs:
  deep-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_BASE_URL: https://kalenel.nl/
      GEJAST_SITE_SCOPE: friends
      GEJAST_BROWSER_TIMEOUT_MS: '25000'
      GEJAST_EXACT_MAIN_SHA: b64a116f2b2684d1fbd475b40c2b76f569d40942
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: '-c statement_timeout=20000'
    steps:
      - name: Check out exact-current proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v805-postv801a-fast-deep-20260818
          fetch-depth: 0

      - name: Record run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v805-postv801a-fast-deep-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v805-postv801a-fast-deep-run-id.txt
          git commit -m 'test: record post-v801a fast deep run id'
          git push origin HEAD:proof/v805-postv801a-fast-deep-20260818

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prove exact current v805 tree and live data plane
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v805'
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v805'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^(\.github/workflows/v805-postv801a-fast-deep-20260818\.yml|\.proof/v805-postv801a-fast-deep-run-id\.txt)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof branch drift:'; echo "$unexpected"; exit 1; }
          GEJAST_DATA_PLANE_TIMEOUT_MS=10000 GEJAST_DATA_PLANE_ATTEMPTS=2 GEJAST_DATA_PLANE_RETRY_DELAY_MS=750 node check-live-data-plane.mjs
          node check-toepen-idempotency-owner-guard-v801a.mjs
          echo 'RESULT=V805_POSTV801A_FAST_DEEP_EXACT_MAIN_PASS'

      - name: Prepare shipped deep-live script against system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "GEJAST_SYSTEM_CHROME=$chrome" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path
          src = Path('scripts/final-cert-live-browser-v792.mjs').read_text()
          src = src.replace('v792','v805').replace('V792','V805')
          src = src.replace("chromium.launch({ headless: true })", "chromium.launch({ headless: true, executablePath: process.env.GEJAST_SYSTEM_CHROME })")
          old = """  await page.waitForTimeout(900);\n  if (/login\\.html/i.test(page.url())) throw new Error(`${label} unexpectedly redirected to login`);\n  const body = (await page.locator('body').innerText()).trim();"""
          new = """  await page.waitForFunction(() => document.documentElement.getAttribute('data-gejast-auth-state') === 'authenticated' || /login\\.html/i.test(location.pathname), null, { timeout });\n  if (/login\\.html/i.test(page.url())) throw new Error(`${label} unexpectedly redirected to login`);\n  await page.waitForTimeout(150);\n  const body = (await page.locator('body').innerText()).trim();"""
          if old not in src:
              raise SystemExit('auth-aware loadRoute patch target missing')
          src = src.replace(old, new)
          if "executablePath: process.env.GEJAST_SYSTEM_CHROME" not in src:
              raise SystemExit('system Chrome launch patch missing')
          Path('scripts/v805-postv801a-fast-deep.mjs').write_text(src)
          PY
          node --check scripts/v805-postv801a-fast-deep.mjs
          "$chrome" --version
          echo 'RESULT=V805_POSTV801A_SYSTEM_CHROME_READY_PASS'

      - name: Provision hidden disposable players
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V805PV801A_${suffix}"
          name2="V805PV801B_${suffix}"
          pin1='4826'; pin2='7314'
          echo "::add-mask::$pin1"; echo "::add-mask::$pin2"
          {
            echo "GEJAST_PLAYER1_NAME=$name1"
            echo "GEJAST_PLAYER2_NAME=$name2"
          } >> "$GITHUB_ENV"
          timeout 25s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$name1" -v n2="$name2" -v p1="$pin1" -v p2="$pin2" <<'SQL'
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v805-pv801-a-'||lower(:'n1'),:'n1',true,'md5:'||md5(:'p1'||':'||current_database()),true,true,true,'friends'),
            ('v805-pv801-b-'||lower(:'n2'),:'n2',true,'md5:'||md5(:'p2'||':'||current_database()),true,true,true,'friends');
          SQL
          sessions="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$name1" -v n2="$name2" -v p1="$pin1" -v p2="$pin2" <<'SQL'
          select public.account_login_v687(:'n1',:'p1','friends','{"proof":"v805-postv801a-fast-deep"}'::jsonb)->>'session_token',
                 public.account_login_v687(:'n2',:'p2','friends','{"proof":"v805-postv801a-fast-deep"}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ && "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"; echo "::add-mask::$token2"
          {
            echo "GEJAST_PLAYER1_TOKEN=$token1"
            echo "GEJAST_PLAYER2_TOKEN=$token2"
          } >> "$GITHUB_ENV"
          echo 'RESULT=V805_POSTV801A_FAST_DEEP_FIXTURES_PASS'

      - name: Run multi-context reconnect mobile and natural completion campaign
        run: node scripts/v805-postv801a-fast-deep.mjs

      - name: Prove sessions survive gameplay
        shell: bash
        run: |
          set -euo pipefail
          state="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v t1="$GEJAST_PLAYER1_TOKEN" -v t2="$GEJAST_PLAYER2_TOKEN" <<'SQL'
          with s as (
            select public.account_public_state_v687(:'t1',:'t1','friends') a,
                   public.account_public_state_v687(:'t2',:'t2','friends') b
          ) select coalesce(a->>'ok','false'),coalesce(b->>'ok','false') from s;
          SQL
          )"
          test "$state" = 'true|true'
          echo 'RESULT=V805_POSTV801A_FAST_DEEP_POST_GAME_SESSIONS_PASS'

      - name: Cleanup controlled fixtures and prove zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ]; then echo 'No controlled identities were provisioned.'; exit 0; fi
          timeout 30s psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          begin;
          delete from public.paardenrace_match_history h using public.paardenrace_rooms r
           where h.room_id=r.id and (r.host_name in (:'n1',:'n2') or r.host_player_id in (select id from public.players where display_name in (:'n1',:'n2')) or r.created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2')));
          delete from public.klaverjas_online_games where created_by_player_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.pikken_games where created_by_player_name in (:'n1',:'n2') or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.paardenrace_rooms where host_name in (:'n1',:'n2') or host_player_id in (select id from public.players where display_name in (:'n1',:'n2')) or created_by_player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'));
          delete from public.gejast_player_sessions_v746 where player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.players where display_name in (:'n1',:'n2') and hidden_from_public=true and is_dummy=true;
          commit;
          SQL
          residue="$(timeout 25s psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select (select count(*) from public.players where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'))),
                 (select count(*) from public.klaverjas_online_games where created_by_player_name in (:'n1',:'n2')),
                 (select count(*) from public.pikken_games where created_by_player_name in (:'n1',:'n2')),
                 (select count(*) from public.paardenrace_rooms where host_name in (:'n1',:'n2'));
          SQL
          )"
          test "$residue" = '0|0|0|0|0|0'
          echo 'RESULT=V805_POSTV801A_FAST_DEEP_ZERO_RESIDUE_PASS'

      - name: Final marker
        run: echo 'RESULT=V805_POSTV801A_FAST_DEEP_LIVE_PASS'
