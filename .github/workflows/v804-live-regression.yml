name: v804 exact-live cadence and auth regression

on:
  push:
    branches: [proof/v804-live-regression]
    paths: ['.github/workflows/v804-live-regression.yml']

permissions:
  contents: read

jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proof branch rooted at exact v804 merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v804-live-regression
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Prove exact current product and live v804 deployment
        shell: bash
        run: |
          set -euo pipefail
          exact=efbb2d2c106746cb4e659036dc62971da2b0b275
          test "$(git show "$exact:VERSION" | tr -d '\r\n')" = 'v804'
          test "$(curl -fsS --max-time 15 "https://kalenel.nl/VERSION?cb=${GITHUB_RUN_ID}" | tr -d '\r\n')" = 'v804'
          unexpected="$(git diff --name-only "$exact"..HEAD | grep -Ev '^\.github/workflows/v804-live-regression\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected product drift:'; echo "$unexpected"; exit 1; }
      - name: Install fresh Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove exact-live v804 bounded Pikken and Paardenrace cadence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const token='d'.repeat(48);
          async function contextWithMocks(){
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            await context.addInitScript(({token})=>{
              localStorage.setItem('jas_session_token_v11',token);
              sessionStorage.setItem('jas_session_token_v11',token);
            },{token});
            const counts=new Map();
            await context.route('https://uiqntazgnrxwliaidkmy.supabase.co/**',async route=>{
              const url=new URL(route.request().url());
              const rpc=url.pathname.split('/rpc/')[1]||url.pathname;
              counts.set(rpc,(counts.get(rpc)||0)+1);
              let body={};
              if(rpc==='account_public_state_v687') body={ok:true,site_scope:'friends',player_name:'V804LiveProof'};
              else if(rpc.includes('pikken_open_lobbies')||rpc.includes('pikken_live_matches')) body=[];
              else if(rpc.includes('paardenrace_room_state')) body={room:{stage:'race',room_code:'TEST'},players:[{name:'A'},{name:'B'}]};
              else if(rpc.includes('homepage')) body={ok:true,entries:{},site_scope:'friends'};
              else if(rpc.includes('drinks_homepage_top5')) body=[];
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
            });
            return {context,counts};
          }
          try {
            const p=await contextWithMocks();
            const page=await p.context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e?.message||e)));
            await page.goto(`https://kalenel.nl/pikken.html?cb=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-gejast-auth-state')==='authenticated',{timeout:15000});
            await page.waitForTimeout(5600);
            const ps=await page.evaluate(()=>({patched:!!window.__gejastV725PikkenPagePatched,timer:!!window.__gejastV725PikkenFeedTimer,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}));
            const open=[...p.counts].filter(([k])=>k.includes('pikken_open_lobbies')).reduce((n,[,v])=>n+v,0);
            const live=[...p.counts].filter(([k])=>k.includes('pikken_live_matches')).reduce((n,[,v])=>n+v,0);
            if(open<2||open>4||live<2||live>4) throw new Error(`v804 Pikken cadence out of bounds open=${open} live=${live}`);
            if(!ps.patched||!ps.timer||errors.length) throw new Error(`v804 Pikken surface unstable: ${JSON.stringify({ps,errors})}`);
            console.log(`V804_LIVE_PIKKEN_CADENCE_PASS open=${open} live=${live}`);
            await p.context.close();

            const r=await contextWithMocks();
            const rp=await r.context.newPage();
            const rerrors=[]; rp.on('pageerror',e=>rerrors.push(String(e?.message||e)));
            await rp.goto(`https://kalenel.nl/paardenrace_live.html?room=TEST&live=TEST&cb=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await rp.waitForFunction(()=>document.documentElement.getAttribute('data-gejast-auth-state')==='authenticated',{timeout:15000});
            await rp.waitForTimeout(4600);
            const rs=await rp.evaluate(()=>({patched:!!window.__gejastV725PaardenracePagePatched,timer:!!window.__gejastV725PaardenraceMonitorTimer}));
            const states=[...r.counts].filter(([k])=>k.includes('paardenrace_room_state')).reduce((n,[,v])=>n+v,0);
            if(states<1||states>3) throw new Error(`v804 Paardenrace cadence out of bounds state=${states}`);
            if(!rs.patched||!rs.timer||rerrors.length) throw new Error(`v804 Paardenrace surface unstable: ${JSON.stringify({rs,rerrors})}`);
            console.log(`V804_LIVE_PAARDENRACE_CADENCE_PASS state=${states}`);
            await r.context.close();
            console.log(`RESULT=V804_EXACT_LIVE_CADENCE_PASS pikken_open=${open} pikken_live=${live} paard_state=${states}`);
          } finally { await browser.close(); }
          NODE
      - name: Prove exact-live v804 logged-out forced-login boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base='https://kalenel.nl/';
          const routes=['index.html','home.html','leaderboard.html','profiles.html','drinks.html','despimarkt.html','toepen.html','boerenbridge.html','beerpong.html','pikken.html','paardenrace.html','klaverjas_online.html','rad.html'];
          const browser=await chromium.launch({headless:true});
          try {
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const leaks=[];
            await context.exposeBinding('__recordGejastLeak',(_source,data)=>{leaks.push(data);});
            await context.addInitScript(()=>{
              const excluded=new Set(['/login.html','/request.html','/activate.html']);
              let sent=false;
              const sample=()=>{
                try{
                  if(sent||excluded.has(location.pathname)) return;
                  const body=(document.body?.innerText||'').replace(/\s+/g,' ').trim();
                  const vis=getComputedStyle(document.documentElement).visibility;
                  if(body.length>20&&vis!=='hidden'){
                    sent=true;
                    window.__recordGejastLeak({path:location.pathname,visibility:vis,state:document.documentElement.getAttribute('data-gejast-auth-state'),body:body.slice(0,160)});
                  }
                }catch{}
              };
              new MutationObserver(sample).observe(document,{subtree:true,childList:true,attributes:true});
              const tick=()=>{sample();requestAnimationFrame(tick)};
              requestAnimationFrame(tick);
            });
            for(const route of routes){
              const page=await context.newPage();
              await page.goto(new URL(route,base).toString(),{waitUntil:'commit',timeout:25000});
              await page.waitForURL(u=>u.pathname==='/login.html',{timeout:12000});
              await page.close();
            }
            if(leaks.length) throw new Error(`protected UI leak before redirect: ${JSON.stringify(leaks)}`);
            const family=await context.newPage();
            await family.goto(new URL('familie/index.html',base).toString(),{waitUntil:'commit',timeout:25000});
            await family.waitForURL(u=>u.pathname==='/login.html'&&u.searchParams.get('scope')==='family',{timeout:12000});
            await family.close();
            await context.close();
            console.log(`RESULT=V804_LOGGED_OUT_AUTH_BOUNDARY_PASS routes=${routes.length} visible_leaks=0 family_scope=PASS`);
          } finally { await browser.close(); }
          NODE
