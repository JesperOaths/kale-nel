    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Parse JS and guard group/latest review authority
        run: |
          node --check ops/c720p/s9-native-security/security-people-v45.js
          node ops/c720p/s9-native-security/test-qualified-outfit-reference-revocation-v319.cjs
      - name: Compile additive guarded deployer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("ops/c720p/s9-native-security/install-qualified-outfit-reference-revocation-v319.py")
          compile(path.read_bytes(),str(path),"exec")
          print("guarded installer syntax verified")
          PY
