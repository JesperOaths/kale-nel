name: One-shot base-triggered v807 product builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v807-builder-main-once
  cancel-in-progress: true

jobs:
  build-v807:
    if: github.head_ref == 'ops/v807-builder-trigger3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v807-remove-active-stale-session-probes
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Prove main product tree is still exact v806 plus this process workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:VERSION | tr -d '\r\n')" = 'v806'
          unexpected="$(git diff --name-only 87fa814d28c00035b770c0ff8959def27a00f059..origin/main | grep -Ev '^\.github/workflows/v807-builder-main-once\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected main product drift:'; echo "$unexpected"; exit 1; }
          test "$(git show 87fa814d28c00035b770c0ff8959def27a00f059:VERSION | tr -d '\r\n')" = 'v806'
          echo 'RESULT=V807_BUILDER_MAIN_PRODUCT_GUARD_PASS'
      - name: Apply exact v807 correction and run complete repository verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-v807-stale-session-probe-removal.py
          node check-version-drift.mjs
          node check-v806-canonical-session-runtime.mjs
          node check-v807-active-session-callers.mjs
          node check-release-certification-state.mjs
          node check-beta-readiness-current-v770d.mjs
          npm ci
          npm run verify
      - name: Commit only verified v807 product files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v807-builder-once.yml
          rm -f scripts/prepare-v807-stale-session-probe-removal.py
          rm -f .proof/v807-builder-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove active stale session probes v807'
          git push origin HEAD:agent/v807-remove-active-stale-session-probes
          echo 'RESULT=V807_STALE_SESSION_CALLER_BUILDER_PASS'
