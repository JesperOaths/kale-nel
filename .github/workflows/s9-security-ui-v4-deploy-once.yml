name: C720P Security UI V4 one-time deployment
on:
  push:
    branches:
      - release/s9-security-interface-v4-20261011
    paths:
      - ".github/workflows/s9-security-ui-v4-deploy-once.yml"
permissions:
  contents: read
jobs:
  guarded-ui-only-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Re-run source and two-page rollback tests before remote request
        run: |
          set -euo pipefail
          P=ops/c720p/s9-native-security
          python3 "$P/test-security-date-category-folders.py"
          python3 "$P/test-security-compact-layout.py"
          python3 "$P/test-deploy-security-ui-v4.py"
      - name: Request pinned Security HTML-only deployment
        shell: bash
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN_NOT_CONFIGURED"; exit 2; }
          response="$(curl -fsS --retry 1 --connect-timeout 10 --max-time 40 \
            -X POST 'https://uiqntazgnrxwliaidkmy.supabase.co/functions/v1/ops-c720p-v868-maintenance' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"step":"security_interface_v4"}')"
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
          import os,json
          data=json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True and data.get('release')=='security_interface_v4'
          print('C720P_UI_V4_REMOTE_RELEASE_REQUEST_ACCEPTED',data.get('job'))
          PY
