name: one-shot v812 player profile builder

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-v812-player-profile-builder.yml']

permissions:
  contents: write

concurrency:
  group: one-shot-v812-player-profile-builder
  cancel-in-progress: false

env:
  PRODUCT_SHA: c3cb4b5e35f32e699b6432aca6502fae6b151007
  TARGET_BRANCH: agent/v812-player-profile-runtime-cleanup

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v812-player-profile-runtime-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify exact v812 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_drift="$(git diff --name-only "$PRODUCT_SHA"..origin/main | grep -Ev '^\.github/workflows/ops-v812-player-profile-builder\.yml$' || true)"
          test -z "$main_drift" || { echo 'Unexpected main drift:'; echo "$main_drift"; exit 1; }
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          printf 'v812\n' > VERSION
          python3 <<'PY'
          from pathlib import Path
          import json

          p=Path('gejast-profile-source.js')
          s=p.read_text()
          old="""    const unified = await RPC.callRpc('get_public_player_unified_scoped', { player_name: playerName, site_scope_input: scope }).catch(() => null);\n    if (unified) {\n      return {\n        unified: unified || {},\n        drinks: drinks || {},\n        badge_facts: {}\n      };\n    }\n\n"""
          if old not in s:
              old=old.replace('\n','\r\n')
          if old not in s:
              raise SystemExit('broken unified RPC block not found')
          s=s.replace(old,'',1)
          old2="""  async function loadPlayerGamePanels({ playerName, gameKey = 'klaverjas' }) {\n    const bundle = await loadPlayerBundle({ playerName, gameKey }).catch(() => ({ shared_stats: {}, game_insights: { cards: [] } }));\n    return {\n      shared_stats: bundle?.shared_stats || {},\n      game_insights: bundle?.game_insights || { cards: [] }\n    };\n  }\n"""
          if old2 not in s:
              old2=old2.replace('\n','\r\n')
          new2="""  async function loadPlayerGamePanels({ playerName, gameKey = 'klaverjas' }) {\n    const scope = CTX.getScope();\n    const fallback = await loadPlayerBundle({ playerName, gameKey }).catch(() => ({ shared_stats: {}, game_insights: { cards: [] } }));\n    const payload = { game_key_input: gameKey, player_name_input: playerName, site_scope_input: scope };\n    const [sharedStats, gameInsights] = await Promise.all([\n      RPC.callRpc('get_public_shared_player_stats_scoped', payload).catch(() => fallback?.shared_stats || {}),\n      RPC.callRpc('get_public_player_game_insights_scoped', payload).catch(() => fallback?.game_insights || { cards: [] })\n    ]);\n    return {\n      shared_stats: sharedStats || fallback?.shared_stats || {},\n      game_insights: gameInsights || fallback?.game_insights || { cards: [] }\n    };\n  }\n"""
          if '\r\n' in old2:
              new2=new2.replace('\n','\r\n')
          if old2 not in s:
              raise SystemExit('loadPlayerGamePanels block not found')
          p.write_text(s.replace(old2,new2,1))

          Path('check-v812-player-profile-runtime-cleanup.mjs').write_text("""#!/usr/bin/env node\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst version=fs.readFileSync('VERSION','utf8').trim();\nassert(Number(version.replace(/^v/i,''))>=812,'v812+ required');\nconst src=fs.readFileSync('gejast-profile-source.js','utf8');\nassert(!src.includes(\"RPC.callRpc('get_public_player_unified_scoped'\"),'active profile source must not call the known-broken unified aggregate RPC');\nassert(src.includes(\"RPC.callRpc('get_profiles_page_bundle_scoped'\"),'profile identity must retain the healthy scoped profiles bundle fallback');\nassert(src.includes(\"RPC.callRpc('get_public_shared_player_stats_scoped', payload)\"),'player panels must use healthy scoped shared stats');\nassert(src.includes(\"RPC.callRpc('get_public_player_game_insights_scoped', payload)\"),'player panels must use healthy scoped game insights');\nassert(src.includes('game_key_input: gameKey') && src.includes('player_name_input: playerName') && src.includes('site_scope_input: scope'),'scoped player panel RPC arguments must be explicit');\nconsole.log('PASS v812 player profile runtime cleanup');\n""")

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); script=data['scripts']['verify:static']
          anchor='node check-v811-analytics-rpc-contract.mjs'; addition='node check-v812-player-profile-runtime-cleanup.mjs'
          if addition not in script:
              if anchor not in script: raise SystemExit('v811 verify anchor missing')
              script=script.replace(anchor,anchor+' && '+addition)
          data['scripts']['verify:static']=script
          pkg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          for name in ['beta-live-write-checklist.json','gameplay-acceptance.json']:
              path=Path(name); obj=json.loads(path.read_text()); obj['site_version']='v812'
              if name=='gameplay-acceptance.json': obj['last_updated']='2026-08-18'
              path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')

          cert={
            'schema_version':1,
            'current_version':'v812',
            'status':'REVALIDATION_REQUIRED',
            'previous_certified_version':'v808',
            'previous_certified_product_sha':'7f6f7bc110807e85f52ff4d54927620dbbc9ffeb',
            'previous_certified_release_branch':'release/v808-certified-20260818',
            'superseded_uncertified_version':'v811',
            'superseded_uncertified_product_sha':'c3cb4b5e35f32e699b6432aca6502fae6b151007',
            'reason':'v812 removes the active call to production get_public_player_unified_scoped, which is proven to fail with PostgreSQL 42702 because _gejast_elo_for_game_scope ambiguously references game_key. The player page retains its existing profile/drinks fallback and now reads shared stats and game insights directly through healthy scoped RPCs. No backend/schema mutation.',
            'remaining_release_blockers':['Fresh exact-current v812 health must pass.','Authenticated runtime proof must show analytics remains repaired, player runtime bundle stays 2xx, the broken unified RPC is no longer called, and scoped player stats/insights succeed.','Fresh deep gameplay plus full authenticated visual evidence and independent zero-residue cleanup are required before PASS.'],
            'required_next':['Merge only after canonical verification and dependency audit.','Run exact-current v812 authenticated RPC diagnostics and deep gameplay.','Run the full authenticated visual audit, manually review its screenshots, independently confirm zero controlled residue, then promote v812 to PASS.']
          }
          Path('release-certification.json').write_text(json.dumps(cert,indent=2,ensure_ascii=False)+'\n')

          rpath=Path('beta-readiness.json'); r=json.loads(rpath.read_text())
          r['site_version']='release candidate v812 / live v811 / certified rollback v808'; r['last_updated']='2026-08-18'
          ident=r.setdefault('deployment_identity',{})
          ident['status']='ready_to_test'; ident['live_version']='v811'; ident['release_candidate_version']='v812'; ident['frontend_release_merge']='c3cb4b5e35f32e699b6432aca6502fae6b151007'; ident['repository_head_at_audit']='c3cb4b5e35f32e699b6432aca6502fae6b151007'
          ident['note']='v812 removes the known-broken get_public_player_unified_scoped frontend call without hiding a backend failure: production read-only diagnosis proves PostgreSQL 42702 in _gejast_elo_for_game_scope. Current UI already fell back whenever it failed; v812 goes directly to that healthy profile path and uses get_public_shared_player_stats_scoped plus get_public_player_game_insights_scoped for game panels. No production SQL mutation.'
          ev='2026-08-18 v812 grounding: direct production read proved get_public_player_unified_scoped fails with PostgreSQL 42702 from ambiguous game_key in _gejast_elo_for_game_scope; get_profiles_page_bundle_scoped, get_public_shared_player_stats_scoped and get_public_player_game_insights_scoped all succeeded for a scoped player read. v812 removes only the failing active aggregate call and preserves healthy fallbacks.'
          evidence=ident.setdefault('evidence',[])
          if ev not in evidence: evidence.insert(0,ev)
          rpath.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          node fix-version-drift.mjs
          node check-v812-player-profile-runtime-cleanup.mjs
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          mkdir -p .proof
          printf '%s\n' "$GITHUB_RUN_ID" > .proof/v812-builder-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clean player profile runtime v812'
          git push origin HEAD:"$TARGET_BRANCH"
          echo 'RESULT=V812_PLAYER_PROFILE_BUILDER_PASS'
