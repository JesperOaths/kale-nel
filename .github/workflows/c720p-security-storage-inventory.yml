name: C720P safe storage inventory
on:
  pull_request:
    paths:
      - '.github/workflows/c720p-security-storage-inventory.yml'
      - 'ops/c720p/s9-native-security/security-storage-readonly-inventory.py'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/security-storage-readonly-inventory.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/security-storage-readonly-inventory.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('ops/c720p/s9-native-security/security-storage-readonly-inventory.py').read_text()
          assert 'C720P_SAFE_STORAGE_INVENTORY_V1' in src
          for bad in ['shutil.rmtree(','.unlink(', 'os.remove(', 'os.replace(', 'shell=True','rm -','subprocess.Popen(']:
              assert bad not in src,bad
          print('STORAGE_READONLY_SCOPE_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Missing private gateway'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src="ops/c720p/s9-native-security/security-storage-readonly-inventory.py"
          hash="$(sha256sum "$src" | cut -d' ' -f1)"
          [[ "$hash" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          temp="/tmp/c720p-security-disk-inventory-${GITHUB_SHA:0:12}.py"
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 25 '${origin}' -o '${temp}' && printf '%s  %s\\n' '${hash}' '${temp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${temp}'"
          idem="security-disk-inventory-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
           'github-actions-security-storage','diagnostic',:'cmd',270,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "C720P_DISK_INVENTORY_JOB=$id"
          for i in $(seq 1 45); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == failed\|* || "$state" == error\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 15000)"
              echo "$out"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'C720P_SAFE_STORAGE_INVENTORY_V1' <<< "$out" || exit 1
              exit 0
            fi
            sleep 9
          done
          exit 1
