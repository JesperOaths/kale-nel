name: C720P legacy S9 JPEG page install source and physical preflight V188
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-s9-jpeg-pages-v187.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-s9-jpeg-pages-path-safety-v188.py'
      - '.github/workflows/c720p-s9-jpeg-pages-preflight-v188.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/deploy-c720p-s9-jpeg-pages-v187.py'
      - 'ops/c720p/security-runtime/test-deploy-c720p-s9-jpeg-pages-path-safety-v188.py'
      - '.github/workflows/c720p-s9-jpeg-pages-preflight-v188.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s9-jpeg-page-safe-preflight-v188
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Legacy Save index and guard compatibility with no live writes
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/deploy-c720p-s9-jpeg-pages-v187.py"
          python3 "$d/test-deploy-c720p-s9-jpeg-pages-v187.py"
          python3 "$d/test-deploy-c720p-s9-jpeg-pages-path-safety-v188.py"
          python3 "$d/test-c720p-legacy-s9-index-bridge-guard-v1.py"
          node "$d/test-c720p-migrated-snapshot-display-v182.mjs"
  physical-preflight:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: SHA-pinned physical *PREVIEW ONLY* of legacy S9 thumbnail installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source=ops/c720p/security-runtime/deploy-c720p-s9-jpeg-pages-v187.py
          digest="$(sha256sum "$source" | cut -d' ' -f1)"
          stage="/tmp/c720p-jpeg-pages-v188-${GITHUB_SHA:0:14}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="umask 077 && curl -fsSL --max-time 35 '$url' -o '$stage' && printf '%s  %s\\n' '$digest' '$stage' | sha256sum -c - >/dev/null && /usr/bin/python3 '$stage'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-jpeg-pages-v188-preview-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-jpeg-pages-v188-preflight','diagnostic',:'cmd',250,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_JPEG_PAGES_V188_PREFLIGHT_JOB=$job"
          for attempt in $(seq 1 100); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3500)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              grep -q 'C720P_S9_JPEG_PAGES_V187' <<< "$output"
              grep -q '"state": "preflight"' <<< "$output"
              grep -q '"source_pins_verified": true' <<< "$output"
              grep -q '"pages_and_watchdog_compile": true' <<< "$output"
              grep -q '"install_requires_apply": true' <<< "$output"
              grep -q '"no_media_changes": true' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "S9 JPEG frontend non-mutating physical preflight unavailable";exit 1
