name: C720P all migrated S9 authenticated browser Range V146
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-all-migrated-browser-v146.py'
      - 'ops/c720p/security-runtime/test-smoke-c720p-all-migrated-browser-v146.py'
      - '.github/workflows/c720p-all-migrated-browser-v146.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/smoke-c720p-all-migrated-browser-v146.py'
      - 'ops/c720p/security-runtime/test-smoke-c720p-all-migrated-browser-v146.py'
      - '.github/workflows/c720p-all-migrated-browser-v146.yml'
permissions:
  contents: read
concurrency:
  group: c720p-all-migrated-browser-v146
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Every verified file retains authenticated bounded access
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/smoke-c720p-all-migrated-browser-v146.py"
          python3 "$d/test-smoke-c720p-all-migrated-browser-v146.py"
          python3 "$d/test-smoke-c720p-legacy-auth-browser-v136.py"
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read-only all-import authenticated Chromium Range proof
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          d="ops/c720p/security-runtime"
          stage="/tmp/c720p-all-migrated-v146-${GITHUB_SHA:0:13}"
          cmd="install -d -m 700 '$stage'"
          for name in smoke-c720p-all-migrated-browser-v146.py smoke-c720p-legacy-auth-browser-v136.py; do
            digest="$(sha256sum "$d/$name" | cut -d' ' -f1)"
            uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$d/$name"
            cmd="$cmd && curl -fsSL --max-time 35 '$uri' -o '$stage/$name' && printf '%s  %s\\n' '$digest' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/smoke-c720p-all-migrated-browser-v146.py' && /usr/bin/python3 '$stage/smoke-c720p-all-migrated-browser-v146.py' --run"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-all-browser-v146-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-all-browser-v146','diagnostic',:'cmd',320,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_ALL_BROWSER_V146_JOB=$job"
          for attempt in $(seq 1 110); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3600)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              grep -q 'C720P_MIGRATED_ALL_BROWSER_RANGES_V146_VERIFIED' <<< "$output"
              grep -q '"authenticated_all_import_ranges": true' <<< "$output"
              grep -q 'C720P_MIGRATED_ALL_HOST_RANGES_V148_VERIFIED' <<< "$output"
              grep -q '"all_host_headers_verified": true' <<< "$output"
              grep -q '"upstream_front_ranges_sha_equal": true' <<< "$output"
              grep -q '"local_c720p_originals_still_required": true' <<< "$output"
              grep -q '"bounded_1024_bytes_each": true' <<< "$output"
              grep -q '"index_guard_active": true' <<< "$output"
              grep -q '"local_copy_retention_required": true' <<< "$output"
              grep -q '"media_modified": false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Browser all-import Range proof not completed";exit 1
