name: Bruis shop operations v847

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force cost/catalog refresh, backup and both owner briefs'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read

concurrency:
  group: bruis-shop-operations-v847
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
    steps:
      - name: Run protected shop operations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::Missing Supabase runtime secrets"
            exit 1
          fi
          payload='{"action":"run"}'
          if [[ "${FORCE_RUN}" == "true" ]]; then
            payload='{"action":"run","force":true}'
          fi
          response_file="$RUNNER_TEMP/shop-ops.json"
          status="$(curl --silent --show-error --max-time 600             --output "$response_file" --write-out '%{http_code}'             -X POST "${SUPABASE_URL}/functions/v1/shop-ops-v847"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H 'Content-Type: application/json'             --data "$payload")"
          node --input-type=module - "$response_file" "$status" <<'NODE'
          import fs from 'node:fs';
          const [file,status]=process.argv.slice(2);
          const raw=fs.readFileSync(file,'utf8');
          let body={};
          try{body=JSON.parse(raw)}catch{}
          const safe={
            status:Number(status),
            ok:body?.ok===true,
            started_at:body?.result?.started_at||null,
            completed_at:body?.result?.completed_at||null,
            new_alerts:body?.result?.new_alerts??null,
            backup_id:body?.result?.backup?.id||null,
            cost_refresh_ms:body?.result?.costs?.refresh?.duration_ms??null,
            catalog_changes:body?.result?.catalog?.changes??null,
            orders_checked:body?.result?.orders?.orders_checked??null
          };
          console.log('shop-ops-v847',JSON.stringify(safe));
          if(Number(status)!==200||body?.ok!==true){
            console.error('shop operations failed:',String(body?.detail||body?.error||'unknown').slice(0,500));
            process.exit(1);
          }
          NODE
