name: Bruis shop operations v847

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force cost/catalog refresh, backup and both owner briefs'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/shop-operations-v847.trigger'

permissions:
  contents: read

concurrency:
  group: bruis-shop-operations-v847
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_RUN: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.force || 'false') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build due-work plan
        id: plan
        run: node scripts/run-shop-ops-v847.mjs plan

      - name: Refresh current costs
        if: steps.plan.outputs.costs == 'true'
        run: node scripts/run-shop-ops-v847.mjs run_costs

      - name: Refresh catalog and check drift
        if: steps.plan.outputs.catalog == 'true'
        run: node scripts/run-shop-ops-v847.mjs run_catalog

      - name: Check order exceptions and telemetry
        if: steps.plan.outputs.orders == 'true'
        run: node scripts/run-shop-ops-v847.mjs run_orders

      - name: Create private backup snapshot
        if: steps.plan.outputs.backup == 'true'
        id: backup
        run: node scripts/run-shop-ops-v847.mjs run_backup

      - name: Generate daily owner brief
        if: steps.plan.outputs.daily_brief == 'true'
        run: node scripts/run-shop-ops-v847.mjs run_daily_brief

      - name: Generate weekly owner brief
        if: steps.plan.outputs.weekly_brief == 'true'
        run: node scripts/run-shop-ops-v847.mjs run_weekly_brief

      - name: End-to-end XLSX bookkeeping self-test
        if: env.FORCE_RUN == 'true'
        run: node scripts/run-shop-ops-v847.mjs export_self_test

      - name: Export and encrypt newly-created backup
        if: steps.backup.outputs.backup_id != ''
        shell: bash
        env:
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bruis-backup"
          raw="$RUNNER_TEMP/bruis-backup/backup.json"
          enc="$RUNNER_TEMP/bruis-backup/bruis-shop-backup-${BACKUP_ID}.json.enc"
          curl --silent --show-error --fail --max-time 120             "${SUPABASE_URL}/rest/v1/shop_backup_snapshots_v847?id=eq.${BACKUP_ID}&select=*"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H 'Accept: application/json' > "$raw"
          node --input-type=module - "$raw" <<'NODE'
          import fs from 'node:fs';
          const file=process.argv[2];
          const rows=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!Array.isArray(rows)||rows.length!==1||!rows[0]?.payload_sha256) throw new Error('Backup export did not return exactly one valid snapshot');
          NODE
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$raw" -out "$enc" -pass env:SUPABASE_SERVICE_ROLE_KEY
          rm -f "$raw"
          echo "Encrypted backup artifact prepared: $(basename "$enc")"

      - name: Upload encrypted offsite backup artifact
        if: steps.backup.outputs.backup_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bruis-shop-backup-${{ steps.backup.outputs.backup_id }}
          path: ${{ runner.temp }}/bruis-backup/*.enc
          if-no-files-found: error
          retention-days: 90
