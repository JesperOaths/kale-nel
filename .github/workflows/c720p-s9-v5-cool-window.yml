name: S9 V5 archive face review · C720P guarded cool-window installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/s9-v5-cool-window-worker.py'
      - 'ops/c720p/s9-native-security/install-s9-v5-cool-window-v1.py'
      - 'ops/c720p/s9-native-security/test-s9-v5-cool-window-v1.py'
      - '.github/workflows/c720p-s9-v5-cool-window.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/s9-v5-cool-window-worker.py'
      - 'ops/c720p/s9-native-security/install-s9-v5-cool-window-v1.py'
      - '.github/workflows/c720p-s9-v5-cool-window.yml'
permissions:
  contents: read
concurrency:
  group: s9-face-v5-c720p-cool-window
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Confirm S9 temperature, evidence and rollback tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/c720p/s9-native-security/s9-v5-cool-window-worker.py \
            ops/c720p/s9-native-security/install-s9-v5-cool-window-v1.py
          python3 ops/c720p/s9-native-security/test-s9-v5-cool-window-v1.py
          python3 ops/c720p/s9-native-security/test-face-backfill-coverage-v35.py
          python3 ops/c720p/s9-native-security/test-face-deploy-recovery-v35.py
  bootstrap:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PostgreSQL client for the existing authorized C720P management path
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'No connected C720P management secret'; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
      - name: Install immutable local user-systemd timer (no camera restart)
        shell: bash
        run: |
          set -euo pipefail
          installer='ops/c720p/s9-native-security/install-s9-v5-cool-window-v1.py'
          worker='ops/c720p/s9-native-security/s9-v5-cool-window-worker.py'
          build='ops/c720p/s9-native-security/build-s9-face-recall-v27.py'
          android_install='ops/c720p/s9-native-security/deploy-s9-face-recall-v27.py'
          bootstrap_sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          worker_sha="$(sha256sum "$worker" | cut -d' ' -f1)"
          build_sha="$(sha256sum "$build" | cut -d' ' -f1)"
          android_install_sha="$(sha256sum "$android_install" | cut -d' ' -f1)"
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          short_id="$(printf '%s' "$GITHUB_SHA" | cut -c1-22)"
          dest="/tmp/c720p-s9-v5-cool-window-$short.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/$GITHUB_SHA/$installer"
          cmd="curl -fSsL --max-time 45 '$uri' -o '$dest' && printf '%s  %s\n' '$bootstrap_sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' --ref '$GITHUB_SHA' --worker-sha '$worker_sha' --build-sha '$build_sha' --installer-sha '$android_install_sha'"
          idem="c720p-s9-v5-cool-window-$short_id-$GITHUB_RUN_ATTEMPT"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v5-cool-window','deployment',:'cmd',240,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "C720P_S9_V5_LOCAL_TIMER_JOB=$id"
          for i in $(seq 1 55); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 7000)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_V5_LOCAL_TIMER_VERIFIED' <<< "$output" || exit 1
              exit 0
            fi
            sleep 4
          done
          echo 'C720P local timer not confirmed'
          exit 1
