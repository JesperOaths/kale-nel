name: v774 production browser acceptance audit

on:
  pull_request:
    paths:
      - 'scripts/audit-live-browser-v774.mjs'
      - 'scripts/audit-live-browser-v774-focus.mjs'
      - '.github/workflows/v774-production-browser-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install temporary Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Triage confirmed v773 browser findings
        run: node scripts/audit-live-browser-v774-focus.mjs
