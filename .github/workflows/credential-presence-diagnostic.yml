name: Credential presence diagnostic
on:
  push:
    branches:
      - diag/credential-presence-20260910
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report presence only
        shell: bash
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          for n in PRINTIFY_API_TOKEN SHOPIFY_ADMIN_ACCESS_TOKEN SHOPIFY_ACCESS_TOKEN SHOPIFY_ADMIN_TOKEN SHOPIFY_TOKEN; do
            if [ -n "${!n}" ]; then
              printf '%s=PRESENT\n' "$n"
            else
              printf '%s=ABSENT\n' "$n"
            fi
          done
