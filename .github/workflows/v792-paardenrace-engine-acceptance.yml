name: v792 Paardenrace gameplay acceptance

on:
  push:
    branches:
      - 'agent/v792-paardenrace-engine-matrix'
  pull_request:
    paths:
      - 'gejast-paardenrace.js'
      - 'check-paardenrace-engine-v792.mjs'
      - '.github/workflows/v792-paardenrace-engine-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paardenrace-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run deterministic race matrix
        run: node check-paardenrace-engine-v792.mjs
