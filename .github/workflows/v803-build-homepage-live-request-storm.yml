name: Build v803 homepage live request storm fix

on:
  push:
    branches: [agent/v803-homepage-live-request-storm]
    paths: ['.github/workflows/v803-build-homepage-live-request-storm.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v803-homepage-live-request-storm
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply focused runtime repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gejast-v725-repair.js')
          s=p.read_text()
          old="  function patchHomepageLiveCards(){ const path=(location.pathname||'').split('/').pop().toLowerCase(); if(path && path!=='index.html' && path!=='home.html') return; const token=sessionToken(); if(!token) return; const payload={session_token:token,site_scope_input:scope()};"
          new="  let homepageLiveCardsChecked=false;\n  function patchHomepageLiveCards(){ const path=(location.pathname||'').split('/').pop().toLowerCase(); if(path && path!=='index.html') return; if(window.GEJAST_LIVE_SUMMARY&&typeof window.GEJAST_LIVE_SUMMARY.loadHomepageState==='function') return; const token=sessionToken(); if(!token||homepageLiveCardsChecked) return; homepageLiveCardsChecked=true; const payload={session_token:token,site_scope_input:scope()};"
          if old not in s:
              raise SystemExit('Expected v725 homepage patch owner not found')
          p.write_text(s.replace(old,new,1))
          Path('VERSION').write_text('v803\n')
          PY
          node fix-version-drift.mjs
          cat > check-v803-homepage-live-request-cadence.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const source = fs.readFileSync('gejast-v725-repair.js', 'utf8');
          if (!source.includes('let homepageLiveCardsChecked=false')) throw new Error('v725 one-shot homepage fallback guard missing');
          if (!source.includes("if(path && path!=='index.html') return")) throw new Error('v725 must not run homepage-live repair on home.html');
          if (!source.includes("window.GEJAST_LIVE_SUMMARY&&typeof window.GEJAST_LIVE_SUMMARY.loadHomepageState==='function'")) throw new Error('canonical live-summary ownership guard missing');

          async function exercise({ canonical }) {
            let fetchCount = 0;
            const intervals = [];
            const head = { appendChild() {} };
            const classList = { add(){}, remove(){} };
            const document = {
              readyState: 'complete', hidden: false, head,
              body: { classList, innerText: '' },
              addEventListener(){},
              getElementById(){ return null; },
              querySelector(){ return null; },
              querySelectorAll(){ return []; },
              createElement(){ return { id:'', className:'', style:{}, setAttribute(){}, appendChild(){}, querySelector(){return null;} }; }
            };
            const window = {
              GEJAST_CONFIG: {
                SUPABASE_URL: 'https://example.invalid',
                SUPABASE_PUBLISHABLE_KEY: 'test',
                getPlayerSessionToken(){ return 'a'.repeat(48); }
              },
              GEJAST_SCOPE_UTILS: { getScope(){ return 'friends'; } },
              ...(canonical ? { GEJAST_LIVE_SUMMARY: { loadHomepageState(){} } } : {})
            };
            const context = {
              window, document,
              location: { pathname: '/index.html', search: '', href: 'https://kalenel.nl/index.html', replace(){} },
              history: { replaceState(){} },
              URL, URLSearchParams,
              console,
              fetch: async () => { fetchCount += 1; return { ok:true, status:200, async text(){ return '{}'; } }; },
              setInterval(fn){ intervals.push(fn); return intervals.length; }, clearInterval(){},
              setTimeout(){ return 1; }, clearTimeout(){},
              encodeURIComponent,
            };
            vm.createContext(context);
            vm.runInContext(source, context, { filename:'gejast-v725-repair.js' });
            for (let i=0;i<8;i++) for (const fn of [...intervals]) fn();
            await new Promise((resolve)=>setImmediate(resolve));
            return fetchCount;
          }

          const canonicalCount = await exercise({ canonical:true });
          if (canonicalCount !== 0) throw new Error(`canonical v803 homepage made ${canonicalCount} legacy homepage-live fetches; expected 0`);
          const fallbackCount = await exercise({ canonical:false });
          if (fallbackCount > 1) throw new Error(`legacy fallback made ${fallbackCount} homepage-live fetches; expected at most 1`);
          console.log(`PASS v803 homepage-live cadence: canonical=${canonicalCount}, legacy_fallback=${fallbackCount}`);
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          needle='node check-v801-full-visual-audit-auth-context.mjs'
          add='node check-v803-homepage-live-request-cadence.mjs'
          s=data['scripts']['verify:static']
          if add not in s:
              if needle not in s: raise SystemExit('verify insertion anchor missing')
              s=s.replace(needle, needle+' && '+add, 1)
          data['scripts']['verify:static']=s
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n')
          PY
          node check-v803-homepage-live-request-cadence.mjs
          npm ci
          npm run verify || true
          git rm .github/workflows/v803-build-homepage-live-request-storm.yml
          git config user.name 'JesperOaths'
          git config user.email '150788310+JesperOaths@users.noreply.github.com'
          git add VERSION gejast-v725-repair.js check-v803-homepage-live-request-cadence.mjs package.json '*.html' '*.js' '*.mjs' familie || true
          git add -u
          git commit -m 'fix: stop legacy homepage live request storm'
          git push origin HEAD:agent/v803-homepage-live-request-storm
