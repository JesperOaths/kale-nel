name: S9 migrated V236 owner write gateway safety
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/*V236.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-owner-write-failclosed-v236.py'
      - '.github/workflows/s9-migrated-owner-write-v236.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/*V236.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-owner-write-failclosed-v236.py'
      - '.github/workflows/s9-migrated-owner-write-v236.yml'
permissions:
  contents: read
jobs:
  synthetic_owner_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Reject foreign app, shell, missing owner, source anchor and clock
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-owner-write-failclosed-v236.py"
          python3 "$d/test-s9-migrated-bound-receipt-v234.py"
          python3 "$d/test-s9-owner-read-failclosed-v235.py"
  real_android_sdk_abi:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual V233 backend plus V234/V235/V236 against Android 36
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          root=Path('ops/c720p/s9-native-security')
          pins=json.loads((root/'migrated-companion-v233/source-pins.json').read_text())
          names=[x['name'] for x in pins['files']]
          names+=['S9MigratedBoundActionReceiptV234',
                   'S9MigratedAndroidOwnerReadGatewayV235',
                   'S9MigratedAndroidOwnerWriteGatewayV236']
          src=root/'offline-worker'
          sdk=Path(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk'))
          jar=sdk/'platforms/android-36/android.jar'
          if not jar.is_file():
              raise RuntimeError('android_36_sdk_required_for_actual_abi_not_a_fixture')
          paths=[src/(name+'.java') for name in names]
          if any(not p.is_file() for p in paths):
              raise RuntimeError('missing_real_android_source_dependency')
          with tempfile.TemporaryDirectory(prefix='s9-v236-real-android-javac-') as tmp:
              cp=subprocess.run(['javac','-source','8','-target','8',
                 '-cp',str(jar),'-d',tmp]+[str(p) for p in paths],
                 text=True,capture_output=True,timeout=90)
              if cp.returncode:raise RuntimeError(cp.stderr[-8000:])
              classes=list(Path(tmp).rglob('*.class'))
              if len(classes)<60:raise RuntimeError('unexpectedly_incomplete_real_abi')
              print('S9_V236_REAL_ANDROID36_JAVA_ABI_COMPILED',len(classes),
                    'classes','not_installed=True','no_enrollment=True')
          PY
