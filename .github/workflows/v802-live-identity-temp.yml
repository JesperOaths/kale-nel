name: TEMP v802 live identity

on:
  push:
    branches:
      - release/v802-live-identity
    paths:
      - '.github/workflows/v802-live-identity-temp.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/v802-live-identity
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Record exact live identity without certifying release
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const write=(p,x)=>fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          const merge='a0af7b08dba0222fee78f9f6fbf68e26e0bf7610';
          const beta=JSON.parse(fs.readFileSync('beta-readiness.json','utf8'));
          beta.site_version='live v802';
          beta.deployment_identity.live_version='v802';
          beta.deployment_identity.frontend_release_merge=merge;
          beta.deployment_identity.repository_head_at_audit=merge;
          delete beta.deployment_identity.release_candidate_version;
          const deploymentEvidence='2026-08-16 live v802: frontend merge '+merge+' reached /VERSION=v802 during exact-main Live deployment health run 31974690719; public/admin routes, GitHub OAuth perimeter, base+extended read-only acceptance and performance all PASS. Exact-v802 visual run 31974690727 failed before Chromium because every service-role REST fixture provision attempt timed out; no screenshots/artifact were produced and cleanup also timed out, so residue is unverified rather than zero.';
          beta.deployment_identity.evidence=[deploymentEvidence,...(beta.deployment_identity.evidence||[]).filter(x=>!String(x).includes('live v802:'))];
          beta.deployment_identity.note='Live v802 is deployed and static/read-only health is proven by run 31974690719. Release certification remains fail-closed: exact-v802 full visual run 31974690727 could not provision disposable identities because the production Supabase data plane timed out on every service-role REST attempt; Chromium never ran, no screenshot artifact exists, and cleanup/residue verification also timed out. SQL-only Toepen v801a still requires explicit production deployment authorization.';
          const liveRoutes=(beta.baseline_checks||[]).find(x=>x.id==='live_routes');
          if(liveRoutes) liveRoutes.evidence=deploymentEvidence+' '+String(liveRoutes.evidence||'');
          write('beta-readiness.json',beta);

          const cert=JSON.parse(fs.readFileSync('release-certification.json','utf8'));
          cert.current_version='v802';
          cert.status='REVALIDATION_REQUIRED';
          cert.reason='v802 is live from frontend merge '+merge+' and exact-main deployment health run 31974690719 is green. Certification remains blocked because full visual run 31974690727 failed before Chromium when the production Supabase data plane timed out on all disposable-identity provisioning attempts; no screenshot artifact was produced and cleanup/residue verification also timed out. The separate SQL-only Toepen v801a ownership repair remains deliberately undeployed without explicit authorization.';
          cert.current_evidence={...(cert.current_evidence||{}),frontend_version:'v802',frontend_merge:merge,audited_repository_head:merge,v802_live_deployment_health_run:31974690719,v802_visual_audit_run:31974690727,v802_visual_audit_status:'FAILED_BEFORE_SCREENSHOTS_SUPABASE_DATA_PLANE',v802_visual_artifact:null,v802_visual_cleanup_status:'UNVERIFIED_DATA_PLANE_TIMEOUT'};
          cert.required_next=[
            'Restore reliable production Supabase data-plane access, then rerun the exact-current full live visual audit through authenticated Friends/Family fixture provisioning, screenshot capture, artifact upload, zero-residue cleanup and manual screenshot review.',
            'Obtain explicit authorization before applying GEJAST_v801a_toepen_idempotency_owner_guard.sql to production Supabase.',
            'After v801a deployment, prove same-owner Toepen idempotency still returns the same game while unrelated-owner, invalid-session and wrong-scope replay fail closed, with zero residue.',
            'Rerun exact-current live health and the deep Phase-2 gameplay campaign after any backend mutation before considering PASS.'
          ];
          write('release-certification.json',cert);
          NODE
          node check-beta-readiness-current-v770d.mjs
          node check-release-certification-state.mjs
      - name: Commit exact live identity
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta-readiness.json release-certification.json
          git commit -m 'cert: record live v802 deployment identity'
          git push origin HEAD:release/v802-live-identity
