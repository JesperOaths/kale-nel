name: Patch v793 readiness metadata

on:
  push:
    branches:
      - fix/v793-visual-audit-repairs
    paths:
      - 'scripts/v793-readiness-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v793-visual-audit-repairs

      - name: Mark v793 as release candidate while v792 remains live
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='beta-readiness.json';
          const tracker=JSON.parse(fs.readFileSync(file,'utf8'));
          tracker.site_version='release candidate v793 / live v792';
          tracker.last_updated='2026-08-16';
          tracker.deployment_identity = tracker.deployment_identity || {};
          tracker.deployment_identity.release_candidate_version='v793';
          tracker.deployment_identity.live_version='v792';
          const marker='v793 candidate: full production screenshot audit found and repairs visible Klaverjas duplication, ladder game-key mismatch, stale game status RPC owners, Pikken spectator context loss and Rad stats aggregation failure; current release remains REVALIDATION_REQUIRED until post-deploy screenshots and gameplay are re-run.';
          tracker.deployment_identity.evidence = Array.isArray(tracker.deployment_identity.evidence) ? tracker.deployment_identity.evidence : [];
          if(!tracker.deployment_identity.evidence.includes(marker)) tracker.deployment_identity.evidence.push(marker);
          fs.writeFileSync(file,JSON.stringify(tracker,null,2)+'\n');
          NODE
          node check-beta-readiness-current-v770d.mjs

      - name: Commit readiness metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta-readiness.json
          git commit -m 'test: mark v793 as release candidate'
          git push origin HEAD:fix/v793-visual-audit-repairs
