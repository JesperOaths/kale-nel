name: v768 live health proof

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v768-live-health-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Run hardened checker against deployed v766
        env:
          GEJAST_EXPECTED_VERSION: v766
          GEJAST_DEPLOY_WAIT_SECONDS: '0'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: node check-live-routes.mjs
