name: audit Pikken stats shape
on:
  push:
    branches:
      - 'agent/v789-full-site-gameplay-playtest'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Probe read-only Pikken stats response shape
        run: node scripts/audit-pikken-stats-shape.mjs
      - name: Prove repository stayed clean
        run: |
          git diff --check
          git status --short
