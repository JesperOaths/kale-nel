name: v783 runtime stability release builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Chromium tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build scoped v783 candidate
        run: node scripts/build-v783-runtime-release.mjs
      - name: Preserve browser checker outside repository
        run: cp scripts/check-candidate-v783-runtime.mjs /tmp/check-candidate-v783-runtime.mjs
      - name: Remove temporary audit/build machinery
        run: |
          rm -f scripts/audit-runtime-stability-v783.mjs
          rm -f scripts/check-candidate-v783-runtime.mjs
          rm -f scripts/build-v783-runtime-release.mjs
          rm -f .github/workflows/v783-runtime-stability-audit.yml
      - name: Verify clean candidate repository
        run: |
          node check-redirect-alias-runtime-v783.mjs
          npm run verify
          git -c core.whitespace=cr-at-eol diff --check
      - name: Serve patched candidate locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v783-http.log 2>&1 &
          echo $! >/tmp/v783-http.pid
          sleep 2
      - name: Render patched aliases in Chromium
        run: |
          cp /tmp/check-candidate-v783-runtime.mjs scripts/.v783-browser-check.mjs
          node scripts/.v783-browser-check.mjs
          rm -f scripts/.v783-browser-check.mjs
      - name: Commit clean v783 candidate
        run: |
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.whitespace cr-at-eol
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "v783 clean redirect alias runtime"
          git push origin HEAD:${{ github.head_ref }}
