name: v786 Rad live overflow release builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-v786:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Chromium tooling
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Apply deterministic v786 Rad runtime patch
        run: |
          node scripts/build-v786-rad-overflow-fix.mjs
          node fix-version-drift.mjs
      - name: Full permanent verification
        run: npm run verify
      - name: Rad runtime browser proof across mobile widths
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v786-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          node scripts/prove-v786-rad-overflow.mjs
      - name: Remove temporary builder machinery and commit clean candidate
        run: |
          rm -f .github/workflows/v786-rad-overflow-builder.yml
          rm -f scripts/build-v786-rad-overflow-fix.mjs
          rm -f scripts/prove-v786-rad-overflow.mjs
          rm -rf node_modules
          test ! -e .github/workflows/v786-rad-overflow-builder.yml
          test ! -e scripts/build-v786-rad-overflow-fix.mjs
          test ! -e scripts/prove-v786-rad-overflow.mjs
          git config core.whitespace cr-at-eol
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: contain live Rad mobile wheel v786"
          git push origin HEAD:${{ github.head_ref }}
