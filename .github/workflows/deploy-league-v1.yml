name: Deploy League analytics backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-league-v1.yml'
      - 'supabase/functions/league-api-v1/**'
      - 'league/**'
      - 'supabase/migrations/*league*'
      - 'check-league-web-v1.mjs'

permissions:
  contents: read

jobs:
  deploy-league:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify League web contract
        run: node check-league-web-v1.mjs
      - name: Deploy League backend into retired production slot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error title=Missing Supabase credential::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          mkdir -p supabase/functions/printify-gildan-diff-diag-v1
          cp supabase/functions/league-api-v1/index.ts supabase/functions/printify-gildan-diff-diag-v1/index.ts
          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 functions deploy printify-gildan-diff-diag-v1             --project-ref "$PROJECT_REF"             --no-verify-jwt
