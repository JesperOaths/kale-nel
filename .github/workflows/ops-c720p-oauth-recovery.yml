name: C720P OAuth recovery audit

on:
  push:
    branches: ['ops/c720p-drive-oauth-recovery']
    paths: ['.github/workflows/ops-c720p-oauth-recovery.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uiqntazgnrxwliaidkmy
    steps:
      - name: Enqueue fixed C720P OAuth audit through Supabase Management API
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          token=os.environ.get('SUPABASE_ACCESS_TOKEN','')
          if not token:
              raise SystemExit('SUPABASE_ACCESS_TOKEN missing')
          ref=os.environ['PROJECT_REF']
          api=f'https://api.supabase.com/v1/projects/{ref}/database/query'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          command_b64=''
          sql=f"""insert into c720p_agent.jobs(command,timeout_seconds,idempotency_key)
          values (convert_from(decode('{command_b64}','base64'),'UTF8'),180,'oauth-recovery-gh-audit-20260916-v1')
          on conflict (idempotency_key) do update set idempotency_key=excluded.idempotency_key
          returning id,state,created_at;"""
          def query(q, read_only=False):
              body=json.dumps({'query':q,'read_only':read_only}).encode()
              req=urllib.request.Request(api,data=body,headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  text=e.read().decode(errors='replace')
                  raise RuntimeError(f'Management API HTTP {e.code}: {text[:500]}')
          res=query(sql)
          print('ENQUEUE_RESPONSE=',json.dumps(res))
          row=res[0] if isinstance(res,list) and res else res
          job_id=int(row['id'])
          for i in range(48):
              time.sleep(5)
              rows=query(f"select id,state,attempts,exit_code,finished_at,stdout,stderr from c720p_agent.jobs where id={job_id};", True)
              row=rows[0] if isinstance(rows,list) and rows else {}
              print(f"POLL {i+1}: state={row.get('state')} exit={row.get('exit_code')}")
              if row.get('state') in ('done','error','failed'):
                  print('=== C720P STDOUT ===')
                  print(row.get('stdout') or '')
                  print('=== C720P STDERR ===')
                  print(row.get('stderr') or '')
                  if row.get('state')!='done' or row.get('exit_code') not in (0,None):
                      raise SystemExit(2)
                  break
          else:
              raise SystemExit('Timed out waiting for C720P job')
