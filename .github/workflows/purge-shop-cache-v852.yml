name: Purge shop CDN cache v857

on:
  push:
    paths:
      - '.github/workflows/purge-shop-cache-v852.yml'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TOKEN_A: ${{ secrets.CLOUDFARE_API_TOKEN_ONE }}
      TOKEN_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ONE }}
      TOKEN_C: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Purge stale shop HTML and verify cleaned collection artwork
        shell: bash
        run: |
          set -euo pipefail

          purged="false"
          for label in A B C; do
            var="TOKEN_$label"
            token="${!var:-}"
            [[ -n "$token" ]] || continue

            zone_http="$(curl --silent --show-error --max-time 20               -o /tmp/zones-$label.json -w '%{http_code}'               -H "Authorization: Bearer $token"               -H "Content-Type: application/json"               'https://api.cloudflare.com/client/v4/zones?name=kalenel.nl&status=active&per_page=50' || true)"
            [[ "$zone_http" == "200" ]] || { echo "Token $label cannot read zone (HTTP $zone_http)."; continue; }

            zone_id="$(jq -r '.result[0].id // empty' /tmp/zones-$label.json)"
            [[ -n "$zone_id" ]] || { echo "Token $label returned no active zone."; continue; }

            purge_http="$(curl --silent --show-error --max-time 20               -o /tmp/purge-$label.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $token"               -H "Content-Type: application/json"               --data '{"purge_everything":true}'               "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" || true)"
            success="$(jq -r '.success // false' /tmp/purge-$label.json 2>/dev/null || echo false)"
            if [[ "$purge_http" == "200" && "$success" == "true" ]]; then
              echo "Cloudflare cache purged with token alias $label."
              purged="true"
              break
            fi
            echo "Token $label can read the zone but cannot purge it (HTTP $purge_http)."
          done

          if [[ "$purged" != "true" ]]; then
            echo "::warning::No configured Cloudflare token has cache-purge permission; checking whether origin propagation already replaced the stale object."
          fi

          for attempt in {1..20}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20               -D "$headers" -o "$body" -w '%{http_code}'               -H 'Cache-Control: no-cache'               'https://kalenel.nl/shop/' || true)"
            cf_status="$(awk 'BEGIN{IGNORECASE=1} /^cf-cache-status:/ {gsub("\r",""); print $2}' "$headers" | tail -1)"
            age="$(awk 'BEGIN{IGNORECASE=1} /^age:/ {gsub("\r",""); print $2}' "$headers" | tail -1)"
            echo "attempt=$attempt http=$code cf-cache-status=${cf_status:-none} age=${age:-none}"
            if [[ "$code" == "200" ]]               && grep -q 'version-watermark">v857<' "$body"               && grep -q 'data-open-size-guide' "$body"               && grep -q 'store.js?v=20260921-storefront-v857-r1' "$body"               && grep -q 'styles.css?v=20260921-storefront-v857-r1' "$body"               && grep -q 'collection-media-v831.js?v=20260921-storefront-v857-r1' "$body"; then
              echo "Plain https://kalenel.nl/shop/ now serves v857 with the cleaned Classic/Boxy collection artwork."
              exit 0
            fi
            sleep 3
          done

          echo "::error::Plain /shop/ still does not serve v857."
          exit 1
