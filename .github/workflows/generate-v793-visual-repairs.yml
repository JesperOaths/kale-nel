name: Generate v793 visual repairs

on:
  push:
    branches:
      - fix/v793-visual-audit-repairs
    paths:
      - 'scripts/v793-generation-trigger.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/v793-visual-audit-repairs
          fetch-depth: 0

      - name: Generate v793 product/version repairs
        run: node scripts/apply-v793-visual-repairs.mjs

      - name: Verify generated branch before committing
        run: |
          node check-version-drift.mjs
          node check-v793-visual-audit-repairs.mjs
          node check-final-acceptance-v792.mjs
          node check-release-certification-state.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 1
          fi
          git commit -m 'fix: repair v793 visual audit defects'
          git push origin HEAD:fix/v793-visual-audit-repairs
