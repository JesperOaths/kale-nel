name: S9 migrated source-bound action receipt V234
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/*V234.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-bound-receipt-v234.py'
      - '.github/workflows/s9-migrated-bound-receipt-v234.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/*V234.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-bound-receipt-v234.py'
      - '.github/workflows/s9-migrated-bound-receipt-v234.yml'
permissions:
  contents: read
jobs:
  host_only_bound_receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Synthetic independent source approval and signed action-to-current-state binding
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-migrated-bound-receipt-v234.py"
          python3 "$d/test-s9-migrated-postcommit-v232.py"
          python3 "$d/test-s9-dual-store-commit-v197.py"
