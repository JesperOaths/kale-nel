name: C720P native S9 microSD live health V15
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-person-ml-v1/s9_phone_garden_status.py'
      - 'ops/c720p/s9-person-ml-v1/test-s9-storage-status-v15.py'
      - 'ops/c720p/s9-native-security/deploy-native-sd-health-v15.py'
      - '.github/workflows/c720p-s9-native-sd-health-v15.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-native-sd-health-v15.py'
permissions:
  contents: read
concurrency:
  group: c720p-native-s9-storage-health-v15
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate S9 native microSD telemetry and guarded source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-person-ml-v1/s9_phone_garden_status.py ops/c720p/s9-native-security/deploy-native-sd-health-v15.py
          python3 ops/c720p/s9-person-ml-v1/test-s9-storage-status-v15.py
          python3 ops/c720p/s9-native-security/test-phone-sensor-telemetry.py
          python3 - <<'PY'
          from pathlib import Path
          app=Path('ops/c720p/s9-native-security/deploy-native-sd-health-v15.py').read_text()
          for x in ('SECURITY_NATIVE_SD_HEALTH_V15_VERIFIED',
            'SECURITY_NATIVE_SD_HEALTH_V15_ROLLED_BACK',
            'c720p-drive-security-archive.service','concurrent_source_change',
            '/new/api/live-person-watch','/new/api/saved',
            'sd_free_bytes','18808/status'):
            assert x in app,x
          for x in ('shell=True','shutil.rmtree(', 'camera-control','/api/saved/delete'):
            assert x not in app,x
          print('NATIVE_SD_HEALTH_V15_SCOPE_PASS')
          PY
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Guarded status-only upgrade and rollback-aware archive verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || exit 1
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          file="ops/c720p/s9-native-security/deploy-native-sd-health-v15.py"
          digest="$(sha256sum "$file" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${file}"
          dst="/tmp/native-s9-sd-health-v15-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${dst}' && printf '%s  %s\\n' '${digest}' '${dst}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${dst}'"
          idem="native-s9-sd-health-v15-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-native-sd-health-v15','deployment',:'cmd',220,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_NATIVE_SD_HEALTH_V15_JOB_ID=$id"
          for i in $(seq 1 42); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 7600)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || { echo 'Guarded deployment failed or rolled back'; exit 1; }
              grep -q 'SECURITY_NATIVE_SD_HEALTH_V15_VERIFIED' <<< "$output" || exit 1
              echo 'S9_NATIVE_MICROSD_HEALTH_V15_ON_DEVICE_VERIFIED'
              exit 0
            fi
            sleep 8
          done
          exit 1
