name: Apply guarded v770 cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v770-stale-repair-copy-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v770 branch
        uses: actions/checkout@v5
        with:
          ref: agent/v770-stale-repair-copy-cleanup
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Apply narrow copy fixes, safe version bump and regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`${path}: expected source text not found`);
            fs.writeFileSync(path, before.replace(from, to), 'utf8');
          }

          replaceExact(
            'ballroom.html',
            "Balzaalactie is nog niet beschikbaar. Run eerst de balzaal-repair SQL.",
            "Balzaalactie is tijdelijk niet beschikbaar. Vernieuw de pagina en probeer het opnieuw."
          );
          replaceExact(
            'gejast-live-summary.js',
            "Live samenvatting is nog niet beschikbaar op deze database. Draai eerst de v488 compat SQL.",
            "Live samenvatting kon niet worden geladen. Vernieuw de pagina en probeer het opnieuw."
          );

          fs.writeFileSync('VERSION', 'v770\n', 'utf8');

          const fixerPath = 'fix-version-drift.mjs';
          let fixer = fs.readFileSync(fixerPath, 'utf8');
          if (!fixer.includes('allowedStaticVersionFiles')) {
            const ignoredNeedle = "const ignoredFiles = new Set(['check-version-drift.mjs','fix-version-drift.mjs']);\n";
            if (!fixer.includes(ignoredNeedle)) throw new Error('fix-version-drift.mjs constants insertion point missing');
            fixer = fixer.replace(
              ignoredNeedle,
              ignoredNeedle + "const allowedStaticVersionFiles = new Set(['admin.html','cloudflare/workers/admin-gate/static/admin.html','scripts/test-admin-static-assets-html-handling.mjs','scripts/test-admin-worker-gate.mjs']);\n"
            );

            const oldBlock = `  let after = before
              .replace(/\\?v\\d+/gi, \`?\${rootVersion}\`)
              .replace(/(GEJAST_PAGE_VERSION\\s*=\\s*['\"])v\\d+(['\"])/gi, \`$1\${rootVersion}$2\`)
              .replace(/(GEJAST_SITE_VERSION\\s*=\\s*['\"])v\\d+(['\"])/gi, \`$1\${rootVersion}$2\`)
              .replace(/(VERSION\\s*:\\s*['\"])v\\d+(['\"])/gi, \`$1\${rootVersion}$2\`)
              .replace(/v\\d+\\s*[-–—.]?\\s*Made by Bruis/gi, \`\${rootVersion}  -  Made by Bruis\`);`;
            const newBlock = `  const preserveStaticV762 = allowedStaticVersionFiles.has(rel);
              let after = before
              .replace(/\\?v(\\d+)/gi, (match, digits) => preserveStaticV762 && digits === '762' ? match : \`?\${rootVersion}\`)
              .replace(/(GEJAST_PAGE_VERSION\\s*=\\s*['\"])v(\\d+)(['\"])/gi, (match, prefix, digits, suffix) => preserveStaticV762 && digits === '762' ? match : \`\${prefix}\${rootVersion}\${suffix}\`)
              .replace(/(GEJAST_SITE_VERSION\\s*=\\s*['\"])v(\\d+)(['\"])/gi, (match, prefix, digits, suffix) => preserveStaticV762 && digits === '762' ? match : \`\${prefix}\${rootVersion}\${suffix}\`)
              .replace(/(VERSION\\s*:\\s*['\"])v(\\d+)(['\"])/gi, (match, prefix, digits, suffix) => preserveStaticV762 && digits === '762' ? match : \`\${prefix}\${rootVersion}\${suffix}\`)
              .replace(/v(\\d+)\\s*[-–—.]?\\s*Made by Bruis/gi, (match, digits) => preserveStaticV762 && digits === '762' ? match : \`\${rootVersion}  -  Made by Bruis\`);`;
            if (!fixer.includes(oldBlock)) throw new Error('fix-version-drift.mjs replacement block missing');
            fixer = fixer.replace(oldBlock, newBlock);
            fs.writeFileSync(fixerPath, fixer, 'utf8');
          }

          const checker = `#!/usr/bin/env node
          import fs from 'node:fs';
          const ballroom = fs.readFileSync('ballroom.html','utf8');
          const live = fs.readFileSync('gejast-live-summary.js','utf8');
          const version = fs.readFileSync('VERSION','utf8').trim();
          const fixer = fs.readFileSync('fix-version-drift.mjs','utf8');
          const failures = [];
          if (version !== 'v770') failures.push('root VERSION is not v770');
          if (ballroom.includes('Run eerst de balzaal-repair SQL')) failures.push('Ballroom still exposes repair-SQL instructions');
          if (!ballroom.includes('Balzaalactie is tijdelijk niet beschikbaar. Vernieuw de pagina en probeer het opnieuw.')) failures.push('Ballroom generic recovery copy missing');
          if (live.includes('v488 compat SQL')) failures.push('Live summary still exposes v488 SQL instructions');
          if (!live.includes('Live samenvatting kon niet worden geladen. Vernieuw de pagina en probeer het opnieuw.')) failures.push('Live-summary generic recovery copy missing');
          if (!ballroom.includes('get_ballroom_state_safe') || !ballroom.includes('get_ballroom_public_state_safe')) failures.push('Ballroom safe read fallback contract changed');
          if (!ballroom.includes('ballroom_claim_king_safe') || !ballroom.includes('ballroom_request_entry_safe')) failures.push('Ballroom safe write contract changed');
          if (!live.includes('get_live_match_summary_public_scoped') || !live.includes('get_live_match_summary_public')) failures.push('Live-summary scoped/legacy fallback contract changed');
          if (!live.includes('get_homepage_live_state_public_scoped') || !live.includes('get_homepage_live_state_public')) failures.push('Homepage scoped/legacy fallback contract changed');
          if (!fixer.includes('preserveStaticV762') || !fixer.includes("digits === '762'")) failures.push('version fixer does not preserve only intentional v762 tokens');
          if (failures.length) { failures.forEach((x)=>console.error('- '+x)); process.exit(1); }
          console.log('v770 stale repair-copy regression PASS.');
          `;
          fs.writeFileSync('check-stale-repair-copy-v770.mjs', checker.replace(/^          /gm,''), 'utf8');

          let pkg = fs.readFileSync('package.json','utf8');
          if (!pkg.includes('check-stale-repair-copy-v770.mjs')) {
            const pkgNeedle = 'node check-ballroom-safe-read-repair-v769a.mjs"';
            if (!pkg.includes(pkgNeedle)) throw new Error('package verify insertion point missing');
            pkg = pkg.replace(pkgNeedle, 'node check-ballroom-safe-read-repair-v769a.mjs && node check-stale-repair-copy-v770.mjs"');
            fs.writeFileSync('package.json', pkg, 'utf8');
          }
          NODE

          node fix-version-drift.mjs
          node check-version-drift.mjs
          node check-stale-repair-copy-v770.mjs
          npm run verify
      - name: Commit generated ordinary v770 release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows/v770-apply-cleanup.yml || true
          git restore --staged .github/workflows/verify.yml || true
          if git diff --cached --quiet; then
            echo "No generated ordinary-file changes to commit."
            exit 0
          fi
          git commit -m "v770 clean stale repair instructions"
          git push origin HEAD:agent/v770-stale-repair-copy-cleanup
