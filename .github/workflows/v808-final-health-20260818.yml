name: v808 final exact health proof

on:
  push:
    branches: [proof/v808-final-certification-20260818]
    paths: ['.github/workflows/v808-final-health-20260818.yml']

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEJAST_EXACT_MAIN_SHA: 7f6f7bc110807e85f52ff4d54927620dbbc9ffeb
      GEJAST_EXPECTED_VERSION: v808
    steps:
      - name: Check out exact proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v808-final-certification-20260818
          fetch-depth: 0
      - name: Record run identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .proof/v808-final-health-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .proof/v808-final-health-run-id.txt
          git commit -m 'test: record v808 final health run id'
          git push origin HEAD:proof/v808-final-certification-20260818
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Prove exact current product tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GEJAST_EXACT_MAIN_SHA"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = "$GEJAST_EXPECTED_VERSION"
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^(\.github/workflows/v808-final-health-20260818\.yml|\.proof/v808-final-health-run-id\.txt)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected proof-branch drift:'; echo "$unexpected"; exit 1; }
          echo 'RESULT=V808_FINAL_HEALTH_EXACT_TREE_PASS'
      - name: Verify deployed public and admin surfaces
        env:
          GEJAST_DEPLOY_WAIT_SECONDS: '300'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: node check-live-routes.mjs
      - name: Verify live admin GitHub OAuth outer boundary
        env:
          GEJAST_ADMIN_AUTH_TIMEOUT_MS: '15000'
        run: node check-live-admin-auth-boundary.mjs
      - name: Verify Supabase auth data-plane liveness
        env:
          GEJAST_DATA_PLANE_TIMEOUT_MS: '10000'
          GEJAST_DATA_PLANE_ATTEMPTS: '2'
          GEJAST_DATA_PLANE_RETRY_DELAY_MS: '750'
        run: node check-live-data-plane.mjs
      - name: Run primary read-only beta acceptance
        env:
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
        run: node check-beta-readonly-surfaces.mjs
      - name: Run extended read-only beta acceptance
        env:
          GEJAST_BETA_SURFACE_TIMEOUT_MS: '15000'
        run: node check-beta-readonly-extended.mjs
      - name: Record live beta performance probe
        env:
          GEJAST_PERF_TIMEOUT_MS: '20000'
        run: node check-beta-performance.mjs
      - name: Final marker
        run: echo 'RESULT=V808_FINAL_EXACT_HEALTH_PASS'
