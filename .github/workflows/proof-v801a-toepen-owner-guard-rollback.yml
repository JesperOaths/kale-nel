name: v801a Toepen owner guard rollback-only proof

on:
  push:
    branches: [sql/v801a-toepen-idempotency-owner-guard]
    paths: ['.github/workflows/proof-v801a-toepen-owner-guard-rollback.yml']

permissions:
  contents: read

concurrency:
  group: full-live-visual-audit
  cancel-in-progress: false

jobs:
  rollback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_EXACT_MAIN_SHA: d5388341c5ca0a595f80f239ebb5cafa84b6af60
    steps:
      - name: Check out v801a branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: sql/v801a-toepen-idempotency-owner-guard
          fetch-depth: 0

      - name: Prove unchanged v801 live baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = v801
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = v801
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          before="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select position('toepen_game_owner_mismatch' in pg_get_functiondef('public.create_toepen_game(text,jsonb,text)'::regprocedure));")"
          test "$before" = 0
          echo 'RESULT=V801A_PRE_PROOF_PRODUCTION_FUNCTION_UNCHANGED'

      - name: Build transaction-safe migration copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('GEJAST_v801a_toepen_idempotency_owner_guard.sql').read_text().splitlines()
          out=[]
          for line in src:
              s=line.strip().lower()
              if s in {'begin;','commit;'} or s.startswith('notify pgrst'):
                  continue
              out.append(line)
          Path('/tmp/v801a-under-test.sql').write_text('\n'.join(out)+'\n')
          PY
          grep -q 'toepen_game_owner_mismatch' /tmp/v801a-under-test.sql
          ! grep -Eq '^[[:space:]]*(begin;|commit;|notify pgrst)' /tmp/v801a-under-test.sql

      - name: Exercise v801a against production schema and rollback everything
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          PROOF_A="V801aTxA_${suffix}"
          PROOF_B="V801aTxB_${suffix}"
          PROOF_CLIENT="v801a-tx-${suffix}"
          PROOF_BAD_CLIENT="v801a-tx-bad-${suffix}"
          p1=4826; p2=7314
          echo "::add-mask::$p1"; echo "::add-mask::$p2"
          echo "PROOF_A=$PROOF_A" >> "$GITHUB_ENV"
          echo "PROOF_B=$PROOF_B" >> "$GITHUB_ENV"
          echo "PROOF_CLIENT=$PROOF_CLIENT" >> "$GITHUB_ENV"
          echo "PROOF_BAD_CLIENT=$PROOF_BAD_CLIENT" >> "$GITHUB_ENV"

          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v a="$PROOF_A" -v b="$PROOF_B" -v c="$PROOF_CLIENT" -v badc="$PROOF_BAD_CLIENT" -v p1="$p1" -v p2="$p2" <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          \i /tmp/v801a-under-test.sql
          select set_config('gejast.proof_a', :'a', true),
                 set_config('gejast.proof_b', :'b', true),
                 set_config('gejast.proof_client', :'c', true),
                 set_config('gejast.proof_bad_client', :'badc', true),
                 set_config('gejast.proof_pin_a', :'p1', true),
                 set_config('gejast.proof_pin_b', :'p2', true);

          do $proof$
          declare
            a_name text := current_setting('gejast.proof_a');
            b_name text := current_setting('gejast.proof_b');
            client_id text := current_setting('gejast.proof_client');
            bad_client_id text := current_setting('gejast.proof_bad_client');
            pin_a text := current_setting('gejast.proof_pin_a');
            pin_b text := current_setting('gejast.proof_pin_b');
            token_a text;
            token_b text;
            payload jsonb;
            forged jsonb;
            first_result jsonb;
            replay_result jsonb;
            first_id bigint;
          begin
            insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
            values
              ('v801a-tx-a-'||lower(a_name),a_name,true,'md5:'||md5(pin_a||':'||current_database()),true,true,true,'friends'),
              ('v801a-tx-b-'||lower(b_name),b_name,true,'md5:'||md5(pin_b||':'||current_database()),true,true,true,'friends');

            token_a := public.account_login_v687(a_name,pin_a,'friends','{"proof":"v801a-rollback"}'::jsonb)->>'session_token';
            token_b := public.account_login_v687(b_name,pin_b,'friends','{"proof":"v801a-rollback"}'::jsonb)->>'session_token';
            if token_a !~ '^[0-9a-f]{48}$' or token_b !~ '^[0-9a-f]{48}$' then
              raise exception 'proof session creation failed';
            end if;

            payload := jsonb_build_object(
              'client_match_id',client_id,'game_type','toepen','target_points',1,'site_scope','friends',
              'participants',jsonb_build_array(
                jsonb_build_object('seat_no',1,'name',a_name,'start_points',0,'end_points',0,'eliminated',false,'finish_rank',1),
                jsonb_build_object('seat_no',2,'name','Synthetic Opponent','start_points',0,'end_points',1,'eliminated',true,'eliminated_round_no',1,'finish_rank',2)
              ),
              'rounds',jsonb_build_array(jsonb_build_object(
                'round_no',1,'dealer_seat',1,'winner_seat',1,'winner_name',a_name,'stake_final',1,
                'results',jsonb_build_array(
                  jsonb_build_object('seat_no',1,'name',a_name,'action','win','penalty_points',0),
                  jsonb_build_object('seat_no',2,'name','Synthetic Opponent','action','stay','penalty_points',1)
                )
              ))
            );

            first_result := public.create_toepen_game(token_a,payload,'friends');
            if coalesce((first_result->>'ok')::boolean,false) is distinct from true
               or coalesce((first_result->>'already_saved')::boolean,true) is distinct from false then
              raise exception 'first save contract failed: %', first_result;
            end if;
            first_id := (first_result->>'game_id')::bigint;

            replay_result := public.create_toepen_game(token_a,payload,'friends');
            if coalesce((replay_result->>'already_saved')::boolean,false) is distinct from true
               or (replay_result->>'game_id')::bigint is distinct from first_id then
              raise exception 'same-owner idempotency contract failed: %', replay_result;
            end if;

            begin
              perform public.create_toepen_game(token_b,payload,'friends');
              raise exception 'foreign replay unexpectedly succeeded';
            exception when others then
              if sqlerrm <> 'toepen_game_owner_mismatch' then raise exception 'foreign replay wrong error: %', sqlerrm; end if;
            end;

            begin
              perform public.create_toepen_game('ffffffffffffffffffffffffffffffffffffffffffffffff',payload,'friends');
              raise exception 'invalid session unexpectedly succeeded';
            exception when others then
              if position('Niet ingelogd' in sqlerrm)=0 then raise exception 'invalid session wrong error: %', sqlerrm; end if;
            end;

            begin
              perform public.create_toepen_game(token_a,payload,'family');
              raise exception 'wrong-scope replay unexpectedly succeeded';
            exception when others then
              if position('Verkeerde Toepen-scope' in sqlerrm)=0 then raise exception 'wrong-scope replay wrong error: %', sqlerrm; end if;
            end;

            forged := jsonb_set(payload,'{client_match_id}',to_jsonb(bad_client_id),false);
            forged := jsonb_set(forged,'{participants,1,end_points}','2'::jsonb,false);
            begin
              perform public.create_toepen_game(token_a,forged,'friends');
              raise exception 'forged totals unexpectedly succeeded';
            exception when others then
              if position('Toepen-eindscore komt niet overeen met rondepunten' in sqlerrm)=0 then raise exception 'totals guard wrong error: %', sqlerrm; end if;
            end;

            if (select count(*) from public.toepen_games where client_match_id=client_id) <> 1 then raise exception 'expected exactly one valid proof game'; end if;
            if (select count(*) from public.toepen_games where client_match_id=bad_client_id) <> 0 then raise exception 'forged totals game residue exists inside transaction'; end if;
            raise notice 'RESULT=V801A_TRANSACTIONAL_OWNER_GUARD_PASS';
          end
          $proof$;
          rollback;
          SQL
          echo 'RESULT=V801A_TRANSACTION_ROLLBACK_COMPLETED'

      - name: Prove production function and data are untouched after rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          after="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select position('toepen_game_owner_mismatch' in pg_get_functiondef('public.create_toepen_game(text,jsonb,text)'::regprocedure));")"
          test "$after" = 0
          if [ -n "${PROOF_A:-}" ]; then
            residue="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -c "select (select count(*) from public.players where display_name in ('$PROOF_A','$PROOF_B')),(select count(*) from public.gejast_player_sessions_v746 where display_name in ('$PROOF_A','$PROOF_B')),(select count(*) from public.toepen_games where client_match_id in ('$PROOF_CLIENT','$PROOF_BAD_CLIENT'));" )"
            test "$residue" = '0|0|0'
          fi
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = v801
          echo 'RESULT=V801A_ROLLBACK_PROOF_ZERO_RESIDUE_PASS'
