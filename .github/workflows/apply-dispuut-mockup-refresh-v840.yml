name: Apply Dispuut mockup refresh v840

"on":
  push:
    branches:
      - fix/us-phone-shipping-v840
    paths:
      - '.github/workflows/apply-dispuut-mockup-refresh-v840.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Version Printify mockups and verify catalog contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-dispuut-mockup-refresh-v840.py
          npm ci
          node check-shop-commerce-v817.mjs
          npm run verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/shop-catalog-v828/index.ts \
                  check-shop-commerce-v817.mjs \
                  check-live-shop.mjs
          git commit -m 'fix: refresh Printify mockups after artwork changes'
          git push
