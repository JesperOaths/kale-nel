name: v776 final-product acceptance audit

on:
  pull_request:
    paths:
      - 'scripts/audit-final-product-ux-v776.mjs'
      - '.github/workflows/v776-final-product-acceptance-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Audit user-facing HTML for finish/accessibility residue
        run: node scripts/audit-final-product-ux-v776.mjs
      - name: Run current live performance budgets
        env:
          GEJAST_EXPECTED_VERSION: v775
          GEJAST_SMOKE_RETRIES: '3'
        run: node check-beta-performance.mjs
