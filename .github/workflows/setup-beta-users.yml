name: Setup beta users

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.repository == 'JesperOaths/kale-nel'
    env:
      SUPABASE_URL: https://uiqntazgnrxwliaidkmy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BETA1_PIN: ${{ secrets.BETA1_PIN }}
      BETA2_PIN: ${{ secrets.BETA2_PIN }}
    steps:
      - name: Validate beta PIN secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${BETA1_PIN:-}" =~ ^[0-9]{4}$ ]]; then
            echo "Missing or invalid BETA1_PIN secret; expected exactly four digits."
            exit 1
          fi
          if [[ ! "${BETA2_PIN:-}" =~ ^[0-9]{4}$ ]]; then
            echo "Missing or invalid BETA2_PIN secret; expected exactly four digits."
            exit 1
          fi
          if [ "$BETA1_PIN" = "$BETA2_PIN" ]; then
            echo "BETA1_PIN and BETA2_PIN must be different."
            exit 1
          fi

      - name: Prepare bcrypt hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import crypt
          import os

          pins = {
              "BETA1_HASH": os.environ["BETA1_PIN"],
              "BETA2_HASH": os.environ["BETA2_PIN"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, pin in pins.items():
                  hashed = crypt.crypt(pin, crypt.mksalt(crypt.METHOD_BLOWFISH)).replace("$2b$", "$2a$", 1)
                  print(f"::add-mask::{hashed}")
                  env_file.write(f"{name}={hashed}\n")
          PY

      - name: Create or update beta users
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) throw new Error('Missing Supabase service role config');
          if (!process.env.BETA1_HASH || !process.env.BETA2_HASH) throw new Error('Missing generated beta PIN hashes');
          const users = [
            { display_name:'Beta1', slug:'beta1', username:'beta1', pin_hash:process.env.BETA1_HASH, approved_email:'beta1@example.invalid' },
            { display_name:'Beta2', slug:'beta2', username:'beta2', pin_hash:process.env.BETA2_HASH, approved_email:'beta2@example.invalid' }
          ];
          function headers(extra={}) {
            return {
              apikey: key,
              Authorization: `Bearer ${key}`,
              'Content-Type': 'application/json',
              Accept: 'application/json',
              ...extra
            };
          }
          async function parse(res) {
            const text = await res.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            if (!res.ok) throw new Error(typeof data === 'string' ? data : (data?.message || data?.error || data?.details || data?.hint || `HTTP ${res.status}`));
            return data;
          }
          async function rest(path, init={}) {
            return fetch(`${url}/rest/v1/${path}`, {
              ...init,
              headers: headers(init.headers || {})
            }).then(parse);
          }
          async function findPlayer(slug) {
            const rows = await rest(`players?select=id,display_name,slug,site_scope&slug=eq.${encodeURIComponent(slug)}&limit=1`);
            return Array.isArray(rows) && rows.length ? rows[0] : null;
          }
          async function upsertPlayer(user) {
            const payload = {
              display_name: user.display_name,
              slug: user.slug,
              pin_hash: user.pin_hash,
              active: true,
              approved: true,
              approved_email: user.approved_email,
              site_scope: 'friends',
              hidden_from_public: false,
              is_dummy: false
            };
            const existing = await findPlayer(user.slug);
            if (existing?.id) {
              const rows = await rest(`players?id=eq.${existing.id}&select=id,display_name,slug,active,approved,site_scope`, {
                method: 'PATCH',
                headers: { Prefer: 'return=representation' },
                body: JSON.stringify(payload)
              });
              return rows[0];
            }
            const rows = await rest('players?select=id,display_name,slug,active,approved,site_scope', {
              method: 'POST',
              headers: { Prefer: 'return=representation' },
              body: JSON.stringify(payload)
            });
            return rows[0];
          }
          async function upsertAllowed(user, player) {
            const full = {
              username: user.username,
              display_name: user.display_name,
              status: 'active',
              player_id: player.id,
              site_scope: 'friends',
              reserved_for_email: user.approved_email,
              reserved_for_person_note: 'Tier 3 beta test account'
            };
            const minimal = {
              username: user.username,
              display_name: user.display_name,
              status: 'active',
              player_id: player.id
            };
            for (const payload of [full, minimal]) {
              try {
                const rows = await rest('allowed_usernames?on_conflict=username&select=id,username,display_name,status,player_id,site_scope', {
                  method: 'POST',
                  headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
                  body: JSON.stringify(payload)
                });
                return Array.isArray(rows) ? rows[0] : rows;
              } catch (err) {
                if (payload === minimal) throw err;
              }
            }
          }
          const result = [];
          for (const user of users) {
            const player = await upsertPlayer(user);
            const allowed = await upsertAllowed(user, player);
            result.push({ name:user.display_name, player_id:player.id, allowed_id:allowed?.id || null, scope:player.site_scope || 'friends' });
          }
          console.log(JSON.stringify({ ok:true, users:result }, null, 2));
          NODE
