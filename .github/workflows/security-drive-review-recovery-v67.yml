name: Security Drive review legacy recovery audit V67
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/audit-drive-review-recovery-v67.py'
      - '.github/workflows/security-drive-review-recovery-v67.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/audit-drive-review-recovery-v67.py'
      - '.github/workflows/security-drive-review-recovery-v67.yml'
permissions:
  contents: read
concurrency:
  group: security-drive-review-recovery-v67
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Assert strictly read-only recovery audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/audit-drive-review-recovery-v67.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/audit-drive-review-recovery-v67.py').read_text()
          for banned in ('os.remove(', '.unlink(', 'shutil.rmtree(', 'subprocess.', 'os.system(', 'os.replace(', 'open("w"', "open('w'", '.write_text(', '.write_bytes('):
              assert banned not in s, banned
          assert 'DRIVE_REVIEW_RECOVERY_V67' in s
          assert 'review_files_modified' in s
          print('DRIVE_V67_READ_ONLY_SOURCE_PASS')
          PY
  audit:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Inspect aggregate historic visitor links and manual person overlays
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          src='ops/c720p/s9-native-security/audit-drive-review-recovery-v67.py'
          digest="$(sha256sum "$src" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
          dest="/tmp/security-drive-forensics-v67-${GITHUB_SHA:0:12}.py"
          cmd="curl -fsSL --max-time 35 '$url' -o '$dest' && printf '%s  %s\\n' '$digest' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest'"
          idem="security-drive-forensics-v67-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-drive-forensics-v67','diagnostic',:'cmd',90,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_DRIVE_RECOVERY_JOB=$id"
          for i in $(seq 1 35); do
            result="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$result" == done* || "$result" == error* || "$result" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 6000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 1000)"
              echo "$output"
              if [[ "$result" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'DRIVE_REVIEW_RECOVERY_V67' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          exit 1
