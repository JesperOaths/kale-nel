name: Arm S9 v9 cool-idle upgrade on C720P

on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/arm-person-v9-cool-idle.py'
      - 'ops/c720p/s9-native-security/test-cool-idle-timer-v9.py'
      - '.github/workflows/arm-s9-v9-cool-idle.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/arm-s9-v9-cool-idle.yml'

permissions:
  contents: read

jobs:
  verify-c720p-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify bounded local timer and pinned phone-deployer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-cool-idle-timer-v9.py
          python3 ops/c720p/s9-native-security/test-person-motion-v9-upgrade.py
          python3 -m py_compile ops/c720p/s9-native-security/arm-person-v9-cool-idle.py
          python3 -m py_compile ops/c720p/s9-native-security/deploy-person-motion-v9.py

  arm-c720p:
    needs: verify-c720p-timer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Arm 24-hour, C720P-local guarded on-phone upgrade window
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Authorized C720P gateway unavailable'; exit 1; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          installer='ops/c720p/s9-native-security/arm-person-v9-cool-idle.py'
          deployer='ops/c720p/s9-native-security/deploy-person-motion-v9.py'
          script_hash="$(sha256sum "$installer" | cut -d' ' -f1)"
          deploy_hash="$(sha256sum "$deployer" | cut -d' ' -f1)"
          [[ "${script_hash}" =~ ^[a-f0-9]{64}$ && "${deploy_hash}" =~ ^[a-f0-9]{64}$ && "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${installer}"
          dst="/tmp/s9-person-v9-arm-${GITHUB_SHA:0:14}.py"
          cmd="curl -fSsL --max-time 45 '${uri}' -o '${dst}' && printf '%s  %s\\n' '${script_hash}' '${dst}' | sha256sum -c - >/dev/null && S9_SECURITY_REF='${GITHUB_SHA}' S9_V9_DEPLOY_SHA256='${deploy_hash}' /usr/bin/python3 '${dst}'"
          idem="s9-v9-local-cool-idle-${GITHUB_SHA:0:24}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v9-cool-idle','deployment',:'cmd',120,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "S9_V9_LOCAL_TIMER_INSTALL_JOB=$id"
          for attempt in $(seq 1 18); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}" | head -n 1)"
            if [[ "$status" == done\|* || "$status" == error\|* || "$status" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}" | head -c 3000)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || { echo "Local timer install failed"; exit 1; }
              grep -Eq 'S9_V9_COOL_IDLE_TIMER_ARMED|S9_V9_COOL_IDLE_TIMER_ALREADY_ARMED' <<< "$output" || exit 1
              echo 'S9_V9_LOCAL_SAFE_COOL_IDLE_RETRY_CONFIRMED'
              exit 0
            fi
            sleep 7
          done
          echo 'Local timer installer did not complete in time'
          exit 1
