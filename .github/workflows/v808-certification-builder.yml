name: v808 certification builder

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

concurrency:
  group: v808-certification-builder
  cancel-in-progress: false

env:
  PRODUCT_SHA: 7f6f7bc110807e85f52ff4d54927620dbbc9ffeb
  CERT_BRANCH: release/v808-certification-record

jobs:
  certify:
    if: github.head_ref == 'release/v808-certification-record'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release/v808-certification-record
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build exact v808 certification record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRODUCT_SHA"
          test "$(git show "$PRODUCT_SHA:VERSION" | tr -d '\r\n')" = 'v808'
          unexpected="$(git diff --name-only "$PRODUCT_SHA"..HEAD | grep -Ev '^\.github/workflows/v808-certification-builder\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected certification-branch drift:'; echo "$unexpected"; exit 1; }
          python3 <<'PY'
          from pathlib import Path
          import json

          product_sha='7f6f7bc110807e85f52ff4d54927620dbbc9ffeb'
          visual_digest='b017cbb66811ebd8c3bd8daf9ec7083df12db082ae7d6af209ef19422dd81af9'

          final={
            'schema_version':1,
            'site_version':'v808',
            'status':'PASS',
            'certified_at':'2026-08-18',
            'evidence_baseline_main_sha':product_sha,
            'certified_release_branch':'release/v808-certified-20260818',
            'production_migration':{
              'version':'20260818001412',
              'name':'gejast_v801a_toepen_idempotency_owner_guard'
            },
            'authoritative_runs':{
              'exact_current_live_health':{
                'run_id':32123034385,'job_id':95698011853,'conclusion':'success',
                'coverage':['exact v808 tree','live VERSION','public routes','admin OAuth outer boundary','auth data plane','primary read-only','extended read-only','performance']
              },
              'owner_isolation':{
                'run_id':32123034385,'job_id':95698167836,'conclusion':'success',
                'games':['boerenbridge','beerpong'],'same_owner_replay':'PASS','cross_owner_replay':'rejected','cleanup':'zero residue'
              },
              'deep_live':{
                'run_id':32123034385,'job_id':95698248548,'conclusion':'success',
                'coverage':['multi-context','mobile','reconnect','Pikken natural completion','Paardenrace natural completion','post-game session survival'],'cleanup':'zero residue'
              },
              'authenticated_visual_closure':{
                'run_id':32123034341,'job_id':95667460019,'conclusion':'success',
                'screenshots':137,'records':137,'broken_after_declared_alias_refinement':0,
                'family_runtime_contracts':'PASS','manual_review':'PASS','cleanup':'zero residue',
                'artifact_id':9319744233,'artifact_name':'v808-final-visual-32123034341-1','artifact_sha256':visual_digest
              }
            },
            'non_authoritative_diagnostics':{
              'serial_visual_harness':{
                'run_id':32123034385,'job_id':95698786463,'conclusion':'failure',
                'classification':'superseded proof-harness policy mismatch',
                'reason':'The older Family helper treated generic known HTTP-404 runtime warning console messages as fatal before screenshot capture. Its route assertions, including the parameterless and named Family player aliases, passed and its fixture cleanup passed zero residue. The independent exact-current authenticated visual-closure run 32123034341 is the authoritative visual evidence.'
              }
            },
            'security_contracts':{
              'forced_player_login_gate':'PASS','friends_family_scope_isolation':'PASS',
              'family_empty_player_alias':'PASS','admin_cloudflare_outer_boundary':'PASS',
              'admin_supabase_totp_inner_boundary':'PASS','toepen_idempotency_owner_guard':'PASS',
              'boerenbridge_owner_isolation':'PASS','beerpong_owner_isolation':'PASS'
            },
            'gameplay_contracts':{
              'toepen':'PASS','boerenbridge':'PASS','beerpong':'PASS','klaverjas':'PASS','pikken':'PASS','paardenrace':'PASS',
              'pikken_natural_completion':'PASS','paardenrace_natural_completion':'PASS','multi_context_reconnect':'PASS','mobile_runtime':'PASS'
            },
            'production_state':{
              'supabase_project_id':'uiqntazgnrxwliaidkmy','database_data_plane':'healthy',
              'latest_migration_version':'20260818001412','latest_migration_name':'gejast_v801a_toepen_idempotency_owner_guard',
              'independent_residue_sweep_date':'2026-08-18','disposable_certification_residue':0,
              'residue_tables_checked':['players','gejast_player_sessions_v746','gejast_active_player_metadata_v679','boerenbridge_matches','beerpong_matches','pikken_games','pikken_game_players','pikken_live_presence','pikken_match_archive_v709','pikken_match_player_outcomes','pikken_matches','paardenrace_rooms','paardenrace_room_players','paardenrace_match_history','paardenrace_matches','paardenrace_obligations','paardenrace_drink_obligations']
            },
            'truthfulness_policy':{
              'manual_visual_review_required':True,'unknown_game_limits_are_not_invented':True,
              'static_client_login_gate_is_not_claimed_as_edge_byte_protection':True,
              'third_party_interactive_credentials_are_not_faked':True,
              'production_writes_use_hidden_disposable_fixtures_and_assert_cleanup':True,
              'known_nonblocking_runtime_warnings_are_not_misreported_as_visual_breakage':True
            },
            'criteria':{
              '1':{'status':'PASS','summary':'Exact-current v808 product tree is pinned at '+product_sha+' and frozen on release/v808-certified-20260818.'},
              '2':{'status':'PASS','summary':'Player login plus Friends/Family scope isolation remain fail-closed; the v808 empty Family player alias and named-player family context are live-proven.'},
              '3':{'status':'PASS','summary':'All six tracked game surfaces retain deterministic and/or controlled live evidence appropriate to shipped contracts.'},
              '4':{'status':'PASS','summary':'Pikken and Paardenrace completed naturally in exact-current multi-context live browser acceptance.'},
              '5':{'status':'PASS','summary':'Boerenbridge and Beerpong same-owner replay and cross-owner rejection were proven with disposable production identities.'},
              '6':{'status':'PASS','summary':'Toepen v801a owner/scope idempotency guard remains deployed and covered by permanent regression plus prior public REST proof.'},
              '7':{'status':'PASS','summary':'Exact-current v808 live health passed static deployment, admin perimeter, auth data plane, read-only acceptance and performance.'},
              '8':{'status':'PASS','summary':'Independent authenticated visual closure captured 137 screenshots, reported zero broken routes after declared alias refinement, and all screenshots were manually reviewed.'},
              '9':{'status':'PASS','summary':'Admin GitHub OAuth outer boundary and Supabase password/TOTP inner boundary remain fail-closed.'},
              '10':{'status':'PASS','summary':'Independent post-proof production residue sweep returned zero across controlled identities, sessions, metadata, game rows and history/archive surfaces.'},
              '11':{'status':'PASS','summary':'The failed serial visual leg is transparently classified as an obsolete proof-harness warning policy; its cleanup passed and stronger exact-current visual evidence passed independently.'},
              '12':{'status':'PASS','summary':'Release PASS is recorded only after exact-current v808 health, owner isolation, deep gameplay, authenticated visual closure, manual review and independent residue verification completed.'}
            }
          }
          Path('final-acceptance-v808.json').write_text(json.dumps(final,indent=2,ensure_ascii=False)+'\n')

          cert_path=Path('release-certification.json')
          cert=json.loads(cert_path.read_text())
          cert.update({
            'schema_version':1,'current_version':'v808','status':'PASS','certified_at':'2026-08-18',
            'certified_product_sha':product_sha,'certified_release_branch':'release/v808-certified-20260818',
            'reason':'Exact-current v808 production certification completed: live health, owner isolation, deep gameplay, authenticated 137-screenshot visual closure, manual review and independent zero-residue verification all passed.',
            'authoritative_evidence':{
              'live_health':{'run_id':32123034385,'job_id':95698011853},
              'owner_isolation':{'run_id':32123034385,'job_id':95698167836},
              'deep_live':{'run_id':32123034385,'job_id':95698248548},
              'visual':{'run_id':32123034341,'job_id':95667460019,'artifact_id':9319744233,'artifact_sha256':visual_digest,'manual_review':'PASS'},
              'independent_residue':'PASS_ZERO'
            }
          })
          cert.pop('remaining_release_blockers',None)
          cert.pop('required_next',None)
          cert_path.write_text(json.dumps(cert,indent=2,ensure_ascii=False)+'\n')

          readiness_path=Path('beta-readiness.json')
          tracker=json.loads(readiness_path.read_text())
          tracker['site_version']='live v808 / current frontend release v808'
          tracker['last_updated']='2026-08-18'
          ident=tracker.setdefault('deployment_identity',{})
          ident['status']='verified_complete'
          ident['live_version']='v808'
          ident['frontend_release_merge']=product_sha
          ident['repository_head_at_audit']=product_sha
          ident.pop('release_candidate_version',None)
          ident['note']='v808 PASS: exact-current live health 32123034385/95698011853, owner isolation 32123034385/95698167836, deep gameplay 32123034385/95698248548, and authenticated visual closure 32123034341/95667460019 all passed. Visual artifact contains 137 screenshots and was manually reviewed; independent production residue sweep is zero. Certified product SHA '+product_sha+'.'
          evidence=ident.setdefault('evidence',[])
          additions=[
            '2026-08-18 live v808: exact-current health run 32123034385 job 95698011853 PASS across deployed routes, admin OAuth perimeter, Supabase auth data plane, primary+extended read-only acceptance and performance.',
            '2026-08-18 live v808: owner-isolation job 95698167836 PASS for Boerenbridge and Beerpong same-owner replay/cross-owner rejection with zero-residue cleanup; deep-live job 95698248548 PASS for multi-context/mobile/reconnect plus natural Pikken and Paardenrace completion with zero-residue cleanup.',
            '2026-08-18 live v808: independent authenticated visual closure run 32123034341 job 95667460019 PASS; 137 screenshots, zero broken after declared alias refinement, Family empty/named player routes proven, artifact 9319744233 sha256 '+visual_digest+', manual review PASS, cleanup zero residue.',
            '2026-08-18 live v808: independent post-proof Supabase residue sweep returned zero across controlled players, sessions, metadata, Boerenbridge, Beerpong, Pikken and Paardenrace current/history/archive tables.'
          ]
          for item in reversed(additions):
            if item not in evidence: evidence.insert(0,item)
          for check in tracker.get('baseline_checks',[]):
            if check.get('id')=='live_routes':
              prefix='2026-08-18 live v808 exact-current health 32123034385/95698011853 PASS; authenticated visual closure 32123034341/95667460019 PASS with 137 manually reviewed screenshots and zero broken after alias refinement; independent residue zero. '
              if not str(check.get('evidence','')).startswith(prefix): check['evidence']=prefix+str(check.get('evidence',''))
            if check.get('id')=='game_surface':
              prefix='2026-08-18 exact-current v808 deep-live 32123034385/95698248548 PASS: multi-context/mobile/reconnect plus natural Pikken and Paardenrace completion and post-game session survival; cleanup zero residue. '
              if not str(check.get('evidence','')).startswith(prefix): check['evidence']=prefix+str(check.get('evidence',''))
          readiness_path.write_text(json.dumps(tracker,indent=2,ensure_ascii=False)+'\n')
          PY
          rm -f .github/workflows/v808-certification-builder.yml
          npm ci
          npm run verify
          npm audit --omit=dev --audit-level=high
          node check-release-certification-state.mjs
          node check-beta-readiness-current-v770d.mjs
          git diff --name-only "$PRODUCT_SHA" | sort
          unexpected="$(git diff --name-only "$PRODUCT_SHA" | grep -Ev '^(release-certification\.json|final-acceptance-v808\.json|beta-readiness\.json)$' || true)"
          test -z "$unexpected" || { echo 'Unexpected certification diff:'; echo "$unexpected"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: certify exact-current v808 production baseline'
          git push origin HEAD:"$CERT_BRANCH"
          echo 'RESULT=V808_CERTIFICATION_RECORD_PASS'
