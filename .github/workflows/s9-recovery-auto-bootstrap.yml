name: S9 conditional independent recovery worker bootstrap
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-resumable-archive.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-recovery-auto-bootstrap.py'
      - '.github/workflows/s9-recovery-auto-bootstrap.yml'
  push:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-resumable-archive.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-recovery-auto-bootstrap.py'
      - '.github/workflows/s9-recovery-auto-bootstrap.yml'
permissions:
  contents: read
jobs:
  startup-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test conditional bounded restore and no-camera-change acceptance
        run: |
          set -euo pipefail
          p=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$p/run-s9-v3-resumable-archive.py"
          python3 "$p/test-s9-recovery-auto-bootstrap.py"
          python3 "$p/test-s9-v3-ledger-reconciliation.py"
          python3 "$p/test-s9-v3-resumable-archive.py"
