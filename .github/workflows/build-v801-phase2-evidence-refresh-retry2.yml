name: Build v801 Phase 2 evidence refresh retry 2

on:
  push:
    branches: [cert/v801-phase2-evidence-refresh]
    paths: ['.github/workflows/build-v801-phase2-evidence-refresh-retry2.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: cert/v801-phase2-evidence-refresh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Build and fully verify current evidence state
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/build-v801-phase2-evidence-refresh.py
          python3 scripts/patch-v801-finalized-readiness.py
          node check-release-certification-state.mjs
          node check-gameplay-acceptance-current.mjs
          node check-beta-readiness-current-v770d.mjs
          node check-live-write-safety-v770e.mjs
          node check-finalized-baseline-v786.mjs
          npm run verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-certification.json gameplay-acceptance.json beta-readiness.json check-beta-readiness-current-v770d.mjs check-live-write-safety-v770e.mjs check-finalized-baseline-v786.mjs
          git commit -m 'cert: refresh v801 Phase 2 evidence truth'
          git push origin HEAD:cert/v801-phase2-evidence-refresh
