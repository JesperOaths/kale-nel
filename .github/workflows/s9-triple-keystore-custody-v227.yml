name: S9 three independent existing Keystore HMAC custody V227
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedThreeKeyCustodyV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedManifestKeyCustodyV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedThreeKeyCustodyTestV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-three-key-custody-v227.py'
      - '.github/workflows/s9-triple-keystore-custody-v227.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedThreeKeyCustodyV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedManifestKeyCustodyV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedThreeKeyCustodyTestV227.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-three-key-custody-v227.py'
      - '.github/workflows/s9-triple-keystore-custody-v227.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Host-only HMAC key independence, no provisioning
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-three-key-custody-v227.py"
          python3 "$d/test-s9-sealed-manifest-source-v216.py"
          python3 "$d/test-s9-initial-sealed-manifest-enrollment-v220.py"
      - name: Android API 28 compile, without app installation
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$work/classes" \
            "$d/S9MigratedMetadataLedgerV193.java" \
            "$d/S9MigratedLedgerTrustedCheckpointV196.java" \
            "$d/S9MigratedDualStoreCommitV197.java" \
            "$d/S9MigratedVerifiedSourceV198.java" \
            "$d/S9MigratedSealedSourceManifestV216.java" \
            "$d/S9MigratedKeystoreKeyPairGuardV202.java" \
            "$d/S9MigratedAndroidKeystoreOwnerV202.java" \
            "$d/S9MigratedThreeKeyCustodyV227.java" \
            "$d/S9MigratedManifestKeyCustodyV227.java"
          "$d8" --min-api 28 --output "$work/dex" $(find "$work/classes" -name '*.class' -print)
          test -s "$work/dex/classes.dex"
          echo S9_THREE_KEY_CUSTODY_V227_API28_COMPILED_NO_DEVICE
