name: S9 disposable AndroidKeystore HMAC test V219 (host-only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/s9-keystore-probe-v219/**'
      - 'ops/c720p/s9-native-security/offline-worker/probe-s9-ephemeral-keystore-v219.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-ephemeral-keystore-v219.py'
      - '.github/workflows/s9-ephemeral-keystore-probe-v219.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/s9-keystore-probe-v219/**'
      - 'ops/c720p/s9-native-security/offline-worker/probe-s9-ephemeral-keystore-v219.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-ephemeral-keystore-v219.py'
      - '.github/workflows/s9-ephemeral-keystore-probe-v219.yml'
permissions:
  contents: read
jobs:
  host_only_unsigned_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Python source and temporary key safety contract
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/probe-s9-ephemeral-keystore-v219.py"
          python3 "$d/test-s9-ephemeral-keystore-v219.py"
      - name: Compile Android API28 disposable APK in GitHub runner only
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker/s9-keystore-probe-v219
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8" && test -x "$aapt"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/classes" "$stage/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$stage/classes" "$root/KeyProbe.java"
          "$d8" --min-api 28 --output "$stage/dex" $(find "$stage/classes" -name '*.class' -print)
          "$aapt" package -f -M "$root/AndroidManifest.xml" -I "$jar" -F "$stage/unsigned.apk"
          (cd "$stage/dex" && "$aapt" add "$stage/unsigned.apk" classes.dex)
          python3 - "$stage/dex/classes.dex" "$stage/unsigned.apk" <<'PY'
          from pathlib import Path
          import sys,zipfile
          dex=Path(sys.argv[1]).read_bytes()
          assert dex.startswith(b'dex\n') and 1000<len(dex)<250000
          with zipfile.ZipFile(sys.argv[2]) as z:
              assert 'classes.dex' in z.namelist()
          print('S9_TEST_ONLY_ANDROID_HMAC_V219_API28_COMPILED')
          PY
