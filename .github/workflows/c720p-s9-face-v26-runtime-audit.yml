name: S9 V26 runtime face backfill audit
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/audit-s9-face-v26-runtime.py'
      - '.github/workflows/c720p-s9-face-v26-runtime-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/audit-s9-face-v26-runtime.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/s9-native-security/audit-s9-face-v26-runtime.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/audit-s9-face-v26-runtime.py').read_text()
          for f in ('rmtree(','.unlink(','.delete(', 'subprocess.', 'face_candidates','unknown_','candidate_name','face_embedding'):
            assert f not in s,f
          print('FACE_RECALL_METADATA_ONLY_PASS')
          PY
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src='ops/c720p/s9-native-security/audit-s9-face-v26-runtime.py'
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          file="/tmp/s9-face-v26-health-${GITHUB_SHA:0:12}.py"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 30 '${url}' -o '${file}' && printf '%s  %s\\n' '${sha}' '${file}' | sha256sum -c - >/dev/null && python3 '${file}'"
          idem="s9-face-v26-runtime-audit-${GITHUB_SHA:0:23}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v26-runtime-audit','diagnostic',:'cmd',130,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "FACE_RECALL_JOB=$id"
          for i in $(seq 1 42); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 8000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q 'S9_FACE_V26_RUNTIME_AUDIT' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
