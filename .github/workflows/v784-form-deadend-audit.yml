name: v784 form and dead-end audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install temporary Chromium tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run v784 form/dead-end audit
        run: node scripts/audit-form-deadends-v784.mjs
