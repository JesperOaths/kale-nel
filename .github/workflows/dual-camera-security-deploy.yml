name: Kalenel security relay v769

on:
  push:
    branches:
      - agent/dual-camera-security-deploy
    paths:
      - '.github/workflows/dual-camera-security-deploy.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Worker to clock-skew-safe relay
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.before.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/workers/admin-gate/src/worker.js')
          s=p.read_text()
          old="const ADMIN_BUILD = 'v768-security-same-origin-media-proxy';"
          new="const ADMIN_BUILD = 'v769-security-clock-skew-safe-relay';"
          if old not in s: raise SystemExit('v768 build marker missing')
          s=s.replace(old,new,1)
          old="const SECURITY_MEDIA_PROXY_URL = `${SUPABASE_URL}/functions/v1/c720p-security-media?action=proxy`;"
          new="const SECURITY_MEDIA_PROXY_URL = `${SUPABASE_URL}/functions/v1/c720p-security-relay`;"
          if old not in s: raise SystemExit('v768 media proxy target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check cloudflare/workers/admin-gate/src/worker.js
          node scripts/build-admin-worker-assets.mjs
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js
          grep -q "ADMIN_BUILD = 'v769-security-clock-skew-safe-relay'" cloudflare/workers/admin-gate/src/worker.js
          grep -q 'functions/v1/c720p-security-relay' cloudflare/workers/admin-gate/src/worker.js
          echo V769_STATIC=PASS

      - name: Deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ rc=$?; if [ "$rc" -ne 0 ]; then echo V769_ROLLBACK=YES; cp /tmp/worker.before.js cloudflare/workers/admin-gate/src/worker.js; node scripts/build-admin-worker-assets.mjs; (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true; fi; exit "$rc"; }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 15); do
            root_code=$(curl -sS -o /dev/null -D /tmp/root.h -w '%{http_code}' https://kalenel.nl/security/ || true)
            root_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/root.h || true)
            media_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/new/api/status || true)
            public_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            echo TRY=$attempt ROOT=$root_code:$root_loc UNAUTH_MEDIA=$media_code PUBLIC=$public_code
            if [ "$root_code" = 302 ] && [ "$root_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2F' ] && [ "$media_code" = 302 ] && [ "$public_code" = 200 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          echo V769_EDGE=PASS

      - name: Push source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B agent/security-relay-v769
          git add -- cloudflare/workers/admin-gate/src/worker.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Use clock-skew-safe security relay'
          git push --force origin HEAD:agent/security-relay-v769
          echo V769_SOURCE_BRANCH=PASS
