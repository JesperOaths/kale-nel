name: Kalenel security controls v773

on:
  push:
    branches:
      - agent/dual-camera-security-deploy
    paths:
      - '.github/workflows/dual-camera-security-deploy.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/security-controls-v772
          fetch-depth: 0

      - name: Prepare v773
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.before.js
          cp security/index.html /tmp/security.before.html
          python3 - <<'PY'
          from pathlib import Path
          w=Path('cloudflare/workers/admin-gate/src/worker.js')
          s=w.read_text()
          old="const ADMIN_BUILD = 'v772-security-camera-controls';"
          if old not in s:
              raise SystemExit('v772 worker marker missing')
          s=s.replace(old,"const ADMIN_BUILD = 'v773-security-controls-60s';",1)
          w.write_text(s)

          p=Path('security/index.html')
          s=p.read_text()
          if '120000' not in s:
              raise SystemExit('two-minute timer marker missing')
          s=s.replace('120000','60000',1)
          s=s.replace('automatically stops after 2 minutes','automatically stops after 1 minute',1)
          s=s.replace('Kalenel · security-5 · source-aware dual camera','Kalenel · security-6 · v773 · protected camera controls',1)
          p.write_text(s)
          PY
          node --check cloudflare/workers/admin-gate/src/worker.js
          node scripts/build-admin-worker-assets.mjs
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          grep -q "ADMIN_BUILD = 'v773-security-controls-60s'" cloudflare/workers/admin-gate/src/worker.js
          grep -q 'automatically stops after 1 minute' security/index.html
          grep -q '60000' security/index.html
          ! grep -q '120000' security/index.html

      - name: Deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              cp /tmp/worker.before.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/security.before.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 15); do
            build=$(curl -sS -o /dev/null -D - https://admin.kalenel.nl/admin.html | awk 'BEGIN{IGNORECASE=1}/^x-kalenel-admin-build:/{sub(/\r$/,"");print $2;exit}')
            root=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/ || true)
            controls=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/new/api/controls || true)
            post=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"key":"torch","value":"off"}' https://kalenel.nl/security/new/api/control || true)
            public=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            echo "TRY=$attempt BUILD=$build ROOT=$root CONTROLS=$controls POST=$post PUBLIC=$public"
            if [ "$build" = 'v773-security-controls-60s' ] && [ "$root" = 302 ] && [ "$controls" = 302 ] && [ "$post" = 401 ] && [ "$public" = 200 ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT

      - name: Push source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B agent/security-controls-v773
          git add -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          git diff --cached --check
          git commit -m 'Use one-minute guarded live camera controls'
          git push --force origin HEAD:agent/security-controls-v773
