name: Kalenel security storage and presets v774

on:
  push:
    branches:
      - agent/dual-camera-security-deploy
    paths:
      - '.github/workflows/dual-camera-security-deploy.yml'
      - 'scripts/deploy-security-v774.py'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/dual-camera-security-deploy
          fetch-depth: 0

      - name: Mark deployment started
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:agent/v774-stage-started

      - name: Prepare v774 from certified v772 components
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/security-direct-v772 agent/security-controls-v772
          git checkout origin/agent/security-direct-v772 -- cloudflare/workers/admin-gate/src/worker.js
          git checkout origin/agent/security-controls-v772 -- security/index.html
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.before.js
          cp security/index.html /tmp/security.before.html
          set +e
          python3 scripts/deploy-security-v774.py >/tmp/v774-patch.log 2>&1
          rc=$?
          {
            echo PATCH_RC=$rc
            cat /tmp/v774-patch.log
            echo WORKER_BUILD_LINES
            grep -n "ADMIN_BUILD" cloudflare/workers/admin-gate/src/worker.js || true
            echo UI_MARKERS
            grep -nE 'newStorage|data-preset|loadControls|newControls' security/index.html | head -40 || true
          } > v774-prepare-diagnostic.txt
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- cloudflare/workers/admin-gate/src/worker.js security/index.html v774-prepare-diagnostic.txt
          git commit -m 'Capture v774 prepare output' || true
          git push --force origin HEAD:agent/v774-prepare-output
          test "$rc" = 0
          set -e
          node --check cloudflare/workers/admin-gate/src/worker.js
          node scripts/build-admin-worker-assets.mjs
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          grep -q "ADMIN_BUILD = 'v774-security-storage-presets'" cloudflare/workers/admin-gate/src/worker.js
          grep -q 'newStorage' security/index.html
          grep -q 'data-preset="maxnight"' security/index.html
          grep -q "SECURITY_MEDIA_SESSION_URL" cloudflare/workers/admin-gate/src/worker.js
          grep -q "cameraOrigin" cloudflare/workers/admin-gate/src/worker.js
          grep -q "securityProxyTarget(media" cloudflare/workers/admin-gate/src/worker.js
          grep -q "trycloudflare\\.com" cloudflare/workers/admin-gate/src/worker.js
          git push --force origin HEAD:agent/v774-stage-prepared
          echo V774_STATIC=PASS

      - name: Deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo V774_ROLLBACK=YES
              cp /tmp/worker.before.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/security.before.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          git push --force origin HEAD:agent/v774-stage-deployed
          ok=0
          for attempt in $(seq 1 15); do
            build=$(curl -sS -o /dev/null -D - https://admin.kalenel.nl/admin.html | awk 'BEGIN{IGNORECASE=1}/^x-kalenel-admin-build:/{sub(/\r$/,"");print $2;exit}')
            root=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/ || true)
            controls=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/new/api/controls || true)
            post=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"key":"torch","value":"off"}' https://kalenel.nl/security/new/api/control || true)
            public=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            echo "TRY=$attempt BUILD=$build ROOT=$root CONTROLS=$controls POST=$post PUBLIC=$public"
            if [ "$build" = 'v774-security-storage-presets' ] && [ "$root" = 302 ] && [ "$controls" = 302 ] && [ "$post" = 401 ] && [ "$public" = 200 ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          git push --force origin HEAD:agent/v774-stage-edge-pass
          echo V774_EDGE=PASS

      - name: Push reconciled source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B agent/security-v774
          git add -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          git diff --cached --check
          git commit -m 'Add Security storage metrics and safe camera presets' || true
          git push --force origin HEAD:agent/security-v774
          echo V774_SOURCE_BRANCH=PASS
