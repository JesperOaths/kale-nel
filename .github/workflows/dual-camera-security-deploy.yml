name: Dual camera security deploy

on:
  push:
    branches:
      - agent/dual-camera-security-deploy
    paths:
      - '.github/workflows/dual-camera-security-deploy.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TARGET_BRANCH: feature/dual-camera-security

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Preserve patcher and production rollback source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/patch-dual-camera-worker.py /tmp/patch-dual-camera-worker.py
          python3 -m py_compile /tmp/patch-dual-camera-worker.py
          git fetch origin main "$TARGET_BRANCH"
          git show origin/main:cloudflare/workers/admin-gate/src/worker.js > /tmp/production-worker.js
          git show origin/main:security/index.html > /tmp/production-security.html
          test -s /tmp/production-worker.js
          test -s /tmp/production-security.html

      - name: Check out scoped target branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          unexpected=$(git diff --name-only origin/main...HEAD | grep -Ev '^security/index\.html$' || true)
          test -z "$unexpected"

      - name: Patch and validate dual-camera candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch-dual-camera-worker.py
          node --check cloudflare/workers/admin-gate/src/worker.js
          node --check /tmp/security-inline.js
          node scripts/build-admin-worker-assets.mjs
          test -s cloudflare/workers/admin-gate/static/security/index.html
          grep -q "ADMIN_BUILD = 'v766-dual-camera-security'" cloudflare/workers/admin-gate/src/worker.js
          grep -q "for (const camera of \['s3', 'new'\])" cloudflare/workers/admin-gate/src/worker.js
          grep -q '/security/new-clips/' security/index.html
          grep -q '/security/s3-clips/' security/index.html
          grep -q 'security-4 · dual camera' security/index.html
          ! grep -Eqi 'trycloudflare\.com|192\.168\.|media_token|hmac_secret|service_role' security/index.html
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          echo DUAL_CAMERA_STATIC_VALIDATION=PASS

      - name: Deploy with automatic production rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo DUAL_CAMERA_DEPLOY_VERIFY_FAILED_ROLLING_BACK=YES
              cp /tmp/production-worker.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/production-security.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
              echo DUAL_CAMERA_WORKER_ROLLBACK_ATTEMPTED=YES
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 12); do
            echo EDGE_VERIFY_ATTEMPT=$attempt
            root_code=$(curl -sS -o /dev/null -D /tmp/root.h -w '%{http_code}' https://kalenel.nl/security/ || true)
            new_code=$(curl -sS -o /dev/null -D /tmp/new.h -w '%{http_code}' https://kalenel.nl/security/new-clips/ || true)
            s3_code=$(curl -sS -o /dev/null -D /tmp/s3.h -w '%{http_code}' https://kalenel.nl/security/s3-clips/ || true)
            new_api_code=$(curl -sS -o /dev/null -D /tmp/newapi.h -w '%{http_code}' https://kalenel.nl/security/new/api/status || true)
            s3_api_code=$(curl -sS -o /dev/null -D /tmp/s3api.h -w '%{http_code}' https://kalenel.nl/security/s3/api/status || true)
            root_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/root.h || true)
            new_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/new.h || true)
            s3_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/s3.h || true)
            new_api_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/newapi.h || true)
            s3_api_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/s3api.h || true)
            login_code=$(curl -sS -o /tmp/login.body -H 'content-type: application/json' --data '{"username":"x","password":"x","totp":"000000"}' -w '%{http_code}' https://kalenel.nl/security/auth/login || true)
            public_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            admin_code=$(curl -sS -o /dev/null -D /tmp/admin.h -w '%{http_code}' https://kalenel.nl/admin.html || true)
            admin_loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");print substr($0,index($0,":")+2);exit}' /tmp/admin.h || true)
            echo ROOT=$root_code:$root_loc NEW=$new_code:$new_loc S3=$s3_code:$s3_loc NEW_API=$new_api_code:$new_api_loc S3_API=$s3_api_code:$s3_api_loc LOGIN=$login_code PUBLIC=$public_code ADMIN=$admin_code:$admin_loc
            if [ "$root_code" = 302 ] && [ "$root_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2F' ] && [ "$new_code" = 302 ] && [ "$new_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2Fnew-clips%2F' ] && [ "$s3_code" = 302 ] && [ "$s3_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2Fs3-clips%2F' ] && [ "$new_api_code" = 302 ] && [ "$new_api_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2F' ] && [ "$s3_api_code" = 302 ] && [ "$s3_api_loc" = 'https://admin.kalenel.nl/login?return_to=%2Fsecurity%2F' ] && [ "$login_code" = 401 ] && grep -q 'github_session_required' /tmp/login.body && [ "$public_code" = 200 ] && [ "$admin_code" = 302 ] && [ "$admin_loc" = 'https://admin.kalenel.nl/admin.html' ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          echo DUAL_CAMERA_OUTER_GATE=PASS
          echo DUAL_CAMERA_UNAUTH_MEDIA_GATE=PASS
          echo PUBLIC_SITE_REGRESSION=PASS
          echo DUAL_CAMERA_WORKER_DEPLOY=PASS

      - name: Persist scoped Worker source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- cloudflare/workers/admin-gate/src/worker.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'cloudflare/workers/admin-gate/src/worker.js'
          git commit -m 'Route protected dual-camera security pages'
          git push origin HEAD:"$TARGET_BRANCH"
          echo DUAL_CAMERA_SOURCE_PERSISTED=PASS
