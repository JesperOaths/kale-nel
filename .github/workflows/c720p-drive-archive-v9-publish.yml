name: Publish C720P Drive Archive V9
on:
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-drive-archive-v9.py'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_DRIVE_ARCHIVE_V9'
        required: true
        type: string
permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'JesperOaths/kale-nel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIRMATION_INPUT: ${{ inputs.confirmation }}
      PGCONNECT_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate deployment entrypoint and authentication
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$CONFIRMATION_INPUT" != "DEPLOY_DRIVE_ARCHIVE_V9" ]]; then
            echo "Refusing unconfirmed manual deployment"; exit 1
          fi
          test -n "${SUPABASE_DB_URL:-}" || { echo "Private management connection unavailable"; exit 1; }
          python3 -m py_compile ops/c720p/s9-native-security/deploy-drive-archive-v9.py
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
      - name: Deploy and wait for on-hub playback verification
        shell: bash
        run: |
          set -euo pipefail
          relative="ops/c720p/s9-native-security/deploy-drive-archive-v9.py"
          checksum="$(sha256sum "$relative" | cut -d' ' -f1)"
          [[ "$checksum" =~ ^[a-f0-9]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          raw="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${relative}"
          temp="/tmp/c720p-drive-archive-v9-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${raw}' -o '${temp}' && printf '%s  %s\\n' '${checksum}' '${temp}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${temp}'"
          idem="drive-archive-v9-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-drive-archive-v9','deployment',:'cmd',650,:'idem'
          );
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]] || { echo "Invalid device job ID"; exit 1; }
          echo "C720P_ARCHIVE_JOB_ID=$job"
          for tick in $(seq 1 70); do
            record="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${job}" | head -n 1)"
            if [[ "$record" == done\|* || "$record" == failed\|* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${job}" | head -c 4000)"
              echo "$out"
              [[ "$record" == 'done|0' ]] || { echo "Hub job failed; deployment rollback is automatic"; exit 1; }
              grep -q 'ARCHIVE_DRIVE_V9_VERIFIED' <<< "$out" || { echo "Missing Drive list/video proof"; exit 1; }
              echo "C720P_DRIVE_ARCHIVE_V9_LIVE_PASS"
              exit 0
            fi
            sleep 9
          done
          echo "Device job has not finished yet"
          exit 1
