name: v770f reversible profile harness proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/v770f-reversible-profile-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Prove profile harness defaults to no-write
        shell: bash
        run: |
          set -euo pipefail
          output="$(node check-beta-live-write-profile.mjs)"
          printf '%s\n' "$output"
          grep -Fq 'State: blocked. No data was changed.' <<<"$output"
          grep -Fq 'live_write' <<<"$(node check-beta-live-write-readiness.mjs)" || true
      - name: Full repository verification
        run: npm run verify
      - name: Live v770 read-only deployment health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
