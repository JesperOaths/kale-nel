name: Legacy C720P index regenerated bridge preservation
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/c720p_legacy_s9_index_bridge_guard_v1.py'
      - 'ops/c720p/security-runtime/test-c720p-legacy-s9-index-bridge-guard-v1.py'
      - 'ops/c720p/security-runtime/c720p-legacy-s9-index-bridge-guard-v1.*'
      - '.github/workflows/c720p-legacy-index-regeneration-guard.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/c720p_legacy_s9_index_bridge_guard_v1.py'
permissions:
  contents: read
jobs:
  no-recording-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/c720p_legacy_s9_index_bridge_guard_v1.py
          python3 ops/c720p/security-runtime/test-c720p-legacy-s9-index-bridge-guard-v1.py
          echo C720P_LEGACY_S9_INDEX_NO_MEDIA_MUTATIONS
