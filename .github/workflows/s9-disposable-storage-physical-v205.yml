name: S9 disposable read-only cross-app storage ownership V205
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-disposable-storage-lifecycle-v205.py'
      - '.github/workflows/s9-disposable-storage-physical-v205.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-disposable-storage-lifecycle-v205.py'
      - '.github/workflows/s9-disposable-storage-physical-v205.yml'
permissions:
  contents: read
concurrency:
  group: s9-disposable-storage-physical-v205
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run strict one-shot cleanup and offline physical-probe contract regression
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-disposable-storage-access-v204.py"
          python3 "$d/test-s9-disposable-storage-lifecycle-v205.py"
          python3 -m py_compile "$d/probe-s9-disposable-storage-access-v204.py"
      - name: Compile signed-test-only Java receiver package on isolated runner
        run: |
          set -euo pipefail
          root=ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204
          jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          test -s "$jar" && test -x "$d8" && test -x "$aapt"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/classes" "$stage/dex"
          javac -source 8 -target 8 -cp "$jar" -d "$stage/classes" "$root/StorageProbe.java"
          "$d8" --min-api 28 --output "$stage/dex" $(find "$stage/classes" -name '*.class' -print)
          "$aapt" package -f -M "$root/AndroidManifest.xml" -I "$jar" -F "$stage/disposable-unsigned.apk"
          (cd "$stage/dex" && "$aapt" add "$stage/disposable-unsigned.apk" classes.dex)
          python3 - "$stage/disposable-unsigned.apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a:
              assert "classes.dex" in a.namelist()
          print("S9_DISPOSABLE_V205_HOST_BUILD_VERIFIED")
          PY
  physical:
    needs: synthetic
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: One guarded Android 10 disposable read-only permission probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/s9-disposable-uid-v205-${GITHUB_SHA:0:12}"
          cmd="umask 077 && install -d -m 700 '$stage' '$stage/s9-storage-probe-v204'"
          for file in \
            "ops/c720p/s9-native-security/offline-worker/probe-s9-disposable-storage-access-v204.py" \
            "ops/c720p/s9-native-security/offline-worker/probe-s9-app-process-noimage-v166.py" \
            "ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204/AndroidManifest.xml" \
            "ops/c720p/s9-native-security/offline-worker/s9-storage-probe-v204/StorageProbe.java"; do
            hash="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            case "$name" in AndroidManifest.xml|StorageProbe.java) dest="$stage/s9-storage-probe-v204/$name";; *) dest="$stage/$name";; esac
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 35 '$url' -o '$dest' && printf '%s  %s\\n' '$hash' '$dest' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/probe-s9-disposable-storage-access-v204.py'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="s9-disposable-uid-v205-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-disposable-readonly-v205','deployment',:'cmd',320,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "S9_DISPOSABLE_UID_V205_JOB=$job"
          for attempt in $(seq 1 110); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3200)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'S9_STORAGE_PROBE_PHYSICAL_V204' <<< "$output"
              grep -q '"status":"isolated_readonly_storage_probe_verified"' <<< "$output"
              grep -q '"disposable_app_uninstalled":true' <<< "$output"
              grep -q '"native_camera_pid_unchanged":true' <<< "$output"
              grep -q '"camera_apk_modified":false' <<< "$output"
              grep -q '"media_bytes_read":0' <<< "$output"
              grep -q '"originals_modified":false' <<< "$output"
              grep -q '"person_reviews_modified":false' <<< "$output"
              grep -q '"write_permission_granted":false' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Disposable S9 UID access probe not complete";exit 1
