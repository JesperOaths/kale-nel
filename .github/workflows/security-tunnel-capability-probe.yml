name: Security tunnel capability probe

on:
  push:
    branches:
      - agent/security-v775-work
    paths:
      - '.github/workflows/security-tunnel-capability-probe.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/security-v775-work
          fetch-depth: 0
      - name: Probe Tunnel API permission without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&per_page=1" || true)
          success=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/cf.json')); print(str(bool(d.get('success'))).lower())
except Exception: print('false')
PY
          )
          if [ "$code" = 200 ] && [ "$success" = true ]; then result='TUNNEL_API=PASS'; else result="TUNNEL_API=FAIL HTTP=$code"; fi
          echo "$result" > /tmp/security-tunnel-capability.txt
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B agent/security-tunnel-capability-result origin/main
          mkdir -p proof
          cp /tmp/security-tunnel-capability.txt proof/security-tunnel-capability.txt
          git add proof/security-tunnel-capability.txt
          git commit -m 'Record Cloudflare tunnel capability probe'
          git push --force origin HEAD:agent/security-tunnel-capability-result
