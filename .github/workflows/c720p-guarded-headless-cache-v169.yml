name: Guarded C720P regenerable headless cache reclaim V169
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/c720p-guarded-headless-cache-v169.py'
      - 'ops/c720p/security-runtime/test-c720p-guarded-headless-cache-v169.py'
      - '.github/workflows/c720p-guarded-headless-cache-v169.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/c720p-guarded-headless-cache-v169.py'
      - 'ops/c720p/security-runtime/test-c720p-guarded-headless-cache-v169.py'
      - '.github/workflows/c720p-guarded-headless-cache-v169.yml'
permissions:
  contents: read
concurrency:
  group: c720p-headless-safe-cache-v169
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Enforce camera, profile, path, and media exclusion safeguards
        run: |
          set -euo pipefail
          d=ops/c720p/security-runtime
          python3 -m py_compile "$d/c720p-guarded-headless-cache-v169.py"
          python3 "$d/test-c720p-guarded-headless-cache-v169.py"
          python3 ops/c720p/s9-native-security/test-regenerable-cache-reclaim-v1.py
  physical:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: SHA-pinned bounded cache-only cleanup on an idle healthy hub
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          stage="/tmp/c720p-headless-cache-v169-${GITHUB_SHA:0:13}"
          cmd="umask 077 && install -d -m 700 '$stage'"
          for file in "ops/c720p/security-runtime/c720p-guarded-headless-cache-v169.py" "ops/c720p/s9-native-security/reclaim-regenerable-chromium-cache.py"; do
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            name="$(basename "$file")"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$file"
            cmd="$cmd && curl -fsSL --max-time 40 '$url' -o '$stage/$name' && printf '%s  %s\\n' '$digest' '$stage/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/c720p-guarded-headless-cache-v169.py'"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="c720p-cache-v169-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-c720p-guarded-cache-v169','deployment',:'cmd',200,:'idem');
          SQL
          )"
          [[ "$job" =~ ^[0-9]+$ ]]
          echo "C720P_HEADLESS_CACHE_V169_JOB=$job"
          for attempt in $(seq 1 80); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$job" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$job" | head -c 3500)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              grep -q 'C720P_HEADLESS_CACHE_V169_VERIFIED' <<< "$output"
              grep -q '"originals_retained": true' <<< "$output"
              grep -q '"media_deleted": false' <<< "$output"
              grep -q '"review_changes": false' <<< "$output"
              grep -q '"camera_ready_after": true' <<< "$output"
              grep -q '"camera_dropped_output_frames_after": 0' <<< "$output"
              exit 0
            fi
            sleep 3
          done
          echo "Headless cache safety proof unavailable";exit 1
