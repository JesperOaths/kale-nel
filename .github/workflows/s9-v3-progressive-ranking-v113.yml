name: S9 V3 progressive appearance rankings cool-window publisher V113
on:
  schedule:
    # Follows OSNet :05 and HSV32 :20; publish only in a fresh safe 4K window.
    - cron: '40 1,5,9,13,17,21 * * *'
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-progressive-ranking-v113.py'
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-uniform-appearance-rankings-v3.py'
      - 'ops/c720p/s9-native-security/offline-worker/backfill-s9-hsv32-uniform-v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9AppearanceRankingWorkerV3.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-partial-inventory.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-batched-pair-presence-v192.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-progressive-ranking-v113.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-phone-json-integrity-v114.py'
      - '.github/workflows/s9-v3-progressive-ranking-v113.yml'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-cool-window-stage-order-v118.py'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-progressive-ranking-v113.py'
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-uniform-appearance-rankings-v3.py'
      - 'ops/c720p/s9-native-security/offline-worker/backfill-s9-hsv32-uniform-v2.py'
      - 'ops/c720p/s9-native-security/offline-worker/S9AppearanceRankingWorkerV3.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-partial-inventory.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-batched-pair-presence-v192.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-progressive-ranking-v113.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-phone-json-integrity-v114.py'
      - '.github/workflows/s9-v3-progressive-ranking-v113.yml'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-cool-window-stage-order-v118.py'
permissions:
  contents: read
concurrency:
  group: s9-v3-progressive-ranking-one-at-a-time
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify phone-free, safe publication behavior
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/run-s9-v3-progressive-ranking-v113.py"
          python3 "$d/test-s9-v3-progressive-ranking-v113.py"
          python3 ops/c720p/s9-native-security/offline-worker/test-s9-v3-cool-window-stage-order-v118.py
          python3 "$d/test-s9-phone-json-integrity-v114.py"
          python3 "$d/test-s9-v3-ranker-capture-isolation-v106.py"
          python3 "$d/test-s9-v3-partial-inventory.py"
          python3 "$d/test-s9-v3-batched-pair-presence-v192.py"
  guarded-publisher:
    needs: verify
    if: (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: SHA-stage and run safe, non-regressive V3 ranking only when camera healthy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          d='ops/c720p/s9-native-security/offline-worker'
          stage="/tmp/s9-v3-progressive-${GITHUB_SHA:0:14}"
          cmd="mkdir -p '$stage'"
          for script in run-s9-v3-progressive-ranking-v113.py run-s9-uniform-appearance-rankings-v3.py backfill-s9-hsv32-uniform-v2.py backfill-v40-person-rois-on-s9.py backfill-s9-original-roi-osnet-temporal-v2.py S9AppearanceRankingWorkerV3.java PhoneOfflineSimilarity.java; do
            source="$d/$script"
            sum="$(sha256sum "$source" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
            cmd="$cmd && curl -fsSL --retry 2 --max-time 40 '$url' -o '$stage/$script' && printf '%s  %s\\n' '$sum' '$stage/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/run-s9-v3-progressive-ranking-v113.py' --apply"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          idem="s9-v3-progressive-${GITHUB_SHA:0:17}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v3-progressive','deployment',:'cmd',860,:'idem'
          );
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_V3_PROGRESSIVE_JOB=$id"
          for attempt in $(seq 1 190); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3500)"
              echo "$output"
              [[ "$status" == 'done|0' ]] || exit 1
              if grep -q 'S9_V3_PROGRESSIVE_RANKING_VERIFIED' <<< "$output"; then
                grep -q '"camera_apk_unchanged": true' <<< "$output"
                grep -q '"manual_decisions_unchanged": true' <<< "$output"
                grep -q '"automatic_assignments": 0' <<< "$output"
                echo "S9 V3 active appearance ranking index independently verified"
              elif grep -q 'S9_V3_PROGRESSIVE_RANKING_DEFERRED' <<< "$output"; then
                grep -q '"rankings_published": false' <<< "$output"
                echo "S9 V3 ranking safely deferred; no false completion claim"
              elif grep -q 'S9_V3_PROGRESSIVE_RANKING_CURRENT' <<< "$output"; then
                grep -q '"rankings_published": false' <<< "$output"
                echo "S9 V3 active index already current"
              else
                echo "S9 V3 unknown result"; exit 1
              fi
              exit 0
            fi
            sleep 4
          done
          echo "S9 V3 progressive safe-publisher management job timed out"; exit 1
