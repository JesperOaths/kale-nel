name: Harden S3 bedroom camera against Wi-Fi ADB access
on:
  pull_request:
    paths:
      - 'ops/c720p/harden-s3-bedroom-privacy-20261016.py'
      - '.github/workflows/c720p-s3-privacy-lock-20261016.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/harden-s3-bedroom-privacy-20261016.py'
      - '.github/workflows/c720p-s3-privacy-lock-20261016.yml'
permissions:
  contents: read
concurrency:
  group: c720p-s3-privacy-guard
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          python3 -m py_compile ops/c720p/harden-s3-bedroom-privacy-20261016.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/harden-s3-bedroom-privacy-20261016.py').read_text()
          assert s.index('if not camera():raise RuntimeError("motion_camera_lost_after_disabling_old_apps")') < s.index('command=run(["adb","-s",ADB,"usb"]')
          assert s.index('report["adb_port_closed_verified"]=closed') < s.index('state_write(True,')
          assert s.index('if not closed or not report["S3_wifi_reachable_after"]:') < s.index('state_write(True,')
          assert 'pm","disable-user"' in s and 'com.pas.webcam.pro' in s
          assert 'nl.kalenel.s3motion' in s
          assert 'adb shell getprop' not in s
          assert 'S3_PRIVACY_PORT_LOCK' in s
          print('S3_PRIVACY_SCOPE_PASS')
          PY
  apply:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          src='ops/c720p/harden-s3-bedroom-privacy-20261016.py'
          sha="$(sha256sum "$src" | cut -d' ' -f1)"
          dest="/tmp/s3-bed-privacy-${GITHUB_SHA:0:12}.py"
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${src}"
          cmd="curl -fSsL --max-time 30 '${origin}' -o '${dest}' && printf '%s  %s\\n' '${sha}' '${dest}' | sha256sum -c - >/dev/null && python3 '${dest}' --apply"
          idem="s3-privacy-lock-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v command="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s3-privacy-lock','maintenance',:'command',500,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S3_PRIVACY_JOB=$id"
          for i in $(seq 1 68); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 13000)"
              echo "$output"
              [[ "$state" == 'done|0' ]]
              grep -q 'S3_PRIVACY_PORT_LOCK' <<< "$output"
              exit 0
            fi
            sleep 7
          done
          exit 1
