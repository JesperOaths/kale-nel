name: S9 migrated Save Delete metadata ledger V193 (host only)
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerTestV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-ledger-v193.py'
      - 'ops/c720p/security-runtime/s9_migrated_save_delete_contract_v181.py'
      - '.github/workflows/s9-migrated-durable-metadata-ledger-v193.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/S9MigratedMetadataLedgerTestV193.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-migrated-ledger-v193.py'
      - 'ops/c720p/security-runtime/s9_migrated_save_delete_contract_v181.py'
      - '.github/workflows/s9-migrated-durable-metadata-ledger-v193.yml'
permissions:
  contents: read
jobs:
  java-ledger-and-python-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: S9 durable metadata journal crash/replay test and Python receipt parity
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 "$d/test-s9-migrated-ledger-v193.py"
          python3 ops/c720p/security-runtime/test_s9_migrated_save_delete_contract_v181.py
