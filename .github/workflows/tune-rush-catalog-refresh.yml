name: Tune Rush official YouTube catalog refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'music/catalog-candidates.json'
      - 'scripts/tune-rush-official-catalog-import.mjs'
      - '.github/workflows/tune-rush-catalog-refresh.yml'
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate editorial genres, years and search candidates
        run: |
          node --check scripts/tune-rush-official-catalog-import.mjs
          node scripts/tune-rush-official-catalog-import.mjs --dry-run
      - name: Discover embeddable music videos through official YouTube Data API
        if: github.event_name != 'pull_request'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/tune-rush-official-catalog-import.mjs
