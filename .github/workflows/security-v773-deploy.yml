name: Kalenel Security v773

on:
  push:
    branches:
      - agent/security-v773-storage-presets
    paths:
      - '.github/workflows/security-v773-deploy.yml'
      - 'scripts/deploy-security-v773-storage-presets.py'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/security-v773-storage-presets
          fetch-depth: 0

      - name: Prepare v773
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.before.js
          cp security/index.html /tmp/security.before.html
          python3 scripts/deploy-security-v773-storage-presets.py
          node --check cloudflare/workers/admin-gate/src/worker.js
          node scripts/build-admin-worker-assets.mjs
          git diff --check -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          grep -q "ADMIN_BUILD = 'v773-security-storage-presets'" cloudflare/workers/admin-gate/src/worker.js
          grep -q 'id="newStorage"' security/index.html
          grep -q "preset:'Preset'" security/index.html
          echo V773_STATIC=PASS

      - name: Deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo V773_ROLLBACK=YES
              cp /tmp/worker.before.js cloudflare/workers/admin-gate/src/worker.js
              cp /tmp/security.before.html security/index.html
              node scripts/build-admin-worker-assets.mjs
              (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy) || true
            fi
            exit "$rc"
          }
          trap rollback EXIT
          (cd cloudflare/workers/admin-gate && npx --yes wrangler@4.33.1 deploy)
          ok=0
          for attempt in $(seq 1 15); do
            root_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/ || true)
            status_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/security/new/api/status || true)
            control_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"key":"preset","value":"auto"}' https://kalenel.nl/security/new/api/control || true)
            public_code=$(curl -sS -o /dev/null -w '%{http_code}' https://kalenel.nl/ || true)
            build=$(curl -sS -o /dev/null -D - https://admin.kalenel.nl/admin.html | awk 'BEGIN{IGNORECASE=1}/^x-kalenel-admin-build:/{sub(/\r$/,"");print $2;exit}')
            echo TRY=$attempt BUILD=$build ROOT=$root_code UNAUTH_STATUS=$status_code UNAUTH_CONTROL=$control_code PUBLIC=$public_code
            if [ "$build" = 'v773-security-storage-presets' ] && [ "$root_code" = 302 ] && [ "$status_code" = 302 ] && [ "$control_code" = 401 ] && [ "$public_code" = 200 ]; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1
          trap - EXIT
          echo V773_EDGE=PASS

      - name: Push reconciled source branch
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/workers/admin-gate/src/worker.js /tmp/worker.v773.js
          cp security/index.html /tmp/security.v773.html
          git checkout -B agent/security-v773-deployed origin/main
          cp /tmp/worker.v773.js cloudflare/workers/admin-gate/src/worker.js
          cp /tmp/security.v773.html security/index.html
          git config user.name 'Kalenel Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- cloudflare/workers/admin-gate/src/worker.js security/index.html
          git diff --cached --check
          git commit -m 'v773 add Security storage telemetry and presets'
          git push --force origin HEAD:agent/security-v773-deployed
          echo V773_SOURCE_BRANCH=PASS
