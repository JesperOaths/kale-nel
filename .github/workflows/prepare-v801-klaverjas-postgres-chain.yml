name: Prepare v801 Klaverjas PostgreSQL proof triggers

on:
  push:
    branches: [proof/v801-klaverjas-postgres-chain]
    paths: ['.github/workflows/prepare-v801-klaverjas-postgres-chain.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v801-klaverjas-postgres-chain
      - name: Add proof-trigger-only comments
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          files = [
              Path('.github/workflows/v792f-klaverjas-postgres-proof.yml'),
              Path('.github/workflows/v792g-klaverjas-roem-proof.yml'),
              Path('.github/workflows/v792h-klaverjas-recovery-proof.yml'),
          ]
          marker = '# v801 Phase-2 isolated proof trigger only; no product or SQL change.\n'
          for p in files:
              text = p.read_text()
              if marker in text:
                  continue
              first, rest = text.split('\n', 1)
              p.write_text(first + '\n' + marker + rest)
          PY
          git diff --check
          git diff --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v792f-klaverjas-postgres-proof.yml .github/workflows/v792g-klaverjas-roem-proof.yml .github/workflows/v792h-klaverjas-recovery-proof.yml
          git commit -m 'test: retrigger isolated Klaverjas PostgreSQL proofs on v801'
          git push origin HEAD:proof/v801-klaverjas-postgres-chain
