name: TEMP v802 version sync

on:
  push:
    branches:
      - agent/v802-family-player-alias
    paths:
      - '.github/workflows/v802-version-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/v802-family-player-alias
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Run canonical version drift fixer
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 'v802'
          node fix-version-drift.mjs
          node check-version-drift.mjs
      - name: Commit deterministic sync
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/v802-version-sync-temp.yml'
          if git diff --cached --quiet; then
            echo 'No version sync changes.'
          else
            git commit -m 'release: synchronize v802 frontend owners'
            git push origin HEAD:agent/v802-family-player-alias
          fi
