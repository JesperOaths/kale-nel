name: Final rebuild Cloudflare HTTPS patch

on:
  push:
    branches:
      - agent/cloudflare-https-final-rebase-v792
    paths:
      - '.github/workflows/final-rebase-cloudflare-https-v792.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/cloudflare-https-final-rebase-v792
      - name: Apply HTTPS edge patch onto latest main
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('cloudflare/workers/admin-gate/src/worker.js', "const ADMIN_BUILD = 'v762';", "const ADMIN_BUILD = 'v763';")
          replace_once(
              'cloudflare/workers/admin-gate/src/worker.js',
              "      const url = new URL(request.url);\n      if (url.hostname === PUBLIC_HOST || url.hostname === `www.${PUBLIC_HOST}`) {",
              "      const url = new URL(request.url);\n      if (url.protocol === 'http:') {\n        const target = new URL(url.toString());\n        target.protocol = 'https:';\n        return new Response(null, {\n          status: 308,\n          headers: secureHeaders({\n            Location: target.toString(),\n            'Cache-Control': 'no-store'\n          })\n        });\n      }\n      if (url.hostname === PUBLIC_HOST || url.hostname === `www.${PUBLIC_HOST}`) {"
          )

          test_path = Path('scripts/test-admin-worker-gate.mjs')
          test = test_path.read_text(encoding='utf-8')
          if test.count("'v762'") != 3:
              raise SystemExit('worker build assertions drifted')
          test = test.replace("'v762'", "'v763'")
          anchor = "async function req(url, options = {}, e = env()) {\n  return worker.fetch(new Request(url, options), e, {});\n}\n\n"
          if test.count(anchor) != 1:
              raise SystemExit('worker test insertion anchor drifted')
          tests = """async function req(url, options = {}, e = env()) {\n  return worker.fetch(new Request(url, options), e, {});\n}\n\nconst publicHttpRedirect = await req('http://kalenel.nl/index.html?probe=https', { redirect: 'manual' });\nassert.equal(publicHttpRedirect.status, 308);\nassert.equal(publicHttpRedirect.headers.get('Location'), 'https://kalenel.nl/index.html?probe=https');\nassert.equal(publicHttpRedirect.headers.get('Cache-Control'), 'no-store');\n\nconst adminHttpRedirect = await req('http://admin.kalenel.nl/admin.html?probe=https', { redirect: 'manual' });\nassert.equal(adminHttpRedirect.status, 308);\nassert.equal(adminHttpRedirect.headers.get('Location'), 'https://admin.kalenel.nl/admin.html?probe=https');\nassert.equal(adminHttpRedirect.headers.get('Cache-Control'), 'no-store');\n\nconst publicHttpPostRedirect = await req('http://kalenel.nl/request.html?probe=post', { method: 'POST', body: 'x', redirect: 'manual' });\nassert.equal(publicHttpPostRedirect.status, 308);\nassert.equal(publicHttpPostRedirect.headers.get('Location'), 'https://kalenel.nl/request.html?probe=post');\n\n"""
          test_path.write_text(test.replace(anchor, tests, 1), encoding='utf-8')

          replace_once('package.json', '"verify": "npm run verify:static && npm run verify:js"', '"verify": "npm run verify:static && npm run verify:js && npm run admin-worker:test"')

          gate_path = Path('check-canonical-gejast-gate-v792.mjs')
          gate = gate_path.read_text(encoding='utf-8')
          gate = gate.replace("  'npm run verify:static && npm run verify:js',", "  'npm run verify:static && npm run verify:js && npm run admin-worker:test',", 1)
          anchor2 = "assert.match(\n  pkg.scripts?.['verify:static'] ?? '',"
          addition = "assert.equal(\n  pkg.scripts?.['admin-worker:test'],\n  'node scripts/test-admin-worker-gate.mjs',\n  'canonical verification must execute the deterministic Cloudflare admin-worker security suite'\n);\n"
          if gate.count(anchor2) != 1:
              raise SystemExit('canonical gate insertion anchor drifted')
          gate = gate.replace(anchor2, addition + anchor2, 1)
          gate = gate.replace("console.log('Canonical npm verification is required by GEJAST CI.');", "console.log('Canonical npm verification is required by GEJAST CI, including the Cloudflare Worker security suite.');", 1)
          gate_path.write_text(gate, encoding='utf-8')
          PY
      - name: Verify Worker transport and auth regressions
        run: npm run admin-worker:test
      - name: Syntax-check Worker
        run: node --check cloudflare/workers/admin-gate/src/worker.js
      - name: Preserve concurrent hardening
        shell: bash
        run: |
          grep -F 'check-critical-actions-sha-pinning-v792.mjs' package.json
          grep -F 'check-live-readonly-beta-acceptance-v792.mjs' package.json
          grep -F 'actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09' .github/workflows/verify.yml
          grep -F 'actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444' .github/workflows/verify.yml
      - name: Commit final rebased patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'JesperOaths'
          git config user.email '150788310+JesperOaths@users.noreply.github.com'
          git rm .github/workflows/final-rebase-cloudflare-https-v792.yml
          git add cloudflare/workers/admin-gate/src/worker.js scripts/test-admin-worker-gate.mjs package.json check-canonical-gejast-gate-v792.mjs
          git commit -m 'security: enforce HTTPS in Cloudflare edge worker'
          git push origin HEAD:agent/cloudflare-https-final-rebase-v792
