name: S9 read-only auxiliary MP4 structural probe
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/AuxiliaryMediaProbe.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-auxiliary-media-probe-v1.py'
      - 'ops/c720p/security-runtime/s9_auxiliary_media_probe_v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-media-probe-v1.py'
      - '.github/workflows/s9-auxiliary-media-probe.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/AuxiliaryMediaProbe.java'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-auxiliary-media-probe-v1.py'
      - 'ops/c720p/security-runtime/s9_auxiliary_media_probe_v1.py'
      - 'ops/c720p/security-runtime/test-s9-auxiliary-media-probe-v1.py'
permissions:
  contents: read
jobs:
  compile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Compile against the Android API, check read-only contracts
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/offline-worker/test-s9-auxiliary-media-probe-v1.py
          python3 -m py_compile ops/c720p/security-runtime/s9_auxiliary_media_probe_v1.py
          python3 ops/c720p/security-runtime/test-s9-auxiliary-media-probe-v1.py
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR="$(find "$SDK_ROOT/platforms" -name android.jar | sort -V | tail -1)"
          test -s "$ANDROID_JAR"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$work"             ops/c720p/s9-native-security/offline-worker/AuxiliaryMediaProbe.java
          test -s "$work/nl/kalenel/s9security/AuxiliaryMediaProbe.class"
          echo S9_AUXILIARY_MEDIA_PROBE_COMPILED_READONLY
