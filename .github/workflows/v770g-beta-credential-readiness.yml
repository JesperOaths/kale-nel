name: v770g beta credential readiness

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.head.ref == 'agent/v770g-beta-credential-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Check expected secret presence only
        shell: bash
        env:
          BETA_PLAYER1_NAME: ${{ secrets.GEJAST_BETA_PLAYER1_NAME }}
          BETA_PLAYER1_PIN: ${{ secrets.GEJAST_BETA_PLAYER1_PIN }}
          BETA_PLAYER2_NAME: ${{ secrets.GEJAST_BETA_PLAYER2_NAME }}
          BETA_PLAYER2_PIN: ${{ secrets.GEJAST_BETA_PLAYER2_PIN }}
          ADMIN_SESSION: ${{ secrets.GEJAST_ADMIN_SESSION_TOKEN }}
        run: |
          present(){ if [ -n "$2" ]; then echo "$1=present"; else echo "$1=missing"; fi; }
          present GEJAST_BETA_PLAYER1_NAME "$BETA_PLAYER1_NAME"
          present GEJAST_BETA_PLAYER1_PIN "$BETA_PLAYER1_PIN"
          present GEJAST_BETA_PLAYER2_NAME "$BETA_PLAYER2_NAME"
          present GEJAST_BETA_PLAYER2_PIN "$BETA_PLAYER2_PIN"
          present GEJAST_ADMIN_SESSION_TOKEN "$ADMIN_SESSION"
          if [ -n "$BETA_PLAYER1_NAME" ] && [ -n "$BETA_PLAYER1_PIN" ]; then
            echo 'PROFILE_PROOF_CREDENTIALS=ready'
          else
            echo 'PROFILE_PROOF_CREDENTIALS=not_configured'
          fi
          if [ -n "$BETA_PLAYER1_NAME" ] && [ -n "$BETA_PLAYER1_PIN" ] && [ -n "$BETA_PLAYER2_NAME" ] && [ -n "$BETA_PLAYER2_PIN" ]; then
            echo 'TWO_PLAYER_PROOF_CREDENTIALS=ready'
          else
            echo 'TWO_PLAYER_PROOF_CREDENTIALS=not_configured'
          fi
