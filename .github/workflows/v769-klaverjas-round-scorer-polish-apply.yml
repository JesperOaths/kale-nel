name: v769 Klaverjas round scorer polish apply

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v769-klaverjas-round-scorer-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v769-klaverjas-round-scorer-polish
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply narrow scorer polish
        run: node scripts/apply-v769-klaverjas-round-scorer-polish.mjs
      - name: Synchronize frontend version markers
        run: node fix-version-drift.mjs
      - name: Install pinned dependencies
        run: npm ci
      - name: Dependency security
        run: npm audit --audit-level=high
      - name: Full repository verification
        run: npm run verify
      - name: Current deployed v768 read-only health
        env:
          GEJAST_EXPECTED_VERSION: v768
          GEJAST_DEPLOY_WAIT_SECONDS: '180'
        run: npm run smoke:live
      - name: Beta read-only smoke
        run: npm run smoke:beta:read
      - name: Push health smoke without send
        run: npm run smoke:push
      - name: Commit generated v769 release safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^node_modules/'; then
            echo 'Refusing node_modules.'
            exit 1
          fi
          git commit -m "v769 polish Klaverjas round scorer UI"
          git push origin HEAD:agent/v769-klaverjas-round-scorer-polish
