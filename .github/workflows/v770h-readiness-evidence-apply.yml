name: v770h readiness evidence apply

on:
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v770h-readiness-evidence-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v770h-readiness-evidence-consolidation
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Apply evidence consolidation
        run: node scripts/apply-v770h-readiness-evidence.mjs
      - name: Remove temporary ordinary generator
        run: rm scripts/apply-v770h-readiness-evidence.mjs
      - name: Install pinned dependencies
        run: npm ci
      - name: Full verification
        run: npm run verify
      - name: Beta readiness report
        run: npm run beta:readiness
      - name: Live v770 read-only health
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
        run: npm run smoke:live
      - name: Push health without send
        run: npm run smoke:push
      - name: Commit ordinary evidence/tooling changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta-readiness.json beta-live-write-checklist.json package.json check-live-write-safety-v770e.mjs
          git add -u check-beta-live-write-secondary-games.mjs scripts/apply-v770h-readiness-evidence.mjs
          bad="$(git diff --cached --name-only | grep -Ev '^(beta-readiness\.json|beta-live-write-checklist\.json|package\.json|check-live-write-safety-v770e\.mjs|check-beta-live-write-secondary-games\.mjs|scripts/apply-v770h-readiness-evidence\.mjs)$' || true)"
          if [ -n "$bad" ]; then echo "Unexpected staged files:"; echo "$bad"; exit 1; fi
          git commit -m "v770h consolidate proven beta readiness evidence"
          git push origin HEAD:agent/v770h-readiness-evidence-consolidation
