name: League analysis contract

on:
  push:
    branches: [main]
    paths:
      - 'league/**'
      - 'supabase/functions/league-api-v1/**'
      - 'docs/league-analysis-model.md'
      - 'scripts/check-league-analysis-contract.mjs'
      - 'scripts/check-league-review-audit.mjs'
      - '.github/workflows/league-analysis-contract.yml'
  pull_request:
    paths:
      - 'league/**'
      - 'supabase/functions/league-api-v1/**'
      - 'docs/league-analysis-model.md'
      - 'scripts/check-league-analysis-contract.mjs'
      - 'scripts/check-league-review-audit.mjs'
      - '.github/workflows/league-analysis-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Check League analyzer invariants
        run: node scripts/check-league-analysis-contract.mjs
