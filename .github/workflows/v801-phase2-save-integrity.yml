name: v801 Phase 2 save integrity diagnostic

on:
  push:
    branches: [proof/v801-phase2-save-integrity]
    paths: ['.github/workflows/v801-phase2-save-integrity.yml']

permissions:
  contents: read

concurrency:
  group: full-live-visual-audit
  cancel-in-progress: false

jobs:
  save-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEJAST_EXACT_MAIN_SHA: d5388341c5ca0a595f80f239ebb5cafa84b6af60
    steps:
      - name: Check out exact-v801 proof branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: proof/v801-phase2-save-integrity
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Prove exact v801 product tree and live deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(git show "$GEJAST_EXACT_MAIN_SHA:VERSION" | tr -d '\r\n')" = 'v801'
          test "$(curl -fsS --max-time 10 https://kalenel.nl/VERSION | tr -d '\r\n')" = 'v801'
          unexpected="$(git diff --name-only "$GEJAST_EXACT_MAIN_SHA"..HEAD | grep -Ev '^\.github/workflows/v801-phase2-save-integrity\.yml$' || true)"
          test -z "$unexpected" || { echo 'Unexpected product drift:'; echo "$unexpected"; exit 1; }

      - name: Install database client and run deterministic remaining-game matrices
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          node check-toepen-engine-v792.mjs
          node check-boerenbridge-engine-v792.mjs
          node check-beerpong-gameplay-v792.mjs
          node check-klaverjas-online.mjs
          node check-klaverjas-online-transition-v792b.mjs
          node check-klaverjas-online-rules-v792c.mjs
          node check-klaverjas-online-persistence-v792f.mjs
          echo 'RESULT=V801_PHASE2_REMAINING_DETERMINISTIC_PASS'

      - name: Provision two hidden current-login identities
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          name1="V801SaveA_${suffix}"
          name2="V801SaveB_${suffix}"
          pin1='4826'; pin2='7314'
          echo "::add-mask::$pin1"; echo "::add-mask::$pin2"
          echo "GEJAST_PLAYER1_NAME=$name1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_NAME=$name2" >> "$GITHUB_ENV"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          insert into public.players(slug,display_name,active,pin_hash,approved,hidden_from_public,is_dummy,site_scope)
          values
            ('v801-save-a-'||lower(:'name1'),:'name1',true,'md5:'||md5(:'pin1'||':'||current_database()),true,true,true,'friends'),
            ('v801-save-b-'||lower(:'name2'),:'name2',true,'md5:'||md5(:'pin2'||':'||current_database()),true,true,true,'friends');
          SQL
          sessions="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v name1="$name1" -v name2="$name2" -v pin1="$pin1" -v pin2="$pin2" <<'SQL'
          select public.account_login_v687(:'name1',:'pin1','friends','{}'::jsonb)->>'session_token',
                 public.account_login_v687(:'name2',:'pin2','friends','{}'::jsonb)->>'session_token';
          SQL
          )"
          IFS='|' read -r token1 token2 <<< "$sessions"
          [[ "$token1" =~ ^[0-9a-f]{48}$ && "$token2" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$token1"; echo "::add-mask::$token2"
          echo "GEJAST_PLAYER1_TOKEN=$token1" >> "$GITHUB_ENV"
          echo "GEJAST_PLAYER2_TOKEN=$token2" >> "$GITHUB_ENV"

      - name: Save complete Toepen match and prove cross-owner replay defect
        shell: bash
        run: |
          set -euo pipefail
          client="v801-toepen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "GEJAST_TOEPEN_CLIENT=$client" >> "$GITHUB_ENV"
          first="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -v token="$GEJAST_PLAYER1_TOKEN" -v client="$client" -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select public.create_toepen_game(:'token',jsonb_build_object(
            'client_match_id',:'client','game_type','toepen','target_points',1,'site_scope','friends',
            'participants',jsonb_build_array(
              jsonb_build_object('seat_no',1,'name',:'n1','start_points',0,'end_points',0,'eliminated',false,'finish_rank',1),
              jsonb_build_object('seat_no',2,'name',:'n2','start_points',0,'end_points',1,'eliminated',true,'eliminated_round_no',1,'finish_rank',2)
            ),
            'rounds',jsonb_build_array(jsonb_build_object(
              'round_no',1,'dealer_seat',1,'winner_seat',1,'winner_name',:'n1','stake_final',1,
              'results',jsonb_build_array(
                jsonb_build_object('seat_no',1,'name',:'n1','action','win','penalty_points',0),
                jsonb_build_object('seat_no',2,'name',:'n2','action','stay','penalty_points',1)
              )
            ))
          ),'friends');
          SQL
          )"
          echo "$first" | grep -q '"ok": true'
          echo "$first" | grep -q '"already_saved": false'
          replay="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -v token="$GEJAST_PLAYER2_TOKEN" -v client="$client" -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select public.create_toepen_game(:'token',jsonb_build_object(
            'client_match_id',:'client','game_type','toepen','target_points',1,
            'participants',jsonb_build_array(
              jsonb_build_object('seat_no',1,'name',:'n1','end_points',0,'eliminated',false,'finish_rank',1),
              jsonb_build_object('seat_no',2,'name',:'n2','end_points',1,'eliminated',true,'eliminated_round_no',1,'finish_rank',2)
            ),
            'rounds',jsonb_build_array(jsonb_build_object('round_no',1,'dealer_seat',1,'winner_seat',1,'winner_name',:'n1','stake_final',1,'results',jsonb_build_array(
              jsonb_build_object('seat_no',1,'name',:'n1','action','win','penalty_points',0),
              jsonb_build_object('seat_no',2,'name',:'n2','action','stay','penalty_points',1)
            )))
          ),'friends');
          SQL
          )"
          echo "$replay" | grep -q '"already_saved": true'
          counts="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v client="$client" <<'SQL'
          select (select count(*) from public.toepen_games where client_match_id=:'client'),
                 (select count(*) from public.toepen_game_participants p join public.toepen_games g on g.id=p.game_id where g.client_match_id=:'client'),
                 (select count(*) from public.toepen_rounds r join public.toepen_games g on g.id=r.game_id where g.client_match_id=:'client'),
                 (select count(*) from public.toepen_round_results rr join public.toepen_games g on g.id=rr.game_id where g.client_match_id=:'client');
          SQL
          )"
          test "$counts" = '1|2|1|2'
          echo 'RESULT=V801_TOEPEN_CROSS_OWNER_IDEMPOTENCY_DEFECT_PROVEN'

      - name: Prove Boerenbridge and Beerpong owner isolation live
        shell: bash
        run: |
          set -euo pipefail
          bb="v801-bb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bp="v801-bp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "GEJAST_BB_CLIENT=$bb" >> "$GITHUB_ENV"
          echo "GEJAST_BP_CLIENT=$bp" >> "$GITHUB_ENV"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v token="$GEJAST_PLAYER1_TOKEN" -v bb="$bb" -v bp="$bp" -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" <<'SQL'
          select public.save_boerenbridge_match(:'token',:'bb','v801-proof','v801',jsonb_build_object('match_name','Phase 2 proof','site_scope','friends','rounds',18));
          select public.save_beerpong_match(:'token',:'bp',jsonb_build_object('format','1v1','status','finished','team_a_player_names',jsonb_build_array(:'n1'),'team_b_player_names',jsonb_build_array(:'n2'),'winner_team','team_a','cups_left_team_a',10,'cups_left_team_b',4));
          SQL
          if psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v token="$GEJAST_PLAYER2_TOKEN" -v bb="$bb" -c "select public.save_boerenbridge_match(:'token',:'bb','v801-proof','v801','{}'::jsonb);" >/tmp/bb-cross.out 2>&1; then
            cat /tmp/bb-cross.out; echo 'Boerenbridge cross-owner replay unexpectedly succeeded'; exit 1
          fi
          grep -q 'boerenbridge_match_owner_mismatch' /tmp/bb-cross.out
          if psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v token="$GEJAST_PLAYER2_TOKEN" -v bp="$bp" -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" -c "select public.save_beerpong_match(:'token',:'bp',jsonb_build_object('format','1v1','status','finished','team_a_player_names',jsonb_build_array(:'n1'),'team_b_player_names',jsonb_build_array(:'n2'),'winner_team','team_a','cups_left_team_a',10,'cups_left_team_b',4));" >/tmp/bp-cross.out 2>&1; then
            cat /tmp/bp-cross.out; echo 'Beerpong cross-owner replay unexpectedly succeeded'; exit 1
          fi
          grep -q 'beerpong_match_owner_mismatch' /tmp/bp-cross.out
          echo 'RESULT=V801_BOERENBRIDGE_BEERPONG_OWNER_ISOLATION_PASS'

      - name: Cleanup all diagnostic fixtures and prove zero residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEJAST_PLAYER1_NAME:-}" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" \
            -v tc="${GEJAST_TOEPEN_CLIENT:-__none__}" -v bb="${GEJAST_BB_CLIENT:-__none__}" -v bp="${GEJAST_BP_CLIENT:-__none__}" <<'SQL'
          begin;
          delete from public.toepen_games where client_match_id=:'tc';
          delete from public.boerenbridge_matches where client_match_id=:'bb';
          delete from public.beerpong_matches where client_match_id=:'bp';
          delete from public.gejast_active_player_metadata_v679 where lower(coalesce(player_name,'')) in (lower(:'n1'),lower(:'n2'));
          delete from public.gejast_player_sessions_v746 where player_id in (select id from public.players where display_name in (:'n1',:'n2'));
          delete from public.players where display_name in (:'n1',:'n2') and is_dummy=true and hidden_from_public=true;
          commit;
          SQL
          residue="$(psql "$SUPABASE_DB_URL" -X -At -F'|' -v ON_ERROR_STOP=1 -v n1="$GEJAST_PLAYER1_NAME" -v n2="$GEJAST_PLAYER2_NAME" -v tc="${GEJAST_TOEPEN_CLIENT:-__none__}" -v bb="${GEJAST_BB_CLIENT:-__none__}" -v bp="${GEJAST_BP_CLIENT:-__none__}" <<'SQL'
          select (select count(*) from public.players where display_name in (:'n1',:'n2')),
                 (select count(*) from public.gejast_player_sessions_v746 where display_name in (:'n1',:'n2')),
                 (select count(*) from public.toepen_games where client_match_id=:'tc'),
                 (select count(*) from public.boerenbridge_matches where client_match_id=:'bb'),
                 (select count(*) from public.beerpong_matches where client_match_id=:'bp');
          SQL
          )"
          test "$residue" = '0|0|0|0|0'
          echo 'RESULT=V801_PHASE2_SAVE_DIAGNOSTIC_ZERO_RESIDUE_PASS'
