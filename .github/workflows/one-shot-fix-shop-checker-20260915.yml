name: One-shot shop checker repair

on:
  push:
    branches: ['fix/bunq-payment-provider-compat']
    paths:
      - '.github/workflows/one-shot-fix-shop-checker-20260915.yml'

permissions:
  contents: write

jobs:
  patch-and-clean-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/bunq-payment-provider-compat
      - name: Align checker with helper-based Supabase deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('check-shop-commerce-v817.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''assert.match(deployWorkflow, /functions deploy shop-catalog-v828/);\nassert.match(deployWorkflow, /functions deploy shop-manual-checkout-v832/);'''
          new = '''assert.match(deployWorkflow, /functions deploy \\"\\$function_name\\"/);\nassert.match(deployWorkflow, /deploy_function shop-catalog-v828/);\nassert.match(deployWorkflow, /deploy_function shop-manual-checkout-v832/);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one stale deployment assertion block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-fix-shop-checker-20260915.yml
          node --check check-shop-commerce-v817.mjs
          git diff --check
          grep -nE 'functions deploy|deploy_function shop-' check-shop-commerce-v817.mjs | tail -5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align shop deployment checker with helper workflow'
          git push origin HEAD:fix/bunq-payment-provider-compat
