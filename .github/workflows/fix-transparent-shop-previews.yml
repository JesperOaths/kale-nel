name: Fix transparent shop previews

on:
  push:
    paths:
      - '.github/workflows/fix-transparent-shop-previews.yml'

permissions:
  contents: write

jobs:
  build-transparent-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow gdown

      - name: Build transparent previews from exact Drive masters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import gc
          import gdown

          Image.MAX_IMAGE_PIXELS = None

          sources = {
              'axolotl': ('1asaGT5oDJLpgMTfOSmLeTiMii9FU8deh', '003_axolotl 1_4x_A3_900PPI.png'),
              'hydrangea': ('13jqXDj-_QgfC1B0VTcR8H6usMR_if1Gm', '025_hydrangea 1_4x_A3_900PPI.png'),
              'mantis': ('12mn6dYqgnHdNxiXxm44wv4PpDc55jcBL', '040_orchid mantis 1_4x_A3_900PPI.png'),
              'queen-annes-lace': ('1Q7hxfgkfTj3rCSKI9VS1qZIiPYrzsEzC', '054_wild carrot 1_4x_A3_900PPI.png'),
              'thistle': ('1nfADF3u-KkaWpJ2ki0Z9nCAfFnpSNIxh', '011_distel 1_4x_A3_900PPI.png'),
              'jellyfish': ('1Z1Alpie3M5HhZOcCYjUHQ3ofd-Ve1A8e', 'jellyfish_1_enhanced_4x_A3_900PPI.png'),
              'dragonfly': ('1yYQG7D-P6yAMxbHuIQAN_I-afmMi2zLm', '015_dragonfly 1_4x_A3_900PPI.png'),
          }

          outdir = Path('shop/assets/product-previews')
          outdir.mkdir(parents=True, exist_ok=True)
          tmpdir = Path('.tmp-transparent-previews')
          tmpdir.mkdir(exist_ok=True)

          def fast_resize_rgba(im, maxdim=1800):
              if max(im.size) <= maxdim:
                  return im
              factor = max(1, int(max(im.size) // (maxdim * 2)))
              if factor > 1:
                  im = im.reduce(factor)
              scale = maxdim / max(im.size)
              size = (max(1, round(im.width * scale)), max(1, round(im.height * scale)))
              return im.resize(size, Image.Resampling.LANCZOS)

          for slug, (file_id, source_name) in sources.items():
              src = tmpdir / source_name
              print(f'Downloading {source_name}...')
              result = gdown.download(id=file_id, output=str(src), quiet=False, fuzzy=True)
              if not result or not src.exists() or src.stat().st_size == 0:
                  raise RuntimeError(f'Download failed for {source_name}')

              with Image.open(src) as im:
                  rgba = im.convert('RGBA')
                  alpha = rgba.getchannel('A')
                  extrema = alpha.getextrema()
                  bbox = alpha.getbbox()
                  if extrema[0] != 0 or extrema[1] != 255 or bbox is None:
                      raise RuntimeError(f'{source_name} is not a proper transparent RGBA master: alpha={extrema}')
                  cropped = rgba.crop(bbox)
                  cropped = fast_resize_rgba(cropped, 1800)
                  out = outdir / f'{slug}-front-v5.webp'
                  cropped.save(out, 'WEBP', quality=94, method=4, exact=True)

              with Image.open(out) as check:
                  check = check.convert('RGBA')
                  a = check.getchannel('A')
                  if a.getextrema()[0] != 0:
                      raise RuntimeError(f'{out} lost transparency')
                  corners = [
                      check.getpixel((0, 0))[3],
                      check.getpixel((check.width - 1, 0))[3],
                      check.getpixel((0, check.height - 1))[3],
                      check.getpixel((check.width - 1, check.height - 1))[3],
                  ]
                  if any(c != 0 for c in corners):
                      raise RuntimeError(f'{out} has non-transparent corners: {corners}')
                  print(f'PASS {out}: {check.width}x{check.height}, alpha={a.getextrema()}, corners={corners}')

              src.unlink(missing_ok=True)
              gc.collect()

          print('All seven transparent previews passed alpha validation.')
          PY

      - name: Point shop to transparent v5 assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('shop/product-preview-overrides.js')
          text = js.read_text(encoding='utf-8')
          for slug in ['hydrangea', 'axolotl', 'mantis', 'queen-annes-lace', 'thistle', 'jellyfish', 'dragonfly']:
              old = f'assets/product-previews/{slug}-front-v4.webp'
              new = f'assets/product-previews/{slug}-front-v5.webp'
              if old not in text:
                  raise RuntimeError(f'Missing expected current mapping: {old}')
              text = text.replace(old, new)
          js.write_text(text, encoding='utf-8')

          index = Path('shop/index.html')
          html = index.read_text(encoding='utf-8')
          old_cache = 'product-preview-overrides.js?v=20260830-front-art-edge-v4-boxy1'
          new_cache = 'product-preview-overrides.js?v=20260830-transparent-drive-v5-boxy1'
          if old_cache not in html:
              raise RuntimeError(f'Missing expected cache-bust marker: {old_cache}')
          index.write_text(html.replace(old_cache, new_cache), encoding='utf-8')
          PY

      - name: Commit transparent assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/assets/product-previews/*-front-v5.webp shop/product-preview-overrides.js shop/index.html
          git diff --cached --stat
          git commit -m 'Shop: use transparent Drive masters for front artwork'
          git push origin HEAD:main
