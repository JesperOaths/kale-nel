name: Security Recordings V61 original/prebuffer player status
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-recordings-v61.py'
      - '.github/workflows/security-recordings-v61-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-recordings-v61-release.yml'
permissions:
  contents: read
concurrency:
  group: c720p-security-recordings-v61-source-pin
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate source script and original HTML status contract
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-security-recordings-v61.py
          python3 ops/c720p/s9-native-security/test-security-v8.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/c720p/s9-native-security/deploy-security-recordings-v61.py').read_text()
          for anchor in ('securityPlaybackSegment','before=archive()','after=archive()','source(NEW)','source(OLD)','if raw!=path.read_bytes()','ROLLBACK_ERROR'):
              assert anchor in p, anchor
          PY
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Guarded source-pinned HTML deployment with no original media changes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source='ops/c720p/s9-native-security/deploy-security-recordings-v61.py'
          hash="$(sha256sum "$source" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          dest="/tmp/security-recordings-v61-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 35 '$url' -o '$dest' && printf '%s  %s\n' '$hash' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest' && /usr/bin/python3 '$dest' --apply"
          idem="security-recordings-v61-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-recordings-v61','deployment',:'cmd',260,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_RECORDINGS_V61_JOB=$id"
          for i in $(seq 1 60); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 14000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 2500)"
              echo "$out"
              if [[ "$status" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'SECURITY_RECORDINGS_V61_DRY_RUN_PASS' <<< "$out"
              grep -q 'SECURITY_RECORDINGS_V61_DEPLOY_VERIFIED' <<< "$out"
              exit 0
            fi
            sleep 4
          done
          exit 1
