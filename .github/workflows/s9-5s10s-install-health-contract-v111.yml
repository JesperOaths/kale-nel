name: S9 10-second tail installer verification regression V111
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/deploy-guarded-s9-5s10s-v9.py'
      - 'ops/c720p/s9-native-security/test-s9-5s10s-health-probe-v111.py'
      - '.github/workflows/s9-5s10s-install-health-contract-v111.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-guarded-s9-5s10s-v9.py'
      - 'ops/c720p/s9-native-security/test-s9-5s10s-health-probe-v111.py'
      - '.github/workflows/s9-5s10s-install-health-contract-v111.yml'
permissions:
  contents: read
jobs:
  local-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-guarded-s9-5s10s-v9.py
          python3 ops/c720p/s9-native-security/test-s9-5s10s-health-probe-v111.py
          python3 ops/c720p/s9-native-security/test-post-motion-tail-v7.py
