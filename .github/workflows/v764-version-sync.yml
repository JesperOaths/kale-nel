name: v764 version sync

on:
  push:
    branches:
      - agent/v764-live-write-matrix

permissions:
  contents: write

jobs:
  sync-version-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v764-live-write-matrix
          fetch-depth: 1

      - name: Sync active frontend version markers to root VERSION
        run: node fix-version-drift.mjs

      - name: Commit mechanical version sync when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Version markers already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync v764 frontend version markers"
          git push origin HEAD:agent/v764-live-write-matrix
