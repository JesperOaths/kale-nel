name: v770a scoped live-read post-apply proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.pull_request.head.ref == 'agent/v770a-scoped-live-read-repair'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Compile, exercise, rollback and reapply v770a SQL
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;

          create function public._gejast_live_scope_norm_v352(v text)
          returns text language sql immutable
          as $$ select case when lower(trim(coalesce(v,'')))='family' then 'family' else 'friends' end $$;

          create function public._gejast_name_for_session(token text)
          returns text language sql stable
          as $$ select null::text $$;

          create function public._name_in_site_scope(input_name text, input_scope text)
          returns boolean language sql stable
          as $$ select true $$;

          create function public._gejast_live_surface_rows_v352(
            site_scope_input text default 'friends',
            include_finished boolean default false
          )
          returns table(
            game_type text,
            client_match_id text,
            site_scope text,
            participants text[],
            winner_names text[],
            submitter_name text,
            summary_payload jsonb,
            created_at timestamptz,
            updated_at timestamptz,
            finished_at timestamptz,
            is_live boolean
          )
          language sql stable
          as $$
            select null::text, null::text, null::text, '{}'::text[], '{}'::text[], null::text,
                   '{}'::jsonb, null::timestamptz, null::timestamptz, null::timestamptz, false
            where false
          $$;

          create function public.get_live_match_summary_public_scoped(site_scope_input text default 'friends')
          returns jsonb language sql stable security definer set search_path=public
          as $$ select jsonb_build_object('ok',true,'summary','[]'::jsonb,'matches','[]'::jsonb,'scope',site_scope_input) $$;

          create function public.get_homepage_live_state_public_scoped(site_scope_input text default 'friends')
          returns jsonb language sql stable security definer set search_path=public
          as $$ select jsonb_build_object('ok',true,'live','[]'::jsonb,'matches','[]'::jsonb,'scope',site_scope_input) $$;
          SQL

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f GEJAST_v770a_scoped_live_read_repair.sql

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare summary_result jsonb; homepage_result jsonb;
          begin
            summary_result := public.get_live_match_summary_public_scoped('klaverjas','__compile_probe__','__compile_probe__','friends');
            if coalesce((summary_result->>'found')::boolean, true) then
              raise exception 'compiled summary probe should be found=false';
            end if;
            if summary_result->>'site_scope' <> 'friends' then
              raise exception 'compiled summary probe lost scope';
            end if;

            homepage_result := public.get_homepage_live_state_public_scoped(null,'family');
            if homepage_result->>'site_scope' <> 'family' then
              raise exception 'compiled homepage probe lost family scope';
            end if;
            if homepage_result->'entries'->'klaverjas'->>'is_live' <> 'false' then
              raise exception 'compiled null-session homepage probe should not expose klaverjas';
            end if;
          end $$;
          SQL

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f GEJAST_v770a_scoped_live_read_repair_ROLLBACK.sql

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regprocedure('public.get_live_match_summary_public_scoped(text)') is null then
              raise exception 'rollback did not restore summary stub';
            end if;
            if to_regprocedure('public.get_homepage_live_state_public_scoped(text)') is null then
              raise exception 'rollback did not restore homepage stub';
            end if;
          end $$;
          SQL

          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f GEJAST_v770a_scoped_live_read_repair.sql
          echo 'v770a PostgreSQL compile/rollback/rerun PASS.'
      - name: Verify v770a DDL/read boundary
        run: node check-scoped-live-read-repair-v770a.mjs
      - name: Prove deployed v770a scoped frontend read contracts
        env:
          GEJAST_SCOPED_LIVE_EXPECT_POST: '1'
        run: node check-live-scoped-live-read-v770a.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Confirm deployed frontend remains v770
        env:
          GEJAST_EXPECTED_VERSION: v770
          GEJAST_DEPLOY_WAIT_SECONDS: '30'
          GEJAST_SMOKE_TIMEOUT_MS: '15000'
        run: npm run smoke:live
      - name: Ballroom v769a read remains healthy
        run: node check-live-ballroom-safe-read-v769a.mjs
      - name: Push health without send
        run: npm run smoke:push
