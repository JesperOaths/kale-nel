name: Real C720P Security playback and filing read-only acceptance
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/verify-security-live-only-browser-readonly.py'
      - 'ops/c720p/s9-native-security/verify-security-review-modal-readonly.py'
      - '.github/workflows/c720p-security-ui-readonly-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/verify-security-live-only-browser-readonly.py'
      - 'ops/c720p/s9-native-security/verify-security-review-modal-readonly.py'
      - '.github/workflows/c720p-security-ui-readonly-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: c720p-security-ui-readonly-kiosk-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Parse bounded read-only diagnostics, prevent writes
        run: |
          set -euo pipefail
          for script in ops/c720p/s9-native-security/verify-security-live-only-browser-readonly.py ops/c720p/s9-native-security/verify-security-review-modal-readonly.py; do
            python3 -m py_compile "$script"
          done
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path('ops/c720p/s9-native-security/verify-security-live-only-browser-readonly.py'), Path('ops/c720p/s9-native-security/verify-security-review-modal-readonly.py')):
              src=p.read_text()
              for forbidden in ("video.play(", "'method':'POST'", '"method":"POST"', "manualLink(", "X-S9-Manual-Link-Intent", "setSource("):
                  assert forbidden not in src,(p,forbidden)
              assert "Target.createTarget" in src and "Target.closeTarget" in src
          print('SECURITY_BROWSER_AUDIT_READONLY_CONTRACT_PASS')
          PY
  inspect:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Open background kiosk test pages with no playback or review POST
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security'
          tmp="/tmp/security-ui-readonly-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$tmp'"
          for name in security-step4-cdp-safe.py verify-security-live-only-browser-readonly.py verify-security-review-modal-readonly.py; do
            hash="$(sha256sum "$root/$name" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$root/$name"
            cmd="$cmd && curl -fSsL --max-time 35 '$url' -o '$tmp/$name' && printf '%s  %s\n' '$hash' '$tmp/$name' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$tmp/verify-security-live-only-browser-readonly.py' && /usr/bin/python3 '$tmp/verify-security-review-modal-readonly.py'"
          idem="security-ui-readonly-acceptance-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-ui-acceptance','diagnostic',:'cmd',260,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_UI_READONLY_ACCEPTANCE_JOB=$id"
          for i in $(seq 1 60); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 11000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 3000)"
              echo "$output"
              if [[ "$status" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'SECURITY_MJPEG_ORIGINAL_ONLY_BROWSER_ACCEPTANCE_PASS' <<< "$output"
              grep -q 'SECURITY_REVIEW_MODAL_READONLY_ACCEPTANCE_PASS' <<< "$output"
              echo 'SECURITY_UI_REAL_BROWSER_READONLY_VERIFIED'
              exit 0
            fi
            sleep 4
          done
          exit 1
