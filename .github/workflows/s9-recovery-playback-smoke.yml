name: S9 cool-window recovery playback smoke
on:
  pull_request:
    paths:
      - 'ops/c720p/security-runtime/s9_recovery_playback_smoke_v1.py'
      - 'ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v1.py'
      - 'ops/c720p/security-runtime/c720p-s9-recovery-playback-smoke-v1.service'
      - 'ops/c720p/security-runtime/c720p-s9-recovery-playback-smoke-v1.timer'
      - '.github/workflows/s9-recovery-playback-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/security-runtime/s9_recovery_playback_smoke_v1.py'
      - 'ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v1.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check no-video-write and 1024-byte byte-range contract
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/security-runtime/s9_recovery_playback_smoke_v1.py
          python3 ops/c720p/security-runtime/test-s9-recovery-playback-smoke-v1.py
          echo S9_RECOVERY_RANGE_SMOKE_OFFLINE_PASS
