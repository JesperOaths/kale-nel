name: Publish compact People and Faces evidence V19
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/face-appearances.html.txt'
      - 'ops/c720p/s9-native-security/deploy-faces-evidence-v19.py'
      - '.github/workflows/c720p-security-faces-v19.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-faces-evidence-v19.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-faces-evidence-v19.py
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const source=fs.readFileSync('ops/c720p/s9-native-security/face-appearances.html.txt','utf8');
          for(const x of ['.more[hidden]','/new/saved/snap/','/new/saved/clip/',
           'data-kind="review"','Recording loaded','<div id="playerState"',
           'security-video-playback.js', 'id="playerLoading"', 'id="playerOriginal"'])assert(source.includes(x),x);
          for(const m of source.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/g))new vm.Script(m[1]);
          console.log('PEOPLE_FACES_PER_CLIP_V19_HTML_JS_PASS');
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/c720p/s9-native-security/deploy-faces-evidence-v19.py').read_text()
          for x in ['SECURITY_FACES_V19_VERIFIED','SECURITY_FACES_V19_ROLLED_BACK',
             'original_backup_or_concurrent_edit_failed','http_readback','sha(source)']:
              assert x in s,x
          print('FACES_UI_BACKUP_ROLLBACK_SCOPE_PASS')
          PY
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || exit 1
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          file="ops/c720p/s9-native-security/deploy-faces-evidence-v19.py"
          tpl="ops/c720p/s9-native-security/face-appearances.html.txt"
          digest="$(sha256sum "$file"|cut -d' ' -f1)"
          htmlhash="$(sha256sum "$tpl"|cut -d' ' -f1)"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ && "$htmlhash" =~ ^[a-f0-9]{64}$ ]]
          origin="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/${file}"
          dst="/tmp/security-faces-v19-${GITHUB_SHA:0:12}.py"
          cmd="curl -fSsL --max-time 30 '${origin}' -o '${dst}' && printf '%s  %s\\n' '${digest}' '${dst}' | sha256sum -c - >/dev/null && /usr/bin/python3 '${dst}' --ref '${GITHUB_SHA}' --sha256 '${htmlhash}'"
          idem="security-faces-v19-${GITHUB_SHA:0:24}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
           'github-actions-security-faces-v19','deployment',:'cmd',230,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          echo "SECURITY_FACES_V19_JOB=$id"
          for i in $(seq 1 43); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=${id}"|head -n 1)"
            if [[ "$state" == done\|* || "$state" == error\|* || "$state" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=${id}"|head -c 6500)"
              echo "$output"
              [[ "$state" == 'done|0' ]] || exit 1
              grep -q 'SECURITY_FACES_V19_VERIFIED' <<< "$output" || exit 1
              echo "SECURITY_FACES_V19_HUB_PASS"
              exit 0
            fi
            sleep 8
          done
          exit 1
