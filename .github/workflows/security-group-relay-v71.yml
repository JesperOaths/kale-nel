name: Security Group Filing Auth Relay V71
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/*group-relay-v71.py'
      - '.github/workflows/security-group-relay-v71.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/deploy-security-group-relay-v71.py'
      - '.github/workflows/security-group-relay-v71.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test fail-closed relay schema without touching production
        run: |
          set -euo pipefail
          python3 -m py_compile ops/c720p/s9-native-security/deploy-security-group-relay-v71.py
          python3 ops/c720p/s9-native-security/test-security-group-relay-v71.py
          python3 ops/c720p/s9-native-security/test-manual-recording-links-v1.py
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: c720p-security-group-v71-relay
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply exact V70 relay fix with rollback and harmless wire-protocol acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security'
          staging="/tmp/security-group-relay-v71-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$staging'"
          for script in deploy-security-group-relay-v71.py deploy-security-filing-v65.py; do
            src="$root/$script"
            dig="$(sha256sum "$src" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
            cmd="$cmd && curl -fsSL --max-time 40 '$url' -o '$staging/$script' && printf '%s  %s\\n' '$dig' '$staging/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && python3 '$staging/deploy-security-group-relay-v71.py' --ref '${GITHUB_SHA}' && python3 '$staging/deploy-security-group-relay-v71.py' --ref '${GITHUB_SHA}' --apply"
          idem="security-group-v71-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-security-group-relay-v71','deployment',:'cmd',540,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "SECURITY_GROUP_V71_JOB=$id"
          for i in $(seq 1 120); do
            state="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$state" == done* || "$state" == error* || "$state" == failed* ]]; then
              out="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 12000)"
              err="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stderr,'') from c720p_agent.jobs where id=$id" | head -c 5000)"
              echo "$out"
              if [[ "$state" != 'done|0' ]]; then echo "$err"; exit 1; fi
              grep -q 'SECURITY_GROUP_V71_VERIFIED' <<< "$out"
              grep -q '"probe": true' <<< "$out"
              exit 0
            fi
            sleep 4
          done
          exit 1
