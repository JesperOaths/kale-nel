name: S9 V3 partial verified source cohort read-only preflight V105
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-partial-live-preflight-v105.py'
      - 'ops/c720p/s9-native-security/offline-worker/test-s9-v3-partial-live-preflight-v105.py'
      - '.github/workflows/s9-v3-partial-reference-live-v105.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/offline-worker/run-s9-v3-partial-live-preflight-v105.py'
      - '.github/workflows/s9-v3-partial-reference-live-v105.yml'
permissions:
  contents: read
concurrency:
  group: security-v3-partial-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate preflight safety and synthetic complete 58 of 76 V3 crop subset
        run: |
          set -euo pipefail
          d=ops/c720p/s9-native-security/offline-worker
          python3 -m py_compile "$d/run-s9-v3-partial-live-preflight-v105.py"
          python3 "$d/test-s9-v3-partial-live-preflight-v105.py"
          python3 "$d/test-s9-v3-partial-inventory.py"
          python3 - <<'PY'
          from pathlib import Path
          code=Path("ops/c720p/s9-native-security/offline-worker/run-s9-v3-partial-live-preflight-v105.py").read_text()
          for forbidden in ("--apply","pm install","am force-stop","rm -f","os.replace("):
              assert forbidden not in code
          assert "source_identifiers_disclosed" in code
          assert "capture_output=True" in code
          PY
  live-readonly:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify full V2 map retained within live complete S9 V3 subset
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          root='ops/c720p/s9-native-security/offline-worker'
          stage="/tmp/security-v3-partial-${GITHUB_SHA:0:12}"
          cmd="mkdir -p '$stage'"
          for script in run-s9-v3-partial-live-preflight-v105.py run-s9-uniform-appearance-rankings-v3.py backfill-s9-hsv32-uniform-v2.py backfill-v40-person-rois-on-s9.py backfill-s9-original-roi-osnet-temporal-v2.py; do
            src="$root/$script"
            digest="$(sha256sum "$src" | cut -d' ' -f1)"
            url="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$src"
            cmd="$cmd && curl -fsSL --retry 2 --max-time 35 '$url' -o '$stage/$script' && printf '%s  %s\\n' '$digest' '$stage/$script' | sha256sum -c - >/dev/null"
          done
          cmd="$cmd && /usr/bin/python3 '$stage/run-s9-v3-partial-live-preflight-v105.py'"
          idem="security-v3-partial-${GITHUB_SHA:0:20}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-v3-partial-readonly','diagnostic',:'cmd',660,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_V3_PRIVATE_PREFLIGHT_JOB=$id"
          for attempt in $(seq 1 150); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n1)"
            if [[ "$status" == done* || "$status" == error* || "$status" == failed* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 3500)"
              echo "$output"
              if [[ "$status" != 'done|0' ]]; then
                echo "S9 V3 source subset validation failed"; exit 1
              fi
              if grep -q 'S9_V3_PARTIAL_REFERENCE_READONLY_VERIFIED' <<< "$output"; then
                grep -q '"source_identifiers_disclosed": false' <<< "$output"
                grep -q '"original_57_v2_descriptors_preserved": true' <<< "$output"
                grep -q '"ranking_written": false' <<< "$output"
                exit 0
              fi
              if grep -q 'S9_V3_PARTIAL_REFERENCE_READONLY_DEFERRED' <<< "$output"; then
                grep -q '"rankings_written": false' <<< "$output"
                exit 0
              fi
              echo "No verified or deferred read-only result"; exit 1
            fi
            sleep 4
          done
          echo "S9 V3 partial reference preflight timed out"; exit 1
