name: S9 opt-in validation capture inventory - read only
on:
  pull_request:
    paths:
      - 'ops/c720p/s9-native-security/validate-s9-opt-in-captures-v1.py'
      - 'ops/c720p/s9-native-security/test-s9-opt-in-captures-v1.py'
      - '.github/workflows/c720p-s9-opt-in-validation.yml'
  push:
    branches: [main]
    paths:
      - 'ops/c720p/s9-native-security/validate-s9-opt-in-captures-v1.py'
      - '.github/workflows/c720p-s9-opt-in-validation.yml'
permissions:
  contents: read
concurrency:
  group: s9-consented-validation-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify opt-in manifest checks and provenance
        run: |
          set -euo pipefail
          python3 ops/c720p/s9-native-security/test-s9-opt-in-captures-v1.py
          python3 -m py_compile ops/c720p/s9-native-security/validate-s9-opt-in-captures-v1.py
  audit:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'JesperOaths/kale-nel'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check local opt-in readiness without reading image bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          source='ops/c720p/s9-native-security/validate-s9-opt-in-captures-v1.py'
          sha="$(sha256sum "$source" | cut -d' ' -f1)"
          dest="/tmp/s9-optin-validation-${GITHUB_SHA:0:12}.py"
          uri="https://raw.githubusercontent.com/JesperOaths/kale-nel/${GITHUB_SHA}/$source"
          cmd="curl -fSsL --max-time 35 '$uri' -o '$dest' && printf '%s  %s\n' '$sha' '$dest' | sha256sum -c - >/dev/null && /usr/bin/python3 '$dest'"
          idem="s9-optin-validation-${GITHUB_SHA:0:22}-${GITHUB_RUN_ATTEMPT}"
          id="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -v cmd="$cmd" -v idem="$idem" <<'SQL'
          select job_id from c720p_agent.submit_management_job_v1(
            'github-actions-s9-optin-validation','diagnostic',:'cmd',180,:'idem');
          SQL
          )"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "S9_OPTIN_VALIDATION_JOB=$id"
          for i in $(seq 1 50); do
            status="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select state || '|' || coalesce(exit_code::text,'') from c720p_agent.jobs where id=$id" | head -n 1)"
            if [[ "$status" == done\|* || "$status" == error\|* || "$status" == failed\|* ]]; then
              output="$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select coalesce(stdout,'') from c720p_agent.jobs where id=$id" | head -c 5000)"
              echo "$output"
              [[ "$status" == 'done|0' ]]
              grep -q 'S9_OPT_IN_VALIDATION_READINESS' <<< "$output"
              exit 0
            fi
            sleep 4
          done
          exit 1
