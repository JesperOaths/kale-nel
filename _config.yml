# GitHub Pages publishes this repository from main:/ using Jekyll.
# Keep repository evidence, tests, backend tooling, historical snapshots and
# operational artifacts in Git while preventing them from becoming public site
# routes. Runtime HTML/CSS/JS/images stay publishable unless a specific file is
# explicitly classified below as historical/dead evidence.
exclude:
  - ".github/"
  - "scripts/"
  - "cloudflare/"
  - "sql/"
  - "repo/"
  - "mnt/"
  - "deployment_forensics_v761/"
  - "RELEASES/"
  - "docs/"
  - "check-*.mjs"
  - "package.json"
  - "package-lock.json"
  - "gameplay-acceptance.json"
  - "beta-live-write-checklist.json"
  - "*.md"
  - "**/*.md"
  - "*.txt"
  - "**/*.txt"
  - "*.json"
  - "**/*.json"
  - "*.csv"
  - "**/*.csv"
  - "*.xml"
  - "**/*.xml"
  - "*.body"
  - "**/*.body"
  - "*.yml"
  - "**/*.yml"
  - "*.yaml"
  - "**/*.yaml"
  - "*.sql"
  - "**/*.sql"
  - "*.patch"
  - "**/*.patch"
  - "*.ps1"
  - "**/*.ps1"
  - "*.py"
  - "**/*.py"
  - "*.sh"
  - "**/*.sh"
  - "*.toml"
  - "**/*.toml"
  - "*.mjs"
  - "**/*.mjs"
  - "ADMIN_*"
  - "AUDIT_*"
  - "APPLY_*"
  - "*_PROOF_*"
  - "*_MATRIX_*"
  # Proven dead/duplicate/reference web owners retained in Git for provenance only.
  - "gejast-family-rollout-v437.js"
  - "gejast-mobile-foundation-v581.css"
  - "gejast-mobile-foundation-v581.js"
  - "gejast-mobile-foundation-v582.css"
  - "gejast-mobile-foundation-v582.js"
