<body><main class="wrap"><section class="shell"><header class="top"><div><div class="muted">Afzonderlijke Toepen-analyse</div><h1>Toepen kluis</h1><p class="muted">Potjes, eindposities, folds, rondewins en eliminaties zonder vermenging met Klaverjas-statistieken.</p></div><div class="actions"><select id="scopeSelect"><option value="friends">Vrienden</option><option value="family">Familie</option></select><a class="btn alt" href="./admin.html">Beheerhub</a><a class="btn alt" href="./toepen.html">Scorer</a><button class="btn" id="reloadBtn" type="button">Verversen</button></div></header><div id="status" class="status">Adminsessie controleren…</div><div class="grid"><section class="panel"><h2>Speleranalyse</h2><div id="players" class="cards empty">Laden…</div></section><section class="panel"><h2>Wedstrijdgeschiedenis</h2><div id="games" class="cards empty">Laden…</div></section></div></section></main><div class="site-credit-watermark" data-version-watermark>v757 ? Made by Bruis</div>
<script>
(()=>{'use strict';const cfg=window.GEJAST_CONFIG||{};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const headers=()=>({'Content-Type':'application/json',apikey:cfg.SUPABASE_PUBLISHABLE_KEY||'',Authorization:`Bearer ${cfg.SUPABASE_PUBLISHABLE_KEY||''}`,Accept:'application/json'});async function rpc(name,body){const r=await fetch(`${cfg.SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',mode:'cors',cache:'no-store',headers:headers(),body:JSON.stringify(body||{})});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){throw new Error(t||`HTTP ${r.status}`)}if(!r.ok)throw new Error(d?.message||d?.error||d?.hint||`HTTP ${r.status}`);return d&&d[name]!==undefined?d[name]:d}function adminToken(){return window.GEJAST_ADMIN_SESSION?.getToken?.()||sessionStorage.getItem('jas_admin_session_v8')||localStorage.getItem('jas_admin_session_v8')||''}function render(data){const players=Array.isArray(data?.player_stats)?data.player_stats:[];const games=Array.isArray(data?.recent_games)?data.recent_games:[];$('players').className=players.length?'cards':'cards empty';$('players').innerHTML=players.length?players.map(p=>`<article class="card"><strong>${esc(p.player_name)}</strong><div class="stats"><div class="stat"><span>Potjes</span><strong>${p.games_played||0}</strong></div><div class="stat"><span>Wins</span><strong>${p.games_won||0}</strong></div><div class="stat"><span>Gem. plek</span><strong>${p.average_finish??'—'}</strong></div><div class="stat"><span>Rondewins</span><strong>${p.rounds_won||0}</strong></div><div class="stat"><span>Folds</span><strong>${p.folds||0}</strong></div><div class="stat"><span>Blijfverlies</span><strong>${p.stay_losses||0}</strong></div><div class="stat"><span>Uitvallers</span><strong>${p.eliminations||0}</strong></div><div class="stat"><span>Gem. eindscore</span><strong>${p.average_end_points??'—'}</strong></div></div></article>`).join(''):'Nog geen Toepen-data.';$('games').className=games.length?'cards':'cards empty';$('games').innerHTML=games.length?games.map(g=>`<details class="card"><summary>${new Date(g.played_at).toLocaleString('nl-NL')} · ${esc((g.winner_names||[]).join(', ')||'Geen winnaar')}</summary><p><strong>Spelers:</strong> ${esc((g.participant_names||[]).join(', '))}</p><p><strong>Rondes:</strong> ${g.round_count||0} · <strong>Doel:</strong> ${g.target_points||10}</p><p class="muted">Opgeslagen door ${esc(g.created_by_player_name||'onbekend')} · ${esc(JSON.stringify(g.ruleset||{}))}</p></details>`).join(''):'Nog geen opgeslagen Toepen-potjes.'}async function load(){const token=adminToken();if(!token){$('status').textContent='Geen adminsessie. Je wordt naar de beheerlogin gestuurd.';window.GEJAST_ADMIN_SESSION?.redirectToAdminLogin?.('admin_required','toepen_vault.html');return}$('status').textContent='Toepen-kluis laden…';try{const data=await rpc('get_toepen_vault_summary',{admin_session_token:token,limit_count:200,site_scope_input:$('scopeSelect').value});render(data);$('status').textContent='Kluis geladen.'}catch(err){$('status').textContent=`Laden mislukt: ${err.message||err}`}}$('reloadBtn').onclick=load;$('scopeSelect').onchange=load;(async()=>{if(window.GEJAST_ADMIN_SESSION?.requirePage){const ok=await window.GEJAST_ADMIN_SESSION.requirePage('toepen_vault.html');if(!ok)return}await load();try{cfg.applyVersionLabel&&cfg.applyVersionLabel()}catch(_){}})()})();
</script></body></html>
