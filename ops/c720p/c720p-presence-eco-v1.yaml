# C720P_PRESENCE_ECO_V1
# Fail-safe presence layer. Unknown is never treated as Away.
input_number:
  c720p_away_auto_off_minutes:
    name: Away light shutoff delay
    icon: mdi:timer-off-outline
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider
    initial: 15

template:
  - sensor:
      - name: C720P Home Presence
        unique_id: c720p_home_presence
        icon: >-
          {% if states('person.jesper') == 'home' %}mdi:home-account
          {% elif states('person.jesper') == 'not_home' %}mdi:home-export-outline
          {% else %}mdi:home-question{% endif %}
        state: >-
          {% set p = states('person.jesper') %}
          {% if p == 'home' %}Home
          {% elif p == 'not_home' %}Away
          {% else %}Unknown{% endif %}
        attributes:
          person_entity: person.jesper
          person_state: "{{ states('person.jesper') }}"
          tracker_count: "{{ (state_attr('person.jesper','device_trackers') or []) | count }}"
          trackers: "{{ state_attr('person.jesper','device_trackers') or [] }}"
          fail_safe: "Unknown/unavailable never counts as Away"
          away_delay_minutes: "{{ states('input_number.c720p_away_auto_off_minutes') }}"
  - binary_sensor:
      - name: C720P Away Confident
        unique_id: c720p_away_confident
        icon: mdi:home-export-outline
        availability: "{{ states('person.jesper') in ['home','not_home'] }}"
        state: "{{ states('person.jesper') == 'not_home' }}"

automation:
  - id: c720p_presence_away_eco_off_v1
    alias: C720P Eco Guard - confident away lights off
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: input_boolean.c720p_energy_saver
        state: "on"
      - condition: state
        entity_id: binary_sensor.c720p_away_confident
        state: "on"
      - condition: template
        value_template: >-
          {% set delay = states('input_number.c720p_away_auto_off_minutes') | float(15) %}
          {{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.c720p_away_confident.last_changed)) >= delay * 60 }}
      - condition: template
        value_template: >-
          {{ is_state('light.c720p_ui_living_room_lights','on')
             or is_state('light.c720p_ui_bedroom_lights','on') }}
    action:
      - action: light.turn_off
        target:
          entity_id:
            - light.c720p_ui_living_room_lights
            - light.c720p_ui_bedroom_lights
