<script id="s9v7-tracks-script">
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const valid=/^(?:(?:motion|native4k)_[0-9]{13}|rec_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2})[.]mp4$/;
const palette={black:'#252d34',white:'#edf2f7',gray:'#98a5af',red:'#d76f6a',orange:'#de9a59',yellow:'#e9d36e',green:'#6ab587',blue:'#70a9d7',purple_or_pink:'#b88ecb',brown:'#aa8162'};
const make=(tag,cls,txt)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=String(txt);return el};
const relay=()=>{if(window.C720PSecureRelay?.fetch&&window.C720PSecureRelay?.url)return window.C720PSecureRelay;
try{if(window.parent!==window&&window.parent.location.origin===location.origin&&window.parent.C720PSecureRelay?.fetch)return window.parent.C720PSecureRelay}catch(_){}return null};
const fmtColour=c=>String(c||'unknown').replaceAll('_',' ');
const isReviewed=r=>['sampled_tracks_available','none_detected_in_sampled_frames'].includes(r.anonymous_tracking_status);
const trackCount=r=>Array.isArray(r.anonymous_tracks)?r.anonymous_tracks.length:Number(r.anonymous_track_count)||0;
const stamp=r=>{const match=/^(?:motion|native4k)_([0-9]{13})/.exec(r.clip_no);return match?Number(match[1]):null};
const dayOf=r=>{const n=stamp(r);if(n===null)return String(r.clip_no).slice(4,14);const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(n));const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};
const timeOf=r=>stamp(r)!==null?new Date(stamp(r)).toLocaleTimeString('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'}):String(r.clip_no).slice(15,20).replace('-',':');
const directions={moving_left_in_image:'Left in image',moving_right_in_image:'Right in image',moving_up_in_image:'Up in image',moving_down_in_image:'Down in image',stationary_or_uncertain:'Stationary / uncertain',insufficient_samples:'Insufficient samples'};
const category=r=>{const g=String(r.scene_category||'').toLowerCase(),tags=Array.isArray(r.content_categories)?r.content_categories.map(String):[];
if(g==='multiple_people'||Number(r.person_count)>1)return 'Group';
if(Number(r.person_count)>0||g==='one_person')return 'Person';
if(g.includes('vehicle')||tags.includes('vehicle'))return 'Vehicle';if(g.includes('animal')||tags.includes('animal'))return 'Animal';return 'Motion'};
const matchesKind=r=>{const k=state.kind;if(k==='all')return true;if(k==='tracked')return trackCount(r)>0;if(k==='people')return Number(r.person_count)>0;if(k==='group')return category(r)==='Group';if(k==='vehicle')return category(r)==='Vehicle';if(k==='animal')return category(r)==='Animal';return true};
const state={all:[],movement:'all',kind:'tracked',colour:'all',day:'all',reviewed:false,query:'',order:'new',limit:48,busy:false};
let playerToken=0;
async function thumbnail(img,r){try{const api=relay();if(api?.url)img.src=await api.url('/new/saved/snap/'+encodeURIComponent(r.clip_no+'.thumb.jpg')+(r.thumbnail_revision?'?rev='+encodeURIComponent(r.thumbnail_revision):''))}catch(_){
img.src='/local/frontyard-security-new/s9-phone-thumbs/'+encodeURIComponent(r.clip_no)+'.thumb.jpg'}}
function colourPill(track){const c=String(track.upper_clothing_colour||'');const name=String(track.id||'');
const el=make('span','track');const dot=make('i','colour-dot');dot.style.setProperty('--paint',palette[c]||'#677b88');el.append(dot,make('span','',name+' · '+fmtColour(c)));return el}
function card(r){const el=make('article','card'),pic=make('div','image'),img=make('img');img.loading='lazy';img.decoding='async';img.alt='Scene preview';img.onerror=()=>img.remove();
pic.append(make('div','fallback','▣'),img);el.append(pic);
const body=make('div','card-body'),head=make('div','top'),c=category(r);
head.append(make('b','',dayOf(r)+' · '+timeOf(r)),make('span','kind',c));body.append(head);
const wrap=make('div','tracks'),tracks=Array.isArray(r.anonymous_tracks)?r.anonymous_tracks:[];
for(const track of tracks.slice(0,9))if(/^Person (?:[1-9]|[1-5][0-9]|6[0-4])$/.test(String(track.id||''))){
 const item=make('div','track-evidence'),jump=make('button','track-jump');jump.type='button';jump.append(colourPill(track));jump.setAttribute('aria-label','Play '+track.id+' observation');jump.addEventListener('click',()=>play(r,Number(track.first_sample_ms)||0));item.append(jump);
 const confidence=Number(track.peak_detection_score);item.append(make('span','details',(directions[track.image_movement_direction]||'Movement not measured')+' · '+(Number(track.sample_count)||0)+' samples'+(Number.isFinite(confidence)?' · '+Math.round(confidence*100)+'% peak score':'')));
 const a=Number(track.first_sample_ms),b=Number(track.last_sample_ms);if(Number.isFinite(a)&&Number.isFinite(b))item.append(make('span','details',(a/1000).toFixed(1)+'–'+(b/1000).toFixed(1)+'s in recording'));wrap.append(item)}
if(!wrap.children.length)wrap.append(make('span','kind',isReviewed(r)?'No tracks in sampled frames':'Awaiting track scan'));
body.append(wrap);
const stats=make('div','details',(r.person_count!=null?'Peak '+Number(r.person_count)+' person candidates':'Person count unavailable')+' · '+(r.sampled_frames!=null?Number(r.sampled_frames)+' sampled frames':'Sample count unavailable'));
body.append(stats);
const open=make('button','open','Play clip');open.type='button';open.addEventListener('click',()=>play(r));body.append(open);
el.append(body);thumbnail(img,r);return el}
function matches(r){if(!matchesKind(r))return false;if(state.reviewed&&!isReviewed(r))return false;
if(state.day!=='all'&&dayOf(r)!==state.day)return false;
const tracks=Array.isArray(r.anonymous_tracks)?r.anonymous_tracks:[];
if(state.movement!=='all'&&!tracks.some(t=>state.movement==='measured'?/^moving_(left|right|up|down)_in_image$/.test(t.image_movement_direction||''):t.image_movement_direction===state.movement))return false;
if(state.colour!=='all'&&!tracks.some(t=>t.upper_clothing_colour===state.colour))return false;
if(state.query){const q=[r.clip_no,dayOf(r),r.timestamp,r.scene_category,...tracks.map(t=>[t.id,t.upper_clothing_colour].join(' '))].join(' ').toLowerCase();
if(!q.includes(state.query))return false}
return true}
function render(){let entries=state.all.filter(matches);
const chronological=(a,b)=>dayOf(a).localeCompare(dayOf(b))||timeOf(a).localeCompare(timeOf(b))||a.clip_no.localeCompare(b.clip_no);
entries.sort((a,b)=>state.order==='tracks'?trackCount(b)-trackCount(a)||chronological(b,a):state.order==='old'?chronological(a,b):chronological(b,a));
const grid=$('grid');grid.replaceChildren();
const visible=Math.min(entries.length,Math.max(0,state.limit));
for(const r of entries.slice(0,visible))grid.append(card(r));
const remaining=Math.max(0,entries.length-visible);
$('more').hidden=remaining===0;
$('more').textContent=remaining?('Show next '+Math.min(48,remaining)+' · '+remaining+' remaining'):'';
$('noResults').hidden=entries.length!==0;
$('count').textContent=entries.length+' recordings · '+entries.reduce((n,r)=>n+trackCount(r),0)+' clip-scoped tracks';
}
function resetFilteredScroll(){const scroller=$('results');if(scroller)scroller.scrollTop=0}
function dayOptions(){const select=$('day'),days=[...new Set(state.all.map(dayOf))].sort().reverse();select.replaceChildren();
const all=make('option','','All dates');all.value='all';select.append(all);
for(const d of days){const opt=make('option','',d);opt.value=d;select.append(opt)}
if(!days.includes(state.day))state.day='all';select.value=state.day}
async function play(r,startMs=0){const api=relay(),token=++playerToken,v=$('video');v.pause();v.removeAttribute('src');v.load();$('videoTitle').textContent=dayOf(r)+' · '+timeOf(r);
$('videoStatus').textContent='Loading…';if(!$('viewer').open)$('viewer').showModal();
try{if(!api?.url)throw Error('relay');const signed=await api.url('/new/saved/clip/'+encodeURIComponent(r.clip_no));if(token!==playerToken)return;v.addEventListener('loadedmetadata',()=>{if(token===playerToken&&startMs>0&&Number.isFinite(v.duration))v.currentTime=Math.min(startMs/1000,Math.max(0,v.duration-.1))},{once:true});v.src=signed;v.load();$('videoStatus').textContent=''}
catch(_){if(token===playerToken)$('videoStatus').textContent='Recording unavailable'}}
async function reload(){if(state.busy)return;state.busy=true;
try{const api=relay();if(!api?.fetch)throw Error('relay');const resp=await api.fetch('/new/api/saved',{cache:'no-store'});
if(!resp.ok)throw Error('not_found');const j=await resp.json();if(!Array.isArray(j.events)||j.archive_mode!=='S9-microSD-only')throw Error('index');
state.all=j.events.filter(r=>valid.test(String(r.clip_no||'')));dayOptions();render()}
catch(_){$('count').textContent='Archive unavailable';if(!state.all.length)$('noResults').hidden=false}
finally{state.busy=false}}
const colours=$('colours'),all=make('button','swatch');all.type='button';all.title='All colours';all.setAttribute('aria-label','All clothing colours');all.setAttribute('aria-pressed','true');all.dataset.colour='all';colours.append(all);
for(const [name,paint] of Object.entries(palette)){const el=make('button','swatch');el.type='button';el.title=fmtColour(name);el.setAttribute('aria-label',fmtColour(name));el.setAttribute('aria-pressed','false');el.dataset.colour=name;el.style.setProperty('--paint',paint);colours.append(el)}
colours.addEventListener('click',e=>{const b=e.target.closest('button[data-colour]');if(!b)return;state.colour=b.dataset.colour;state.limit=48;resetFilteredScroll();
for(const x of colours.querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));render()});
$('categories').addEventListener('click',e=>{const b=e.target.closest('button[data-kind]');if(!b)return;state.kind=b.dataset.kind;state.limit=48;resetFilteredScroll();
for(const x of $('categories').querySelectorAll('button'))x.setAttribute('aria-pressed',String(x===b));render()});
$('reviewed').addEventListener('change',e=>{state.reviewed=e.target.checked;state.limit=48;resetFilteredScroll();render()});
$('movement').addEventListener('change',e=>{state.movement=e.target.value;state.limit=48;resetFilteredScroll();render()});
$('day').addEventListener('change',e=>{state.day=e.target.value;state.limit=48;resetFilteredScroll();render()});
$('order').addEventListener('change',e=>{state.order=e.target.value;render()});
$('search').addEventListener('input',e=>{state.query=e.target.value.toLowerCase().trim().slice(0,100);state.limit=48;resetFilteredScroll();render()});
$('more').addEventListener('click',()=>{state.limit+=48;render()});
$('close').addEventListener('click',()=>$('viewer').close());
$('viewer').addEventListener('close',()=>{++playerToken;const v=$('video');v.pause();v.removeAttribute('src');v.load()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&$('viewer').open)$('viewer').close()});
reload();
})();

const GEJAST_PAGE_VERSION='v817';
</script>
