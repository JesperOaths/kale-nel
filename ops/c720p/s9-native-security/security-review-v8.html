<!doctype html>
<html lang="en"><head><script src="/gejast-auth-gate.js?v817"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Cache-Control" content="no-store">
<title>Security · Recordings & Evidence</title>
<style>
:root{color-scheme:dark;--bg:#0c1520;--panel:#152432;--ink:#eef7fc;--muted:#a4bdc9;--line:#324857;--accent:#79e3d0}
*{box-sizing:border-box}body{font:13px/1.46 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#203646;border-radius:9px;padding:9px 12px}
button:hover{border-color:#7cb7c0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{height:100dvh;overflow-y:auto;padding:23px clamp(15px,2.6vw,38px) 60px;scrollbar-gutter:stable;overscroll-behavior:contain}
header{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .eyebrow{letter-spacing:.18em;color:var(--accent);font-size:10px;font-weight:800;text-transform:uppercase}
h1{font-size:25px;letter-spacing:-.04em;margin:0}p{color:var(--muted);margin:5px 0 0}
#sync{font-size:11px;color:var(--muted);padding:9px 0}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);background:var(--panel);padding:13px;border-radius:13px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.filters input,.filters select{border:1px solid var(--line);background:#172a39;border-radius:8px;padding:10px;min-height:39px}
.filters input{min-width:180px;flex:1}
.layout{display:grid;grid-template-columns:minmax(290px,1fr) minmax(310px,.9fr);gap:16px;align-items:start}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:11px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;min-width:0}
.clip[aria-selected=true]{border:2px solid var(--accent);background:#1b3945}
.pic{height:148px;display:block;position:relative;background:#253849}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .none{position:absolute;inset:0;display:grid;place-items:center;color:#b4c5d1;font-size:12px}
.clip-label{padding:11px}.clip-label strong{display:block;font-size:12px}.clip-label small{display:block;color:var(--muted);margin-top:5px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:10px;border:1px solid #486879;background:#223c4e;padding:3px 6px;border-radius:6px}
.detail{position:sticky;top:9px;border:1px solid var(--line);border-radius:14px;background:#132432;padding:15px;min-width:0}
.detail h2{font-size:17px;margin:0 0 7px}.filename{overflow-wrap:anywhere;color:var(--muted);font-size:11px}
video{width:100%;height:auto;max-height:320px;background:#05090d;display:block;border-radius:9px;object-fit:contain}
#quality{color:#c3d7df;font-size:11px;padding:7px 0 12px;min-height:30px}
#metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.metric{padding:11px;border:1px solid #385161;background:#1a3040;border-radius:9px;min-width:0}
.metric b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.metric span{color:#bdd0db;font-size:11px}
.note{color:#c2d6e1;font-size:12px;margin:12px 0;padding:12px;border-left:2px solid #74c8b6;background:#1a3541}
.details{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;margin:12px 0 0}
.details dt,.details dd{margin:0;padding:8px 4px;border-bottom:1px solid #294554;font-size:11px;overflow-wrap:anywhere}
.details dt{color:#a8c1ce}.empty{padding:35px 20px;text-align:center;border:1px dashed var(--line);color:var(--muted)}
#results{color:var(--muted);font-size:11px;margin-bottom:12px}
@media(max-width:1020px){.layout{grid-template-columns:1fr}.detail{position:static}}
@media(max-width:580px){.statrow{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:110px minmax(0,1fr)}.pic{height:150px}}
</style></head><body><main>
<header><div><div class="eyebrow">S9+ · microSD · local only</div><h1 id="title">Recordings</h1><p id="intro"></p></div><button type="button" id="refresh">Refresh</button></header>
<div id="sync" role="status">Connecting to the phone archive…</div>
<section class="statrow" aria-label="Recording summary"><div class="stat"><strong id="nclips">—</strong><span id="cliplabel">Clips</span></div><div class="stat"><strong id="npeople">—</strong><span>Flagged people (unverified)</span></div><div class="stat"><strong id="nreview">—</strong><span>With sampled-frame review</span></div><div class="stat"><strong id="nfaces">—</strong><span>Saved frontal face crops</span></div></section>
<div class="filters"><input id="search" type="search" maxlength="100" placeholder="Filter by time, filename, category" aria-label="Find recording"><select id="type" aria-label="Filter classifications"><option value="all">All categories</option><option value="people">Person candidates</option><option value="motion">Other motion</option><option value="review">Unreviewed</option></select><select id="order" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="score">Highest person score</option></select></div>
<div id="results"></div><div class="layout"><section id="list" class="list" aria-label="Recordings"></section><aside id="detail" class="detail"><div class="empty">Choose a recording to inspect the original video and review evidence.</div></aside></div>
</main><script id="s9v8-review-script">
(()=>{
'use strict';
const $=id=>document.getElementById(id),mode=new URLSearchParams(location.search).get('mode')==='evidence'?'evidence':'today';
const native=/^motion_[0-9]{13}[.]mp4$/,legacy=/^rec_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}[.]mp4$/;
const SAFE=/^(?:motion_[0-9]{13}|rec_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2})[.]mp4[.]thumb[.]jpg$/;
const state={all:[],visible:[],selected:null,refreshing:false,activeVideo:null};
$('title').textContent=mode==='today'?"Today's recordings":"Evidence & analytics";
$('intro').textContent=mode==='today'?'Clips recorded today, Amsterdam time. Historical clips remain in Archive.':'Detector confidence, sampled frames, tracked-appearance evidence and original recordings in one searchable place.';
$('cliplabel').textContent=mode==='today'?'Today’s clips':'Indexed clips';
function relay(){if(window.C720PSecureRelay?.url&&window.C720PSecureRelay?.fetch)return window.C720PSecureRelay;
try{if(window.parent!==window&&window.parent.C720PSecureRelay?.url)return window.parent.C720PSecureRelay}catch(_){}return null}
function stamp(rec){const n=String(rec.clip_no||'');if(native.test(n))return Number(n.slice(7,20));if(legacy.test(n)){const m=n.match(/^rec_([0-9]{4}-[0-9]{2}-[0-9]{2})_([0-9]{2})-([0-9]{2})/);if(m)return Date.parse(m[1]+'T'+m[2]+':'+m[3]+':00+02:00')||0;}const t=Date.parse(String(rec.timestamp||''));return Number.isFinite(t)?t:0}
function day(ms){if(!ms)return '';const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms));const k=Object.fromEntries(f.map(a=>[a.type,a.value]));return k.year+'-'+k.month+'-'+k.day}
function today(){return day(Date.now())}
function name(rec){return String(rec.clip_no||'')}
function fmt(rec){let ms=stamp(rec);return ms?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(ms):String(rec.timestamp||'Unknown time')}
function label(rec){const p=Number(rec.person_count||0);return p>1?p+' possible people':p>0?'Person candidate':rec.scene_category==='unreviewed'?'Awaiting review':'Motion · unverified'}
function pct(n){return Number.isFinite(n)?(100*n).toFixed(1)+'%':'Not measured'}
function text(tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=String(value??'');return el}
function pic(rec,host){const n=String(rec.snapshot_name||'');const outer=text('div','','pic');const fallback=text('span','No scene thumbnail','none');outer.append(fallback);if(SAFE.test(n)){
 const img=document.createElement('img');img.alt='Scene sample from recording; not an identified face';img.loading='lazy';img.decoding='async';img.src='/local/frontyard-security-new/s9-phone-thumbs/'+encodeURIComponent(n);
 img.onload=()=>fallback.remove();img.onerror=()=>img.remove();outer.append(img);
 }host.append(outer)}
function metric(parent,value,title){const div=text('div','','metric');div.append(text('b',value),text('span',title));parent.append(div)}
function entryKey(rec){return name(rec)}
function playbackStop(){if(state.activeVideo){state.activeVideo.pause();state.activeVideo.removeAttribute('src');state.activeVideo.load();state.activeVideo=null}}
async function open(rec){
 state.selected=entryKey(rec);
 document.querySelectorAll('.clip').forEach(n=>n.setAttribute('aria-selected',String(n.dataset.clip===state.selected)));
 playbackStop();const host=$('detail');host.replaceChildren();
 host.append(text('h2',fmt(rec)),text('div',name(rec),'filename'));
 const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.disablePictureInPicture=false;
 host.append(video);state.activeVideo=video;
 const quality=text('div','Loading media details…','');quality.id='quality';host.append(quality);
 const mf=text('div','','');mf.id='metrics';host.append(mf);
 const scores=rec.person_score===null||rec.person_score===undefined?NaN:Number(rec.person_score);
 const samples=Number(rec.sampled_frames)||0,positives=Number(rec.person_detected_frames_050)||0;
 metric(mf,Number.isFinite(scores)?(scores*100).toFixed(0)+'%':'—','Peak uncalibrated person-detector score');
 metric(mf,samples||'—','Frames reviewed (sampled, not continuous)');
 metric(mf,samples?pct(positives/samples):'—','Sampled frames with person ≥0.50 ('+positives+'/'+samples+')');
 metric(mf,Number.isFinite(Number(rec.person_count))?String(rec.person_count):'—','Maximum simultaneously detected people');
 const note=text('div','Scores are uncalibrated model outputs, not verified accuracy or identity. A negative result in sampled frames does not prove nobody appeared anywhere in the recording.','note');host.append(note);
 const def=document.createElement('dl');def.className='details';
 const fields=[['Classification',label(rec)],['Filename',name(rec)],['Recorded',fmt(rec)],['Length',Number(rec.duration_ms)>0?(rec.duration_ms/1000).toFixed(1)+' seconds':'Not indexed'],['Size',Number(rec.size)>0?(rec.size/1048576).toFixed(1)+' MiB':'Not indexed'],['Storage',rec.camera||'S9+ microSD'],['Review backend',rec.review_backend||'Not reported'],['Person event',rec.person_event_category||'Not assigned'],['Appearance tracks',Array.isArray(rec.anonymous_tracks)?rec.anonymous_tracks.length:0],['Face snapshots',Number(rec.face_snapshots_saved||0)],['Face review',rec.face_review_status||'Not completed'],['Content categories',Array.isArray(rec.content_categories)?rec.content_categories.join(', ')||'None':'Unavailable']];
 for(const [key,value] of fields)def.append(text('dt',key),text('dd',value));host.append(def);
 const details=document.createElement('details');details.append(text('summary','All indexed evidence fields'));const all=document.createElement('dl');all.className='details';
 for(const [key,value] of Object.entries(rec).sort(([a],[b])=>a.localeCompare(b))){
 all.append(text('dt',key.replaceAll('_',' ')),text('dd',typeof value==='object'?JSON.stringify(value):String(value??'—')));
 }details.append(all);host.append(details);
 if(!native.test(name(rec))){quality.textContent='Legacy clip: use Archive for playback; this view preserves its evidence metadata.';return}
 const r=relay();if(!r?.url){quality.textContent='Secure video relay unavailable';return}
 try{const url=await r.url('/new/saved/clip/'+encodeURIComponent(name(rec)));
 if(state.selected!==entryKey(rec))return;video.src=url;
 video.addEventListener('loadedmetadata',()=>{quality.textContent='Original video · '+video.videoWidth+' × '+video.videoHeight+' · '+(Number.isFinite(video.duration)?video.duration.toFixed(1)+'s':'unknown duration')+' · monitoring displayed frames';},{once:true});
 let count=0,start=0,reported=0;const cb=(now,meta)=>{if(state.activeVideo!==video||!video.isConnected)return;
 if(!start)start=now;count++;
 if(now-start>=1200){const fps=count*1000/(now-start);const q=video.getVideoPlaybackQuality?.();let dropped=q?.droppedVideoFrames;
 quality.textContent='Actual displayed playback: '+fps.toFixed(1)+' FPS'+(typeof dropped==='number'?' · dropped frames '+dropped:'')+
 (fps<24?' · below 24 FPS target':' · meets 24 FPS target')+' · '+video.videoWidth+'×'+video.videoHeight;
 count=0;start=now;reported++;}
 video.requestVideoFrameCallback(cb)};
 if(typeof video.requestVideoFrameCallback==='function')video.requestVideoFrameCallback(cb);
 else quality.textContent='Video ready · FPS measurement not supported in this browser';
 }catch(_){quality.textContent='Unable to load signed MP4. Original retained on S9+.'}
}
function render(){
 const query=$('search').value.toLowerCase().trim(),type=$('type').value,order=$('order').value;
 let result=state.all.filter(rec=>{
  if(mode==='today'&&day(stamp(rec))!==today())return false;
  const p=Number(rec.person_count||0),review=Number(rec.sampled_frames||0)>0;
  if(type==='people'&&p<=0)return false;
  if(type==='motion'&&(p>0||rec.scene_category==='unreviewed'))return false;
  if(type==='review'&&review)return false;
  if(query&&!([name(rec),fmt(rec),rec.scene_category,rec.person_event_category].join(' ').toLowerCase().includes(query)))return false;
  return true;});
 result.sort((a,b)=>order==='score'?Number(b.person_score||0)-Number(a.person_score||0):
  order==='old'?stamp(a)-stamp(b):stamp(b)-stamp(a));
 state.visible=result;const p=result.filter(x=>Number(x.person_count)>0);
 $('nclips').textContent=result.length;
 $('npeople').textContent=p.length;
 $('nreview').textContent=result.filter(x=>Number(x.sampled_frames)>0).length;
 $('nfaces').textContent=result.reduce((n,x)=>n+Number(x.face_snapshots_saved||0),0);
 $('results').textContent=result.length+' recordings shown'+(mode==='today'?' · Today in Amsterdam, including all classifications':' · historical and current evidence');
 const host=$('list');host.replaceChildren();
 if(!result.length){host.append(text('div',mode==='today'?'No indexed clips today yet. Camera status is independent of recording count.':'No matching recordings.','empty'));return;}
 for(const rec of result.slice(0,400)){
  const card=text('button','','clip');card.type='button';card.dataset.clip=name(rec);
  card.setAttribute('aria-selected',String(state.selected===name(rec)));pic(rec,card);
  const labels=text('div','','clip-label');labels.append(text('strong',fmt(rec)),text('small',label(rec)));
  const cs=text('div','','chips');cs.append(text('span',Number(rec.sampled_frames||0)>0?'Reviewed '+rec.sampled_frames+' frames':'Unreviewed','chip'));
  if(rec.person_score!==null&&rec.person_score!==undefined&&Number.isFinite(Number(rec.person_score)))cs.append(text('span','Peak '+(Number(rec.person_score)*100).toFixed(0)+'%','chip'));
  labels.append(cs);card.append(labels);card.onclick=()=>open(rec);host.append(card);
 }
 if(state.selected&&!result.some(x=>name(x)===state.selected))playbackStop();
}
async function refresh(){
 if(state.refreshing)return;state.refreshing=true;$('sync').textContent='Refreshing verified S9+ archive…';
 try{const r=relay();if(!r?.fetch)throw Error('secure_relay_unavailable');
 const resp=await r.fetch('/new/api/saved',{cache:'no-store'});
 if(!resp.ok)throw Error('archive_status_'+resp.status);
 const d=await resp.json();if(d.archive_mode!=='S9-microSD-only'||!Array.isArray(d.events))throw Error('wrong_archive');
 state.all=d.events.filter(x=>native.test(name(x))||legacy.test(name(x)));
 $('sync').textContent='S9+ microSD connected · '+state.all.length+' recordings indexed · original 4K retained';
 render();
 }catch(e){$('sync').textContent='Archive metadata unavailable · '+String(e.message||e);if(!state.all.length)$('list').replaceChildren(text('div','Connection error; recordings remain on the phone.','empty'))}
 finally{state.refreshing=false}}
$('refresh').onclick=refresh;
for(const id of ['search','type','order'])$(id).addEventListener(id==='search'?'input':'change',render);
document.addEventListener('visibilitychange',()=>{if(document.hidden)state.activeVideo?.pause();else if(!state.all.length)refresh()});
window.addEventListener('pagehide',playbackStop);
refresh();setInterval(()=>{if(!document.hidden)refresh()},60000);
})();
</script></body></html>
