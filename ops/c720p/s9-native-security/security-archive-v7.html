<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="Referrer-Policy" content="no-referrer">
<title>Security · Archive</title>
<style>
:root{color-scheme:dark;--bg:#0e151e;--panel:#14202c;--tile:#192936;--edge:#293a47;--ink:#eff5f8;--soft:#93a8b6;--focus:#83daca}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
main{height:100dvh;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:30px clamp(18px,3.2vw,52px) 64px}
.wrap{max-width:1560px;margin:auto}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:31px}
h1{font-size:23px;letter-spacing:-.035em;margin:0;font-weight:740}
.controls{display:flex;align-items:center;gap:12px}
select,.subtle-button{background:#182835;border:1px solid #314653;border-radius:10px;padding:10px 14px;min-height:42px}
.subtle-button{font-size:12px;color:#b9c9d3}
.status{font-size:12px;color:var(--soft);margin:0 0 18px}
.month{font-size:12px;font-weight:760;color:#8faab6;letter-spacing:.06em;text-transform:uppercase;margin:28px 3px 13px}
.day{border:1px solid var(--edge);background:var(--panel);border-radius:14px;margin-bottom:12px;overflow:hidden}
.day>summary{min-height:69px;display:flex;align-items:center;gap:18px;padding:15px 23px;list-style:none;cursor:pointer}
.day>summary::-webkit-details-marker{display:none}
.day>summary:hover{background:#1a2a37}
.day>summary .date{font-size:16px;font-weight:700;min-width:0;flex:1}
.day>summary .summary-end{font-variant-numeric:tabular-nums;font-size:12px;color:var(--soft)}
.day>summary .arrow{display:block;transform:rotate(0);font-size:20px;color:#8da6b6;transition:transform .16s}
.day[open]>summary .arrow{transform:rotate(180deg)}
.day[open]>summary{border-bottom:1px solid var(--edge)}
.clips{padding:21px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:18px;align-items:start}
.clip{min-width:0;text-align:left;border:0;padding:0;background:transparent;color:inherit}
.picture{display:block;position:relative;border-radius:11px;overflow:hidden;border:1px solid #344755;background:#223542;aspect-ratio:16/10}
.picture img{width:100%;height:100%;display:block;object-fit:cover}
.picture .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#607e90;font-size:24px}
.picture img{position:relative}
.clip:hover .picture{border-color:#79c2b6}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px 0}
.meta b{font-weight:680;font-size:13px;font-variant-numeric:tabular-nums}
.meta span{color:var(--soft);font-size:11px}
#empty{color:var(--soft);padding:60px 0;text-align:center}
dialog{width:min(760px,94vw);max-height:90dvh;padding:16px;background:#111e2a;border:1px solid #3b5260;border-radius:16px;color:var(--ink)}
dialog::backdrop{background:#03070cd9}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{background:#243743;border:1px solid #405766;padding:7px 13px;border-radius:9px}
video{width:100%;max-height:67dvh;display:block;background:#04080c;border-radius:10px;object-fit:contain}
#playerState{color:var(--soft);font-size:12px;padding-top:9px}
@media(max-width:750px){main{padding:19px 14px 70px}.heading{margin-bottom:22px}.day>summary{min-height:61px;padding:12px 15px}.clips{padding:13px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.meta{display:block}.meta span{display:block;margin-top:3px}}
@media(max-width:400px){.clips{grid-template-columns:1fr}.heading{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.day>summary .arrow{transition:none}}

/* One archive destination, preserving each storage source's authenticated reader. */
.source-switch{display:flex;gap:9px;flex-wrap:wrap;padding:0 0 18px;border-bottom:1px solid var(--edge);margin-bottom:19px}
.source-switch button{background:#162532;color:#a9bfcb;border:1px solid #344a58;border-radius:11px;padding:11px 16px;font-weight:700;text-align:left;min-height:50px}
.source-switch button[aria-selected="true"]{background:#22413f;border-color:#68b9ab;color:#eefff9}
.source-switch small{display:block;font-size:10px;font-weight:500;color:#94a9b7;padding-top:3px}
.source-view[hidden],.source-controls[hidden]{display:none!important}
#driveLibrary{height:calc(100dvh - 180px);min-height:330px;overflow:hidden;border:1px solid var(--edge);border-radius:13px;background:#0b151f}
#driveArchiveFrame{display:block;width:100%;height:100%;border:0;background:#0b151f}
#driveLoad{padding:18px;color:var(--soft);font-size:12px}
#archive:has(#driveLibrary:not([hidden])){overflow:hidden}
#archive:has(#driveLibrary:not([hidden])) .wrap{height:100%;display:flex;flex-direction:column}
#archive:has(#driveLibrary:not([hidden])) #driveLibrary{flex:1;min-height:0;height:auto}
@media(max-width:750px){.source-switch{gap:6px;margin-bottom:12px}.source-switch button{flex:1;padding:9px;min-width:140px;font-size:12px}#driveLibrary{min-height:280px}}
</style>
</head>
<body>
<main id="archive"><div class="wrap">
<header class="heading"><h1>Archive</h1><div class="controls source-controls" id="localControls" hidden><select id="monthSelect" aria-label="Choose archive month"><option value="all">All dates</option></select><button id="refresh" class="subtle-button" type="button" aria-label="Refresh local archive">↻</button></div></header>
<nav class="source-switch" role="tablist" aria-label="Archived recording source">
<button id="driveTab" role="tab" type="button" aria-selected="true" aria-controls="driveLibrary">Google Drive <small>Historical saved clips</small></button>
<button id="localTab" role="tab" type="button" aria-selected="false" aria-controls="localLibrary" tabindex="-1">S9+ microSD <small>Native camera archive</small></button>
</nav>
<section id="driveLibrary" class="source-view" role="tabpanel" aria-labelledby="driveTab">
<div id="driveLoad" role="status">Opening historical Google Drive recordings…</div>
<iframe id="driveArchiveFrame" title="Historical Google Drive recording browser" loading="eager" referrerpolicy="no-referrer" data-src="/local/c720p-drive-saved.html?camera=camera&amp;v=SECURITY_ARCHIVE_DRIVE_V8" hidden></iframe>
</section>
<section id="localLibrary" class="source-view" role="tabpanel" aria-labelledby="localTab" hidden>
<div id="status" class="status" role="status">Loading local recordings…</div>
<div id="timeline" aria-label="S9+ local recording dates"></div><div id="empty" hidden>No local recordings found</div>
</section>
</div></main>
<dialog id="viewer" aria-label="Saved recording"><div class="dialog-head"><strong id="viewerTitle">Recording</strong><button id="close" class="close" type="button">Close</button></div><video id="video" controls playsinline preload="metadata"></video><div id="playerState"></div></dialog>
<script id="s9v7-archive-script">
(()=>{
'use strict';
const $=id=>document.getElementById(id);
/* The historical Drive gallery previously ran directly under the hub.
   Pass through the same authenticated relay for the nested, same-origin reader. */
if(!window.C720PSecureRelay)try{
 Object.defineProperty(window,'C720PSecureRelay',{configurable:true,get(){
  try{return window.parent!==window&&window.parent.location.origin===location.origin?window.parent.C720PSecureRelay:null}
  catch(_){return null}
 }});
}catch(_){}
let localLoaded=false;
function showSource(kind,focus=false){
 const drive=kind==='drive';
 for(const [id,selected] of [['driveTab',drive],['localTab',!drive]]){
  const t=$(id);t.setAttribute('aria-selected',String(selected));t.tabIndex=selected?0:-1;
  if(selected&&focus)t.focus();
 }
 $('driveLibrary').hidden=!drive;$('localLibrary').hidden=drive;$('localControls').hidden=drive;
 if(drive){
  const frame=$('driveArchiveFrame');
  if(!frame.getAttribute('src'))frame.src=frame.dataset.src;
  frame.hidden=false;
 }else if(!localLoaded){localLoaded=true;refresh();}
}

const safe=/^(?:(?:motion|native4k)_[0-9]{13}|rec_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2})[.]mp4$/;
const native=/^(?:motion|native4k)_([0-9]{13})[.]mp4$/;
const older=/^rec_([0-9]{4}-[0-9]{2}-[0-9]{2})_([0-9]{2}-[0-9]{2})[.]mp4$/;
const create=(t,c,v)=>{const e=document.createElement(t);if(c)e.className=c;if(v!==undefined)e.textContent=String(v);return e};
const relay=()=>{if(window.C720PSecureRelay?.fetch&&window.C720PSecureRelay?.url)return window.C720PSecureRelay;
try{if(window.parent!==window&&window.parent.location.origin===location.origin&&window.parent.C720PSecureRelay?.fetch)return window.parent.C720PSecureRelay}catch(_){}return null};
const name=r=>String(r.clip_no||r.remote_name||r.name||'');
const dateParts=n=>{const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(n));const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};
const day=r=>{const n=name(r),m=native.exec(n),l=older.exec(n);return m?dateParts(Number(m[1])):l?l[1]:''};
const time=r=>{const m=native.exec(name(r)),l=older.exec(name(r));return m?new Date(Number(m[1])).toLocaleTimeString('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'}):l?l[2].replace('-',':'):'—'};
const formatDay=d=>{const [y,m,dd]=d.split('-').map(Number);return new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Amsterdam'}).format(new Date(Date.UTC(y,m-1,dd,12)))};
const formatMonth=d=>{const [y,m]=d.split('-').map(Number);return new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'Europe/Amsterdam'}).format(new Date(Date.UTC(y,m-1,15,12)))};
const category=r=>{const g=String(r.person_event_category||r.scene_category||'').toLowerCase(),tags=Array.isArray(r.content_categories)?r.content_categories.map(String):[];
if(g.includes('person')||Number(r.person_count)>0)return 'Person';
if(g.includes('animal')||tags.includes('animal'))return 'Animal';
if(g.includes('vehicle')||tags.includes('vehicle'))return 'Vehicle';return 'Motion'};
let records=[],openDays=new Set(),selectedMonth='all',loaded=false,playing=0;
async function preview(img,r){const n=name(r),a=relay();if(!a?.url)return;
try{const p=await a.url('/new/saved/snap/'+encodeURIComponent(n+'.thumb.jpg'));if(img.isConnected)img.src=p}catch(_){
if(img.isConnected)img.src='/local/frontyard-security-new/s9-phone-thumbs/'+encodeURIComponent(n)+'.thumb.jpg';}}
function card(r){const b=create('button','clip');b.type='button';b.setAttribute('aria-label',formatDay(day(r))+' '+time(r)+' '+category(r));
const picture=create('span','picture'),f=create('span','fallback','▣'),img=create('img');img.loading='lazy';img.decoding='async';img.alt='Recording preview';
picture.append(f,img);b.append(picture);
const meta=create('span','meta');meta.append(create('b','',time(r)),create('span','',category(r)));b.append(meta);
b.addEventListener('click',()=>play(r));preview(img,r);return b;}
async function play(r){const a=relay(),n=name(r),token=++playing;
$('viewerTitle').textContent=formatDay(day(r))+' · '+time(r);
$('playerState').textContent='Opening original S9+ video…';const v=$('video');v.pause();v.removeAttribute('src');v.load();
if(!$('viewer').open)$('viewer').showModal();
try{if(!a?.url)throw Error('relay');const src=await a.url('/new/saved/clip/'+encodeURIComponent(n));if(token!==playing)return;v.src=src;v.load();$('playerState').textContent='';}
catch(_){if(token===playing)$('playerState').textContent='Recording unavailable';}}
function dayBox(d,items,initial){const detail=create('details','day');detail.open=initial;const summary=create('summary');
summary.append(create('span','date',formatDay(d)),create('span','summary-end',items.length+' clips'),create('span','arrow','⌄'));detail.append(summary);
const cards=create('div','clips');detail.append(cards);
let populated=false;const populate=()=>{if(populated)return;populated=true;for(const r of items)cards.append(card(r))};
if(initial)populate();
detail.addEventListener('toggle',()=>{if(detail.open){openDays.add(d);populate()}else openDays.delete(d)});return detail;}
function render(){const grouped=new Map();for(const r of records){const d=day(r);if(!d)continue;if(selectedMonth!=='all'&&!d.startsWith(selectedMonth))continue;if(!grouped.has(d))grouped.set(d,[]);grouped.get(d).push(r)}
const sorted=[...grouped.keys()].sort().reverse(),root=$('timeline');root.replaceChildren();
if(!loaded){openDays=new Set(sorted.slice(0,1));loaded=true}
let prevMonth='';
for(const d of sorted){const month=d.slice(0,7);if(month!==prevMonth){root.append(create('div','month',formatMonth(d)));prevMonth=month}
root.append(dayBox(d,grouped.get(d),openDays.has(d)))}
$('empty').hidden=sorted.length>0;$('status').textContent=records.length+' recordings · '+sorted.length+' dates';}
function months(){const values=[...new Set(records.map(day).filter(Boolean).map(x=>x.slice(0,7)))].sort().reverse();
const sel=$('monthSelect');sel.replaceChildren();const all=create('option','','All dates');all.value='all';sel.append(all);
for(const d of values){const op=create('option','',formatMonth(d+'-01'));op.value=d;sel.append(op)}
if(selectedMonth!=='all'&&!values.includes(selectedMonth))selectedMonth='all';sel.value=selectedMonth}
async function refresh(){try{const a=relay();if(!a?.fetch)throw Error('relay');const res=await a.fetch('/new/api/saved',{cache:'no-store'});if(!res.ok)throw Error('status');const j=await res.json();
if(!Array.isArray(j.events)||j.archive_mode!=='S9-microSD-only')throw Error('index');
records=j.events.filter(x=>safe.test(name(x))&&day(x)).sort((a,b)=>name(b).localeCompare(name(a)));months();render()}
catch(_){$('status').textContent='Archive unavailable';if(!records.length){$('timeline').replaceChildren();$('empty').hidden=false}}}
$('driveTab').addEventListener('click',()=>showSource('drive'));
$('localTab').addEventListener('click',()=>showSource('local'));
$('driveArchiveFrame').addEventListener('load',()=>{$('driveLoad').hidden=true});
$('driveArchiveFrame').addEventListener('error',()=>{$('driveLoad').textContent='Historical Drive archive could not be opened'});
$('driveTab').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();showSource('local',true)}});
$('localTab').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();showSource('drive',true)}});
$('monthSelect').addEventListener('change',e=>{selectedMonth=e.target.value;openDays.clear();loaded=false;render()});
$('refresh').addEventListener('click',refresh);
$('close').addEventListener('click',()=>$('viewer').close());
$('viewer').addEventListener('close',()=>{++playing;const v=$('video');v.pause();v.removeAttribute('src');v.load()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&$('viewer').open)$('viewer').close()});
showSource('drive');
})();

const GEJAST_PAGE_VERSION='v817';
</script>
<div data-version-watermark style="position:fixed;bottom:4px;right:10px;color:#647c89;font-size:10px;pointer-events:none">v817 - Made by Bruis</div>
</body>
</html>
