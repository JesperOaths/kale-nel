# Bounded catch-up for the existing read-only S9 on-phone SHA-256 ledger.
# Each service invocation still verifies at most one original. No camera APK,
# recorder, media, quarantine, person reviews or original manifests change.
# PhoneArchiveIntegrityCli CaptureGate already fails closed during recording,
# above 39 C, or when frame-drop/camera status is abnormal.
[Timer]
OnUnitInactiveSec=
OnUnitInactiveSec=5min
RandomizedDelaySec=90s
AccuracySec=1min
